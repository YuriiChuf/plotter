
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Простой векторный редактор</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #2d2d2d;

        .container {

        .sidebar {
            width: 250px;

			overflow-y: auto;

        .main-area {
            flex: 1;

        }
        
        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #1a1a1a;
        }
        
        #svg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        
        .panel {
            background: #333;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }
		.panel label {
			font-size: 10px;
		}
        
        h3 {
            margin-bottom: 15px;
            color: #4dabf7;
        }
        
        button {
            background: #4dabf7;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        
        button:hover {
            background: #339af0;
        }
        
        .tool-btn {
            background: #444;
            margin: 5px;
            width: 40px;
            height: 40px;
			padding: 6px;
        }
        
        .tool-btn.active {
            background: #4dabf7;
        }
		.tool-btn:hover::after {
    content: attr(hotkey);
}
        
        .tools {
            display: flex;
            flex-wrap: wrap;
            gap: 0px;
            margin-bottom: 0px;
        }
        
        input[type="range"] {
            width: 100%;
            margin: 0;
        }
        
        input[type="color"] {
			width: 40px;
			height: 40px;
			margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            display: flex;
            gap: 10px;
        }
        
        .zoom-btn {
            width: 40px;
            height: 40px;
            background: #444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 20px;
        }
        
        .zoom-level {
            color: white;
            line-height: 40px;
            padding: 0 10px;
        }
        
        .coordinates {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
#eraser-indicator {
    pointer-events: none;
    stroke: #ff6b6b;
    stroke-width: 2;
    fill: rgba(255, 107, 107, 0.2);
    stroke-dasharray: 5,5;
}
#push-indicator {
    pointer-events: none;
    stroke: #ff6b6b;
    stroke-width: 1;
    fill: rgba(255, 107, 107, 0.1);
    stroke-dasharray: 3,3;
}
.push-mode {
    cursor: none !important;
}
@keyframes pulse-ring {
	0% { stroke-opacity: 0.7; }
	50% { stroke-opacity: 1; }
	100% { stroke-opacity: 0.7; }
}
/* Точка НЕ выделена */
.bezier-point {
    fill: #4dabf7;
    stroke: #1971c2;
    stroke-width: 2;
    r: 1%;
	opacity: 0.5;
    cursor: move;
}

.bezier-point.selected {
    fill: #ff6b6b;
    stroke: #e03131;
    stroke-width: 3;
	opacity: 0.5;
}

/* Векторы Безье */
.bezier-vector {
    fill: none;
    stroke-linecap: round;
}

/* Направляющие Безье */
.bezier-guide-line {
    stroke: #868e96;
    stroke-width: 1;
    stroke-dasharray: 3,3;
    opacity: 0.5;
}

.bezier-control-point {
    fill: #ffd43b;
    stroke: #f08c00;
    stroke-width: 1;
    r: 0.7%;
    cursor: pointer;
	opacity: 0.5;
	
}

    </style>
</head>
<body>

<div class="panel">

    <script>
        class VectorEditor {
    constructor() {
        // Состояние редактора
        this.state = {
            currentTool: 'select',
            isDrawing: false,
            currentElement: null,
            startPoint: {x: 0, y: 0},
            image: null,
            imageUrl: null,
            zoom: 1,
            viewBox: {x: 0, y: 0, width: 1000, height: 1000},
            strokeColor: '#4dabf7',
            strokeWidth: 3,
            smoothing: 5,
            penPoints: [],
            pushRadius: 20,
			pushStrength: 0.5,
			pushSmooth: true,
			imageForDisplay: null, 
			pushPoints: [], // Точки, которые сдвигаем
			originalPoints: [], // Исходные позиции точек
			pushStart: {x: 0, y: 0}, // Начальная позиция мыши при сдвиге
			eraserSize: 20,
            isMoving: false,
            moveStart: {x: 0, y: 0},
            viewBoxStart: {x: 0, y: 0, width: 0, height: 0},
			eraserPoints: [],
			bezierSelectedPoint: null, // Выделенная точка Безье
            bezierPoints: [],
            bezierVectors: [],
			originalImageRatio: 1,
            
            // Флаги для перетаскивания
            isDraggingPoint: false,
            draggingPointIndex: null,
            draggingPointStartX: 0,
            draggingPointStartY: 0,
            draggingPointOriginalX: 0,
            draggingPointOriginalY: 0,
            
            isDraggingControl: false,
            draggingControlVectorIndex: null,
            draggingControlType: null,
            draggingControlStartX: 0,
            draggingControlStartY: 0,
            draggingControlOriginalX: 0,
            draggingControlOriginalY: 0,
			lastBezierDirection: null, // Последнее направление касательной
			lastBezierLength: null    // Последняя длина касательной
        };
		this.snapSettings = {
			enabled: true,
			snapDistance: 10,
			blackThreshold: 50,
			searchRadius: 15,
			continueVector: true 
		};

		this.lastTool = null;
		
		this.setupHotkeys();
		this.pushData = null;
				this.pushUpdateQueue = [];
				this.isPushUpdatePending = false;
				this.pathCache = new Map();
				this.lastPushUpdate = 0;
				this.lastEraseTime = null; 
				this.lastErasePoint = null; 
				this.imageCanvasCache = null;
				this.imageDataCache = null;
				this.init();
				this.setupCursorRestore();
			}
			

		// ВИЗУАЛЬНЫЙ ИНДИКАТОР ЛАСТИКА
		showEraserIndicator(x, y, radius) {
			let indicator = document.getElementById('eraser-indicator');
			
			if (!indicator) {
				indicator = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
				indicator.id = 'eraser-indicator';
				indicator.setAttribute('stroke', '#ff6b6b');
				indicator.setAttribute('stroke-width', '2');
				indicator.setAttribute('fill', 'rgba(255, 107, 107, 0.2)');
				indicator.setAttribute('stroke-dasharray', '5,5');
				indicator.style.pointerEvents = 'none';

				const pushIndicator = document.getElementById('push-indicator');
				if (pushIndicator) {
					this.svg.insertBefore(indicator, pushIndicator.nextSibling);
				} else {
					this.svg.appendChild(indicator);
				}
			}
			
			indicator.setAttribute('cx', x);
			indicator.setAttribute('cy', y);
			indicator.setAttribute('r', radius);
			indicator.style.display = 'block';
			
			// УБИРАЕМ анимацию пульсации, которая может вызывать остатки
			indicator.style.animation = 'none';
			
			// Устанавливаем z-index для гарантии, что индикатор будет поверх
			indicator.style.zIndex = '9999';
		}

		// СКРЫВАЕМ ИНДИКАТОР ЛАСТИКА
		hideEraserIndicator() {
			const indicator = document.getElementById('eraser-indicator');
			if (indicator) {
				// Полностью скрываем индикатор
				indicator.style.display = 'none';
				
				// Очищаем координаты чтобы точно не было остатков
				indicator.setAttribute('cx', '-100');
				indicator.setAttribute('cy', '-100');
			}
		}
				 
		init() {
			// Инициализация SVG
			this.svg = document.getElementById('svg-canvas');
			this.svg.setAttribute('width', '100%');
			this.svg.setAttribute('height', '100%');
			this.svg.setAttribute('viewBox', '0 0 1000 1000');
			this.svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
document.getElementById('dpiInput').oninput = () => {
	    this.updatePixelDisplay();
    if (this.state.image) {
        //this.updateLoadedImageSizeDisplay(this.state.image);
    }
};
document.getElementById('mmWidth').addEventListener('input', (e) => {
    this.updateSizeWithAspectRatio('width', e.target.value);
});

document.getElementById('mmHeight').addEventListener('input', (e) => {
    this.updateSizeWithAspectRatio('height', e.target.value);
});
document.getElementById('aspectRatioDisplay').addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    
    // Берем текущие значения из полей ввода
    const currentWidth = parseFloat(document.getElementById('mmWidth').value) || 210;
    const currentHeight = parseFloat(document.getElementById('mmHeight').value) || 297;
    
    // Просто обновляем отображение соотношения сторон
    this.updateAspectRatioDisplay(currentWidth, currentHeight);
    
});
			// Загрузка SVG
			document.getElementById('loadSvgBtn').onclick = () => {
				document.getElementById('svgInput').click();
			};

			document.getElementById('svgInput').onchange = (e) => {
				if (e.target.files[0]) this.loadSVG(e.target.files[0]);
			};
			// Обработчики событий
			this.setupEventListeners();
			
			// ОБНОВЛЯЕМ ВСЕ ТЕКСТОВЫЕ ЭЛЕМЕНТЫ ОТ СЛАЙДЕРОВ ПРИ ЗАГРУЗКЕ
			this.updateAllSliderTexts();
			
			// Загружаем настройки из UI
			this.loadSettingsFromUI();
			this.setupGlobalDragHandlers();
			
			// Обновление интерфейса
			this.updateZoomDisplay();
				// Создаем группу для контрольных элементов
				this.state.bezierControlGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
				this.state.bezierControlGroup.id = 'bezier-control-group';
				this.svg.appendChild(this.state.bezierControlGroup);
			// Автоматически создаем подложку A4 при запуске
			this.createA4Background();
			
			// Обновляем отображение пикселей при изменении размеров
			document.getElementById('mmWidth').oninput = () => this.updatePixelDisplay();
			document.getElementById('mmHeight').oninput = () => this.updatePixelDisplay();
			
			// Создание подложки по нажатию кнопки
			document.getElementById('createBackgroundBtn').onclick = () => this.createBackgroundFromInput();
			this.setupToolToggle();
			
		}

setupHotkeys() {
    document.addEventListener('keydown', (e) => {
        // Игнорируем если фокус в поле ввода
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        
        // Ctrl/Cmd + S - сохранить
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            this.saveSVG();
            return;
        }
        
        // Ctrl/Cmd + O - загрузить SVG
        if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
            e.preventDefault();
            document.getElementById('svgInput').click();
            return;
        }
        
        // Esc - сброс инструмента
        if (e.key === 'Escape') {
            this.setTool('select');
            return;
        }
        
        // Горячие клавиши для инструментов
        switch(e.key.toLowerCase()) {
            case 'v': // Выделение
                this.setTool('select');
                break;
            case 'b': // Кривые Безье
                this.setTool('bezier-points');
                break;
            case 'p': // Карандаш
                this.setTool('pen');
                break;
            case 'l': // Линия
                this.setTool('line');
                break;
            case 'r': // Прямоугольник
                this.setTool('rect');
                break;
            case 'c': // Круг
                this.setTool('circle');
                break;
            case 'e': // Ластик
                this.setTool('eraser');
                break;
            case 'u': // Push инструмент
                this.setTool('push');
                break;
            case 'z': // Zoom
                if (e.ctrlKey || e.metaKey) {
                    if (e.shiftKey) {
                        this.zoomIn();
                    } else {
                        this.zoomOut();
                    }
                }
                break;
            case '=': // Zoom in
            case '+':
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    this.zoomIn();
                }
                break;
            case '-': // Zoom out
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    this.zoomOut();
                }
                break;
            case '0': // Сброс zoom
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    this.setZoom(1);
                }
                break;
            case 'delete': // Удалить выделенное
            case 'backspace':
                if (this.state.currentTool === 'bezier-points' && 
                    this.state.bezierSelectedPoint !== null) {
                    this.deleteBezierPoint(this.state.bezierSelectedPoint);
                }
                break;
        }
    });
}

updateAspectRatioDisplay(width, height) {
    const ratioDisplay = document.getElementById('aspectRatioDisplay');
    if (!ratioDisplay) return;
	
    this.state.originalImageRatio = width / height;
    // Упрощаем соотношение
    const simplified = this.simplifyRatio(width, height);
    
    // Обновляем отображение
    ratioDisplay.innerHTML = `${simplified.replace(':', '/<br>')}`;
    ratioDisplay.title = `Соотношение сторон: ${(width/height).toFixed(3)}`;
    
}

updateSizeWithAspectRatio(changedField, value) {
    if (!this.state.image || !this.state.originalImageRatio) {
        // Если нет фото, просто обновляем отображение
        this.updatePixelDisplay();
        return;
    }
    
    const keepRatio = document.getElementById('keepAspectRatio').checked;
    const widthInput = document.getElementById('mmWidth');
    const heightInput = document.getElementById('mmHeight');
    
    if (!keepRatio) {
        // Если не сохранять пропорции - просто обновляем
        this.updatePixelDisplay();
        return;
    }
    
    try {
        const newValue = parseFloat(value);
        if (isNaN(newValue) || newValue <= 0) return;
        
        if (changedField === 'width') {
            // Изменили ширину - пересчитываем высоту
            const newHeight = Math.round(newValue / this.state.originalImageRatio);
            heightInput.value = newHeight;
        } else {
            // Изменили высоту - пересчитываем ширину
            const newWidth = Math.round(newValue * this.state.originalImageRatio);
            widthInput.value = newWidth;
        }
        
        // Обновляем отображение пикселей
        this.updatePixelDisplay();
        
        // Если есть подложка - обновляем её
        this.updateBackgroundSize();
        
    } catch (error) {
        console.error('Ошибка при обновлении размеров:', error);
    }
}

		setupGlobalDragHandlers() {
			// Глобальный обработчик движения мыши
			document.addEventListener('mousemove', (e) => {
				// Если перетаскиваем основную точку Безье
				if (this.state.isDraggingPoint) {
					const coords = this.getSVGCoordinates(e);
					this.updatePointDrag(coords.x, coords.y);

setupCursorRestore() {

        if (this.state.currentTool === 'push' && !e.target.closest('#svg-canvas')) {
            // Возвращаем нормальный курсор
            document.body.style.cursor = 'default';
            this.hidePushIndicator();
        }
    });
    
    // При входе в SVG в режиме push
    this.svg.addEventListener('mouseenter', () => {
        if (this.state.currentTool === 'push') {
            this.updateCursor();
        }
    });
    
    // При выходе из SVG
    this.svg.addEventListener('mouseleave', () => {
        if (this.state.currentTool === 'push') {
            // Возвращаем нормальный курсор
            document.body.style.cursor = 'default';
            this.hidePushIndicator();
        }
    });
    
    // При клике вне SVG в режиме push
    document.addEventListener('mousedown', (e) => {
        if (this.state.currentTool === 'push' && !e.target.closest('#svg-canvas')) {

        }
    });

            // ЗУМ
            zoomIn() {
                this.setZoom(this.state.zoom * 1.2);
            }
            
            zoomOut() {
                this.setZoom(this.state.zoom / 1.2);
            }
            
            setZoom(zoomLevel) {
                this.state.zoom = Math.max(0.1, Math.min(10, zoomLevel));
                
                const centerX = this.state.viewBox.x + this.state.viewBox.width / 2;
                const centerY = this.state.viewBox.y + this.state.viewBox.height / 2;
                
                const newWidth = 1000 / this.state.zoom;
                const newHeight = 1000 / this.state.zoom;
                
                this.state.viewBox = {
                    x: centerX - newWidth / 2,
                    y: centerY - newHeight / 2,
                    width: newWidth,
                    height: newHeight
                };
                
                this.svg.setAttribute('viewBox', 
                    `${this.state.viewBox.x} ${this.state.viewBox.y} ${this.state.viewBox.width} ${this.state.viewBox.height}`
                );
                
                this.updateZoomDisplay();
            }
            
            zoomToPoint(x, y, factor) {
                const newWidth = this.state.viewBox.width * factor;
                const newHeight = this.state.viewBox.height * factor;
                
                const mouseXPercent = (x - this.state.viewBox.x) / this.state.viewBox.width;
                const mouseYPercent = (y - this.state.viewBox.y) / this.state.viewBox.height;
                
                this.state.viewBox = {
                    x: x - (mouseXPercent * newWidth),
                    y: y - (mouseYPercent * newHeight),
                    width: newWidth,
                    height: newHeight
                };
                
                this.svg.setAttribute('viewBox', 
                    `${this.state.viewBox.x} ${this.state.viewBox.y} ${this.state.viewBox.width} ${this.state.viewBox.height}`
                );
                
                this.state.zoom = 1000 / newWidth;
                this.updateZoomDisplay();
            }
            
            updateZoomDisplay() {
                document.getElementById('zoomLevel').textContent = 
                    Math.round(this.state.zoom * 100) + '%';
            }

startPanning(e) {
    this.state.isMoving = true;
    this.state.moveStart = {
        x: e.clientX,
        y: e.clientY,
        viewBoxX: this.state.viewBox.x,
        viewBoxY: this.state.viewBox.y
    };
    this.svg.style.cursor = 'grabbing';
}
    
doPanning(e) {
    if (!this.state.isMoving) return;
    
    // Простой расчет смещения
    const dx = e.clientX - this.state.moveStart.x;
    const dy = e.clientY - this.state.moveStart.y;
    
    // Масштабируем смещение относительно размера viewBox
    const scaleX = this.state.viewBox.width / this.svg.clientWidth;
    const scaleY = this.state.viewBox.height / this.svg.clientHeight;
    
    this.state.viewBox.x = this.state.moveStart.viewBoxX - dx * scaleX;
    this.state.viewBox.y = this.state.moveStart.viewBoxY - dy * scaleY;
    
    this.svg.setAttribute('viewBox', 
        `${this.state.viewBox.x} ${this.state.viewBox.y} ${this.state.viewBox.width} ${this.state.viewBox.height}`
    );
}
    
stopPanning() {
    this.state.isMoving = false;
    // Возвращаем курсор в зависимости от инструмента
    if (this.state.currentTool === 'select') {
        this.svg.style.cursor = 'move';
    } else {
        this.svg.style.cursor = 'crosshair';
    }
}

addWhiteBackgroundToPNG(img) {
    return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        
        // 1. Заливаем белым фоном
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 2. Рисуем оригинальное изображение поверх (сохраняя прозрачность)
        ctx.drawImage(img, 0, 0);
        
        // 3. Создаем новое изображение с белым фоном
        const imgWithBackground = new Image();
        imgWithBackground.onload = () => {
            resolve(imgWithBackground);
        };
        imgWithBackground.src = canvas.toDataURL();
    });
}
loadSVG(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        // Парсим SVG файл
        const parser = new DOMParser();
        const svgDoc = parser.parseFromString(e.target.result, 'image/svg+xml');
        const loadedSvg = svgDoc.querySelector('svg');
        
        if (!loadedSvg) {
            alert('Файл не является валидным SVG');
            return;
        }

        // Получаем размеры загруженного SVG
        const loadedWidth = parseFloat(loadedSvg.getAttribute('width')) || 
                           parseFloat(loadedSvg.getAttribute('viewBox')?.split(' ')[2]) || 
                           1000;
        const loadedHeight = parseFloat(loadedSvg.getAttribute('height')) || 
                            parseFloat(loadedSvg.getAttribute('viewBox')?.split(' ')[3]) || 
                            1000;

        // Если нет изображения - просто добавляем векторы
        if (!this.state.image) {
            this.loadVectorsToCurrentCanvas(loadedSvg, 1, 1, 0, 0);
            alert('SVG успешно загружен (без изображения)');
            return;
        }

        // Получаем размеры и позицию текущего изображения
        const imageElement = document.getElementById('background-image');
        if (!imageElement) {
            this.loadVectorsToCurrentCanvas(loadedSvg, 1, 1, 0, 0);
            alert('SVG успешно загружен');
            return;
        }

        const currentImageX = parseFloat(imageElement.getAttribute('x')) || 0;
        const currentImageY = parseFloat(imageElement.getAttribute('y')) || 0;
        const currentImageWidth = parseFloat(imageElement.getAttribute('width')) || loadedWidth;
        const currentImageHeight = parseFloat(imageElement.getAttribute('height')) || loadedHeight;

        // Рассчитываем масштаб для преобразования координат
        const scaleX = currentImageWidth / loadedWidth;
        const scaleY = currentImageHeight / loadedHeight;

        // Рассчитываем смещение
        const offsetX = currentImageX;
        const offsetY = currentImageY;

        // Загружаем векторы с преобразованием координат
        this.loadVectorsToCurrentCanvas(loadedSvg, scaleX, scaleY, offsetX, offsetY);
        
    };
    reader.readAsText(file);
}

// Новый метод для загрузки векторов с преобразованием координат
loadVectorsToCurrentCanvas(sourceSvg, scaleX, scaleY, offsetX, offsetY) {
    // Находим все векторные элементы в загруженном SVG
    const vectors = sourceSvg.querySelectorAll('path, line, rect, circle, ellipse');
    
    vectors.forEach(vector => {
        const clonedVector = vector.cloneNode(true);
        const tag = clonedVector.tagName.toLowerCase();
        
        // Пропускаем кривые Безье - они будут обработаны отдельно
        if (tag === 'path') {
            const d = clonedVector.getAttribute('d') || '';
            // Если это кривая Безье (команда C), пропускаем обычную обработку
            if (d.includes(' C ') || d.includes(' c ') || d.startsWith('C') || d.startsWith('c')) {
                // Обработаем кривую Безье отдельно
                this.processBezierFromSVG(clonedVector, scaleX, scaleY, offsetX, offsetY);
                return;
            }
        }
        
        // Преобразуем координаты в зависимости от типа элемента
        switch(tag) {
            case 'path':
                const d = clonedVector.getAttribute('d');
                if (d) {
                    const transformedD = this.transformPathCoordinates(d, scaleX, scaleY, offsetX, offsetY);
                    clonedVector.setAttribute('d', transformedD);
                }
                break;
                
            case 'line':
                const x1 = parseFloat(clonedVector.getAttribute('x1'));
                const y1 = parseFloat(clonedVector.getAttribute('y1'));
                const x2 = parseFloat(clonedVector.getAttribute('x2'));
                const y2 = parseFloat(clonedVector.getAttribute('y2'));
                
                if (!isNaN(x1) && !isNaN(y1)) {
                    clonedVector.setAttribute('x1', x1 * scaleX + offsetX);
                    clonedVector.setAttribute('y1', y1 * scaleY + offsetY);
                }
                if (!isNaN(x2) && !isNaN(y2)) {
                    clonedVector.setAttribute('x2', x2 * scaleX + offsetX);
                    clonedVector.setAttribute('y2', y2 * scaleY + offsetY);
                }
                break;
                
            case 'rect':
                const rectX = parseFloat(clonedVector.getAttribute('x'));
                const rectY = parseFloat(clonedVector.getAttribute('y'));
                const rectWidth = parseFloat(clonedVector.getAttribute('width'));
                const rectHeight = parseFloat(clonedVector.getAttribute('height'));
                
                if (!isNaN(rectX)) clonedVector.setAttribute('x', rectX * scaleX + offsetX);
                if (!isNaN(rectY)) clonedVector.setAttribute('y', rectY * scaleY + offsetY);
                if (!isNaN(rectWidth)) clonedVector.setAttribute('width', rectWidth * scaleX);
                if (!isNaN(rectHeight)) clonedVector.setAttribute('height', rectHeight * scaleY);
                break;
                
            case 'circle':
                const cx = parseFloat(clonedVector.getAttribute('cx'));
                const cy = parseFloat(clonedVector.getAttribute('cy'));
                const radius = parseFloat(clonedVector.getAttribute('r'));
                
                if (!isNaN(cx)) clonedVector.setAttribute('cx', cx * scaleX + offsetX);
                if (!isNaN(cy)) clonedVector.setAttribute('cy', cy * scaleY + offsetY);
                if (!isNaN(radius)) clonedVector.setAttribute('r', radius * scaleX);
                break;
                
            case 'ellipse':
                const ellipseCx = parseFloat(clonedVector.getAttribute('cx'));
                const ellipseCy = parseFloat(clonedVector.getAttribute('cy'));
                const ellipseRx = parseFloat(clonedVector.getAttribute('rx'));
                const ellipseRy = parseFloat(clonedVector.getAttribute('ry'));
                
                if (!isNaN(ellipseCx)) clonedVector.setAttribute('cx', ellipseCx * scaleX + offsetX);
                if (!isNaN(ellipseCy)) clonedVector.setAttribute('cy', ellipseCy * scaleY + offsetY);
                if (!isNaN(ellipseRx)) clonedVector.setAttribute('rx', ellipseRx * scaleX);
                if (!isNaN(ellipseRy)) clonedVector.setAttribute('ry', ellipseRy * scaleY);
                break;
        }
        
        // Добавляем стили если их нет
        if (!clonedVector.getAttribute('stroke')) {
            clonedVector.setAttribute('stroke', '#4dabf7');
        }
        if (!clonedVector.getAttribute('stroke-width')) {
            clonedVector.setAttribute('stroke-width', '2');
        }
        if (!clonedVector.getAttribute('fill')) {
            clonedVector.setAttribute('fill', 'none');
        }
        
        // Добавляем на холст
        this.svg.appendChild(clonedVector);
    });
}

parseBezierFromSVG(pathElement, scaleX = 1, scaleY = 1, offsetX = 0, offsetY = 0) {
    // Получаем данные пути
    const d = pathElement.getAttribute('d');
    if (!d) return null;
    
    // Парсим команды кривой Безье
    const commands = d.split(/(?=[MCL])/);
    
    if (commands.length < 2) return null;
    
    // Проверяем, что это кривая Безье (команда C)
    const firstCmd = commands[0].trim();
    const secondCmd = commands[1].trim();
    
    if (!firstCmd.startsWith('M') || !secondCmd.startsWith('C')) {
        return null; // Это не кривая Безье
    }
    
    // Парсим первую точку
    const moveCoords = firstCmd.substring(1).trim().split(/[\s,]+/).map(Number);
    if (moveCoords.length < 2) return null;
    
    // Парсим кривую Безье
    const curveCoords = secondCmd.substring(1).trim().split(/[\s,]+/).map(Number);
    if (curveCoords.length < 6) return null;
    
    // Применяем трансформации
    const applyTransform = (x, y) => ({
        x: x * scaleX + offsetX,
        y: y * scaleY + offsetY
    });
    
    return {
        startPoint: applyTransform(moveCoords[0], moveCoords[1]),
        control1: applyTransform(curveCoords[0], curveCoords[1]),
        control2: applyTransform(curveCoords[2], curveCoords[3]),
        endPoint: applyTransform(curveCoords[4], curveCoords[5]),
        originalElement: pathElement
    };
}

processBezierFromSVG(pathElement, scaleX, scaleY, offsetX, offsetY) {
    // Парсим кривую Безье
    const bezierData = this.parseBezierFromSVG(pathElement, scaleX, scaleY, offsetX, offsetY);
    if (!bezierData) {
        // Если не удалось распарсить как кривую Безье, добавляем как обычный путь
        this.svg.appendChild(pathElement);
        return;
    }
    
    const { startPoint, control1, control2, endPoint } = bezierData;
    
    // Создаем точки Безье
    const point1 = {
        x: startPoint.x,
        y: startPoint.y,
        element: null,
        index: this.state.bezierPoints.length
    };
    
    const point2 = {
        x: endPoint.x,
        y: endPoint.y,
        element: null,
        index: this.state.bezierPoints.length + 1
    };
    
    // Создаем визуальные элементы точек (но скрываем их до включения режима Безье)
    point1.element = this.createBezierPointElement(point1);
    point2.element = this.createBezierPointElement(point2);
    point1.element.style.display = 'none';
    point2.element.style.display = 'none';
    
    this.svg.appendChild(point1.element);
    this.svg.appendChild(point2.element);
    
    // Добавляем точки в массив
    this.state.bezierPoints.push(point1, point2);
    
    // Создаем вектор Безье
    const vector = {
        from: point1.index,
        to: point2.index,
        control1: { 
            x: control1.x, 
            y: control1.y, 
            belongsTo: point1.index 
        },
        control2: { 
            x: control2.x, 
            y: control2.y, 
            belongsTo: point2.index 
        },
        path: pathElement,
        guideElements: {}
    };
    
    // Обновляем путь
    pathElement.setAttribute('d', 
        `M ${startPoint.x} ${startPoint.y} C ${control1.x} ${control1.y} ${control2.x} ${control2.y} ${endPoint.x} ${endPoint.y}`
    );
    
    // Добавляем класс и стили
    pathElement.classList.add('bezier-vector');
    if (!pathElement.getAttribute('stroke')) {
        pathElement.setAttribute('stroke', this.state.strokeColor);
    }
    if (!pathElement.getAttribute('stroke-width')) {
        pathElement.setAttribute('stroke-width', this.state.strokeWidth);
    }
    if (!pathElement.getAttribute('fill')) {
        pathElement.setAttribute('fill', 'none');
    }
    pathElement.setAttribute('stroke-linecap', 'round');
    
    // Добавляем на холст
    this.svg.appendChild(pathElement);
    
    // Создаем направляющие элементы (но скрываем их)
    this.createVectorGuides(vector, point1, point2);
    
    // Скрываем направляющие до включения режима Безье
    if (vector.guideElements.line1) vector.guideElements.line1.style.display = 'none';
    if (vector.guideElements.control1) vector.guideElements.control1.style.display = 'none';
    if (vector.guideElements.line2) vector.guideElements.line2.style.display = 'none';
    if (vector.guideElements.control2) vector.guideElements.control2.style.display = 'none';
    
    // Добавляем вектор в массив
    this.state.bezierVectors.push(vector);
}

// Метод для преобразования координат в пути (d атрибут)
transformPathCoordinates(d, scaleX, scaleY, offsetX, offsetY) {
    // Парсим команды пути
    const commands = d.match(/[MLCQZmlcqz][^MLCQZmlcqz]*/g) || [];
    
    let transformedPath = '';
    
    commands.forEach(commandStr => {
        const command = commandStr[0];
        const numbers = commandStr.substring(1).trim();
        
        if (!numbers) {
            transformedPath += command + ' ';
            return;
        }
        
        // Разбиваем числа
        const numArray = numbers.split(/[\s,]+/).map(Number);
        let transformedNumbers = '';
        
        // Обрабатываем пары координат
        for (let i = 0; i < numArray.length; i += 2) {
            if (i + 1 < numArray.length) {
                const x = numArray[i] * scaleX + offsetX;
                const y = numArray[i + 1] * scaleY + offsetY;
                transformedNumbers += `${x} ${y} `;
            }
        }
        
        transformedPath += command + ' ' + transformedNumbers.trim() + ' ';
    });
    
    return transformedPath.trim();
}

		// Метод для добавления кривой Безье из SVG
addBezierFromSVG(pathElement, scaleX = 1, scaleY = 1, offsetX = 0, offsetY = 0) {
    // Получаем данные пути
    const d = pathElement.getAttribute('d');
    if (!d) return null;
    
    // Парсим команды кривой Безье (C или c команда)
    const commands = d.match(/[MCQZLmcqzl][^MCQZLmcqzl]*/gi) || [];
    
    if (commands.length < 2) return null;
    
    // Находим первую команду M (начальная точка)
    let moveCmd = null;
    let curveCmd = null;
    
    for (const cmd of commands) {
        const cmdType = cmd[0].toUpperCase();
        if (cmdType === 'M' && !moveCmd) {
            moveCmd = cmd;
        } else if ((cmdType === 'C' || cmdType === 'Q') && moveCmd && !curveCmd) {
            curveCmd = cmd;
            break;
        }
    }
    
    if (!moveCmd || !curveCmd) return null;
    
    // Парсим координаты из команды M
    const moveCoords = moveCmd.substring(1).trim().split(/[\s,]+/).map(Number);
    if (moveCoords.length < 2) return null;
    
    // Парсим координаты из команды C (кубическая кривая Безье)
    const curveCoords = curveCmd.substring(1).trim().split(/[\s,]+/).map(Number);
    if (curveCoords.length < 6) return null;
    
    // Применяем трансформации (масштаб и смещение)
    const applyTransform = (x, y) => ({
        x: x * scaleX + offsetX,
        y: y * scaleY + offsetY
    });
    
    const startPoint = applyTransform(moveCoords[0], moveCoords[1]);
    const control1 = applyTransform(curveCoords[0], curveCoords[1]);
    const control2 = applyTransform(curveCoords[2], curveCoords[3]);
    const endPoint = applyTransform(curveCoords[4], curveCoords[5]);
    
    // Создаем точки Безье
    const point1 = {
        x: startPoint.x,
        y: startPoint.y,
        element: null,
        index: this.state.bezierPoints.length
    };
    
    const point2 = {
        x: endPoint.x,
        y: endPoint.y,
        element: null,
        index: this.state.bezierPoints.length + 1
    };
    
    // Создаем визуальные элементы точек
    point1.element = this.createBezierPointElement(point1);
    point2.element = this.createBezierPointElement(point2);
    
    this.svg.appendChild(point1.element);
    this.svg.appendChild(point2.element);
    
    // Добавляем точки в массив
    this.state.bezierPoints.push(point1, point2);
    
    // Создаем вектор Безье
    const vector = {
        from: point1.index,
        to: point2.index,
        control1: { 
            x: control1.x, 
            y: control1.y, 
            belongsTo: point1.index 
        },
        control2: { 
            x: control2.x, 
            y: control2.y, 
            belongsTo: point2.index 
        },
        path: pathElement,
        guideElements: {}
    };
    
    // Обновляем путь с учетом трансформаций
    pathElement.setAttribute('d', 
        `M ${startPoint.x} ${startPoint.y} C ${control1.x} ${control1.y} ${control2.x} ${control2.y} ${endPoint.x} ${endPoint.y}`
    );
    pathElement.classList.add('bezier-vector');
    pathElement.setAttribute('stroke', this.state.strokeColor);
    pathElement.setAttribute('stroke-width', this.state.strokeWidth);
    pathElement.setAttribute('fill', 'none');
    pathElement.setAttribute('stroke-linecap', 'round');
    
    // Создаем направляющие элементы
    this.createVectorGuides(vector, point1, point2);
    
    // Добавляем вектор в массив
    this.state.bezierVectors.push(vector);
    
    return vector;
}

createBackground(width, height) {
    // Создаем canvas для генерации белого изображения
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    
    const ctx = canvas.getContext('2d');
    
    // Заливаем белым цветом
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, width, height);
    
    // Добавляем тонкую серую рамку для визуализации границ
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, width - 1, height - 1);
    
    // Создаем изображение из canvas
    const img = new Image();
    img.onload = () => {
        // Удаляем старое изображение если есть
        this.removeBackgroundImage();
        
        // Сохраняем новое изображение
        this.state.image = img;
        this.state.imageUrl = canvas.toDataURL('image/png');
        this.state.imageForDisplay = img;
        
        // Отображаем изображение
        this.displayImage(img);
        document.getElementById('noImage').style.display = 'none';
        document.getElementById('imageControls').style.display = 'none'; // Скрываем контролы фото
        
        // Применяем прозрачность из слайдера (если нужно)
        const opacitySlider = document.getElementById('opacitySlider');
        const imageElement = document.getElementById('background-image');
        if (opacitySlider && imageElement) {
            imageElement.style.opacity = opacitySlider.value / 100;
        }
        
        this.updateImageCache(img);
        this.fitImageToCanvas();
        
        console.log(`Создана белая подложка ${width}x${height}px`);
    };
    img.src = canvas.toDataURL('image/png');
}


removeBackgroundImage() {
    const imageElement = document.getElementById('background-image');
    if (imageElement) {
        // Проверяем, является ли это белой подложкой (по src)
        if (imageElement.getAttribute('href') && imageElement.getAttribute('href').startsWith('data:image/png')) {
            imageElement.remove();
        }
    }
}

// Обновление отображения размера загруженного фото
updateLoadedImageSizeDisplay(img) {
    const display = document.getElementById('loadedImageSizeDisplay');
    const dpiInfo = document.getElementById('loadedImageDpiInfo');
    const ratioDisplay = document.getElementById('aspectRatioDisplay');
    
    if (display && img) {
        const currentDpi = parseInt(document.getElementById('dpiInput').value) || 96;

        const mmHeight = Math.round((img.height * 25.4) / currentDpi);

        if (dpiInfo) {
            // Информация о DPI на новой строке
            dpiInfo.textContent = `${mmWidth}×${mmHeight} мм (при ${currentDpi} DPI)`;
        }
        
        if (ratioDisplay) {
            // Отображение соотношения сторон
            const ratio = img.width / img.height;
            const simplifiedRatio = this.simplifyRatio(img.width, img.height);
            ratioDisplay.textContent = `${simplifiedRatio}`;
            ratioDisplay.title = `Соотношение сторон: ${ratio.toFixed(3)}`;
        }
    }
}

simplifyRatio(width, height) {
    // Функция для нахождения наибольшего общего делителя (НОД)
    const gcd = (a, b) => {
        a = Math.abs(a);
        b = Math.abs(b);
        
        // Используем алгоритм Евклида
        while (b !== 0) {
            const temp = b;
            b = a % b;
            a = temp;
        }
        return a;
    };
    
    // Находим НОД для текущих чисел
    let divisor = gcd(width, height);
    
    // Если числа очень большие, пробуем упростить до более читаемого формата
    if (divisor === 1 && (width > 1000 || height > 1000)) {
        // Пробуем делить на 10, 5, 2 для упрощения
        const tryDivisors = [10, 5, 2];
        for (const tryDiv of tryDivisors) {
            if (width % tryDiv === 0 && height % tryDiv === 0) {
                divisor = tryDiv;
                break;
            }
        }
    }
    
    // Упрощаем соотношение
    const simplifiedWidth = width / divisor;
    const simplifiedHeight = height / divisor;
    
    // Форматируем вывод
    return `${simplifiedWidth}/\n${simplifiedHeight}`;
}
		updateImageCache(imageToCache) {
			// Очищаем старый кэш
			this.imageCanvasCache = null;
			this.imageDataCache = null;

			this.imageCanvasCache = document.createElement('canvas');

			const ctx = this.imageCanvasCache.getContext('2d');

			this.imageDataCache = ctx.getImageData(0, 0, imageToCache.width, imageToCache.height);
			
			console.log('Кэш изображения обновлен (размер:', imageToCache.width, 'x', imageToCache.height, ')');
		}
				   
		displayImage(img) {
			// Удаляем старое изображение если есть
			const oldImage = document.getElementById('background-image');
			if (oldImage) oldImage.remove();
			
			// Создаем новое изображение
			const imageElement = document.createElementNS('http://www.w3.org/2000/svg', 'image');
			imageElement.id = 'background-image';
			
			// Используем imageForDisplay если есть, иначе оригинал
			const imageToShow = this.state.imageForDisplay || img;
			imageElement.setAttribute('href', imageToShow.src || this.state.imageUrl);
			
			imageElement.style.opacity = '0.5';
			imageElement.setAttribute('preserveAspectRatio', 'xMidYMid meet');
			
			// Отключаем события мыши для изображения
			imageElement.style.pointerEvents = 'none';
			
			// Добавляем первым элементом (фон)
			this.svg.insertBefore(imageElement, this.svg.firstChild);
			
			// Центрируем
			this.centerImage();
		}

		centerImage() {
			if (!this.state.image) return;
			
			const img = this.state.image;
			const imageElement = document.getElementById('background-image');
			if (!imageElement) return;
			
			// Рассчитываем размеры для viewBox 1000x1000
			const viewBoxSize = 1000;
			const scale = Math.min(viewBoxSize / img.width, viewBoxSize / img.height) * 0.9;
			
			// Устанавливаем размеры и позицию
			imageElement.setAttribute('width', img.width * scale);
			imageElement.setAttribute('height', img.height * scale);
			
			const x = (viewBoxSize - img.width * scale) / 2;
			const y = (viewBoxSize - img.height * scale) / 2;
			
			imageElement.setAttribute('x', x);
			imageElement.setAttribute('y', y);
		}

		fitImageToCanvas() {
			if (!this.state.image) return;
			
			const img = this.state.image;
			const scale = Math.min(1000 / img.width, 1000 / img.height) * 0.9;

			const imageElement = document.getElementById('background-image');
			if (imageElement) {
				// Убираем transform
				imageElement.removeAttribute('transform');
				
				// Устанавливаем размеры изображения с учетом масштаба
				imageElement.setAttribute('width', img.width * scale);
				imageElement.setAttribute('height', img.height * scale);
				
				// Центрируем вручную
				const x = (1000 - img.width * scale) / 2;
				const y = (1000 - img.height * scale) / 2;
				imageElement.setAttribute('x', x);
				imageElement.setAttribute('y', y);
			}
			
			// Сбрасываем зум чтобы видеть всё изображение
			this.setZoom(1);
		}

setupToolToggle() {
    // Проверяем, что svg существует
    if (!this.svg) {
        console.warn('SVG не инициализирован, откладываем настройку переключения');
        setTimeout(() => this.setupToolToggle(), 100);
        return;
    }
    
    // Блокируем контекстное меню на холсте
    this.svg.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        return false;
    });

    // Переключение по правой кнопке мыши
    this.svg.addEventListener('mousedown', (e) => {
        if (e.button === 2) {
            e.preventDefault();
            e.stopPropagation();
            
            // Всегда переключаем инструменты при правом клике
            // Неважно где кликнули - даже на элементах Безье
            this.switchTools();
            
            return false;
        }
    });
}

switchTools() {
    const current = this.state.currentTool;
    
    if (this.lastTool && this.lastTool !== current) {
        // Переключаемся на предыдущий инструмент
        this.setTool(this.lastTool);
    }
    
    // Сохраняем текущий инструмент как предыдущий
    this.lastTool = current;
}
	
            // ИНСТРУМЕНТЫ
setTool(tool) {
    // Сбрасываем все состояния перетаскивания
    if (this.state.isDraggingPoint) {
        this.endPointDrag();
    }
    if (this.state.isDraggingBezierControl) {
        this.endBezierControlDrag();
    }
    
    // Всегда сбрасываем currentElement при переключении инструмента
    this.state.currentElement = null;

    // Сохраняем предыдущий инструмент
    const previousTool = this.state.currentTool;

    // Если ВХОДИМ в режим Безье
    if (tool === 'bezier-points') {
        this.state.lastBezierDirection = null;
        this.state.lastBezierLength = null;
        
        // Показываем все элементы Безье
        this.showBezierHelpers();
        this.toggleBezierPoints(true);
        
    } else if (this.state.currentTool === 'bezier-points' && tool !== 'bezier-points') {
        // Если ВЫХОДИМ из режима Безье
        this.deselectAllPoints();
        this.state.lastBezierDirection = null;
        this.state.lastBezierLength = null;
        
        // Скрываем вспомогательные элементы
        this.hideBezierHelpers();
        this.toggleBezierPoints(false);
    }
    
    this.state.currentTool = tool;
    
    // Обновляем активные кнопки
    document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    document.querySelector(`[data-tool="${tool}"]`).classList.add('active');

    // Показываем/скрываем настройки инструментов
    document.getElementById('penSettings').style.display = 
        tool === 'pen' ? 'block' : 'none';
    
    document.getElementById('pushSettings').style.display = 
        tool === 'push' ? 'block' : 'none';
    
    document.getElementById('eraserSettings').style.display = 
        tool === 'eraser' ? 'block' : 'none';
    
    // Опросить UI
    this.loadSettingsFromUI();
    
    // Обновляем курсор
    this.updateCursor();
    
    // Скрываем индикаторы
    if (tool !== 'push') {
        this.hidePushIndicator();
    }
    if (tool !== 'eraser') {
        this.hideEraserIndicator();
    }

    // После переключения обновляем lastTool
    if (tool !== previousTool) {
        this.lastTool = previousTool;
    }
}

updateCursor() {
    if (!this.svg) return;
    
    if (this.state.currentTool === 'push') {
        this.svg.style.cursor = 'none';
    } else if (this.state.currentTool === 'eraser') {
        this.svg.style.cursor = 'none'; // Или можно свой курсор для ластика
    } else if (this.state.currentTool === 'select') {
        this.svg.style.cursor = this.state.isMoving ? 'grabbing' : 'move';
    } else if (this.state.currentTool === 'bezier-points') {
            this.svg.style.cursor = 'crosshair';
    } else {
        this.svg.style.cursor = 'crosshair';
    }
}

// Функция конвертации конкретного элемента в путь
convertToPath(element) {
    let pathData = '';
    const stroke = element.getAttribute('stroke') || 'black';
    const strokeWidth = element.getAttribute('stroke-width') || '1';
    const fill = element.getAttribute('fill') || 'none';
    
    switch(element.tagName.toLowerCase()) {
        case 'line':
            const x1 = parseFloat(element.getAttribute('x1')) || 0;
            const y1 = parseFloat(element.getAttribute('y1')) || 0;
            const x2 = parseFloat(element.getAttribute('x2')) || 0;
            const y2 = parseFloat(element.getAttribute('y2')) || 0;
            
            pathData = `M ${x1} ${y1} L ${x2} ${y2}`;
            break;
            
        case 'rect':
            const rectX = parseFloat(element.getAttribute('x')) || 0;
            const rectY = parseFloat(element.getAttribute('y')) || 0;
            const width = parseFloat(element.getAttribute('width')) || 0;
            const height = parseFloat(element.getAttribute('height')) || 0;
            const rectRx = parseFloat(element.getAttribute('rx')) || 0;
            const rectRy = parseFloat(element.getAttribute('ry')) || 0;
            
            if (rectRx > 0 || rectRy > 0) {
                // Скругленный прямоугольник
                pathData = this.roundedRectToPath(rectX, rectY, width, height, rectRx, rectRy);
            } else {
                // Обычный прямоугольник - добавляем больше точек
                pathData = `M ${rectX} ${rectY} `;
                
                // Верхняя сторона - 4 сегмента
                for (let i = 1; i <= 4; i++) {
                    pathData += `L ${rectX + (width * i / 4)} ${rectY} `;
                }
                
                // Правая сторона - 4 сегмента
                for (let i = 1; i <= 4; i++) {
                    pathData += `L ${rectX + width} ${rectY + (height * i / 4)} `;
                }
                
                // Нижняя сторона - 4 сегмента
                for (let i = 1; i <= 4; i++) {
                    pathData += `L ${rectX + width - (width * i / 4)} ${rectY + height} `;
                }
                
                // Левая сторона - 4 сегмента
                for (let i = 1; i <= 4; i++) {
                    pathData += `L ${rectX} ${rectY + height - (height * i / 4)} `;
                }
                
                pathData += 'Z';
            }
            break;
            
        case 'circle':
            const cx = parseFloat(element.getAttribute('cx')) || 0;
            const cy = parseFloat(element.getAttribute('cy')) || 0;
            const radius = parseFloat(element.getAttribute('r')) || 0;
            
            // Круг -> путь с БОЛЬШИМ количеством точек для сглаживания
            const points = 32; // Увеличиваем с 16 до 32 точек
            pathData = `M ${cx + radius} ${cy}`;
            
            for (let i = 1; i <= points; i++) {
                const angle = (i / points) * Math.PI * 2;
                const px = cx + Math.cos(angle) * radius;
                const py = cy + Math.sin(angle) * radius;
                pathData += ` L ${px} ${py}`;
            }
            pathData += ' Z';
            break;
            
        case 'ellipse':
            const ellipseX = parseFloat(element.getAttribute('cx')) || 0;
            const ellipseY = parseFloat(element.getAttribute('cy')) || 0;
            const ellipseRx = parseFloat(element.getAttribute('rx')) || 0;
            const ellipseRy = parseFloat(element.getAttribute('ry')) || 0;
            
            // Эллипс -> путь с 32 точками
            const ellipsePoints = 32;
            pathData = `M ${ellipseX + ellipseRx} ${ellipseY}`;
            
            for (let i = 1; i <= ellipsePoints; i++) {
                const angle = (i / ellipsePoints) * Math.PI * 2;
                const px = ellipseX + Math.cos(angle) * ellipseRx;
                const py = ellipseY + Math.sin(angle) * ellipseRy;
                pathData += ` L ${px} ${py}`;
            }
            pathData += ' Z';
            break;
    }
    
    if (!pathData) return null;
    
    // Создаем новый путь
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', pathData);
    path.setAttribute('stroke', stroke);
    path.setAttribute('stroke-width', strokeWidth);
    path.setAttribute('fill', fill);
    path.setAttribute('stroke-linecap', element.getAttribute('stroke-linecap') || 'round');
    path.setAttribute('stroke-linejoin', element.getAttribute('stroke-linejoin') || 'round');
    
    return path;
}

roundedRectToPath(x, y, width, height, cornerRx, cornerRy) {
    // Ограничиваем радиусы
    cornerRx = Math.min(cornerRx, width / 2);
    cornerRy = Math.min(cornerRy, height / 2);
    
    let pathData = '';
    
    // Начинаем с правого нижнего угла (с учетом скругления)
    pathData = `M ${x + width - cornerRx} ${y}`;
    
    // Верхняя сторона
    pathData += `H ${x + cornerRx}`;
    
    // Левый верхний угол
    if (cornerRx > 0 && cornerRy > 0) {
        pathData += `A ${cornerRx} ${cornerRy} 0 0 1 ${x} ${y + cornerRy}`;
    } else {
        pathData += `L ${x} ${y}`;
    }
    
    // Левая сторона
    pathData += `V ${y + height - cornerRy}`;
    
    // Левый нижний угол
    if (cornerRx > 0 && cornerRy > 0) {
        pathData += `A ${cornerRx} ${cornerRy} 0 0 1 ${x + cornerRx} ${y + height}`;
    } else {
        pathData += `L ${x} ${y + height}`;
    }
    
    // Нижняя сторона
    pathData += `H ${x + width - cornerRx}`;
    
    // Правый нижний угол
    if (cornerRx > 0 && cornerRy > 0) {
        pathData += `A ${cornerRx} ${cornerRy} 0 0 1 ${x + width} ${y + height - cornerRy}`;
    } else {
        pathData += `L ${x + width} ${y + height}`;
    }
    
    // Правая сторона
    pathData += `V ${y + cornerRy}`;
    
    // Правый верхний угол
    if (cornerRx > 0 && cornerRy > 0) {
        pathData += `A ${cornerRx} ${cornerRy} 0 0 1 ${x + width - cornerRx} ${y}`;
    } else {
        pathData += `L ${x + width} ${y}`;
    }
    
    pathData += ' Z';
    return pathData;
}


// Парсинг пути в точки
parsePathToPoints(d) {
    if (!d || d.trim() === '') {
        return { points: [], isClosed: false };
    }
    
    // Проверяем кэш (Map может использовать строки как ключи)
    if (this.pathCache.has(d)) {
        return this.pathCache.get(d);
    }
    
    const isClosed = d.includes(' Z') || d.includes('z');
    
    try {
        const points = [];
        const numbers = d.match(/[+-]?\d*\.?\d+(?:[eE][+-]?\d+)?/g) || [];
        
        for (let i = 0; i < numbers.length; i += 2) {
            if (i + 1 < numbers.length) {
                points.push({
                    x: parseFloat(numbers[i]),
                    y: parseFloat(numbers[i + 1])
                });
            }
        }
        
        const result = { points, isClosed };
        
        // Кэшируем только для часто используемых путей
        if (d.length < 1000) {
            this.pathCache.set(d, result);
        }
        
        return result;
    } catch (error) {
        console.error('Ошибка парсинга пути:', error, d);
        return { points: [], isClosed: false };
    }
}

// Преобразование точек в путь
pointsToPath(points, wasOriginallyClosed = false) {
    if (points.length === 0) return '';
    
    let pathData = `M ${points[0].x} ${points[0].y}`;
    
    for (let i = 1; i < points.length; i++) {
        pathData += ` L ${points[i].x} ${points[i].y}`;
    }
    
    // Закрываем путь ТОЛЬКО если он изначально был закрыт
    if (wasOriginallyClosed && points.length > 2) {
        pathData += ' Z';
    }
    
    return pathData;
}

insertPointIntoPath(path, afterIndex, x, y) {
    const d = path.getAttribute('d');
    if (!d) return -1;
    
    const { points, isClosed } = this.parsePathToPoints(d);
    
    // Проверяем что точка не существует уже
    const tolerance = 0.1;
    const exists = points.some(p => 
        Math.abs(p.x - x) < tolerance && Math.abs(p.y - y) < tolerance
    );
    
    if (exists) return -1;
    
    if (afterIndex >= 0 && afterIndex < points.length) {
        // Вставляем точку
        points.splice(afterIndex + 1, 0, {x: x, y: y});
        
        // Перестраиваем путь
        const newPath = this.pointsToPath(points, isClosed);
        path.setAttribute('d', newPath);
        
        return afterIndex + 1;
    }
    
    return -1;
}



// Функция расстояния до отрезка
distanceToSegment(px, py, x1, y1, x2, y2) {
    const A = px - x1;
    const B = py - y1;
    const C = x2 - x1;
    const D = y2 - y1;

    const dot = A * C + B * D;
    const lenSq = C * C + D * D;
    let param = -1;
    
    if (lenSq !== 0) param = dot / lenSq;

    let xx, yy;

    if (param < 0) {
        xx = x1;
        yy = y1;
    } else if (param > 1) {
        xx = x2;
        yy = y2;
    } else {
        xx = x1 + param * C;
        yy = y1 + param * D;
    }

    const dx = px - xx;
    const dy = py - yy;
    
    return Math.sqrt(dx * dx + dy * dy);
}

// Вспомогательные методы
findVectorByControlPoint(controlType, belongsToPointIndex) {
    // Находим ВСЕ векторы, где контрольная точка принадлежит указанной точке
    const results = [];
    
    for (let i = 0; i < this.state.bezierVectors.length; i++) {
        const vector = this.state.bezierVectors[i];
        
        // Проверяем ВСЕ связи:
        
        // 1. Если контрольная точка 1 принадлежит указанной точке
        if (controlType === 'control1' && vector.control1.belongsTo === belongsToPointIndex) {
            results.push({ vector, index: i, type: 'control1' });
        }
        
        // 2. Если контрольная точка 2 принадлежит указанной точке
        if (controlType === 'control2' && vector.control2.belongsTo === belongsToPointIndex) {
            results.push({ vector, index: i, type: 'control2' });
        }
        
        // 3. Также проверяем обратные связи
        // (точка может быть концом вектора и иметь control2, который технически connectedTo другую точку)
        if (controlType === 'control2' && vector.to === belongsToPointIndex) {
            results.push({ vector, index: i, type: 'control2' });
        }
        
        if (controlType === 'control1' && vector.from === belongsToPointIndex) {
            results.push({ vector, index: i, type: 'control1' });
        }
    }
    
    // Возвращаем первый найденный результат
    return results.length > 0 ? results[0] : null;
}


            // МЫШЬ
onMouseDown(e) {

if (this.state.currentTool === 'push') {

        .filter(el => {
            const tag = el.tagName.toLowerCase();
            
            // Пропускаем по ID
            if (el.id && (el.id.includes('background') || el.id.includes('indicator'))) {
                return false;
            }
            
            // Проверяем класс через getAttribute (более надежно для SVG)
            const classAttr = el.getAttribute('class') || '';

        for (let i = 0; i < currentPoints.length; i++) {

                Math.pow(coords.x - point.x, 2) +

            );
            
            if (distance <= radius) {
                existingPointsInCircle.push({
                    pointIndex: i,
                    point: point,
                    distance: distance
                });
            }
        }
        
        // 2. Если точек внутри круга МАЛО (<5)
        if (existingPointsInCircle.length < 5) {
            // Найти БЛИЖАЙШИЙ отрезок к центру круга
            let closestSegment = null;
            let minDistance = Infinity;
            let segmentIndex = -1;
            
            for (let i = 0; i < currentPoints.length; i++) {
                const p1 = currentPoints[i];
                const p2 = currentPoints[(i + 1) % currentPoints.length];
                
                if (!isClosed && i === currentPoints.length - 1) break;
                
                const segmentDistance = this.distanceToSegment(coords.x, coords.y, p1.x, p1.y, p2.x, p2.y);
                if (segmentDistance < minDistance && segmentDistance <= radius) {
                    minDistance = segmentDistance;
                    closestSegment = { p1, p2 };
                    segmentIndex = i;
                }
            }
            
            if (closestSegment && segmentIndex !== -1) {
                // 3. Найти где отрезок входит и выходит из круга
                const intersections = this.circleSegmentIntersections(
                    coords.x, coords.y, radius, 
                    closestSegment.p1.x, closestSegment.p1.y, 
                    closestSegment.p2.x, closestSegment.p2.y
                );
                
                let tStart = 0;
                let tEnd = 1;
                
                if (intersections.length >= 2) {
                    tStart = Math.max(0, intersections[0].t - 0.1);
                    tEnd = Math.min(1, intersections[1].t + 0.1);
                } else if (intersections.length === 1) {
                    // Если одна точка пересечения
                    const d1 = Math.sqrt(Math.pow(coords.x - closestSegment.p1.x, 2) + Math.pow(coords.y - closestSegment.p1.y, 2));
                    const d2 = Math.sqrt(Math.pow(coords.x - closestSegment.p2.x, 2) + Math.pow(coords.y - closestSegment.p2.y, 2));
                    
                    if (d1 <= radius) {
                        tStart = 0;
                        tEnd = Math.min(1, intersections[0].t + 0.1);
                    } else if (d2 <= radius) {
                        tStart = Math.max(0, intersections[0].t - 0.1);
                        tEnd = 1;
                    }
                }
                
                // 4. ПОДГОТОВИТЬ все точки для вставки
                const pointsToInsert = [];
                
                // Точки ДО круга (закрепленные)

                    type: 'anchor-before'
                });
                pointsToInsert.push({
                    t: tStart - 0.1,
                    type: 'anchor-before'
                });
                
                // Точки ВНУТРИ круга (5 точек равномерно)
                const numPointsInside = 5;
                for (let i = 1; i <= numPointsInside; i++) {
                    const t = tStart + (tEnd - tStart) * (i / (numPointsInside + 1));
                    pointsToInsert.push({
                        t: t,
                        type: 'inside'
                    });
                }
                
                // Точки ПОСЛЕ круга (закрепленные)
                pointsToInsert.push({
                    t: tEnd + 0.1,
                    type: 'anchor-after'
                });
                pointsToInsert.push({
                    t: tEnd + 0.2,
                    type: 'anchor-after'
                });
                
                // 5. ВСТАВИТЬ все точки ОДНИМ проходом (от конца к началу)
                // Сортируем точки по t (от большего к меньшему)
                pointsToInsert.sort((a, b) => b.t - a.t);
                
                // Начинаем вставлять с КОНЦА, чтобы индексы не сбивались
                pointsToInsert.forEach(pointToInsert => {
                    if (pointToInsert.t >= 0 && pointToInsert.t <= 1) {
                        const x = closestSegment.p1.x + (closestSegment.p2.x - closestSegment.p1.x) * pointToInsert.t;
                        const y = closestSegment.p1.y + (closestSegment.p2.y - closestSegment.p1.y) * pointToInsert.t;
                        
                        // Вставляем ПОСЛЕ segmentIndex
                        this.insertPointIntoPath(path, segmentIndex, x, y);
                    }
                });
            }
        }
        
        // 6. После всех вставок, найти ВСЕ точки внутри круга
        const finalD = path.getAttribute('d');
        const { points: finalPoints } = this.parsePathToPoints(finalD);
        
        for (let i = 0; i < finalPoints.length; i++) {
            const point = finalPoints[i];
            const distance = Math.sqrt(
                Math.pow(coords.x - point.x, 2) + 
                Math.pow(coords.y - point.y, 2)
            );
            
            if (distance <= radius) {
                affectedPoints.push({
                    path: path,
                    pointIndex: i,
                    x: point.x,
                    y: point.y,
                    originalX: point.x,
                    originalY: point.y,
                    distance: distance
                });
            }
        }
    });
    
    if (affectedPoints.length > 0) {
        this.state.isDrawing = true;
        this.pushData = {
            points: affectedPoints,
            mouseStartX: coords.x,
            mouseStartY: coords.y,
            radius: radius
        };
        
        this.showPushIndicator(coords.x, coords.y, radius);
    }
    
    return;
}

if (this.state.currentTool === 'pen') {
