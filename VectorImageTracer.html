    this.createBackground(widthPx, heightPx);
}

createBackground(width, height) {
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, width, height);
    
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, width - 1, height - 1);
    
    const img = new Image();
    img.onload = () => {
        const oldWorksheet = document.getElementById('worksheet-background');
        if (oldWorksheet) oldWorksheet.remove();
        
        this.state.worksheetImage = img;
        this.state.worksheetUrl = canvas.toDataURL('image/png');
        
        this.displayWorksheet(img);
        
        if (!this.state.image) {
            this.updateImageCache(img);
        }
    };
    img.src = canvas.toDataURL('image/png');
}

displayWorksheet(img) {
    while (this.worksheetLayer.firstChild) {
        this.worksheetLayer.removeChild(this.worksheetLayer.firstChild);
    }
    
    const worksheetElement = document.createElementNS('http://www.w3.org/2000/svg', 'image');
    worksheetElement.id = 'worksheet-background';
    worksheetElement.setAttribute('href', img.src || this.state.worksheetUrl);
    worksheetElement.style.opacity = '1.0';
    worksheetElement.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    worksheetElement.style.pointerEvents = 'none'; 
    
    this.worksheetLayer.appendChild(worksheetElement);

    this.centerWorksheet();
}

centerWorksheet() {
    if (!this.state.worksheetImage) return;
    
    const img = this.state.worksheetImage;
    const worksheetElement = document.getElementById('worksheet-background');
    if (!worksheetElement) return;
    
    // Фиксированный viewBox 1000x1000
    const viewBoxSize = 1000;
    const scale = Math.min(viewBoxSize / img.width, viewBoxSize / img.height) * 0.9;
    
    worksheetElement.setAttribute('width', img.width * scale);
    worksheetElement.setAttribute('height', img.height * scale);
    
    const x = (viewBoxSize - img.width * scale) / 2;
    const y = (viewBoxSize - img.height * scale) / 2;
    
    worksheetElement.setAttribute('x', x);
    worksheetElement.setAttribute('y', y);
}

loadImage(file) {
    const reader = new FileReader();
    reader.onload = async (e) => {
        const img = new Image();
        img.onload = async () => {
            this.state.image = img;
            this.state.imageUrl = e.target.result;
            this.state.originalImageRatio = img.width / img.height;
            this.updateAspectRatioDisplay(img.width, img.height);
            const display = document.getElementById('loadedImageSizeDisplay');
            if (display) {
                this.updateLoadedImageSizeDisplay(img);
            }

            this.removePhotoOnly();
            
            let imageForDisplay = img;
            let imageForSnapping = img;
            
            if (file.type === 'image/png' || file.name.toLowerCase().endsWith('.png')) {
                try {
                    imageForDisplay = await this.addWhiteBackgroundToPNG(img);
                    imageForSnapping = imageForDisplay;
                    this.state.imageUrl = imageForDisplay.src;
                } catch (error) {
                    console.warn('Не удалось обработать PNG:', error);
                    imageForDisplay = img;
                    imageForSnapping = img;
                }
            }
            
            this.state.imageForDisplay = imageForDisplay;
            this.displayPhoto(imageForDisplay);
            const imageControls = document.getElementById('imageControls');
            if (imageControls) imageControls.style.display = 'block';
            this.updateImageCache(imageForSnapping);
			this.setTool(this.state.currentTool);
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}
displayPhoto(img) {
    // Очищаем слой фото
    while (this.photoLayer.firstChild) {
        this.photoLayer.removeChild(this.photoLayer.firstChild);
    }
    
    // Сохраняем исходные размеры
    this.state.originalPhotoWidth = img.width;
    this.state.originalPhotoHeight = img.height;
    
    // Создаем фото
    const photoElement = document.createElementNS('http://www.w3.org/2000/svg', 'image');
    photoElement.id = 'photo-overlay';
    photoElement.setAttribute('href', img.src || this.state.imageUrl);
    
    const opacitySlider = document.getElementById('opacitySlider');
    photoElement.style.opacity = (opacitySlider?.value || 50) / 100;
    photoElement.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    
    if (this.state.currentTool === 'select') {
        photoElement.style.pointerEvents = 'all';
        photoElement.style.cursor = 'move';
    } else {
        photoElement.style.pointerEvents = 'none';
        photoElement.style.cursor = 'default';
    }
    
    this.photoLayer.appendChild(photoElement);
    
    // === НОВОЕ: вычисляем размер фото в пикселях SVG на основе DPI ===
    const currentDpi = parseInt(document.getElementById('dpiInput')?.value) || 96;
    
    // Получаем физический размер фото в дюймах (из пикселей / DPI)
    const photoWidthInches = img.width / currentDpi;
    const photoHeightInches = img.height / currentDpi;
    
    // Получаем размер рабочего листа в пикселях SVG
    const worksheetElement = document.getElementById('worksheet-background');
    const worksheetSvgWidth = worksheetElement ? 
        parseFloat(worksheetElement.getAttribute('width')) : 1000;
    const worksheetSvgHeight = worksheetElement ? 
        parseFloat(worksheetElement.getAttribute('height')) : 1000;
    
    // Получаем физический размер рабочего листа в мм из полей ввода
    const worksheetMmWidth = parseFloat(document.getElementById('mmWidth')?.value) || 210;
    const worksheetMmHeight = parseFloat(document.getElementById('mmHeight')?.value) || 297;
    
    // Переводим мм в дюймы (1 дюйм = 25.4 мм)
    const worksheetWidthInches = worksheetMmWidth / 25.4;
    const worksheetHeightInches = worksheetMmHeight / 25.4;
    
    // Вычисляем масштаб: сколько SVG-пикселей приходится на 1 дюйм
    const svgPixelsPerInchX = worksheetSvgWidth / worksheetWidthInches;
    const svgPixelsPerInchY = worksheetSvgHeight / worksheetHeightInches;
    
    // Вычисляем размер фото в SVG-пикселях (сохраняя его физический размер)
    const photoSvgWidth = photoWidthInches * svgPixelsPerInchX;
    const photoSvgHeight = photoHeightInches * svgPixelsPerInchY;
    
    // Сохраняем масштаб относительно исходного размера
    this.state.photoScale = photoSvgWidth / img.width;
    
    // Вычисляем процент от ширины листа для отображения в UI
    const percentOfWorksheet = Math.round((photoSvgWidth / worksheetSvgWidth) * 100);
    
    // Центрируем фото
    const viewBoxSize = 1000;
    const newX = (viewBoxSize - photoSvgWidth) / 2;
    const newY = (viewBoxSize - photoSvgHeight) / 2;
    
    photoElement.setAttribute('width', photoSvgWidth);
    photoElement.setAttribute('height', photoSvgHeight);
    photoElement.setAttribute('x', newX);
    photoElement.setAttribute('y', newY);
    
    this.updatePhotoSizeDisplay(100);
}

removePhotoOnly() {
    const photoElement = document.getElementById('photo-overlay');
    if (photoElement) {
        photoElement.remove();
    }
}

// Обновление отображения размера загруженного фото
updateLoadedImageSizeDisplay(img) {
    const display = document.getElementById('loadedImageSizeDisplay');
    const dpiInfo = document.getElementById('loadedImageDpiInfo');
    
    if (display && img) {
        const currentDpi = parseInt(document.getElementById('dpiInput')?.value) || 96;

        const mmHeight = Math.round((img.height * 25.4) / currentDpi);

        if (dpiInfo) {
            dpiInfo.textContent = `${mmWidth}×${mmHeight} мм (при ${currentDpi} DPI)`;
        }
    }
}

simplifyRatio(width, height) {
    // Функция для нахождения наибольшего общего делителя (НОД)
    const gcd = (a, b) => {
        a = Math.abs(a);
        b = Math.abs(b);
        
        // Используем алгоритм Евклида
        while (b !== 0) {
            const temp = b;
            b = a % b;
            a = temp;
        }
        return a;
    };
    
    // Находим НОД для текущих чисел
    let divisor = gcd(width, height);
    
    // Если числа очень большие, пробуем упростить до более читаемого формата
    if (divisor === 1 && (width > 1000 || height > 1000)) {
        // Пробуем делить на 10, 5, 2 для упрощения
        const tryDivisors = [10, 5, 2];
        for (const tryDiv of tryDivisors) {
            if (width % tryDiv === 0 && height % tryDiv === 0) {
                divisor = tryDiv;
                break;
            }
        }
    }
    
    // Упрощаем соотношение
    const simplifiedWidth = width / divisor;
    const simplifiedHeight = height / divisor;
    
    // Форматируем вывод
    return `${simplifiedWidth}/\n${simplifiedHeight}`;
}

setupToolToggle() {
    // Проверяем, что svg существует
    if (!this.svg) {
        console.warn('SVG не инициализирован, откладываем настройку переключения');
        setTimeout(() => this.setupToolToggle(), 100);
        return;
    }
    
    // Блокируем контекстное меню на холсте
    this.svg.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        return false;
    });

    // Переключение по правой кнопке мыши
    this.svg.addEventListener('mousedown', (e) => {
        if (e.button === 2) {
            e.preventDefault();
            e.stopPropagation();
            
            // Всегда переключаем инструменты при правом клике
            // Неважно где кликнули - даже на элементах Безье
            this.switchTools();
            
            return false;
        }
    });
}

switchTools() {
    const current = this.state.currentTool;
    
    if (this.lastTool && this.lastTool !== current) {
        // Переключаемся на предыдущий инструмент
        this.setTool(this.lastTool);
    }
    
    // Сохраняем текущий инструмент как предыдущий
    this.lastTool = current;
}
	
// ИНСТРУМЕНТЫ            
setTool(tool) {
	document.getElementById('fillSettings').style.display = 
    tool === 'fill-shape' ? 'block' : 'none';
    document.getElementById('bezierSettings').style.display = 
        tool === 'bezier-points' ? 'block' : 'none';
    // Сбрасываем все состояния перетаскивания
    if (this.state.isDraggingPoint) {
        this.endPointDrag();
    }
    if (this.state.isDraggingBezierControl) {
        this.endBezierControlDrag();
    }
    if (this.selectedElement && tool !== 'select') {
        this.removeSelectionHandles();
        this.selectedElement = null;
    }
    this.state.currentElement = null;
    const previousTool = this.state.currentTool;
    
    // Если ВХОДИМ в режим Безье
    if (tool === 'bezier-points') {
        this.state.lastBezierDirection = null;
        this.state.lastBezierLength = null;
        this.showBezierHelpers();
        this.toggleBezierPoints(true);
    } else if (this.state.currentTool === 'bezier-points' && tool !== 'bezier-points') {
        this.deselectAllPoints();
        this.state.lastBezierDirection = null;
        this.state.lastBezierLength = null;
        this.hideBezierHelpers();
        this.toggleBezierPoints(false);
    }
    
    this.state.currentTool = tool;
    
    // === ВАЖНО: МЕНЯЕМ pointer-events ФОТО В ЗАВИСИМОСТИ ОТ ИНСТРУМЕНТА ===
    const photoElement = document.getElementById('photo-overlay');
    if (photoElement) {
        if (tool === 'select') {
            // В режиме выделения фото можно перетаскивать
            photoElement.style.pointerEvents = 'all';
            photoElement.style.cursor = 'move';
        } else {
            // В остальных режимах фото пропускает клики к инструментам рисования
            photoElement.style.pointerEvents = 'none';
            photoElement.style.cursor = 'default';
        }
    }
    
    // Обновляем активные кнопки
    document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    document.querySelector(`[data-tool="${tool}"]`).classList.add('active');
    
    // Показываем/скрываем настройки инструментов
    document.getElementById('penSettings').style.display = 
        tool === 'pen' ? 'block' : 'none';
    
    document.getElementById('pushSettings').style.display = 
        tool === 'push' ? 'block' : 'none';
    
    document.getElementById('eraserSettings').style.display = 
        tool === 'eraser' ? 'block' : 'none';
    
    this.loadSettingsFromUI();
    this.updateCursor();
    
    if (tool !== 'push') {
        this.hidePushIndicator();
    }
    if (tool !== 'eraser') {
        this.hideEraserIndicator();
    }
    
    if (tool !== previousTool) {
        this.lastTool = previousTool;
    }
}

updateCursor() {
    if (!this.svg) return;
    
    if (this.state.currentTool === 'push') {
        this.svg.style.cursor = 'none';
    } else if (this.state.currentTool === 'eraser') {
        // Проверяем, зажат ли Ctrl
        if (window.event && (window.event.ctrlKey || window.event.metaKey)) {
            this.svg.style.cursor = 'pointer';
        } else {
            this.svg.style.cursor = 'none';
        }
    } else if (this.state.currentTool === 'select') {
        this.svg.style.cursor = this.state.isMoving ? 'grabbing' : 'move';
    } else if (this.state.currentTool === 'bezier-points') {
        this.svg.style.cursor = 'crosshair';
    } else {
        this.svg.style.cursor = 'crosshair';
    }
}

showPushIndicator(x, y, radius) {
    let indicator = document.getElementById('push-indicator');
    
    if (!indicator) {
        indicator = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        indicator.id = 'push-indicator';
        indicator.setAttribute('stroke', '#ff6b6b');
        indicator.setAttribute('stroke-width', '1');
        indicator.setAttribute('fill', 'rgba(255, 107, 107, 0.1)');
        indicator.setAttribute('stroke-dasharray', '3,3');
        indicator.style.pointerEvents = 'none';
        this.svg.appendChild(indicator);
    }
    
    indicator.setAttribute('cx', x);
    indicator.setAttribute('cy', y);
    indicator.setAttribute('r', radius);
    indicator.style.display = 'block';
}

hidePushIndicator() {
    const indicator = document.getElementById('push-indicator');
    if (indicator) {
        indicator.style.display = 'none';
    }
}      

deleteEntireVectorAt(e) {
    const coords = this.getSVGCoordinates(e);
    const target = e.target;
    
    // Скрываем индикатор ластика
    this.hideEraserIndicator();
    
    // Проверяем, кликнули ли на вектор Безье
    if (target.classList && target.classList.contains('bezier-vector')) {
        // Находим все связанные векторы Безье
        const vector = this.state.bezierVectors.find(v => v.path === target);
        if (vector) {
            const connectedVectors = this.findAllConnectedBezierVectors(vector);
            this.deleteBezierVectors(connectedVectors);
            return;
        }
    }
    
    // Проверяем, кликнули ли на точку Безье
    if (target.classList && target.classList.contains('bezier-point')) {
        const pointIndex = parseInt(target.getAttribute('data-index'));
        if (!isNaN(pointIndex)) {
            this.deleteBezierPoint(pointIndex);
            return;
        }
    }
    
    // Ищем обычные векторы под курсором
    const radius = 10; // Небольшой радиус для поиска
    
    // Ищем path
    const paths = Array.from(this.svg.querySelectorAll('path'))
        .filter(p => !p.id?.includes('background') && 
                     !p.id?.includes('indicator') &&
                     !p.classList?.contains('bezier-guide-line') &&
                     !p.classList?.contains('bezier-point') &&
                     !p.classList?.contains('bezier-control-point'));
    
    for (const path of paths) {
        if (this.isPointNearPath(coords.x, coords.y, path, radius)) {
            if (path.parentNode) {
                path.parentNode.removeChild(path);
                return;
            }
        }
    }
    
    // Ищем line
    const lines = Array.from(this.svg.querySelectorAll('line'))
        .filter(l => !l.id?.includes('background'));
    
    for (const line of lines) {
        const x1 = parseFloat(line.getAttribute('x1')) || 0;
        const y1 = parseFloat(line.getAttribute('y1')) || 0;
        const x2 = parseFloat(line.getAttribute('x2')) || 0;
        const y2 = parseFloat(line.getAttribute('y2')) || 0;
        
        const dist = this.distanceToSegment(coords.x, coords.y, x1, y1, x2, y2);
        if (dist <= radius) {
            if (line.parentNode) {
                line.parentNode.removeChild(line);
                return;
            }
        }
    }
    
    // Ищем rect
    const rects = Array.from(this.svg.querySelectorAll('rect'))
        .filter(r => !r.id?.includes('background'));
    
    for (const rect of rects) {
        const x = parseFloat(rect.getAttribute('x')) || 0;
        const y = parseFloat(rect.getAttribute('y')) || 0;
        const w = parseFloat(rect.getAttribute('width')) || 0;
        const h = parseFloat(rect.getAttribute('height')) || 0;
        
        if (coords.x >= x && coords.x <= x + w && 
            coords.y >= y && coords.y <= y + h) {
            if (rect.parentNode) {
                rect.parentNode.removeChild(rect);
                return;
            }
        }
    }
    
    // Ищем circle
    const circles = Array.from(this.svg.querySelectorAll('circle'))
        .filter(c => !c.id?.includes('background'));
    
    for (const circle of circles) {
        const cx = parseFloat(circle.getAttribute('cx')) || 0;
        const cy = parseFloat(circle.getAttribute('cy')) || 0;
        const r = parseFloat(circle.getAttribute('r')) || 0;
        
        const dist = Math.sqrt((coords.x - cx) ** 2 + (coords.y - cy) ** 2);
        if (dist <= r + radius) {
            if (circle.parentNode) {
                circle.parentNode.removeChild(circle);
                return;
            }
        }
    }
    
    // Ищем ellipse
    const ellipses = Array.from(this.svg.querySelectorAll('ellipse'))
        .filter(el => !el.id?.includes('background'));
    
    for (const ellipse of ellipses) {
        const cx = parseFloat(ellipse.getAttribute('cx')) || 0;
        const cy = parseFloat(ellipse.getAttribute('cy')) || 0;
        const rx = parseFloat(ellipse.getAttribute('rx')) || 0;
        const ry = parseFloat(ellipse.getAttribute('ry')) || 0;
        
        // Упрощенная проверка
        const dist = Math.sqrt((coords.x - cx) ** 2 + (coords.y - cy) ** 2);
        if (dist <= Math.max(rx, ry) + radius) {
            if (ellipse.parentNode) {
                ellipse.parentNode.removeChild(ellipse);
                return;
            }
        }
    }
    
    // Сохраняем состояние после удаления
    this.saveSnapshot();
}

isPointNearPath(x, y, path, maxDistance) {
    const d = path.getAttribute('d');
    if (!d) return false;
    
    const { points } = this.parsePathToPoints(d);
    if (points.length < 2) return false;
    
    for (let i = 0; i < points.length - 1; i++) {
        const dist = this.distanceToSegment(
            x, y, 
            points[i].x, points[i].y, 
            points[i + 1].x, points[i + 1].y
        );
        if (dist <= maxDistance) return true;
    }
    
    return false;
}

deleteBezierVectors(vectors) {
    // Собираем все точки, которые нужно удалить
    const pointsToDelete = new Set();
    vectors.forEach(v => {
        pointsToDelete.add(v.from);
        pointsToDelete.add(v.to);
        
        // Удаляем визуальные элементы
        if (v.path && v.path.parentNode) {
            v.path.parentNode.removeChild(v.path);
        }
        if (v.guideElements.line1) v.guideElements.line1.remove();
        if (v.guideElements.control1) v.guideElements.control1.remove();
        if (v.guideElements.line2) v.guideElements.line2.remove();
        if (v.guideElements.control2) v.guideElements.control2.remove();
    });
    
    // Удаляем векторы из массива (с конца)
    for (let i = this.state.bezierVectors.length - 1; i >= 0; i--) {
        if (vectors.includes(this.state.bezierVectors[i])) {
            this.state.bezierVectors.splice(i, 1);
        }
    }
    
    // Удаляем точки
    const sortedPoints = Array.from(pointsToDelete).sort((a, b) => b - a);
    sortedPoints.forEach(pointIndex => {
        const point = this.state.bezierPoints[pointIndex];
        if (point && point.element && point.element.parentNode) {
            point.element.parentNode.removeChild(point.element);
        }
        this.state.bezierPoints.splice(pointIndex, 1);
    });
    
    // Обновляем индексы
    this.state.bezierPoints.forEach((point, index) => {
        point.index = index;
        if (point.element) {
            point.element.setAttribute('data-index', index);
        }
    });
    
    // Обновляем индексы в оставшихся векторах
    this.state.bezierVectors.forEach(vector => {
        // Корректируем индексы
        let fromShift = 0, toShift = 0;
        sortedPoints.forEach(removedIndex => {
            if (vector.from > removedIndex) fromShift++;
            if (vector.to > removedIndex) toShift++;
        });
        vector.from -= fromShift;
        vector.to -= toShift;
    });
    
    // Сбрасываем выделение
    this.deselectAllPoints();
    
    // Сохраняем состояние
    this.saveSnapshot();
}

// Функция конвертации конкретного элемента в путь
convertToPath(element) {
    // === ЗАЩИТА: НИКОГДА НЕ КОНВЕРТИРУЕМ БЕЗЬЕ-ЭЛЕМЕНТЫ ===
    const className = element.getAttribute('class') || '';
    if (className.includes('bezier-')) {
        return null;
    }
    
    let pathData = '';
    const stroke = element.getAttribute('stroke') || 'black';
    const strokeWidth = element.getAttribute('stroke-width') || '1';
    const fill = element.getAttribute('fill') || 'none';
    
    switch(element.tagName.toLowerCase()) {
        case 'line':
            const x1 = parseFloat(element.getAttribute('x1')) || 0;
            const y1 = parseFloat(element.getAttribute('y1')) || 0;
            const x2 = parseFloat(element.getAttribute('x2')) || 0;
            const y2 = parseFloat(element.getAttribute('y2')) || 0;
            
            pathData = `M ${x1} ${y1} L ${x2} ${y2}`;
            break;
            
        // ... весь остальной switch без изменений ...
    }
    
    if (!pathData) return null;
    
    // Создаем новый путь
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', pathData);
    path.setAttribute('stroke', stroke);
    path.setAttribute('stroke-width', strokeWidth);
    path.setAttribute('fill', fill);
    path.setAttribute('stroke-linecap', element.getAttribute('stroke-linecap') || 'round');
    path.setAttribute('stroke-linejoin', element.getAttribute('stroke-linejoin') || 'round');
    
    return path;
}

// Парсинг пути в точки
parsePathToPoints(d) {
    if (!d || d.trim() === '') {
        return { points: [], isClosed: false };
    }
    
    // Проверяем кэш (Map может использовать строки как ключи)
    if (this.pathCache.has(d)) {
        return this.pathCache.get(d);
    }
    
    const isClosed = d.includes(' Z') || d.includes('z');
    
    try {
        const points = [];
        const numbers = d.match(/[+-]?\d*\.?\d+(?:[eE][+-]?\d+)?/g) || [];
        
        for (let i = 0; i < numbers.length; i += 2) {
            if (i + 1 < numbers.length) {
                points.push({
                    x: parseFloat(numbers[i]),
                    y: parseFloat(numbers[i + 1])
                });
            }
        }
        
        const result = { points, isClosed };
        
        // Кэшируем только для часто используемых путей
        if (d.length < 1000) {
            this.pathCache.set(d, result);
        }
        
        return result;
    } catch (error) {
        console.error('Ошибка парсинга пути:', error, d);
        return { points: [], isClosed: false };
    }
}

// Преобразование точек в путь
pointsToPath(points, wasOriginallyClosed = false) {
    if (points.length === 0) return '';
    
    let pathData = `M ${points[0].x} ${points[0].y}`;
    
    for (let i = 1; i < points.length; i++) {
        pathData += ` L ${points[i].x} ${points[i].y}`;
    }
    
    // Закрываем путь ТОЛЬКО если он изначально был закрыт
    if (wasOriginallyClosed && points.length > 2) {
        pathData += ' Z';
    }
    
    return pathData;
}

insertPointIntoPath(path, afterIndex, x, y) {
    const d = path.getAttribute('d');
    if (!d) return -1;
    
    const { points, isClosed } = this.parsePathToPoints(d);
    
    // Проверяем что точка не существует уже
    const tolerance = 0.1;
    const exists = points.some(p => 
        Math.abs(p.x - x) < tolerance && Math.abs(p.y - y) < tolerance
    );
    
    if (exists) return -1;
    
    if (afterIndex >= 0 && afterIndex < points.length) {
        // Вставляем точку
        points.splice(afterIndex + 1, 0, {x: x, y: y});
        
        // Перестраиваем путь
        const newPath = this.pointsToPath(points, isClosed);
        path.setAttribute('d', newPath);
        
        return afterIndex + 1;
    }
    
    return -1;
}

// Функция расстояния до отрезка
distanceToSegment(px, py, x1, y1, x2, y2) {
    const A = px - x1;
    const B = py - y1;
    const C = x2 - x1;
    const D = y2 - y1;

    const dot = A * C + B * D;
    const lenSq = C * C + D * D;
    let param = -1;
    
    if (lenSq !== 0) param = dot / lenSq;

    let xx, yy;

    if (param < 0) {
        xx = x1;
        yy = y1;
    } else if (param > 1) {
        xx = x2;
        yy = y2;
    } else {
        xx = x1 + param * C;
        yy = y1 + param * D;
    }

    const dx = px - xx;
    const dy = py - yy;
    
    return Math.sqrt(dx * dx + dy * dy);
}

// Вспомогательные методы
findVectorByControlPoint(controlType, belongsToPointIndex) {
    // Находим ВСЕ векторы, где контрольная точка принадлежит указанной точке
    const results = [];
    
    for (let i = 0; i < this.state.bezierVectors.length; i++) {
        const vector = this.state.bezierVectors[i];
        
        // Проверяем ВСЕ связи:
        
        // 1. Если контрольная точка 1 принадлежит указанной точке
        if (controlType === 'control1' && vector.control1.belongsTo === belongsToPointIndex) {
            results.push({ vector, index: i, type: 'control1' });
        }
        
        // 2. Если контрольная точка 2 принадлежит указанной точке
        if (controlType === 'control2' && vector.control2.belongsTo === belongsToPointIndex) {
            results.push({ vector, index: i, type: 'control2' });
        }
        
        // 3. Также проверяем обратные связи
        // (точка может быть концом вектора и иметь control2, который технически connectedTo другую точку)
        if (controlType === 'control2' && vector.to === belongsToPointIndex) {
            results.push({ vector, index: i, type: 'control2' });
        }
        
        if (controlType === 'control1' && vector.from === belongsToPointIndex) {
            results.push({ vector, index: i, type: 'control1' });
        }
    }
    
    // Возвращаем первый найденный результат
    return results.length > 0 ? results[0] : null;
}

// МЫШЬ            
onMouseDown(e) {
    const coords = this.getSVGCoordinates(e);
    const target = e.target;
if (this.state.currentTool === 'fill-shape') {
    e.preventDefault();
    
    const target = e.target;
    const coords = this.getSVGCoordinates(e);
    
    // Проверяем, кликнули ли на границу фигуры
    const tag = target.tagName?.toLowerCase();
    
    if (tag === 'path' || tag === 'rect' || tag === 'circle' || tag === 'ellipse') {
        if (!target.id?.includes('background') && 
            !target.id?.includes('indicator') &&
            !target.classList?.contains('bezier-point') &&
            !target.classList?.contains('bezier-control-point') &&
            !target.classList?.contains('bezier-guide-line')) {
            
            if (target.classList?.contains('bezier-vector')) {
                const contourElement = this.getFullBezierContour(target);
                if (contourElement) {
                    this.fillShapeWithSnake(contourElement);
                    return;
                }
            }
            this.fillShapeWithSnake(target);
            return;
        }
    }
    
    // Клик по пустому месту — ищем фигуру под курсором
    const foundElement = this.findShapeAtPoint(coords.x, coords.y);
    
    if (foundElement) {
        if (foundElement.classList?.contains('bezier-vector')) {
            const contourElement = this.getFullBezierContour(foundElement);
            if (contourElement) {
                this.fillShapeWithSnake(contourElement);
            } else {
                this.fillShapeWithSnake(foundElement);
            }
        } else {
            this.fillShapeWithSnake(foundElement);
        }
    }
    return;
}

    if (target.id === 'photo-overlay' && this.state.currentTool === 'select') {
        e.preventDefault();
        this.startPhotoDrag(e, target);
        return;
    }

    // Режим Безье точек
if (this.state.currentTool === 'bezier-points') {
    if (e.button === 2) {
        return; 
    }
    e.preventDefault();
    e.stopPropagation();
    
    // Клик по точке Безье — начало перетаскивания (обрабатывается в createBezierPointElement)
    if (target.classList.contains('bezier-point')) {
	
        return;
    }
    
    // Клик по контрольной точке — перетаскивание (обрабатывается в createVectorGuides)
    if (target.classList.contains('bezier-control-point')) {
        return;
    }
    
    // Клик по пустому месту
    if (target === this.svg || target.id === 'worksheet-background' || 
        target.id === 'photo-overlay' || target === this.vectorLayer ||
        target === this.helperLayer) {
        
        if (this.state.bezierSelectedPoint !== null) {
            // === ВСЕГДА создаём новую точку и новый вектор ===
            // Не продолжаем существующий вектор, а начинаем новый
            this.createNewBezierVector(coords.x, coords.y);
        } else {
            // Нет выделенной точки — просто создаём новую точку
            this.createSingleBezierPoint(coords.x, coords.y);
        }
        return;
    }
    
    // Клик по пути Безье — добавляем точку на путь
    if (target.classList && target.classList.contains('bezier-vector')) {
        this.addPointToBezierPath(target, coords.x, coords.y);
        return;
    }
    
    return;
}

    
    // Режим SELECT (для панорамирования и перетаскивания векторов)
if (this.state.currentTool === 'select') {
    e.preventDefault();
    
    const targetClass = target.getAttribute('class') || '';
    const isBezierVector = targetClass.includes('bezier-vector');
    const isBezierPoint = targetClass.includes('bezier-point');
    const isBezierControl = targetClass.includes('bezier-control-point');
    const isBezierGuide = targetClass.includes('bezier-guide-line');
    
    const isHandle = target.parentElement?.id === 'selection-handles';
    if (isHandle) return;
    
    if (isBezierPoint || isBezierControl || isBezierGuide) return;
    
    const tag = target.tagName?.toLowerCase();
    const isVectorElement = tag === 'path' || tag === 'line' || tag === 'rect' || tag === 'circle' || tag === 'ellipse';
    
    // === БЕЗЬЕ-ВЕКТОР: выделяем и перетаскиваем весь контур ===
    if (isBezierVector) {
        this.startBezierContourDrag(e, target);
        return;
    }
    
    // === ОБЫЧНЫЙ ВЕКТОР: выделяем и перетаскиваем ===
    if (isVectorElement && target !== this.worksheetLayer) {
        if (this.selectedElement && this.selectedElement !== target) {
            this.removeSelectionHandles();
            this.selectionAngle = 0;
        }
        this.selectElement(target);
        this.startElementDrag(e, target);
        return;
    }
    
    // Пустое место
    this.removeSelectionHandles();
    this.selectedElement = null;
    this.startPanning(e);
    return;
}

    
if (this.state.currentTool === 'push') {
    e.preventDefault();
    
    const radius = this.state.pushRadius / this.state.zoom;
    const allElements = Array.from(this.svg.children)
        .filter(el => {
            const tag = el.tagName.toLowerCase();
            
            // Пропускаем по ID
            if (el.id && (el.id.includes('background') || el.id.includes('indicator'))) {
                return false;
            }
            
            // Проверяем класс через getAttribute (более надежно для SVG)
            const classAttr = el.getAttribute('class') || '';
            
            // Пропускаем вспомогательные элементы Безье
            if (classAttr.includes('bezier-guide-line') || 
                classAttr.includes('bezier-control-point') || 
                classAttr.includes('bezier-point')) {
                return false;
            }
            
            // Основные векторы Безье - оставляем
            if (tag === 'path' && classAttr.includes('bezier-vector')) {
                return true;
            }
            
            // Обычные элементы
            return (tag === 'path' || tag === 'line' || tag === 'rect' || tag === 'circle');
        });
    
    const affectedPoints = [];
    
    allElements.forEach(element => {
        // Преобразовать в path если нужно
        if (element.tagName !== 'PATH') {
            const path = this.convertToPath(element);
            if (path) {
                element.parentNode.replaceChild(path, element);
                element = path;
            }
        }
        
        const path = element;
        const d = path.getAttribute('d');
        if (!d) return;
        
        const { points: currentPoints, isClosed } = this.parsePathToPoints(d);
        
        // 1. Найти все точки, которые УЖЕ внутри круга
        const existingPointsInCircle = [];
        for (let i = 0; i < currentPoints.length; i++) {
            const point = currentPoints[i];
            const distance = Math.sqrt(
                Math.pow(coords.x - point.x, 2) + 
                Math.pow(coords.y - point.y, 2)
            );
            
            if (distance <= radius) {
                existingPointsInCircle.push({
                    pointIndex: i,
                    point: point,
                    distance: distance
                });
            }
        }
        
        // 2. Если точек внутри круга МАЛО (<5)
        if (existingPointsInCircle.length < 5) {
            // Найти БЛИЖАЙШИЙ отрезок к центру круга
            let closestSegment = null;
            let minDistance = Infinity;
            let segmentIndex = -1;
            
            for (let i = 0; i < currentPoints.length; i++) {
                const p1 = currentPoints[i];
                const p2 = currentPoints[(i + 1) % currentPoints.length];
                
                if (!isClosed && i === currentPoints.length - 1) break;
                
                const segmentDistance = this.distanceToSegment(coords.x, coords.y, p1.x, p1.y, p2.x, p2.y);
                if (segmentDistance < minDistance && segmentDistance <= radius) {
                    minDistance = segmentDistance;
                    closestSegment = { p1, p2 };
                    segmentIndex = i;
                }
            }
            
            if (closestSegment && segmentIndex !== -1) {
                // 3. Найти где отрезок входит и выходит из круга
                const intersections = this.circleSegmentIntersections(
                    coords.x, coords.y, radius, 
                    closestSegment.p1.x, closestSegment.p1.y, 
                    closestSegment.p2.x, closestSegment.p2.y
                );
                
                let tStart = 0;
                let tEnd = 1;
                
                if (intersections.length >= 2) {
                    tStart = Math.max(0, intersections[0].t - 0.1);
                    tEnd = Math.min(1, intersections[1].t + 0.1);
                } else if (intersections.length === 1) {
                    // Если одна точка пересечения
                    const d1 = Math.sqrt(Math.pow(coords.x - closestSegment.p1.x, 2) + Math.pow(coords.y - closestSegment.p1.y, 2));
                    const d2 = Math.sqrt(Math.pow(coords.x - closestSegment.p2.x, 2) + Math.pow(coords.y - closestSegment.p2.y, 2));
                    
                    if (d1 <= radius) {
                        tStart = 0;
                        tEnd = Math.min(1, intersections[0].t + 0.1);
                    } else if (d2 <= radius) {
                        tStart = Math.max(0, intersections[0].t - 0.1);
                        tEnd = 1;
                    }
                }
                
                // 4. ПОДГОТОВИТЬ все точки для вставки
                const pointsToInsert = [];
                
                // Точки ДО круга (закрепленные)
                pointsToInsert.push({
                    t: tStart - 0.2,
                    type: 'anchor-before'
                });
                pointsToInsert.push({
                    t: tStart - 0.1,
                    type: 'anchor-before'
                });
                
                // Точки ВНУТРИ круга (5 точек равномерно)
                const numPointsInside = 5;
                for (let i = 1; i <= numPointsInside; i++) {
                    const t = tStart + (tEnd - tStart) * (i / (numPointsInside + 1));
                    pointsToInsert.push({
                        t: t,
                        type: 'inside'
                    });
                }
                
                // Точки ПОСЛЕ круга (закрепленные)
                pointsToInsert.push({
                    t: tEnd + 0.1,
                    type: 'anchor-after'
                });
                pointsToInsert.push({
                    t: tEnd + 0.2,
                    type: 'anchor-after'
                });
                
                // 5. ВСТАВИТЬ все точки ОДНИМ проходом (от конца к началу)
                // Сортируем точки по t (от большего к меньшему)
                pointsToInsert.sort((a, b) => b.t - a.t);
                
                // Начинаем вставлять с КОНЦА, чтобы индексы не сбивались
                pointsToInsert.forEach(pointToInsert => {
                    if (pointToInsert.t >= 0 && pointToInsert.t <= 1) {
                        const x = closestSegment.p1.x + (closestSegment.p2.x - closestSegment.p1.x) * pointToInsert.t;
                        const y = closestSegment.p1.y + (closestSegment.p2.y - closestSegment.p1.y) * pointToInsert.t;
                        
                        // Вставляем ПОСЛЕ segmentIndex
                        this.insertPointIntoPath(path, segmentIndex, x, y);
                    }
                });
            }
        }
        
        // 6. После всех вставок, найти ВСЕ точки внутри круга
        const finalD = path.getAttribute('d');
        const { points: finalPoints } = this.parsePathToPoints(finalD);
        
        for (let i = 0; i < finalPoints.length; i++) {
            const point = finalPoints[i];
            const distance = Math.sqrt(
                Math.pow(coords.x - point.x, 2) + 
                Math.pow(coords.y - point.y, 2)
            );
            
            if (distance <= radius) {
                affectedPoints.push({
                    path: path,
                    pointIndex: i,
                    x: point.x,
                    y: point.y,
                    originalX: point.x,
                    originalY: point.y,
                    distance: distance
                });
            }
        }
    });
    
    if (affectedPoints.length > 0) {
        this.state.isDrawing = true;
        this.pushData = {
            points: affectedPoints,
            mouseStartX: coords.x,
            mouseStartY: coords.y,
            radius: radius
        };
        
        this.showPushIndicator(coords.x, coords.y, radius);
    }
    
    return;
}

// Инструмент ластик onMouseDown
if (this.state.currentTool === 'eraser') {
    e.preventDefault();
    
    if (e.ctrlKey || e.metaKey) {
        this.deleteEntireVectorAt(e);
        return;
    }
    
    const coords = this.getSVGCoordinates(e);
    
    this.state.isDrawing = true;
    this.state.lastErasePoint = {x: coords.x, y: coords.y};
    this.eraseVectorsAt(coords.x, coords.y);
    
    return;
}
	
    this.state.isDrawing = true;
    
    // ДЛЯ КАРАНДАША: 
if (this.state.currentTool === 'pen') {
    // Если ВЫКЛЮЧЕНО продолжение вектора - начинаем новый путь
    if (!this.snapSettings.continueVector) {
        this.state.currentElement = null;
    }
    
    // Если есть currentElement и продолжение ВКЛЮЧЕНО
        if (this.snapSettings.continueVector && this.state.currentElement) {
            // Получаем последнюю точку текущего пути
            const d = this.state.currentElement.getAttribute('d');
            if (d) {
                const points = d.match(/[\d.-]+/g);
                if (points && points.length >= 2) {
                    // Берем последние координаты
                    const lastX = parseFloat(points[points.length - 2]);
                    const lastY = parseFloat(points[points.length - 1]);
                    
                    // Устанавливаем стартовую точку как последнюю точку пути
                    this.state.startPoint = {x: lastX, y: lastY};
                    
                    // Начинаем рисовать с этой точки
                    this.state.penPoints = [{x: lastX, y: lastY}];
                    return;
                }
            }
        }
    
    // НОВЫЙ КОД: Найти последний путь карандаша и его реальную последнюю точку
    if (this.snapSettings.continueVector) {
        // Ищем все пути карандаша (обычно это пути без fill)
        const allPaths = Array.from(this.svg.querySelectorAll('path'))
            .filter(path => {
                const fill = path.getAttribute('fill');
                const stroke = path.getAttribute('stroke');
                // Это путь карандаша если: нет fill или fill='none', и есть stroke
                return (!fill || fill === 'none') && stroke && 
                       !path.id?.includes('indicator') && 
                       !path.id?.includes('background');
            });
        
        if (allPaths.length > 0) {
            // Берем последний добавленный путь (предположительно последний нарисованный)
            const lastPath = allPaths[allPaths.length - 1];
            
            // Получаем его точки
            const d = lastPath.getAttribute('d');
            if (d) {
                // Парсим путь чтобы найти последнюю точку
                const { points } = this.parsePathToPoints(d);
                
                if (points.length > 0) {
                    // Берем ПОСЛЕДНЮЮ точку пути
                    const lastPoint = points[points.length - 1];
                    
                    // Начинаем с этой точки
                    this.state.currentElement = lastPath;
                    this.state.startPoint = {x: lastPoint.x, y: lastPoint.y};
                    this.state.penPoints = [{x: lastPoint.x, y: lastPoint.y}];
                    return;
                }
            }
        }
    }
    
    // Если ничего не нашли - начинаем новый путь
    this.state.startPoint = {x: coords.x, y: coords.y};
    this.startPen(coords.x, coords.y);
    return;
}
    // НАЧИНАЕМ НОВЫЙ ПУТЬ (если не продолжили существующий)
    this.state.startPoint = {x: coords.x, y: coords.y};
    
    switch(this.state.currentTool) {
        case 'pen':
            this.startPen(coords.x, coords.y);
            break;
        case 'line':
            this.startLine(coords.x, coords.y);
            break;
        case 'rect':
            this.startRect(coords.x, coords.y);
            break;
        case 'circle':
            this.startCircle(coords.x, coords.y);
            break;
    }
}

onMouseMove(e) {
    this.updateCoordinates(e);
    const coords = this.getSVGCoordinates(e);
    this.state.lastMouseX = coords.x;
    this.state.lastMouseY = coords.y;
    if (this.state.isDraggingPhoto && this.state.draggingPhotoElement) {
        e.preventDefault();
        
        const dx = coords.x - this.state.photoDragStartX;
        const dy = coords.y - this.state.photoDragStartY;
        
        const newX = this.state.photoStartX + dx;
        const newY = this.state.photoStartY + dy;
        
        this.state.draggingPhotoElement.setAttribute('x', newX);
        this.state.draggingPhotoElement.setAttribute('y', newY);
        return;
    }
	
    if (this.state.isDraggingElement) {
        e.preventDefault();
        this.doElementDrag(e);
        return;
    }
    if (this.state.isMoving) {
        e.preventDefault();
        this.doPanning(e);
        return;
    }

if (this.isResizing) {
    e.preventDefault();
    this.doResize(e);
    return;
}

if (this.isRotating) {
    e.preventDefault();
    this.doRotate(e);
    return;
}

if (this.isDraggingPivot) {
    e.preventDefault();
    this.doPivotDrag(e);
    return;
}
    if (this.state.currentTool === 'bezier-points') {
        if (this.state.isDraggingPoint) {
            this.updatePointDrag(coords.x, coords.y);
            return;
        }
        
        if (this.state.isDraggingBezierControl) {
            this.updateBezierControlDrag(coords.x, coords.y);
            return;
        }
    }
    // Для инструмента пуш: обновляем индикатор при наведении
	if (this.state.currentTool === 'push') {
		const radius = this.state.pushRadius / this.state.zoom;
		
		if (!this.state.isDrawing) {
			this.showPushIndicator(coords.x, coords.y, radius);
		} else if (this.state.isDrawing && this.pushData) {
			const dx = coords.x - this.pushData.mouseStartX;
			const dy = coords.y - this.pushData.mouseStartY;
			
			// Двигаем ВСЕ точки, которые были внутри круга при нажатии
			this.pushData.points.forEach(pointData => {
				const force = Math.max(0, 1 - (pointData.distance / this.pushData.radius));
				
				if (force > 0.05) {
					const newX = pointData.originalX + dx * force * this.state.pushStrength;
					const newY = pointData.originalY + dy * force * this.state.pushStrength;
					
					this.updatePathPointFast(pointData.path, pointData.pointIndex, newX, newY);
					
					pointData.x = newX;
					pointData.y = newY;
				}
			});
			
			this.showPushIndicator(coords.x, coords.y, this.pushData.radius);
		}
	}

	
    //Для инструмента ластик onMouseMove
if (this.state.currentTool === 'eraser') {
    const radius = this.state.eraserSize / this.state.zoom;
    
    if (e.ctrlKey || e.metaKey) {
        this.hideEraserIndicator();
        this.svg.style.cursor = 'pointer';
        if (this.state.isDrawing) {
            this.state.isDrawing = false;
            this.state.lastErasePoint = null;
        }
        return;
    }
    
    this.svg.style.cursor = 'none';
    this.showEraserIndicator(coords.x, coords.y, radius);
    
    if (this.state.isDrawing) {

        if (this.state.lastErasePoint) {
            const distance = Math.sqrt(
                Math.pow(coords.x - this.state.lastErasePoint.x, 2) + 
                Math.pow(coords.y - this.state.lastErasePoint.y, 2)
            );
            
            if (distance > radius / 2) {
                this.eraseVectorsAt(coords.x, coords.y);
                this.state.lastErasePoint = {x: coords.x, y: coords.y};
            }
        } else {
            this.eraseVectorsAt(coords.x, coords.y);
            this.state.lastErasePoint = {x: coords.x, y: coords.y};
        }
    }
}

    // Обновляем рисование (если рисуем)
    if (this.state.isDrawing) {
        switch(this.state.currentTool) {
        case 'pen':
            this.drawPen(coords.x, coords.y);
            break;
        case 'line':
            this.updateLine(coords.x, coords.y);
            break;
        case 'rect':
            this.updateRect(coords.x, coords.y);
            break;
        case 'circle':
            this.updateCircle(coords.x, coords.y);
            break;
        }
    }
}

onMouseUp() {
    
    if (this.isResizing || this.isRotating) {
		if (this.isResizing) {
			this.isResizing = false;
			this.resizeStart = null;
			this.updateSelectionHandles();
			this.saveSnapshot();
			return;
		}

		if (this.isRotating) {
			this.isRotating = false;
			this.rotateStart = null;
			this.updateSelectionHandles();
			this.saveSnapshot();
			return;
		}
    }
	
	if (this.isDraggingPivot) {
		this.stopPivotDrag();
	}
    // Завершаем перетаскивание фото
    if (this.state.isDraggingPhoto) {
        this.stopPhotoDrag();
    }
    
    // Завершаем перетаскивание вектора
    if (this.state.isDraggingElement) {
        this.stopElementDrag();
    }
    
    // Завершаем панорамирование
    if (this.state.isMoving) {
        this.stopPanning();
    }

    // Завершаем рисование ластиком
    if (this.state.isDrawing && this.state.currentTool === 'eraser') {
        this.state.isDrawing = false;
        this.state.lastErasePoint = null;
        this.lastEraseTime = null;
        this.hideEraserIndicator();
    } 
    
    // Завершаем рисование других инструментов
    if (this.state.isDrawing) {
        // Если рисуем карандашом
        if (this.state.currentTool === 'pen') {
            // Применяем привязку к НЕ-белым линиям
            if (this.state.image && this.snapSettings.enabled) {
                this.snapPathToNonWhiteLine(this.state.currentElement);
            }
            
            // Если ВЫКЛЮЧЕНО продолжение вектора - сбрасываем currentElement
            if (!this.snapSettings.continueVector) {
                this.state.currentElement = null;
            }
            
            // Сбрасываем флаги рисования
            this.state.isDrawing = false;
            this.state.penPoints = [];
            
        } else {
            // Для других инструментов - сбрасываем как обычно
            this.state.currentElement = null;
            this.state.isDrawing = false;
        }
        
        this.hidePushIndicator();
    }
    
    // Завершаем push
    if (this.state.currentTool === 'push') {
        this.state.isDrawing = false;
        this.pushData = null;
        this.hidePushIndicator();
    }
    
    // Скрываем индикатор ластика
    this.hideEraserIndicator();
    
    // Сохраняем состояние
    this.saveSnapshot();
}

onMouseLeave() {
	if (this.state.isDraggingElement) {
        this.stopElementDrag();
    }
	
    if (this.state.isMoving) {
        this.stopPanning();
    }
    
    if (this.state.isDrawing) {
        this.state.isDrawing = false;
        this.state.pushData = null;
        this.hidePushIndicator();
        this.hideEraserIndicator();
    }
    document.body.style.cursor = 'default';
}

startPhotoDrag(e, photoElement) {
    const coords = this.getSVGCoordinates(e);
    
    let currentX = parseFloat(photoElement.getAttribute('x'));
    let currentY = parseFloat(photoElement.getAttribute('y'));
    
    if (isNaN(currentX)) currentX = 0;
    if (isNaN(currentY)) currentY = 0;
    this.state.isDraggingPhoto = true;
    this.state.draggingPhotoElement = photoElement;
    this.state.photoDragStartX = coords.x;
    this.state.photoDragStartY = coords.y;
    this.state.photoStartX = currentX;
    this.state.photoStartY = currentY;
    
    this.svg.style.cursor = 'grabbing';
    
    photoElement.style.outline = '2px solid #ff6b6b';
    photoElement.style.outlineOffset = '2px';
    
    e.preventDefault();
    e.stopPropagation();
}

updatePathPointFast(path, pointIndex, newX, newY) {
    // Если это виртуальная точка (дробный индекс) - НЕ обновляем путь
    // Виртуальные точки существуют только для движения, но не сохраняются
    if (pointIndex % 1 !== 0) {
        return; // Виртуальная точка - не обновляем путь
    }
    
    const d = path.getAttribute('d');
    if (!d) return;
    
    const parts = d.split(/(?=[ML])/);
    let currentIdx = 0;
    
    for (let i = 0; i < parts.length; i++) {
        const part = parts[i];
        const coords = part.substring(1).trim().split(/\s+/);
        
        for (let j = 0; j < coords.length; j += 2) {
            if (currentIdx === Math.floor(pointIndex)) {
                coords[j] = newX;
                coords[j + 1] = newY;
                parts[i] = part.charAt(0) + ' ' + coords.join(' ');
                path.setAttribute('d', parts.join(''));
                return;
            }
            currentIdx++;
        }
    }
}

// Функция разрезания пути в местах пересечения с кругом ластика
cutPathAtIntersections(path, x, y, radius) {
    const d = path.getAttribute('d');
    if (!d) return null;
    
    const { points, isClosed } = this.parsePathToPoints(d);
    if (points.length < 2) return null;
    
    const intersections = [];
    
    // Находим все пересечения отрезков пути с кругом ластика
    for (let i = 0; i < points.length; i++) {
        const p1 = points[i];
        const p2 = points[(i + 1) % points.length];
        
        // Пропускаем если это последний отрезок в незамкнутом пути
        if (!isClosed && i === points.length - 1) break;
        
        const intersection = this.lineCircleIntersection(p1, p2, {x, y}, radius);
        if (intersection.length > 0) {
            // Добавляем информацию о том, с какой стороны отрезка находится круг
            intersection.forEach(inter => {
                // Проверяем, находится ли какая-то из концевых точек внутри радиуса
                const p1InRadius = this.pointDistance(p1, {x, y}) <= radius;
                const p2InRadius = this.pointDistance(p2, {x, y}) <= radius;
                
                intersections.push({
                    point: inter,
                    segmentIndex: i,
                    p1: p1,
                    p2: p2,
                    p1InRadius: p1InRadius,
                    p2InRadius: p2InRadius
                });
            });
        } else {
            // Проверяем, находятся ли концевые точки внутри радиуса
            const p1InRadius = this.pointDistance(p1, {x, y}) <= radius;
            const p2InRadius = this.pointDistance(p2, {x, y}) <= radius;
            
            if (p1InRadius || p2InRadius) {
                intersections.push({
                    point: p1InRadius ? p1 : p2,
                    segmentIndex: i,
                    p1: p1,
                    p2: p2,
                    p1InRadius: p1InRadius,
                    p2InRadius: p2InRadius,
                    isEndpoint: true
                });
            }
        }
    }
    
    // Если нет пересечений - проверяем, полностью ли путь внутри радиуса
    if (intersections.length === 0) {
        const allPointsInRadius = points.every(point => 
            this.pointDistance(point, {x, y}) <= radius
        );
        
        if (allPointsInRadius) {
            return 'delete';
        }
        return null;
    }
    
    // Сортируем точки пересечения вдоль пути
    const allIntersectionPoints = [];
    intersections.forEach(item => {
        // Рассчитываем позицию на отрезке (0-1)
        let t = 0;
        if (!item.isEndpoint) {
            t = this.pointOnSegmentParameter(item.p1, item.p2, item.point);
        } else {
            t = item.p1InRadius ? 0 : 1;
        }
        
        allIntersectionPoints.push({
            point: item.point,
            segmentIndex: item.segmentIndex,
            t: t,
            isEndpoint: item.isEndpoint || false,
            p1InRadius: item.p1InRadius,
            p2InRadius: item.p2InRadius
        });
    });
    
    // Сортируем по индексу сегмента и позиции на нем
    allIntersectionPoints.sort((a, b) => {
        if (a.segmentIndex !== b.segmentIndex) {
            return a.segmentIndex - b.segmentIndex;
        }
        return a.t - b.t;
    });
    
    // Разрезаем путь на части
    const pathParts = this.splitPathAtIntersections(points, allIntersectionPoints, isClosed);
    
    // Фильтруем части: удаляем те, что полностью внутри радиуса, оставляем остальные
    const filteredParts = pathParts.filter(part => {
        if (part.points.length === 0) return false;
        
        // Проверяем несколько точек вдоль части пути
        const checkPoints = [
            part.points[0],
            part.points[Math.floor(part.points.length / 2)],
            part.points[part.points.length - 1]
        ];
        
        // Если все проверяемые точки внутри радиуса - удаляем часть
        const allInside = checkPoints.every(point => 
            this.pointDistance(point, {x, y}) <= radius
        );
        
        return !allInside;
    });
    
    // Если все части удалены - удаляем весь путь
    if (filteredParts.length === 0) {
        return 'delete';
    }
    
    // Создаем новые пути из оставшихся частей
    const newPaths = [];
    filteredParts.forEach(part => {
        if (part.points.length >= 2) {
            newPaths.push(this.pointsToPath(part.points, false));
        }
    });
    
    return newPaths;
}

// Поиск пересечения линии с кругом
lineCircleIntersection(p1, p2, center, radius) {
    const intersections = [];
    
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const A = dx * dx + dy * dy;
    const B = 2 * (dx * (p1.x - center.x) + dy * (p1.y - center.y));
    const C = (p1.x - center.x) * (p1.x - center.x) + 
              (p1.y - center.y) * (p1.y - center.y) - 
              radius * radius;
    
    const discriminant = B * B - 4 * A * C;
    
    if (discriminant < 0) {
        return intersections;
    }
    
    const t1 = (-B - Math.sqrt(discriminant)) / (2 * A);
    const t2 = (-B + Math.sqrt(discriminant)) / (2 * A);
    
    if (t1 >= 0 && t1 <= 1) {
        intersections.push({
            x: p1.x + t1 * dx,
            y: p1.y + t1 * dy
        });
    }
    
    if (t2 >= 0 && t2 <= 1 && Math.abs(t1 - t2) > 0.001) {
        intersections.push({
            x: p1.x + t2 * dx,
            y: p1.y + t2 * dy
        });
    }
    
    return intersections;
}

// Параметр точки на отрезке (0-1)
pointOnSegmentParameter(p1, p2, point) {
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    
    if (Math.abs(dx) > Math.abs(dy)) {
        return (point.x - p1.x) / dx;
    } else {
        return (point.y - p1.y) / dy;
    }
}

// Разделение пути на части по точкам пересечения
splitPathAtIntersections(originalPoints, intersections, isClosed) {
    const parts = [];
    let currentPart = { points: [] };
    
    for (let i = 0; i < originalPoints.length; i++) {
        currentPart.points.push(originalPoints[i]);
        
        const nextPointIndex = (i + 1) % originalPoints.length;
        const segmentIntersections = intersections.filter(
            inter => inter.segmentIndex === i
        ).sort((a, b) => a.t - b.t);
        
        if (segmentIntersections.length > 0) {
            segmentIntersections.forEach(inter => {
                currentPart.points.push(inter.point);
                if (currentPart.points.length >= 2) {
                    parts.push({...currentPart});
                }
                currentPart = { points: [inter.point] };
            });
        }
        
        if (!isClosed && i === originalPoints.length - 1) {
            if (currentPart.points.length >= 2) {
                parts.push({...currentPart});
            }
        }
    }
    
    if (isClosed && parts.length > 0 && currentPart.points.length > 0) {
        parts[0].points = [...currentPart.points, ...parts[0].points.slice(1)];
    } else if (currentPart.points.length >= 2) {
        parts.push({...currentPart});
    }
    
    return parts;
}

// Вычисление точки на кубической Безье
evaluateCubicBezier(x0, y0, x1, y1, x2, y2, x3, y3, t) {
    const mt = 1 - t;
    const mt2 = mt * mt;
    const mt3 = mt2 * mt;
    const t2 = t * t;
    const t3 = t2 * t;
    
    return {
        x: mt3 * x0 + 3 * mt2 * t * x1 + 3 * mt * t2 * x2 + t3 * x3,
        y: mt3 * y0 + 3 * mt2 * t * y1 + 3 * mt * t2 * y2 + t3 * y3
    };
}


// fin ЛАСТИК ДЛЯ КРИВЫХ БЕЗЬЕ

pointToRectDistance(px, py, rect) {
    // Находим ближайшую точку прямоугольника к заданной точке
    const closestX = Math.max(rect.x, Math.min(px, rect.x + rect.width));
    const closestY = Math.max(rect.y, Math.min(py, rect.y + rect.height));
    
    // Расстояние до ближайшей точки
    const dx = px - closestX;
    const dy = py - closestY;
    
    return Math.sqrt(dx * dx + dy * dy);
}

// Расстояние между двумя точками
pointDistance(p1, p2) {
    return Math.sqrt((p2.x - p1.x)**2 + (p2.y - p1.y)**2);
}

// Новая функция: пересечение круга с отрезком
circleSegmentIntersections(cx, cy, radius, x1, y1, x2, y2) {
    const intersections = [];
    
    const dx = x2 - x1;
    const dy = y2 - y1;
    
    const A = dx * dx + dy * dy;
    const B = 2 * (dx * (x1 - cx) + dy * (y1 - cy));
    const C = (x1 - cx) * (x1 - cx) + (y1 - cy) * (y1 - cy) - radius * radius;
    
    const discriminant = B * B - 4 * A * C;
    
    if (discriminant < 0) {
        return intersections;
    }
    
    const sqrtDiscriminant = Math.sqrt(discriminant);
    const t1 = (-B - sqrtDiscriminant) / (2 * A);
    const t2 = (-B + sqrtDiscriminant) / (2 * A);
    
    // Проверяем что точка на отрезке (0 <= t <= 1)
    if (t1 >= 0 && t1 <= 1) {
        intersections.push({
            x: x1 + t1 * dx,
            y: y1 + t1 * dy,
            t: t1
        });
    }
    
    if (t2 >= 0 && t2 <= 1 && Math.abs(t1 - t2) > 0.001) {
        intersections.push({
            x: x1 + t2 * dx,
            y: y1 + t2 * dy,
            t: t2
        });
    }
    
    // Если отрезок полностью внутри круга - добавляем начало и конец
    if (intersections.length === 0) {
        const d1 = Math.sqrt(Math.pow(x1 - cx, 2) + Math.pow(y1 - cy, 2));
        const d2 = Math.sqrt(Math.pow(x2 - cx, 2) + Math.pow(y2 - cy, 2));
        
        if (d1 <= radius && d2 <= radius) {
            intersections.push({x: x1, y: y1, t: 0});
            intersections.push({x: x2, y: y2, t: 1});
        }
    }
    
    return intersections;
}

drawPen(x, y) {

        snappedPoint = snapVectorResult.point;

    // Добавляем точку
    this.state.penPoints.push(finalPoint);
    
    // Сглаживание
    const smoothing = Math.min(this.state.smoothing, this.state.penPoints.length);
    const startIdx = this.state.penPoints.length - smoothing;
    
    let avgX = 0, avgY = 0;
    for (let i = startIdx; i < this.state.penPoints.length; i++) {
        avgX += this.state.penPoints[i].x;
        avgY += this.state.penPoints[i].y;
    }
    avgX /= smoothing;
    avgY /= smoothing;
    
    // Обновляем путь
    const currentPath = this.state.currentElement.getAttribute('d');
    this.state.currentElement.setAttribute('d', currentPath + ` L ${avgX} ${avgY}`);

        allVectors.forEach(vector => {
            let endpoints = [];
            
            if (vector.tagName === 'LINE') {
                // Для линии: начало и конец
                endpoints = [
                    {x: parseFloat(vector.getAttribute('x1')), 
                     y: parseFloat(vector.getAttribute('y1'))},
                    {x: parseFloat(vector.getAttribute('x2')), 
                     y: parseFloat(vector.getAttribute('y2'))}

            else if (vector.tagName === 'PATH') {

                const commands = d.split(/(?=[ML])/); // Разделяем по командам

                    // Первая точка
                    const firstCmd = commands[0];
                    const firstMatch = firstCmd.match(/[\d.-]+/g);
                    if (firstMatch && firstMatch.length >= 2) {
                        endpoints.push({
                            x: parseFloat(firstMatch[0]),
                            y: parseFloat(firstMatch[1])
                        });
                    }
                    
                    // Последняя точка
                    const lastCmd = commands[commands.length - 1];
                    const lastMatch = lastCmd.match(/[\d.-]+/g);
                    if (lastMatch && lastMatch.length >= 2) {
                        endpoints.push({
                            x: parseFloat(lastMatch[lastMatch.length - 2]),
                            y: parseFloat(lastMatch[lastMatch.length - 1])
                        });
                    }
                }
            }
            
            // Проверяем все концевые точки
            endpoints.forEach(point => {
                if (point.x === undefined || point.y === undefined) return;
                
                const dist = Math.sqrt(Math.pow(x - point.x, 2) + Math.pow(y - point.y, 2));
                if (dist < minDistance) {
                    minDistance = dist;
                    nearestPoint = point;
                    nearestElement = vector;
                }
            });
        });
        
        return {point: nearestPoint, element: nearestElement, distance: minDistance};
    }
   
snapPathToNonWhiteLine(pathElement) {
    if (!pathElement || !this.state.image || !this.snapSettings.enabled) return;
    
    const d = pathElement.getAttribute('d');
    if (!d) return;
    
    const { points } = this.parsePathToPoints(d);
    
    // Привязываем только каждую 3-ю точку для скорости
    for (let i = 0; i < points.length; i += 3) {
        const point = points[i];
        const snapped = this.snapToNonWhiteLine(point.x, point.y);
        
        if (snapped) {
            // Немного сдвигаем точку к привязанной позиции
            points[i].x = point.x * 0.7 + snapped.x * 0.3;
            points[i].y = point.y * 0.7 + snapped.y * 0.3;
        }
    }
    
    // Перестраиваем путь
    let newPath = `M ${points[0].x} ${points[0].y}`;
    for (let i = 1; i < points.length; i++) {
        newPath += ` L ${points[i].x} ${points[i].y}`;
    }
    
    pathElement.setAttribute('d', newPath);
}

// безье
    createSingleBezierPoint(x, y) {
        const point = {
            x: x,
            y: y,
            element: null,
            index: this.state.bezierPoints.length
        };
        
        // Создаем элемент точки
        point.element = this.createBezierPointElement(point);
        this.svg.appendChild(point.element);
        
        // Добавляем в массив
        this.state.bezierPoints.push(point);
        
        // Выделяем эту точку
        this.selectBezierPoint(point.index);
    }
  
createNewBezierVector(x, y) {
    const fromPoint = this.state.bezierPoints[this.state.bezierSelectedPoint];
    if (!fromPoint) return;
    
    // Проверяем настройку гладкости
    const createSmooth = document.getElementById('bezierSmoothToggle')?.checked ?? true;
    
    // Проверяем, является ли точка крайней
    const incomingCount = this.state.bezierVectors.filter(v => v.to === fromPoint.index).length;
    const outgoingCount = this.state.bezierVectors.filter(v => v.from === fromPoint.index).length;
    const isEndpoint = (incomingCount + outgoingCount) <= 1;
    
    let actualFromPoint;
    let previousVector = null;
    
    if (isEndpoint) {
        // Крайняя точка — используем её напрямую
        actualFromPoint = fromPoint;
        
        // Ищем предыдущий вектор (для гладкого соединения)
        if (incomingCount === 1) {
            previousVector = this.state.bezierVectors.find(v => v.to === fromPoint.index);
        } else if (outgoingCount === 1) {
            previousVector = this.state.bezierVectors.find(v => v.from === fromPoint.index);
        }
    } else {
        // Средняя точка — создаём новую точку в том же месте
        actualFromPoint = {
            x: fromPoint.x,
            y: fromPoint.y,
            element: null,
            index: this.state.bezierPoints.length
        };
        
        actualFromPoint.element = this.createBezierPointElement(actualFromPoint);
        this.svg.appendChild(actualFromPoint.element);
        this.state.bezierPoints.push(actualFromPoint);
        
        // Для новой точки нет предыдущего вектора
        previousVector = null;
    }
    
    // Создаем новую точку (там где кликнули)
    const toPoint = {
        x: x,
        y: y,
        element: null,
        index: this.state.bezierPoints.length
    };
    
    // Создаем элемент точки
    toPoint.element = this.createBezierPointElement(toPoint);
    this.svg.appendChild(toPoint.element);
    
    // Добавляем в массив
    this.state.bezierPoints.push(toPoint);
    
    // Создаем вектор Безье
    const newVector = this.createBezierVector(actualFromPoint, toPoint, previousVector);
    
    if (createSmooth) {
        // Гладкий режим: выравниваем касательные
        if (previousVector) {
            this.alignTangentsForSmoothConnection(newVector, previousVector);
        }
    } else {
        // Угловой режим: прячем контрольные точки
        newVector.control1.x = actualFromPoint.x;
        newVector.control1.y = actualFromPoint.y;
        newVector.control2.x = toPoint.x;
        newVector.control2.y = toPoint.y;
        
        if (newVector.guideElements.control1) {
            newVector.guideElements.control1.setAttribute('cx', actualFromPoint.x);
            newVector.guideElements.control1.setAttribute('cy', actualFromPoint.y);
            newVector.guideElements.control1.style.display = 'none';
        }
        if (newVector.guideElements.line1) {
            newVector.guideElements.line1.style.display = 'none';
        }
        if (newVector.guideElements.control2) {
            newVector.guideElements.control2.setAttribute('cx', toPoint.x);
            newVector.guideElements.control2.setAttribute('cy', toPoint.y);
            newVector.guideElements.control2.style.display = 'none';
        }
        if (newVector.guideElements.line2) {
            newVector.guideElements.line2.style.display = 'none';
        }
        
        this.updateBezierVectorPath(newVector);
    }
    
    // Снимаем выделение со старой точки (fromPoint)
    if (fromPoint.element) {
        fromPoint.element.classList.remove('selected');
    }
    
    // Выделяем новую точку
    this.selectBezierPoint(toPoint.index);
    
    setTimeout(() => this.saveSnapshot(), 100);
    return newVector;
}

addPointToBezierPath(pathElement, x, y) {
    const vector = this.state.bezierVectors.find(v => v.path === pathElement);
    if (!vector) return;
    
    const fromPoint = this.state.bezierPoints[vector.from];
    const toPoint = this.state.bezierPoints[vector.to];
    if (!fromPoint || !toPoint) return;
    
    const newPoint = {
        x: x,
        y: y,
        element: null,
        index: this.state.bezierPoints.length
    };
    
    newPoint.element = this.createBezierPointElement(newPoint);
    this.svg.appendChild(newPoint.element);
    this.state.bezierPoints.push(newPoint);
    
    // Создаём с направляющими (обычное редактирование)
    const vector1 = this.createBezierVector(fromPoint, newPoint, null, true);
    const vector2 = this.createBezierVector(newPoint, toPoint, null, true);
    
    this.deleteBezierVector(vector);
    this.selectBezierPoint(newPoint.index);
    
    setTimeout(() => this.saveSnapshot(), 100);
}

// Вспомогательный метод для удаления одного вектора
deleteBezierVector(vector) {
    const index = this.state.bezierVectors.indexOf(vector);
    if (index === -1) return;
    
    // Удаляем визуальные элементы
    if (vector.path && vector.path.parentNode) {
        vector.path.parentNode.removeChild(vector.path);
    }
    if (vector.guideElements.line1) vector.guideElements.line1.remove();
    if (vector.guideElements.control1) vector.guideElements.control1.remove();
    if (vector.guideElements.line2) vector.guideElements.line2.remove();
    if (vector.guideElements.control2) vector.guideElements.control2.remove();
    
    // Удаляем из массива
    this.state.bezierVectors.splice(index, 1);
}

    // СОЗДАНИЕ ВЕКТОРА БЕЗЬЕ МЕЖДУ ДВУМЯ ТОЧКАМИ
createBezierVector(fromPoint, toPoint, previousVector = null, createGuides = true) {
    // Рассчитываем контрольные точки
    const controlPoints = this.calculateBezierControlPoints(fromPoint, toPoint, previousVector);
    
    // Создаем объект вектора
    const vector = {
        from: fromPoint.index,
        to: toPoint.index,
        control1: {
            x: controlPoints.cp1.x,
            y: controlPoints.cp1.y,
            belongsTo: fromPoint.index
        },
        control2: {
            x: controlPoints.cp2.x,
            y: controlPoints.cp2.y,
            belongsTo: toPoint.index
        },
        path: null,
        guideElements: {}
    };
    
    // Создаем SVG путь
    vector.path = this.createBezierPath(
        fromPoint.x, fromPoint.y,
        vector.control1.x, vector.control1.y,
        vector.control2.x, vector.control2.y,
        toPoint.x, toPoint.y
    );
    
    this.svg.appendChild(vector.path);
    
    // Создаем направляющие элементы ТОЛЬКО если нужно
    if (createGuides) {
        this.createVectorGuides(vector, fromPoint, toPoint);
    }
    
    // Сохраняем вектор
    this.state.bezierVectors.push(vector);
    
    return vector;
}

createBezierPath(x1, y1, cx1, cy1, cx2, cy2, x2, y2) {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const d = `M ${x1} ${y1} C ${cx1} ${cy1} ${cx2} ${cy2} ${x2} ${y2}`;
    
    path.setAttribute('d', d);
    path.setAttribute('stroke', this.state.strokeColor);
    path.setAttribute('stroke-width', this.state.strokeWidth);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-linecap', 'round');
    path.classList.add('bezier-vector');
    
    return path;
}
    
createVectorGuides(vector, fromPoint, toPoint) {
    const vectorIndex = this.state.bezierVectors.length - 1;
    vector.path.setAttribute('data-vector-id', `${vector.from}-${vector.to}`);
    // ЛИНИЯ 1: от точки "from" к ЕЁ контрольной точке (control1)
    vector.guideElements.line1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    vector.guideElements.line1.setAttribute('class', 'bezier-guide-line');
    vector.guideElements.line1.setAttribute('x1', fromPoint.x);
    vector.guideElements.line1.setAttribute('y1', fromPoint.y);
    vector.guideElements.line1.setAttribute('x2', vector.control1.x);
    vector.guideElements.line1.setAttribute('y2', vector.control1.y);
    vector.guideElements.line1.setAttribute('data-vector-index', vectorIndex);
    vector.guideElements.line1.setAttribute('data-belongs-to', fromPoint.index);
    vector.guideElements.line1.setAttribute('data-control-type', 'control1');
    
    // КОНТРОЛЬНАЯ ТОЧКА 1: принадлежит точке "from"
    vector.guideElements.control1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    vector.guideElements.control1.setAttribute('class', 'bezier-control-point');
    vector.guideElements.control1.setAttribute('cx', vector.control1.x);
    vector.guideElements.control1.setAttribute('cy', vector.control1.y);
    vector.guideElements.control1.setAttribute('r', '4');
    vector.guideElements.control1.setAttribute('data-vector-index', vectorIndex);
    vector.guideElements.control1.setAttribute('data-control-type', 'control1');
    vector.guideElements.control1.setAttribute('data-belongs-to', fromPoint.index);
    
    // ЛИНИЯ 2: от точки "to" к ЕЁ контрольной точке (control2)
    vector.guideElements.line2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    vector.guideElements.line2.setAttribute('class', 'bezier-guide-line');
    vector.guideElements.line2.setAttribute('x1', toPoint.x);
    vector.guideElements.line2.setAttribute('y1', toPoint.y);
    vector.guideElements.line2.setAttribute('x2', vector.control2.x);
    vector.guideElements.line2.setAttribute('y2', vector.control2.y);
    vector.guideElements.line2.setAttribute('data-vector-index', vectorIndex);
    vector.guideElements.line2.setAttribute('data-belongs-to', toPoint.index);
    vector.guideElements.line2.setAttribute('data-control-type', 'control2');
    
    // КОНТРОЛЬНАЯ ТОЧКА 2: принадлежит точке "to"
    vector.guideElements.control2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    vector.guideElements.control2.setAttribute('class', 'bezier-control-point');
    vector.guideElements.control2.setAttribute('cx', vector.control2.x);
    vector.guideElements.control2.setAttribute('cy', vector.control2.y);
    vector.guideElements.control2.setAttribute('r', '4');
    vector.guideElements.control2.setAttribute('data-vector-index', vectorIndex);
    vector.guideElements.control2.setAttribute('data-control-type', 'control2');
    vector.guideElements.control2.setAttribute('data-belongs-to', toPoint.index);
    
    // НОВЫЕ ОБРАБОТЧИКИ - используем единую функцию startBezierControlDrag
    vector.guideElements.control1.addEventListener('mousedown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        this.startBezierControlDrag(e);
    });
    
    vector.guideElements.control2.addEventListener('mousedown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        this.startBezierControlDrag(e);
    });
    
    // Добавляем в SVG
    this.svg.appendChild(vector.guideElements.line1);
    this.svg.appendChild(vector.guideElements.control1);
    this.svg.appendChild(vector.guideElements.line2);
