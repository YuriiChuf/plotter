
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простой векторный редактор</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #2d2d2d;
            color: white;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 250px;
            background: #1a1a1a;
            padding: 20px;
            border-right: 1px solid #444;
			overflow-y: auto;
        }
        
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #1a1a1a;
        }
        
        #svg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        
        .panel {
            background: #333;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }
		.panel label {
			font-size: 10px;
		}
        
        h3 {
            margin-bottom: 15px;
            color: #4dabf7;
        }
        
        button {
            background: #4dabf7;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        
        button:hover {
            background: #339af0;
        }
        
        .tool-btn {
            background: #444;
            margin: 5px;
            width: 40px;
            height: 40px;
			padding: 6px;
        }
        
        .tool-btn.active {
            background: #4dabf7;
        }
		.tool-btn:hover::after {
    content: attr(hotkey);
}
        
        .tools {
            display: flex;
            flex-wrap: wrap;
            gap: 0px;
            margin-bottom: 0px;
        }
        
        input[type="range"] {
            width: 100%;
            margin: 0;
        }
        
        input[type="color"] {
			width: 35px;
			height: 6px;
			margin: 7px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            display: flex;
            gap: 10px;
        }
        
        .zoom-btn {
            width: 40px;
            height: 40px;
            background: #444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 20px;
        }
        
        .zoom-level {
            color: white;
            line-height: 40px;
            padding: 0 10px;
        }
        
        .coordinates {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
#eraser-indicator {
    pointer-events: none;
    stroke: #ff6b6b;
    stroke-width: 2;
    fill: rgba(255, 107, 107, 0.2);
    stroke-dasharray: 5,5;
}
#push-indicator {
    pointer-events: none;
    stroke: #ff6b6b;
    stroke-width: 1;
    fill: rgba(255, 107, 107, 0.1);
    stroke-dasharray: 3,3;
}
.push-mode {
    cursor: none !important;
}
@keyframes pulse-ring {
	0% { stroke-opacity: 0.7; }
	50% { stroke-opacity: 1; }
	100% { stroke-opacity: 0.7; }
}
/* Точка НЕ выделена */
.bezier-point {
    fill: #4dabf7;
    stroke: #1971c2;
    stroke-width: 2;
    r: 1%;
	opacity: 0.5;
    cursor: move;
}

.bezier-point.selected {
    fill: #ff6b6b;
    stroke: #e03131;
    stroke-width: 3;
	opacity: 0.5;
}

/* Векторы Безье */
.bezier-vector {
    fill: none;
    stroke-linecap: round;
}

/* Направляющие Безье */
.bezier-guide-line {
    stroke: #868e96;
    stroke-width: 1;
    stroke-dasharray: 3,3;
    opacity: 0.5;
}

.bezier-control-point {
    fill: #ffd43b;
    stroke: #f08c00;
    stroke-width: 1;
    r: 0.7%;
    cursor: pointer;
	opacity: 0.5;
	
}

.undo-controls {
    position: absolute;
    bottom: 90px; /* Располагаем выше зума */
    right: 20px;
    background: rgba(0,0,0,0.7);
    padding: 10px;
    border-radius: 5px;
    display: flex;
    gap: 10px;
    z-index: 1000;
}

.undo-btn, .redo-btn {
    width: 40px;
    height: 40px;
    background: #444;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.undo-btn:hover {
    background: #4dabf7;
}

.redo-btn:hover {
    background: #ff6b6b;
}

.undo-btn:disabled, .redo-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
}

    </style>
</head>

        class VectorEditor {

		// ВИЗУАЛЬНЫЙ ИНДИКАТОР ЛАСТИКА
		showEraserIndicator(x, y, radius) {
			let indicator = document.getElementById('eraser-indicator');
			
			if (!indicator) {
				indicator = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
				indicator.id = 'eraser-indicator';
				indicator.setAttribute('stroke', '#ff6b6b');
				indicator.setAttribute('stroke-width', '2');
				indicator.setAttribute('fill', 'rgba(255, 107, 107, 0.2)');
				indicator.setAttribute('stroke-dasharray', '5,5');
				indicator.style.pointerEvents = 'none';

				const pushIndicator = document.getElementById('push-indicator');
				if (pushIndicator) {
					this.svg.insertBefore(indicator, pushIndicator.nextSibling);
				} else {
					this.svg.appendChild(indicator);
				}
			}
			
			indicator.setAttribute('cx', x);
			indicator.setAttribute('cy', y);
			indicator.setAttribute('r', radius);
			indicator.style.display = 'block';
			indicator.style.animation = 'none';
			indicator.style.zIndex = '9999';
		}

		// СКРЫВАЕМ ИНДИКАТОР ЛАСТИКА
		hideEraserIndicator() {
			const indicator = document.getElementById('eraser-indicator');
			if (indicator) {
				indicator.style.display = 'none';
				indicator.setAttribute('cx', '-100');
				indicator.setAttribute('cy', '-100');
			}
		}
				 
		init() {
    // Инициализация SVG
    this.svg = document.getElementById('svg-canvas');
    this.svg.setAttribute('width', '100%');
    this.svg.setAttribute('height', '100%');
    this.svg.setAttribute('viewBox', '0 0 1000 1000');
    this.svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

    // 1. Слой подложки (рабочий лист)
    this.worksheetLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    this.worksheetLayer.id = 'worksheet-layer';
    this.svg.appendChild(this.worksheetLayer);
    
    // 2. Слой фото
    this.photoLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    this.photoLayer.id = 'photo-layer';
    this.photoLayer.style.pointerEvents = 'visible'; // ВАЖНО: слой реагирует на события
    this.svg.appendChild(this.photoLayer);
    
    // 3. Слой векторов (сюда будут добавляться все линии, пути и т.д.)
    this.vectorLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    this.vectorLayer.id = 'vector-layer';
    this.svg.appendChild(this.vectorLayer);
    
    // 4. Слой для вспомогательных элементов (точки Безье, направляющие)
    this.helperLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    this.helperLayer.id = 'helper-layer';
    this.svg.appendChild(this.helperLayer);
			document.getElementById('dpiInput').oninput = () => {
					this.updatePixelDisplay();
				if (this.state.image) {
					//this.updateLoadedImageSizeDisplay(this.state.image);
				}
			};
			document.getElementById('mmWidth').addEventListener('input', (e) => {
				this.updateSizeWithAspectRatio('width', e.target.value);
			});

			document.getElementById('mmHeight').addEventListener('input', (e) => {
				this.updateSizeWithAspectRatio('height', e.target.value);
			});
			document.getElementById('aspectRatioDisplay').addEventListener('click', (e) => {
				e.preventDefault();
				e.stopPropagation();
				const currentWidth = parseFloat(document.getElementById('mmWidth').value) || 210;
				const currentHeight = parseFloat(document.getElementById('mmHeight').value) || 297;
				this.updateAspectRatioDisplay(currentWidth, currentHeight);
				
			});
			document.getElementById('loadSvgBtn').onclick = () => {
				document.getElementById('svgInput').click();
			};

			document.getElementById('svgInput').onchange = (e) => {
				if (e.target.files[0]) this.loadSVG(e.target.files[0]);
			};
			this.setupEventListeners();
			this.updateAllSliderTexts();
			
			this.loadSettingsFromUI();
			this.setupGlobalDragHandlers();
			this.updateZoomDisplay();
				this.state.bezierControlGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
				this.state.bezierControlGroup.id = 'bezier-control-group';
				this.svg.appendChild(this.state.bezierControlGroup);
			this.createA4Background();

// 1. Метод сохранения снимка
saveSnapshot() {
    if (this.isSpiralActive) {
        return;
    }
    const now = Date.now();
    if (this.lastSave && (now - this.lastSave < 100)) {
        return;
    }
    
    try {
        const svgClone = this.svg.cloneNode(true);
        
        const tempIds = ['push-indicator', 'eraser-indicator'];
        tempIds.forEach(id => {
            const el = svgClone.querySelector(`#${id}`);
            if (el) el.remove();
        });
        
        const snapshot = svgClone.innerHTML;
        
        const lastSnapshot = this.history.snapshots[this.history.index];
        if (lastSnapshot === snapshot) {
            return;
        }
        
        this.history.snapshots = this.history.snapshots.slice(0, this.history.index + 1);

        this.history.snapshots.push(snapshot);
        this.history.index++;

        if (this.history.snapshots.length > this.history.max) {
            this.history.snapshots.shift();
            this.history.index--;
        }

        this.updateUndoRedoButtons();
        
        this.lastSave = now;
    } catch (error) {
        console.error('Ошибка при сохранении снимка:', error);
    }
}


// 2. Метод отмены
simpleUndo() {
    if (this.history.index > 0) {
        this.history.index--;
        this.restoreSnapshot();
    }
}

// 3. Метод возврата
simpleRedo() {
    if (this.history.index < this.history.snapshots.length - 1) {
        this.history.index++;
        this.restoreSnapshot();
    }
}

// 4. Восстановление снимка
restoreSnapshot() {
    const snapshot = this.history.snapshots[this.history.index];
    if (!snapshot) return;
    
    this.svg.innerHTML = snapshot;
    this.worksheetLayer = document.getElementById('worksheet-layer');
    this.photoLayer = document.getElementById('photo-layer');
    this.vectorLayer = document.getElementById('vector-layer');
    this.helperLayer = document.getElementById('helper-layer');
    if (!this.vectorLayer) {
        this.vectorLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        this.vectorLayer.id = 'vector-layer';
        this.svg.appendChild(this.vectorLayer);
    }
    
    this.updateUndoRedoButtons();
}

// 5. Обновление кнопок
updateUndoRedoButtons() {

    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    
    const canUndo = this.history.index > 0;
    const canRedo = this.history.index < this.history.snapshots.length - 1;
    
    undoBtn.disabled = !canUndo;
    redoBtn.disabled = !canRedo;

    undoBtn.style.opacity = canUndo ? '1' : '0.3';
    redoBtn.style.opacity = canRedo ? '1' : '0.3';

    undoBtn.title = canUndo ? 'Отменить (Ctrl+Z)' : 'Нечего отменять';
    redoBtn.title = canRedo ? 'Вернуть (Ctrl+Shift+Z)' : 'Нечего возвращать';
}

setupHotkeys() {
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        // Обработка Ctrl для ластика
        if (e.key === 'Control' || e.key === 'Meta') {
            if (this.state.currentTool === 'eraser') {
                this.hideEraserIndicator();
                this.svg.style.cursor = 'pointer';
            }
        }
		
        // Ctrl/Cmd + S - сохранить
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            this.saveSVG();
            return;
        }
        
        // Ctrl/Cmd + O - загрузить SVG
        if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
            e.preventDefault();
            document.getElementById('svgInput').click();
            return;
        }
        
        // Esc - сброс инструмента
		if (e.key === 'Escape') {
			// Если есть выделенная точка Безье — снимаем выделение
			if (this.state.bezierSelectedPoint !== null) {
				this.deselectAllPoints();
				return;
			}
			
			// Если есть выделенный элемент — снимаем выделение
			if (this.selectedElement) {
				this.removeSelectionHandles();
				this.selectedElement = null;
				return;
			}
			
			// Иначе переключаем на select
			this.setTool('select');
			return;
		}
        
        // Горячие клавиши для инструментов
        switch(e.key.toLowerCase()) {
            case 'v': // Выделение
                this.setTool('select');
                break;
            case 'b': // Кривые Безье
                this.setTool('bezier-points');
                break;
            case 'p': // Карандаш
                this.setTool('pen');
                break;
            case 'l': // Линия
                this.setTool('line');
                break;
            case 'r': // Прямоугольник
                this.setTool('rect');
                break;
            case 'c': // Круг
                this.setTool('circle');
                break;
            case 'e': // Ластик
                this.setTool('eraser');
                break;
            case 'u': // Push инструмент
                this.setTool('push');
                break;
            case 'z': // Zoom
                if (e.ctrlKey || e.metaKey) {
                    if (e.shiftKey) {
                        this.zoomIn();
                    } else {
                        this.zoomOut();
                    }
                }
                break;
            case '=': // Zoom in
            case '+':
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    this.zoomIn();
                }
                break;
            case '-': // Zoom out
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    this.zoomOut();
                }
                break;
            case '0': // Сброс zoom
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    this.setZoom(1);
                }
                break;
            case 'delete': // Удалить выделенное
            case 'backspace':
                if (this.state.currentTool === 'bezier-points' && 
                    this.state.bezierSelectedPoint !== null) {
                    this.deleteBezierPoint(this.state.bezierSelectedPoint);
                }
                break;
        }
    });
    document.addEventListener('keyup', (e) => {
        if (e.key === 'Control' || e.key === 'Meta') {
            if (this.state.currentTool === 'eraser') {
                this.svg.style.cursor = 'none';
                const radius = this.state.eraserSize / this.state.zoom;
                this.showEraserIndicator(this.state.lastMouseX, this.state.lastMouseY, radius);
            }
        }
    });
}

updateAspectRatioDisplay(width, height) {

    const simplified = this.simplifyRatio(width, height);
    ratioDisplay.innerHTML = `${simplified.replace(':', '/<br>')}`;
    ratioDisplay.title = `Соотношение сторон: ${(width/height).toFixed(3)}`;
    
}

updateSizeWithAspectRatio(changedField, value) {
    if (!this.state.image || !this.state.originalImageRatio) {
        this.updatePixelDisplay();
        return;
    }
    
    const keepRatio = document.getElementById('keepAspectRatio').checked;
    const widthInput = document.getElementById('mmWidth');
    const heightInput = document.getElementById('mmHeight');
    
    if (!keepRatio) {
        this.updatePixelDisplay();
        return;
    }
    
    try {
        const newValue = parseFloat(value);
        if (isNaN(newValue) || newValue <= 0) return;
        
        if (changedField === 'width') {
            const newHeight = Math.round(newValue / this.state.originalImageRatio);
            heightInput.value = newHeight;
        } else {
            const newWidth = Math.round(newValue * this.state.originalImageRatio);
            widthInput.value = newWidth;
        }

        this.updatePixelDisplay();

    } catch (error) {
        console.error('Ошибка при обновлении размеров:', error);
    }
}

		}
	});

scalePhoto(scale) {
    const photoElement = document.getElementById('photo-overlay');
    if (!photoElement || !this.state.image) return;
    this.state.photoScale = scale;

    const originalWidth = this.state.originalPhotoWidth || this.state.image.width;
    const originalHeight = this.state.originalPhotoHeight || this.state.image.height;
    const newWidth = originalWidth * scale;
    const newHeight = originalHeight * scale;
    const currentX = parseFloat(photoElement.getAttribute('x')) || 0;
    const currentY = parseFloat(photoElement.getAttribute('y')) || 0;
    const currentWidth = parseFloat(photoElement.getAttribute('width')) || newWidth;
    const currentHeight = parseFloat(photoElement.getAttribute('height')) || newHeight;
    const centerX = currentX + currentWidth / 2;
    const centerY = currentY + currentHeight / 2;
    const newX = centerX - newWidth / 2;
    const newY = centerY - newHeight / 2;
    photoElement.setAttribute('width', newWidth);
    photoElement.setAttribute('height', newHeight);
    photoElement.setAttribute('x', newX);
    photoElement.setAttribute('y', newY);
    
    this.updatePhotoScaleDisplay();
    
}

scalePhotoByWidthPercent(percent) {
    const photoElement = document.getElementById('photo-overlay');
    if (!photoElement || !this.state.image) return;

    const img = this.state.image;
    const currentDpi = parseInt(document.getElementById('dpiInput')?.value) || 96;
    const photoWidthInches = img.width / currentDpi;
    const photoHeightInches = img.height / currentDpi;
    
    const worksheetElement = document.getElementById('worksheet-background');
    const worksheetSvgWidth = worksheetElement ? 
        parseFloat(worksheetElement.getAttribute('width')) : 1000;
    const worksheetSvgHeight = worksheetElement ? 
        parseFloat(worksheetElement.getAttribute('height')) : 1000;
    
    const worksheetMmWidth = parseFloat(document.getElementById('mmWidth')?.value) || 210;
    const worksheetMmHeight = parseFloat(document.getElementById('mmHeight')?.value) || 297;
    
    const worksheetWidthInches = worksheetMmWidth / 25.4;
    const worksheetHeightInches = worksheetMmHeight / 25.4;
    
    const svgPixelsPerInchX = worksheetSvgWidth / worksheetWidthInches;
    const svgPixelsPerInchY = worksheetSvgHeight / worksheetHeightInches;
    
    const baseWidth = photoWidthInches * svgPixelsPerInchX;
    const baseHeight = photoHeightInches * svgPixelsPerInchY;
    
    const scaleFactor = percent / 100;
    const newWidth = baseWidth * scaleFactor;
    const newHeight = baseHeight * scaleFactor;
    
    this.state.photoScale = (baseWidth * scaleFactor) / img.width;
    
    const currentX = parseFloat(photoElement.getAttribute('x')) || 0;
    const currentY = parseFloat(photoElement.getAttribute('y')) || 0;
    const currentWidth = parseFloat(photoElement.getAttribute('width')) || newWidth;
    const currentHeight = parseFloat(photoElement.getAttribute('height')) || newHeight;
    
    const centerX = currentX + currentWidth / 2;
    const centerY = currentY + currentHeight / 2;
    
    const newX = centerX - newWidth / 2;
    const newY = centerY - newHeight / 2;
    
    photoElement.setAttribute('width', newWidth);
    photoElement.setAttribute('height', newHeight);
    photoElement.setAttribute('x', newX);
    photoElement.setAttribute('y', newY);
    
    this.updatePhotoSizeDisplay(percent);
}

fitPhotoToCanvas() {

    const img = this.state.image;

    const currentDpi = parseInt(document.getElementById('dpiInput')?.value) || 96;
    const photoWidthInches = img.width / currentDpi;
    const photoHeightInches = img.height / currentDpi;
    
    const worksheetElement = document.getElementById('worksheet-background');
    const worksheetSvgWidth = worksheetElement ? 
        parseFloat(worksheetElement.getAttribute('width')) : 1000;
    const worksheetSvgHeight = worksheetElement ? 
        parseFloat(worksheetElement.getAttribute('height')) : 1000;
    
    const worksheetMmWidth = parseFloat(document.getElementById('mmWidth')?.value) || 210;
    const worksheetMmHeight = parseFloat(document.getElementById('mmHeight')?.value) || 297;
    
    const worksheetWidthInches = worksheetMmWidth / 25.4;
    const worksheetHeightInches = worksheetMmHeight / 25.4;
    
    const svgPixelsPerInchX = worksheetSvgWidth / worksheetWidthInches;
    const svgPixelsPerInchY = worksheetSvgHeight / worksheetHeightInches;

    const baseWidth = photoWidthInches * svgPixelsPerInchX;
    const baseHeight = photoHeightInches * svgPixelsPerInchY;
    
    const targetWidth = worksheetSvgWidth;

    const scale = targetWidth / baseWidth;
    const percent = Math.round(scale * 100);
    
    this.state.photoScale = (baseWidth * scale) / img.width;
    
    const newWidth = baseWidth * scale;
    const newHeight = baseHeight * scale;

    const viewBoxSize = 1000;
    const newX = (viewBoxSize - newWidth) / 2;
    const newY = (viewBoxSize - newHeight) / 2;
    
    photoElement.setAttribute('width', newWidth);
    photoElement.setAttribute('height', newHeight);
    photoElement.setAttribute('x', newX);
    photoElement.setAttribute('y', newY);
    
const percentOfOriginal = Math.round((newWidth / baseWidth) * 100);
this.updatePhotoSizeDisplay(percentOfOriginal);
    
}

            zoomToPoint(x, y, factor) {
                const newWidth = this.state.viewBox.width * factor;
                const newHeight = this.state.viewBox.height * factor;
                
                const mouseXPercent = (x - this.state.viewBox.x) / this.state.viewBox.width;
                const mouseYPercent = (y - this.state.viewBox.y) / this.state.viewBox.height;
                
                this.state.viewBox = {
                    x: x - (mouseXPercent * newWidth),
                    y: y - (mouseYPercent * newHeight),
                    width: newWidth,
                    height: newHeight
                };
                
                this.svg.setAttribute('viewBox', 
                    `${this.state.viewBox.x} ${this.state.viewBox.y} ${this.state.viewBox.width} ${this.state.viewBox.height}`
                );

    this.state.viewBox.x = this.state.moveStart.viewBoxX - dx * scaleX;

        `${this.state.viewBox.x} ${this.state.viewBox.y} ${this.state.viewBox.width} ${this.state.viewBox.height}`

startBezierContourDrag(e, clickedElement) {
    const coords = this.getSVGCoordinates(e);
    
    // Находим вектор по кликнутому элементу
    const clickedVector = this.state.bezierVectors.find(v => v.path === clickedElement);
    if (!clickedVector) return;
    
    // Собираем все связанные векторы (весь контур)
    const contourVectors = this.findAllConnectedBezierVectors(clickedVector);
    
    // Собираем все уникальные точки контура
    const contourPoints = new Set();
    contourVectors.forEach(v => {
        contourPoints.add(v.from);
        contourPoints.add(v.to);
    });
    
    // Сохраняем начальные позиции всех точек
    const pointStartPositions = {};
    contourPoints.forEach(pointIndex => {
        const point = this.state.bezierPoints[pointIndex];
        if (point) {
            pointStartPositions[pointIndex] = {
                x: point.x,
                y: point.y
            };
        }
    });
    
    // Сохраняем начальные позиции всех контрольных точек
    const controlStartPositions = [];
    contourVectors.forEach(vector => {
        controlStartPositions.push({
            vector: vector,
            control1: { x: vector.control1.x, y: vector.control1.y },
            control2: { x: vector.control2.x, y: vector.control2.y }
        });
    });
    
    // Устанавливаем состояние перетаскивания
    this.state.isDraggingElement = true;
    this.state.draggingElement = clickedElement;
    this.state.draggingStartMouseX = coords.x;
    this.state.draggingStartMouseY = coords.y;
    
    // Сохраняем данные о контуре для перемещения
    this.state.bezierContourDragData = {
        contourVectors: contourVectors,
        contourPoints: Array.from(contourPoints),
        pointStartPositions: pointStartPositions,
        controlStartPositions: controlStartPositions
    };
    
    this.svg.style.cursor = 'grabbing';

}

findAllConnectedBezierVectors(startVector) {
    const visited = new Set();
    const connected = [];
    
    const traverse = (vector) => {
        if (visited.has(vector)) return;
        visited.add(vector);
        connected.push(vector);
        
        // Ищем векторы, связанные через точки
        this.state.bezierVectors.forEach(v => {
            if (!visited.has(v)) {
                if (v.from === vector.from || v.to === vector.from ||
                    v.from === vector.to || v.to === vector.to) {
                    traverse(v);
                }
            }
        });
    };
    
    traverse(startVector);
    return connected;
}


doBezierContourDrag(x, y) {
    if (!this.state.bezierContourDragData) return;
    
    const data = this.state.bezierContourDragData;
    const dx = x - this.state.draggingStartMouseX;
    const dy = y - this.state.draggingStartMouseY;
    
    // Перемещаем все точки контура
    data.contourPoints.forEach(pointIndex => {
        const point = this.state.bezierPoints[pointIndex];
        const startPos = data.pointStartPositions[pointIndex];
        
        if (point && startPos) {
            point.x = startPos.x + dx;
            point.y = startPos.y + dy;
            
            // Обновляем визуальный элемент точки (если видим)
            if (point.element) {
                point.element.setAttribute('cx', point.x);
                point.element.setAttribute('cy', point.y);
            }
        }
    });
    
    // Перемещаем все контрольные точки
    data.controlStartPositions.forEach(item => {
        item.vector.control1.x = item.control1.x + dx;
        item.vector.control1.y = item.control1.y + dy;
        item.vector.control2.x = item.control2.x + dx;
        item.vector.control2.y = item.control2.y + dy;
    });
    
    // Обновляем визуализацию всех векторов контура
    data.contourVectors.forEach(vector => {
        // Обновляем путь
        this.updateBezierVectorPath(vector);
        
        // Обновляем направляющие
        if (vector.guideElements.control1) {
            vector.guideElements.control1.setAttribute('cx', vector.control1.x);
            vector.guideElements.control1.setAttribute('cy', vector.control1.y);
        }
        if (vector.guideElements.control2) {
            vector.guideElements.control2.setAttribute('cx', vector.control2.x);
            vector.guideElements.control2.setAttribute('cy', vector.control2.y);
        }
        if (vector.guideElements.line1) {
            const fromPoint = this.state.bezierPoints[vector.from];
            vector.guideElements.line1.setAttribute('x1', fromPoint.x);
            vector.guideElements.line1.setAttribute('y1', fromPoint.y);
            vector.guideElements.line1.setAttribute('x2', vector.control1.x);
            vector.guideElements.line1.setAttribute('y2', vector.control1.y);
        }
        if (vector.guideElements.line2) {
            const toPoint = this.state.bezierPoints[vector.to];
            vector.guideElements.line2.setAttribute('x1', toPoint.x);
            vector.guideElements.line2.setAttribute('y1', toPoint.y);
            vector.guideElements.line2.setAttribute('x2', vector.control2.x);
            vector.guideElements.line2.setAttribute('y2', vector.control2.y);
        }
    });
}

// Вспомогательный метод для сдвига пути
translatePath(d, dx, dy) {
    const commands = d.match(/[a-df-zA-DF-Z][^a-df-zA-DF-Z]*/g) || [];
    let newPath = '';
    
    commands.forEach(cmd => {
        const command = cmd[0];
        const numbers = cmd.substring(1).trim().split(/[\s,]+/).map(Number);
        let newCmd = command;
        
        if (command === 'Z' || command === 'z') {
            newPath += command + ' ';
            return;
        }
        
        for (let i = 0; i < numbers.length; i += 2) {
            if (i + 1 < numbers.length) {
                const x = numbers[i] + dx;
                const y = numbers[i + 1] + dy;
                newCmd += ` ${x} ${y}`;
            }
        }
        newPath += newCmd + ' ';
    });
    
    return newPath.trim();
}

// Получение центра фигуры в глобальных координатах
getElementCenter(element) {
    const transform = element.getAttribute('transform') || '';
    const rotateMatch = transform.match(/rotate\([^,]+,([^,]+),([^)]+)\)/);
    if (rotateMatch) {
        return { x: parseFloat(rotateMatch[1]), y: parseFloat(rotateMatch[2]) };
    }
    // Иначе из bbox
    const bbox = this.getElementBBox(element);
    return { x: bbox.x + bbox.width/2, y: bbox.y + bbox.height/2 };
}

// Получение угла поворота фигуры (в радианах)
getElementRotation(element) {
    const transform = element.getAttribute('transform') || '';
    
    // Ищем rotate(угол, cx, cy)
    let match = transform.match(/rotate\(([^,]+),\s*([^,]+),\s*([^)]+)\)/);
    if (match) {
        return {
            angle: parseFloat(match[1]) * Math.PI / 180,
            cx: parseFloat(match[2]),
            cy: parseFloat(match[3])
        };
    }
    
    // Ищем просто rotate(угол)
    match = transform.match(/rotate\(([^)]+)\)/);
    if (match) {
        return {
            angle: parseFloat(match[1]) * Math.PI / 180,
            cx: null,
            cy: null
        };
    }
    
    return { angle: 0, cx: null, cy: null };
}

// Установка угла поворота фигуры
setElementRotation(element, angleDegrees, cx, cy) {
    let transform = element.getAttribute('transform') || '';
    
    // Удаляем старый rotate
    transform = transform.replace(/rotate\([^)]+\)/g, '').trim();
    
    // Добавляем новый rotate (всегда с центром)
    const newRotate = `rotate(${angleDegrees}, ${cx}, ${cy})`;
    
    element.setAttribute('transform', transform ? `${transform} ${newRotate}` : newRotate);
}

// Получение bounding box фигуры БЕЗ учёта поворота
getElementBBox(element) {
    const tag = element.tagName.toLowerCase();
    let bbox = { x: 0, y: 0, width: 0, height: 0 };
    
    if (tag === 'circle') {
        const cx = parseFloat(element.getAttribute('cx')) || 0;
        const cy = parseFloat(element.getAttribute('cy')) || 0;
        const r = parseFloat(element.getAttribute('r')) || 0;
        bbox = { x: cx - r, y: cy - r, width: r * 2, height: r * 2 };
    } else if (tag === 'ellipse') {
        const cx = parseFloat(element.getAttribute('cx')) || 0;
        const cy = parseFloat(element.getAttribute('cy')) || 0;
        const rx = parseFloat(element.getAttribute('rx')) || 0;
        const ry = parseFloat(element.getAttribute('ry')) || 0;
        bbox = { x: cx - rx, y: cy - ry, width: rx * 2, height: ry * 2 };
    } else if (tag === 'rect') {
        bbox.x = parseFloat(element.getAttribute('x')) || 0;
        bbox.y = parseFloat(element.getAttribute('y')) || 0;
        bbox.width = parseFloat(element.getAttribute('width')) || 0;
        bbox.height = parseFloat(element.getAttribute('height')) || 0;
    } else if (tag === 'line') {
        const x1 = parseFloat(element.getAttribute('x1')) || 0;
        const y1 = parseFloat(element.getAttribute('y1')) || 0;
        const x2 = parseFloat(element.getAttribute('x2')) || 0;
        const y2 = parseFloat(element.getAttribute('y2')) || 0;
        bbox.x = Math.min(x1, x2);
        bbox.y = Math.min(y1, y2);
        bbox.width = Math.abs(x2 - x1);
        bbox.height = Math.abs(y2 - y1);
    } else if (tag === 'image') {
        bbox.x = parseFloat(element.getAttribute('x')) || 0;
        bbox.y = parseFloat(element.getAttribute('y')) || 0;
        bbox.width = parseFloat(element.getAttribute('width')) || 0;
        bbox.height = parseFloat(element.getAttribute('height')) || 0;
    } else if (tag === 'path') {
        try {
            // getBBox() возвращает bbox БЕЗ учёта transform
            const rawBBox = element.getBBox();
            bbox = { x: rawBBox.x, y: rawBBox.y, width: rawBBox.width, height: rawBBox.height };
        } catch(e) {
            bbox = { x: 0, y: 0, width: 100, height: 100 };
        }
    }
    
    return bbox;
}

// Поворот точки вокруг центра
rotatePoint(px, py, cx, cy, angle) {
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    const dx = px - cx;
    const dy = py - cy;
    return {
        x: cx + dx * cos - dy * sin,
        y: cy + dx * sin + dy * cos
    };
}

// ПЕРЕМЕЩЕНИЕ
startElementDrag(e, element) {
    const coords = this.getSVGCoordinates(e);
    
    const isBezierVector = element.classList && element.classList.contains('bezier-vector');
    
    if (isBezierVector) {
        this.startBezierContourDrag(e, element);
        return;
    }
    
    this.state.isDraggingElement = true;
    this.state.draggingElement = element;
    this.state.draggingStartMouseX = coords.x;
    this.state.draggingStartMouseY = coords.y;
    
    const tag = element.tagName.toLowerCase();
    
    // Сохраняем начальные координаты
    if (tag === 'image') {
        this.state.draggingStartElementX = parseFloat(element.getAttribute('x')) || 0;
        this.state.draggingStartElementY = parseFloat(element.getAttribute('y')) || 0;
    } else if (tag === 'line') {
        this.state.lineDragData = {
            x1: parseFloat(element.getAttribute('x1')) || 0,
            y1: parseFloat(element.getAttribute('y1')) || 0,
            x2: parseFloat(element.getAttribute('x2')) || 0,
            y2: parseFloat(element.getAttribute('y2')) || 0
        };
    } else if (tag === 'rect') {
        this.state.draggingStartElementX = parseFloat(element.getAttribute('x')) || 0;
        this.state.draggingStartElementY = parseFloat(element.getAttribute('y')) || 0;
    } else if (tag === 'circle' || tag === 'ellipse') {
        this.state.draggingStartElementX = parseFloat(element.getAttribute('cx')) || 0;
        this.state.draggingStartElementY = parseFloat(element.getAttribute('cy')) || 0;
    } else if (tag === 'path') {
        const d = element.getAttribute('d');
        if (d) {
            this.state.draggingStartPathD = d;
        }
    }
    
    // === СОХРАНЯЕМ ЦЕНТР ПОВОРОТА ===
    const transform = element.getAttribute('transform') || '';
    const rotateMatch = transform.match(/rotate\(([^,]+),\s*([^,]+),\s*([^)]+)\)/);
    if (rotateMatch) {
        this.state.draggingRotationCenter = {
            x: parseFloat(rotateMatch[2]),
            y: parseFloat(rotateMatch[3])
        };
    } else {
        this.state.draggingRotationCenter = null;
    }
    
    this.svg.style.cursor = 'grabbing';
}

getElementPosition(element) {
    const tag = element.tagName.toLowerCase();
    
    if (tag === 'image') {
        return {
            x: parseFloat(element.getAttribute('x')) || 0,
            y: parseFloat(element.getAttribute('y')) || 0
        };
    } else if (tag === 'line') {
        return {
            x1: parseFloat(element.getAttribute('x1')) || 0,
            y1: parseFloat(element.getAttribute('y1')) || 0,
            x2: parseFloat(element.getAttribute('x2')) || 0,
            y2: parseFloat(element.getAttribute('y2')) || 0
        };
    } else if (tag === 'rect') {
        return {
            x: parseFloat(element.getAttribute('x')) || 0,
            y: parseFloat(element.getAttribute('y')) || 0,
            width: parseFloat(element.getAttribute('width')) || 0,
            height: parseFloat(element.getAttribute('height')) || 0
        };
    } else if (tag === 'circle') {
        return {
            cx: parseFloat(element.getAttribute('cx')) || 0,
            cy: parseFloat(element.getAttribute('cy')) || 0,
            r: parseFloat(element.getAttribute('r')) || 0
        };
    } else if (tag === 'ellipse') {
        return {
            cx: parseFloat(element.getAttribute('cx')) || 0,
            cy: parseFloat(element.getAttribute('cy')) || 0,
            rx: parseFloat(element.getAttribute('rx')) || 0,
            ry: parseFloat(element.getAttribute('ry')) || 0
        };
    } else if (tag === 'path') {
        return {
            d: element.getAttribute('d') || ''
        };
    }
    
    return {};
}

doElementDrag(e) {
    if (!this.state.isDraggingElement) return;
    
    const coords = this.getSVGCoordinates(e);
    
    if (this.state.bezierContourDragData) {
        this.doBezierContourDrag(coords.x, coords.y);
        return;
    }
    
    if (!this.state.draggingElement) return;
    
    const element = this.state.draggingElement;
    const tag = element.tagName.toLowerCase();
    
    const dx = coords.x - this.state.draggingStartMouseX;
    const dy = coords.y - this.state.draggingStartMouseY;
    
    // Двигаем координаты элемента
    if (tag === 'image') {
        element.setAttribute('x', this.state.draggingStartElementX + dx);
        element.setAttribute('y', this.state.draggingStartElementY + dy);
    } else if (tag === 'line') {
        element.setAttribute('x1', this.state.lineDragData.x1 + dx);
        element.setAttribute('y1', this.state.lineDragData.y1 + dy);
        element.setAttribute('x2', this.state.lineDragData.x2 + dx);
        element.setAttribute('y2', this.state.lineDragData.y2 + dy);
    } else if (tag === 'rect') {
        element.setAttribute('x', this.state.draggingStartElementX + dx);
        element.setAttribute('y', this.state.draggingStartElementY + dy);
    } else if (tag === 'circle' || tag === 'ellipse') {
        element.setAttribute('cx', this.state.draggingStartElementX + dx);
        element.setAttribute('cy', this.state.draggingStartElementY + dy);
    } else if (tag === 'path') {
        if (this.state.draggingStartPathD) {
            const newD = this.translatePath(this.state.draggingStartPathD, dx, dy);
            element.setAttribute('d', newD);
        }
    }
    
    // === СДВИГАЕМ ЦЕНТР ПОВОРОТА ВМЕСТЕ С ЭЛЕМЕНТОМ ===
    if (this.state.draggingRotationCenter) {
        const transform = element.getAttribute('transform') || '';
        const rotateMatch = transform.match(/rotate\(([^,]+),\s*([^,]+),\s*([^)]+)\)/);
        if (rotateMatch) {
            const angle = rotateMatch[1];
            const newCx = this.state.draggingRotationCenter.x + dx;
            const newCy = this.state.draggingRotationCenter.y + dy;
            
            // Заменяем rotate с новым центром
            const newTransform = transform.replace(
                /rotate\([^)]+\)/,
                `rotate(${angle}, ${newCx}, ${newCy})`
            );
            element.setAttribute('transform', newTransform);
        }
    }
    
    // Обновляем рамку
    if (this.selectedElement === element) {
        this.updateSelectionHandles();
    }
}

stopElementDrag() {
    if (!this.state.isDraggingElement) return;
    
    this.state.bezierContourDragData = null;
    this.state.lineDragData = null;
    this.state.draggingStartPathD = null;
    this.state.draggingRotationCenter = null;
    
    this.state.isDraggingElement = false;
    this.state.draggingElement = null;
    
    if (this.selectedElement) {
        this.updateSelectionHandles();
    }
    
    if (this.state.currentTool === 'select') {
        this.svg.style.cursor = 'move';
    } else {
        this.svg.style.cursor = 'crosshair';
    }
}

// ПЕРЕМЕЩЕНИЕ ОПОРНОЙ ТОЧКИ
startPivotDrag(e) {
    if (!this.selectedElement) return;
    
    const coords = this.getSVGCoordinates(e);
    const element = this.selectedElement;
    const rotation = this.getElementRotation(element);
    
    // Сохраняем угол и временно убираем поворот
    this.isDraggingPivot = true;
    this.pivotDragData = {
        startX: coords.x,
        startY: coords.y,
        element: element,
        angle: rotation.angle,
        savedTransform: element.getAttribute('transform') || ''
    };
    
    // Временно убираем rotate
    if (rotation.angle !== 0) {
        element.setAttribute('transform', `rotate(0, ${coords.x}, ${coords.y})`);
    } else {
        element.setAttribute('transform', `rotate(0, ${coords.x}, ${coords.y})`);
    }
    
    this.svg.style.cursor = 'grabbing';
    this.updateSelectionHandles();
}

// В doPivotDrag - просто визуальное обновление без изменения transform
doPivotDrag(e) {
    if (!this.isDraggingPivot || !this.pivotDragData) return;
    
    const coords = this.getSVGCoordinates(e);
    this.pivotDragData.endX = coords.x;
    this.pivotDragData.endY = coords.y;
    
    this.updatePivotPreview(coords.x, coords.y);
}

// В stopPivotDrag - одно применение
stopPivotDrag() {
    if (!this.isDraggingPivot || !this.pivotDragData) return;
    
    const data = this.pivotDragData;
    const element = data.element;
    
    if (data.endX !== undefined) {
        // Возвращаем сохранённый угол с новой позицией pivot
        const angleDeg = data.angle * 180 / Math.PI;
        element.setAttribute('transform', `rotate(${angleDeg}, ${data.endX}, ${data.endY})`);
    } else {
        // Восстанавливаем оригинальный transform
        element.setAttribute('transform', data.savedTransform);
    }
    
    this.isDraggingPivot = false;
    this.pivotDragData = null;
    this.svg.style.cursor = 'move';
    this.updateSelectionHandles();
}

updatePivotPreview(x, y) {
    const handles = document.getElementById('selection-handles');
    if (!handles) return;
    
    // Находим точку центра вращения
    const pivotPoint = handles.querySelector('[data-type="pivot"]');
    if (pivotPoint) {
        pivotPoint.setAttribute('cx', x);
        pivotPoint.setAttribute('cy', y);
    }
    
}

// МАСШТАБИРОВАНИЕ
startResizing(e, handleType) {
    if (!this.selectedElement) return;
    
    const coords = this.getSVGCoordinates(e);
    const element = this.selectedElement;
    
    this.isResizing = true;
    
    // Сохраняем начальные данные
    this.resizeStart = {
        mouseX: coords.x,
        mouseY: coords.y,
        bbox: this.getElementBBox(element),
        position: this.getElementPosition(element),
        center: this.getElementCenter(element),
        rotation: this.getElementRotation(element),
        type: handleType,
        element: element
    };
}

doResize(e) {
    if (!this.isResizing || !this.resizeStart) return;
    
    const coords = this.getSVGCoordinates(e);
    const data = this.resizeStart;
    const element = data.element;
    
    // Смещение мыши в глобальных координатах
    let dx = coords.x - data.mouseX;
    let dy = coords.y - data.mouseY;
    
    // Если фигура повёрнута — преобразуем смещение в локальные координаты
    if (data.rotation.angle !== 0) {
        const rotated = this.rotatePoint(
            data.mouseX + dx, 
            data.mouseY + dy, 
            data.center.x, 
            data.center.y, 
            -data.rotation.angle
        );
        const original = this.rotatePoint(
            data.mouseX, 
            data.mouseY, 
            data.center.x, 
            data.center.y, 
            -data.rotation.angle
        );
        dx = rotated.x - original.x;
        dy = rotated.y - original.y;
    }
    
    let newBBox = { ...data.bbox };
    const type = data.type;
    
    // Изменяем bbox в зависимости от типа хендла
    if (type.includes('e')) {
        newBBox.width = Math.max(10, data.bbox.width + dx);
    }
    if (type.includes('w')) {
        newBBox.width = Math.max(10, data.bbox.width - dx);
        newBBox.x = data.bbox.x + data.bbox.width - newBBox.width;
    }
    if (type.includes('s')) {
        newBBox.height = Math.max(10, data.bbox.height + dy);
    }
    if (type.includes('n')) {
        newBBox.height = Math.max(10, data.bbox.height - dy);
        newBBox.y = data.bbox.y + data.bbox.height - newBBox.height;
    }
    
    // Применяем новый bbox к элементу
    this.applyBBoxToElement(element, newBBox, data.position);
    
    this.updateSelectionHandles();
}

applyBBoxToElement(element, bbox, originalPosition) {
    const tag = element.tagName.toLowerCase();
    const cx = bbox.x + bbox.width / 2;
    const cy = bbox.y + bbox.height / 2;
    
    if (tag === 'circle') {
        const r = Math.min(bbox.width, bbox.height) / 2;
        element.setAttribute('cx', cx);
        element.setAttribute('cy', cy);
        element.setAttribute('r', r);
        
    } else if (tag === 'rect') {
        element.setAttribute('x', bbox.x);
        element.setAttribute('y', bbox.y);
        element.setAttribute('width', bbox.width);
        element.setAttribute('height', bbox.height);
        
    } else if (tag === 'line') {
        const oldCenter = {
            x: (originalPosition.x1 + originalPosition.x2) / 2,
            y: (originalPosition.y1 + originalPosition.y2) / 2
        };
        const scaleX = bbox.width / (Math.abs(originalPosition.x2 - originalPosition.x1) || 1);
        const scaleY = bbox.height / (Math.abs(originalPosition.y2 - originalPosition.y1) || 1);
        
        element.setAttribute('x1', oldCenter.x + (originalPosition.x1 - oldCenter.x) * scaleX);
        element.setAttribute('y1', oldCenter.y + (originalPosition.y1 - oldCenter.y) * scaleY);
        element.setAttribute('x2', oldCenter.x + (originalPosition.x2 - oldCenter.x) * scaleX);
        element.setAttribute('y2', oldCenter.y + (originalPosition.y2 - oldCenter.y) * scaleY);
        
        const newCenter = this.getElementCenter(element);
        element.setAttribute('x1', parseFloat(element.getAttribute('x1')) + cx - newCenter.x);
        element.setAttribute('y1', parseFloat(element.getAttribute('y1')) + cy - newCenter.y);
        element.setAttribute('x2', parseFloat(element.getAttribute('x2')) + cx - newCenter.x);
        element.setAttribute('y2', parseFloat(element.getAttribute('y2')) + cy - newCenter.y);
        
    } else if (tag === 'path') {
        // Перемещаем каждую точку относительно центра
        const d = element.getAttribute('d');
        if (!d) return;
        
        const oldBBox = this.getElementBBox(element);
        const oldCx = oldBBox.x + oldBBox.width / 2;
        const oldCy = oldBBox.y + oldBBox.height / 2;
        const scaleX = bbox.width / (oldBBox.width || 1);
        const scaleY = bbox.height / (oldBBox.height || 1);
        
        // Преобразуем все координаты в path
        const commands = d.match(/[a-zA-Z][^a-zA-Z]*/g) || [];
        let newD = '';
        
        commands.forEach(cmd => {
            const type = cmd[0];
            const coords = cmd.slice(1).trim().split(/[\s,]+/).map(Number);
            let newCmd = type;
            
            for (let i = 0; i < coords.length; i += 2) {
                if (i + 1 < coords.length) {
                    // Масштабируем относительно старого центра
                    const x = oldCx + (coords[i] - oldCx) * scaleX;
                    // Сдвигаем к новому центру
                    const newX = x + (cx - oldCx);
                    const y = oldCy + (coords[i + 1] - oldCy) * scaleY;
                    const newY = y + (cy - oldCy);
                    newCmd += ` ${newX} ${newY}`;
                }
            }
            newD += newCmd + ' ';
        });
        
        element.setAttribute('d', newD.trim());
    }
	
}

// ПОВОРОТ
startRotating(e) {
    if (!this.selectedElement) return;
    
    const coords = this.getSVGCoordinates(e);
    const element = this.selectedElement;
    const center = this.getElementCenter(element);
    const rotation = this.getElementRotation(element);
    
    // Вычисляем начальный угол между мышью и центром
    const dx = coords.x - center.x;
    const dy = coords.y - center.y;
    const startMouseAngle = Math.atan2(dy, dx);
    
    this.isRotating = true;
    this.rotateStart = {
        center: center,
        startMouseAngle: startMouseAngle,
        startFigureAngle: rotation.angle,
        element: element
    };
}

doRotate(e) {
    if (!this.isRotating || !this.rotateStart) return;
    
    const coords = this.getSVGCoordinates(e);
    const data = this.rotateStart;
    
    // Текущий угол между мышью и центром
    const dx = coords.x - data.center.x;
    const dy = coords.y - data.center.y;
    const currentMouseAngle = Math.atan2(dy, dx);
    
    // Изменение угла
    const deltaAngle = currentMouseAngle - data.startMouseAngle;
    
    // Новый угол фигуры
    const newAngle = data.startFigureAngle + deltaAngle;
    const newAngleDeg = newAngle * 180 / Math.PI;
    
    // Применяем поворот
    this.setElementRotation(
        data.element, 
        newAngleDeg, 
        data.center.x, 
        data.center.y
    );
    
    // Обновляем рамку
    this.updateSelectionHandles();
}

            // ИЗОБРАЖЕНИЕ
addWhiteBackgroundToPNG(img) {
    return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        const imgWithBackground = new Image();
        imgWithBackground.onload = () => {
            resolve(imgWithBackground);
        };
        imgWithBackground.src = canvas.toDataURL();
    });
}
          
saveSVG() {
    // Получаем физические размеры листа из полей ввода
    const mmWidth = parseFloat(document.getElementById('mmWidth')?.value) || 210;
    const mmHeight = parseFloat(document.getElementById('mmHeight')?.value) || 297;
    
    // Находим подложку рабочего листа
    const worksheetElement = document.getElementById('worksheet-background');    
    const sheetX = parseFloat(worksheetElement.getAttribute('x')) || 0;
    const sheetY = parseFloat(worksheetElement.getAttribute('y')) || 0;
    const sheetWidth = parseFloat(worksheetElement.getAttribute('width')) || 1000;
    const sheetHeight = parseFloat(worksheetElement.getAttribute('height')) || 1000;

    // Создаем SVG с размерами в мм и сохраняем масштабы
    let svgContent = `<?xml version="1.0" encoding="UTF-8"?>
<svg width="${mmWidth}mm" height="${mmHeight}mm" viewBox="0 0 ${mmWidth} ${mmHeight}" 
     xmlns="http://www.w3.org/2000/svg">
`;

    const scaleX = mmWidth / sheetWidth;
    const scaleY = mmHeight / sheetHeight;
    const avgScale = (scaleX + scaleY) / 2;
	
    const photoElement = document.getElementById('photo-overlay');
    
    
    // Функция преобразования координат из viewBox в мм
    // Вычитаем sheetX и sheetY чтобы привязаться к левому верхнему углу листа
    const toMM = (x, y) => {
        return {
            x: (x - sheetX) * scaleX,
            y: (y - sheetY) * scaleY
        };
    };
    
    // 1. Сохраняем подложку (белый лист)
    /*if (this.state.worksheetUrl) {
        svgContent += `  <!-- Рабочий лист -->\n`;
        svgContent += `  <image x="0" y="0" width="${mmWidth}" height="${mmHeight}" 
                    href="${this.state.worksheetUrl}" preserveAspectRatio="none"/>\n`;
    }*/
    
    // 2. Сохраняем фото (если есть)
    if (photoElement && this.state.imageUrl) {
        const photoX = parseFloat(photoElement.getAttribute('x')) || 0;
        const photoY = parseFloat(photoElement.getAttribute('y')) || 0;
        const photoWidth = parseFloat(photoElement.getAttribute('width')) || 0;
        const photoHeight = parseFloat(photoElement.getAttribute('height')) || 0;
        const opacity = photoElement.style.opacity || 1;
        
        const pos = toMM(photoX, photoY);
        const widthMM = photoWidth * scaleX;
        const heightMM = photoHeight * scaleY;
        
        svgContent += `  <!-- Фото -->\n`;
        svgContent += `  <image x="${pos.x.toFixed(3)}" y="${pos.y.toFixed(3)}" 
                    width="${widthMM.toFixed(3)}" height="${heightMM.toFixed(3)}" 
                    opacity="${opacity}" href="${this.state.imageUrl}" 
                    preserveAspectRatio="none"/>\n`;
    }
    
    // 3. Сохраняем все векторные элементы
    const vectorElements = this.svg.querySelectorAll('path:not([id*="indicator"]), line:not([id*="indicator"]), rect:not([id*="indicator"]), circle:not([id*="indicator"]), ellipse:not([id*="indicator"])');
	
    vectorElements.forEach(el => {
        // Пропускаем фоновые элементы и фото
        if (el.id && (el.id.includes('background') || el.id === 'photo-overlay')) {
            return;
        }
        
        // Пропускаем вспомогательные элементы Безье
        if (el.classList && 
            (el.classList.contains('bezier-guide-line') || 
             el.classList.contains('bezier-control-point') ||
             el.classList.contains('bezier-point'))) {
            return;
        }
        
        const tag = el.tagName.toLowerCase();
        const stroke = el.getAttribute('stroke') || '#000000';
        const strokeWidth = parseFloat(el.getAttribute('stroke-width')) || 1;
		const scaledStrokeWidth = (strokeWidth * avgScale).toFixed(3);
        const fill = el.getAttribute('fill') || 'none';
        const strokeLinecap = el.getAttribute('stroke-linecap') || 'round';
        const strokeLinejoin = el.getAttribute('stroke-linejoin') || 'round';
        
        
        if (tag === 'path') {
            const d = el.getAttribute('d');
            if (d) {
                const convertedD = this.transformPathToMM(d, toMM);
                svgContent += `  <path d="${convertedD}" fill="${fill}" stroke="${stroke}" 
                         stroke-width="${scaledStrokeWidth}" stroke-linecap="${strokeLinecap}" 
                         stroke-linejoin="${strokeLinejoin}"/>\n`;
            }
        } else if (tag === 'line') {
            const x1 = parseFloat(el.getAttribute('x1'));
            const y1 = parseFloat(el.getAttribute('y1'));
            const x2 = parseFloat(el.getAttribute('x2'));
            const y2 = parseFloat(el.getAttribute('y2'));
            
            if (!isNaN(x1) && !isNaN(y1) && !isNaN(x2) && !isNaN(y2)) {
                const p1 = toMM(x1, y1);
                const p2 = toMM(x2, y2);
                svgContent += `  <line x1="${p1.x.toFixed(3)}" y1="${p1.y.toFixed(3)}" 
                             x2="${p2.x.toFixed(3)}" y2="${p2.y.toFixed(3)}" 
                             stroke="${stroke}" stroke-width="${scaledStrokeWidth}" 
                             stroke-linecap="${strokeLinecap}"/>\n`;
            }
        } else if (tag === 'rect') {
            const x = parseFloat(el.getAttribute('x'));
            const y = parseFloat(el.getAttribute('y'));
            const width = parseFloat(el.getAttribute('width'));
            const height = parseFloat(el.getAttribute('height'));
            
            if (!isNaN(x) && !isNaN(y) && !isNaN(width) && !isNaN(height)) {
                const pos = toMM(x, y);
                const wMM = width * scaleX;
                const hMM = height * scaleY;
                svgContent += `  <rect x="${pos.x.toFixed(3)}" y="${pos.y.toFixed(3)}" 
                             width="${wMM.toFixed(3)}" height="${hMM.toFixed(3)}" 
                             fill="${fill}" stroke="${stroke}" stroke-width="${scaledStrokeWidth}"/>\n`;
            }
        } else if (tag === 'circle') {
            const cx = parseFloat(el.getAttribute('cx'));
            const cy = parseFloat(el.getAttribute('cy'));
            const r = parseFloat(el.getAttribute('r'));
            
            if (!isNaN(cx) && !isNaN(cy) && !isNaN(r)) {
                const center = toMM(cx, cy);
                const rMM = r * scaleX;
                svgContent += `  <circle cx="${center.x.toFixed(3)}" cy="${center.y.toFixed(3)}" 
                             r="${rMM.toFixed(3)}" fill="${fill}" stroke="${stroke}" 
                             stroke-width="${scaledStrokeWidth}"/>\n`;
            }
        } else if (tag === 'ellipse') {
            const cx = parseFloat(el.getAttribute('cx'));
            const cy = parseFloat(el.getAttribute('cy'));
            const rx = parseFloat(el.getAttribute('rx'));
            const ry = parseFloat(el.getAttribute('ry'));
            
            if (!isNaN(cx) && !isNaN(cy) && !isNaN(rx) && !isNaN(ry)) {
                const center = toMM(cx, cy);
                const rxMM = rx * scaleX;
                const ryMM = ry * scaleY;
                svgContent += `  <ellipse cx="${center.x.toFixed(3)}" cy="${center.y.toFixed(3)}" 
                             rx="${rxMM.toFixed(3)}" ry="${ryMM.toFixed(3)}" 
                             fill="${fill}" stroke="${stroke}" stroke-width="${scaledStrokeWidth}"/>\n`;
            }
        }
    });
    
    svgContent += '</svg>';
    
    // Скачиваем файл
    const blob = new Blob([svgContent], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `vector_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.svg`;
    document.body.appendChild(a);
    a.click();
    
    setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }, 100);
    
}

loadSVG(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        const parser = new DOMParser();
        const svgDoc = parser.parseFromString(e.target.result, 'image/svg+xml');
        const loadedSvg = svgDoc.querySelector('svg');
        
        if (!loadedSvg) {
            alert('Файл не является валидным SVG');
            return;
        }

        // Получаем размеры загруженного SVG в мм
        let svgWidthMM, svgHeightMM;
        
        const widthAttr = loadedSvg.getAttribute('width');
        const heightAttr = loadedSvg.getAttribute('height');
        
        svgWidthMM = parseFloat(widthAttr);
        svgHeightMM = parseFloat(heightAttr);
        
        if (isNaN(svgWidthMM) || isNaN(svgHeightMM)) {
            const viewBox = loadedSvg.getAttribute('viewBox');
            if (viewBox) {
                const parts = viewBox.split(' ');
                svgWidthMM = parseFloat(parts[2]) || 1000;
                svgHeightMM = parseFloat(parts[3]) || 1000;
            } else {
                svgWidthMM = 1000;
                svgHeightMM = 1000;
            }
        }
        
        // Получаем текущий лист
        const worksheetElement = document.getElementById('worksheet-background');
        const sheetX = parseFloat(worksheetElement?.getAttribute('x')) || 0;
        const sheetY = parseFloat(worksheetElement?.getAttribute('y')) || 0;
        const sheetWidth = parseFloat(worksheetElement?.getAttribute('width')) || 1000;
        const sheetHeight = parseFloat(worksheetElement?.getAttribute('height')) || 1000;
        
        // КООРДИНАТНЫЙ масштаб: из мм в viewBox
        const coordScaleX = sheetWidth / svgWidthMM;
        const coordScaleY = sheetHeight / svgHeightMM;
        
        // МАСШТАБ ТОЛЩИНЫ: такой же как при сохранении!
        const currentMmWidth = parseFloat(document.getElementById('mmWidth')?.value) || 210;
        const currentMmHeight = parseFloat(document.getElementById('mmHeight')?.value) || 297;
        const thicknessScale = (currentMmWidth / sheetWidth + currentMmHeight / sheetHeight) / 2;
        
        // Загружаем: для координат - coordScale, для толщины - thicknessScale
        this.loadVectorsToCurrentCanvas(loadedSvg, coordScaleX, coordScaleY, sheetX, sheetY, thicknessScale);
        
        setTimeout(() => this.saveSnapshot(), 100);
    };
    reader.readAsText(file);
}

// Новый метод для загрузки векторов с преобразованием координат
loadVectorsToCurrentCanvas(sourceSvg, coordScaleX, coordScaleY, offsetX, offsetY, thicknessScale) {
    const vectors = sourceSvg.querySelectorAll('path, line, rect, circle, ellipse');
    
    vectors.forEach(vector => {
        const clonedVector = vector.cloneNode(true);
        const tag = clonedVector.tagName.toLowerCase();

        // Масштабируем толщину линии
        const strokeWidth = parseFloat(clonedVector.getAttribute('stroke-width'));
        if (!isNaN(strokeWidth)) {
            clonedVector.setAttribute('stroke-width', (strokeWidth / thicknessScale).toFixed(2));
        }
        
        if (tag === 'path') {
            const d = clonedVector.getAttribute('d') || '';
            if (d.includes(' C ') || d.includes(' c ') || d.startsWith('C') || d.startsWith('c')) {
                this.processBezierFromSVG(clonedVector, coordScaleX, coordScaleY, offsetX, offsetY);
                return;
            }
        }
        
        switch(tag) {
            case 'path':
                const d = clonedVector.getAttribute('d');
                if (d) {
                    const transformedD = this.transformPathCoordinates(d, coordScaleX, coordScaleY, offsetX, offsetY);
                    clonedVector.setAttribute('d', transformedD);
                }
                break;
                
            case 'line':
                const x1 = parseFloat(clonedVector.getAttribute('x1'));
                const y1 = parseFloat(clonedVector.getAttribute('y1'));
                const x2 = parseFloat(clonedVector.getAttribute('x2'));
                const y2 = parseFloat(clonedVector.getAttribute('y2'));
                
                if (!isNaN(x1) && !isNaN(y1)) {
                    clonedVector.setAttribute('x1', x1 * coordScaleX + offsetX);
                    clonedVector.setAttribute('y1', y1 * coordScaleY + offsetY);
                }
                if (!isNaN(x2) && !isNaN(y2)) {
                    clonedVector.setAttribute('x2', x2 * coordScaleX + offsetX);
                    clonedVector.setAttribute('y2', y2 * coordScaleY + offsetY);
                }
                break;
                
            case 'rect':
                const rectX = parseFloat(clonedVector.getAttribute('x'));
                const rectY = parseFloat(clonedVector.getAttribute('y'));
                const rectWidth = parseFloat(clonedVector.getAttribute('width'));
                const rectHeight = parseFloat(clonedVector.getAttribute('height'));
                
                if (!isNaN(rectX)) clonedVector.setAttribute('x', rectX * coordScaleX + offsetX);
                if (!isNaN(rectY)) clonedVector.setAttribute('y', rectY * coordScaleY + offsetY);
                if (!isNaN(rectWidth)) clonedVector.setAttribute('width', rectWidth * coordScaleX);
                if (!isNaN(rectHeight)) clonedVector.setAttribute('height', rectHeight * coordScaleY);
                break;
                
            case 'circle':
                const cx = parseFloat(clonedVector.getAttribute('cx'));
                const cy = parseFloat(clonedVector.getAttribute('cy'));
                const radius = parseFloat(clonedVector.getAttribute('r'));
                
                if (!isNaN(cx)) clonedVector.setAttribute('cx', cx * coordScaleX + offsetX);
                if (!isNaN(cy)) clonedVector.setAttribute('cy', cy * coordScaleY + offsetY);
                if (!isNaN(radius)) clonedVector.setAttribute('r', radius * coordScaleX);
                break;
                
            case 'ellipse':
                const ellipseCx = parseFloat(clonedVector.getAttribute('cx'));
                const ellipseCy = parseFloat(clonedVector.getAttribute('cy'));
                const ellipseRx = parseFloat(clonedVector.getAttribute('rx'));
                const ellipseRy = parseFloat(clonedVector.getAttribute('ry'));
                
                if (!isNaN(ellipseCx)) clonedVector.setAttribute('cx', ellipseCx * coordScaleX + offsetX);
                if (!isNaN(ellipseCy)) clonedVector.setAttribute('cy', ellipseCy * coordScaleY + offsetY);
                if (!isNaN(ellipseRx)) clonedVector.setAttribute('rx', ellipseRx * coordScaleX);
                if (!isNaN(ellipseRy)) clonedVector.setAttribute('ry', ellipseRy * coordScaleY);
                break;
        }
        
        if (!clonedVector.getAttribute('stroke')) {
            clonedVector.setAttribute('stroke', '#4dabf7');
        }
        if (!clonedVector.getAttribute('stroke-width')) {
            clonedVector.setAttribute('stroke-width', '2');
        }
        if (!clonedVector.getAttribute('fill')) {
            clonedVector.setAttribute('fill', 'none');
        }
        this.svg.appendChild(clonedVector);
    });
}

parseBezierFromSVG(pathElement, scaleX = 1, scaleY = 1, offsetX = 0, offsetY = 0) {
    const d = pathElement.getAttribute('d');
    if (!d) return null;
    const commands = d.split(/(?=[MCL])/);
    
    if (commands.length < 2) return null;

    const firstCmd = commands[0].trim();
    const secondCmd = commands[1].trim();
    
    if (!firstCmd.startsWith('M') || !secondCmd.startsWith('C')) {
        return null; 
    }

    const moveCoords = firstCmd.substring(1).trim().split(/[\s,]+/).map(Number);
    if (moveCoords.length < 2) return null;

    const curveCoords = secondCmd.substring(1).trim().split(/[\s,]+/).map(Number);
    if (curveCoords.length < 6) return null;
    
    const applyTransform = (x, y) => ({
        x: x * scaleX + offsetX,
        y: y * scaleY + offsetY
    });
    
    return {
        startPoint: applyTransform(moveCoords[0], moveCoords[1]),
        control1: applyTransform(curveCoords[0], curveCoords[1]),
        control2: applyTransform(curveCoords[2], curveCoords[3]),
        endPoint: applyTransform(curveCoords[4], curveCoords[5]),
        originalElement: pathElement
    };
}

processBezierFromSVG(pathElement, scaleX, scaleY, offsetX, offsetY) {

    const bezierData = this.parseBezierFromSVG(pathElement, scaleX, scaleY, offsetX, offsetY);
    if (!bezierData) {
        this.svg.appendChild(pathElement);
        return;
    }
    
    const { startPoint, control1, control2, endPoint } = bezierData;
    
    const point1 = {
        x: startPoint.x,
        y: startPoint.y,
        element: null,
        index: this.state.bezierPoints.length
    };
    
    const point2 = {
        x: endPoint.x,
        y: endPoint.y,
        element: null,
        index: this.state.bezierPoints.length + 1
    };
    point1.element = this.createBezierPointElement(point1);
    point2.element = this.createBezierPointElement(point2);
    point1.element.style.display = 'none';
    point2.element.style.display = 'none';
    
    this.svg.appendChild(point1.element);
    this.svg.appendChild(point2.element);
    
    this.state.bezierPoints.push(point1, point2);
    
    const vector = {
        from: point1.index,
        to: point2.index,
        control1: { 
            x: control1.x, 
            y: control1.y, 
            belongsTo: point1.index 
        },
        control2: { 
            x: control2.x, 
            y: control2.y, 
            belongsTo: point2.index 
        },
        path: pathElement,
        guideElements: {}
    };
    
    pathElement.setAttribute('d', 
        `M ${startPoint.x} ${startPoint.y} C ${control1.x} ${control1.y} ${control2.x} ${control2.y} ${endPoint.x} ${endPoint.y}`
    );
    
    pathElement.classList.add('bezier-vector');
    if (!pathElement.getAttribute('stroke')) {
        pathElement.setAttribute('stroke', this.state.strokeColor);
    }
    if (!pathElement.getAttribute('stroke-width')) {
        pathElement.setAttribute('stroke-width', this.state.strokeWidth);
    }
    if (!pathElement.getAttribute('fill')) {
        pathElement.setAttribute('fill', 'none');
    }
    pathElement.setAttribute('stroke-linecap', 'round');
    
    this.svg.appendChild(pathElement);
    
    this.createVectorGuides(vector, point1, point2);
    
    if (vector.guideElements.line1) vector.guideElements.line1.style.display = 'none';
    if (vector.guideElements.control1) vector.guideElements.control1.style.display = 'none';
    if (vector.guideElements.line2) vector.guideElements.line2.style.display = 'none';
    if (vector.guideElements.control2) vector.guideElements.control2.style.display = 'none';
    
    this.state.bezierVectors.push(vector);
}

// Метод для преобразования координат в пути (d атрибут)
transformPathCoordinates(d, scaleX, scaleY, offsetX, offsetY) {
    const commands = d.match(/[MLCQZmlcqz][^MLCQZmlcqz]*/g) || [];
    
    let transformedPath = '';
    
    commands.forEach(commandStr => {
        const command = commandStr[0];
        const numbers = commandStr.substring(1).trim();
        
        if (!numbers) {
            transformedPath += command + ' ';
            return;
        }
        
        const numArray = numbers.split(/[\s,]+/).map(Number);
        let transformedNumbers = '';
        
        for (let i = 0; i < numArray.length; i += 2) {
            if (i + 1 < numArray.length) {
                const x = numArray[i] * scaleX + offsetX;
                const y = numArray[i + 1] * scaleY + offsetY;
                transformedNumbers += `${x} ${y} `;
            }
        }
        
        transformedPath += command + ' ' + transformedNumbers.trim() + ' ';
    });
    
    return transformedPath.trim();
}

// Создание подложки из полей ввода
createBackgroundFromInput() {
    const widthMm = parseInt(document.getElementById('mmWidth').value) || 210;
    const heightMm = parseInt(document.getElementById('mmHeight').value) || 297;
    const dpi = parseInt(document.getElementById('dpiInput').value) || 96;
    
    if (widthMm < 10 || heightMm < 10) {

    }

    }

        alert('DPI должен быть от 10 до 600');

    }
