
<!DOCTYPE html>

            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

            font-family: Arial, sans-serif;

            flex: 1;

            overflow: hidden;
            background: #1a1a1a;
        }
        
        #svg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;

            cursor: crosshair;

        }
        
        button {
            background: #4dabf7;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        
        button:hover {
            background: #339af0;
        }

            background: #444;
            margin: 5px;
            width: 40px;
            height: 40px;
			padding: 6px;
        }
        
        .tool-btn.active {
            background: #4dabf7;
        }

    content: attr(hotkey);
}
        
        .tools {
            display: flex;
            flex-wrap: wrap;
            gap: 0px;
            margin-bottom: 0px;
        }
        
        input[type="range"] {
            width: 100%;
            margin: 0;
        }
        
        input[type="color"] {
			width: 40px;
			height: 40px;
			margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            display: flex;
            gap: 10px;
        }
        
        .zoom-btn {
            width: 40px;
            height: 40px;
            background: #444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 20px;
        }
        
        .zoom-level {
            color: white;
            line-height: 40px;
            padding: 0 10px;
        }
        
        .coordinates {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
#eraser-indicator {
    pointer-events: none;
    stroke: #ff6b6b;
    stroke-width: 2;
    fill: rgba(255, 107, 107, 0.2);
    stroke-dasharray: 5,5;
}
#push-indicator {
    pointer-events: none;
    stroke: #ff6b6b;
    stroke-width: 1;
    fill: rgba(255, 107, 107, 0.1);
    stroke-dasharray: 3,3;
}
.push-mode {
    cursor: none !important;
}
@keyframes pulse-ring {
	0% { stroke-opacity: 0.7; }
	50% { stroke-opacity: 1; }
	100% { stroke-opacity: 0.7; }
}
/* Точка НЕ выделена */
.bezier-point {
    fill: #4dabf7;
    stroke: #1971c2;
    stroke-width: 2;
    r: 1%;
	opacity: 0.5;
    cursor: move;
}

.bezier-point.selected {
    fill: #ff6b6b;
    stroke: #e03131;
    stroke-width: 3;
	opacity: 0.5;
}

/* Векторы Безье */
.bezier-vector {
    fill: none;
    stroke-linecap: round;
}

/* Направляющие Безье */
.bezier-guide-line {
    stroke: #868e96;
    stroke-width: 1;
    stroke-dasharray: 3,3;
    opacity: 0.5;
}

.bezier-control-point {
    fill: #ffd43b;
    stroke: #f08c00;
    stroke-width: 1;
    r: 0.7%;
    cursor: pointer;
	opacity: 0.5;
	
}

.undo-controls {
    position: absolute;
    bottom: 90px; /* Располагаем выше зума */
    right: 20px;
    background: rgba(0,0,0,0.7);
    padding: 10px;
    border-radius: 5px;
    display: flex;
    gap: 10px;
    z-index: 1000;
}

.undo-btn, .redo-btn {
    width: 40px;
    height: 40px;
    background: #444;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.undo-btn:hover {
    background: #4dabf7;
}

.redo-btn:hover {
    background: #ff6b6b;
}

.undo-btn:disabled, .redo-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
}

    </style>
</head>

    <script>
        class VectorEditor {
constructor() {
    // Состояние редактора
    this.state = {
        currentTool: 'select',
        isDrawing: false,
        currentElement: null,
        startPoint: {x: 0, y: 0},
        image: null,
        imageUrl: null,
        zoom: 1,
        viewBox: {x: 0, y: 0, width: 1000, height: 1000},
        strokeColor: '#4dabf7',
        strokeWidth: 3,
        smoothing: 5,
        penPoints: [],
        pushRadius: 20,
        pushStrength: 0.5,
        pushSmooth: true,
        imageForDisplay: null,
        eraserSize: 20,
        isMoving: false,
        moveStart: {x: 0, y: 0},
        viewBoxStart: {x: 0, y: 0, width: 0, height: 0},
        bezierSelectedPoint: null,
        bezierPoints: [],
        bezierVectors: [],
        originalImageRatio: 1,
        photoScale: 1,
        originalPhotoWidth: 0,
        originalPhotoHeight: 0,
        isDraggingPhoto: false,
        draggingPhotoElement: null,
        photoDragStartX: 0,
        photoDragStartY: 0,
        photoStartX: 0,
        photoStartY: 0,
        worksheetImage: null,
        worksheetUrl: null,
        isDraggingPoint: false,
        draggingPointIndex: null,
        draggingPointStartX: 0,
        draggingPointStartY: 0,
        draggingPointOriginalX: 0,
        draggingPointOriginalY: 0,
        lastBezierDirection: null,
        lastBezierLength: null,
        isDraggingElement: false,
        draggingElement: null,
        draggingStartMouseX: 0,
        draggingStartMouseY: 0,
        draggingStartElementX: 0,
        draggingStartElementY: 0
    };
    
    this.snapSettings = {
        enabled: true,
        snapDistance: 10,
        whiteThreshold: 200,
        searchRadius: 15,
        continueVector: true
    };
    
    this.worksheetLayer = null;
    this.photoLayer = null;
    this.vectorLayer = null;
    this.helperLayer = null;
    this.lastTool = null;
    this.pushData = null;
    this.pathCache = new Map();
    this.lastEraseTime = null;
    this.lastErasePoint = null;
    this.imageCanvasCache = null;
    this.imageDataCache = null;
    
    this.history = {
        snapshots: [],
        index: -1,
        max: 10
    };
    
    this.lastSave = 0;
    
    this.setupHotkeys();
    this.init();
    this.setupSimpleUndoRedo();
}			
		// ВИЗУАЛЬНЫЙ ИНДИКАТОР ЛАСТИКА
		showEraserIndicator(x, y, radius) {
			let indicator = document.getElementById('eraser-indicator');
			
			if (!indicator) {
				indicator = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
				indicator.id = 'eraser-indicator';
				indicator.setAttribute('stroke', '#ff6b6b');
				indicator.setAttribute('stroke-width', '2');
				indicator.setAttribute('fill', 'rgba(255, 107, 107, 0.2)');
				indicator.setAttribute('stroke-dasharray', '5,5');
				indicator.style.pointerEvents = 'none';

				const pushIndicator = document.getElementById('push-indicator');
				if (pushIndicator) {
					this.svg.insertBefore(indicator, pushIndicator.nextSibling);
				} else {
					this.svg.appendChild(indicator);
				}
			}
			
			indicator.setAttribute('cx', x);
			indicator.setAttribute('cy', y);
			indicator.setAttribute('r', radius);
			indicator.style.display = 'block';
			indicator.style.animation = 'none';
			indicator.style.zIndex = '9999';
		}

		// СКРЫВАЕМ ИНДИКАТОР ЛАСТИКА
		hideEraserIndicator() {
			const indicator = document.getElementById('eraser-indicator');
			if (indicator) {
				indicator.style.display = 'none';
				indicator.setAttribute('cx', '-100');
				indicator.setAttribute('cy', '-100');
			}
		}
				 
		init() {
    // Инициализация SVG
    this.svg = document.getElementById('svg-canvas');
    this.svg.setAttribute('width', '100%');
    this.svg.setAttribute('height', '100%');
    this.svg.setAttribute('viewBox', '0 0 1000 1000');
    this.svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

    // 1. Слой подложки (рабочий лист)
    this.worksheetLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    this.worksheetLayer.id = 'worksheet-layer';
    this.svg.appendChild(this.worksheetLayer);
    
    // 2. Слой фото
    this.photoLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    this.photoLayer.id = 'photo-layer';
    this.photoLayer.style.pointerEvents = 'visible'; // ВАЖНО: слой реагирует на события
    this.svg.appendChild(this.photoLayer);
    
    // 3. Слой векторов (сюда будут добавляться все линии, пути и т.д.)
    this.vectorLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    this.vectorLayer.id = 'vector-layer';
    this.svg.appendChild(this.vectorLayer);
    
    // 4. Слой для вспомогательных элементов (точки Безье, направляющие)
    this.helperLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    this.helperLayer.id = 'helper-layer';
    this.svg.appendChild(this.helperLayer);
			document.getElementById('dpiInput').oninput = () => {
					this.updatePixelDisplay();
				if (this.state.image) {
					//this.updateLoadedImageSizeDisplay(this.state.image);
				}
			};
			document.getElementById('mmWidth').addEventListener('input', (e) => {
				this.updateSizeWithAspectRatio('width', e.target.value);
			});

			document.getElementById('mmHeight').addEventListener('input', (e) => {
				this.updateSizeWithAspectRatio('height', e.target.value);
			});
			document.getElementById('aspectRatioDisplay').addEventListener('click', (e) => {
				e.preventDefault();
				e.stopPropagation();
				
				// Берем текущие значения из полей ввода
				const currentWidth = parseFloat(document.getElementById('mmWidth').value) || 210;
				const currentHeight = parseFloat(document.getElementById('mmHeight').value) || 297;
				
				// Просто обновляем отображение соотношения сторон
				this.updateAspectRatioDisplay(currentWidth, currentHeight);
				
			});
			// Загрузка SVG
			document.getElementById('loadSvgBtn').onclick = () => {
				document.getElementById('svgInput').click();
			};

			document.getElementById('svgInput').onchange = (e) => {
				if (e.target.files[0]) this.loadSVG(e.target.files[0]);
			};
			// Обработчики событий
			this.setupEventListeners();
			
			// ОБНОВЛЯЕМ ВСЕ ТЕКСТОВЫЕ ЭЛЕМЕНТЫ ОТ СЛАЙДЕРОВ ПРИ ЗАГРУЗКЕ
			this.updateAllSliderTexts();
			
			// Загружаем настройки из UI
			this.loadSettingsFromUI();
			this.setupGlobalDragHandlers();
			
			// Обновление интерфейса
			this.updateZoomDisplay();
				// Создаем группу для контрольных элементов
				this.state.bezierControlGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
				this.state.bezierControlGroup.id = 'bezier-control-group';
				this.svg.appendChild(this.state.bezierControlGroup);
			// Автоматически создаем подложку A4 при запуске
			this.createA4Background();
			
			// Обновляем отображение пикселей при изменении размеров
			document.getElementById('mmWidth').oninput = () => this.updatePixelDisplay();
			document.getElementById('mmHeight').oninput = () => this.updatePixelDisplay();
			
			// Создание подложки по нажатию кнопки
			document.getElementById('createBackgroundBtn').onclick = () => this.createBackgroundFromInput();
			this.setupToolToggle();

			
		}

setupSimpleUndoRedo() {
    // Назначаем кнопки
    document.getElementById('undoBtn').onclick = () => this.simpleUndo();
    document.getElementById('redoBtn').onclick = () => this.simpleRedo();
    
    // Сохраняем начальное состояние (пустое)
    setTimeout(() => this.saveSnapshot(), 100);
    
    // Сохраняем при ЛЮБОМ mouseup (отпускании мыши)
    this.svg.addEventListener('mouseup', (e) => {
        // Задержка для завершения операции
        setTimeout(() => this.saveSnapshot(), 50);
    });
    
    // Сохраняем при загрузке SVG
    document.getElementById('svgInput').addEventListener('change', () => {
        setTimeout(() => this.saveSnapshot(), 300);
    });
    
    // Сохраняем при очистке
    document.getElementById('clearBtn').addEventListener('click', () => {
        setTimeout(() => this.saveSnapshot(), 300);
    });
    
    // Сохраняем при изменении изображения
    document.getElementById('imageInput').addEventListener('change', () => {
        setTimeout(() => this.saveSnapshot(), 500);
    });
}

// 1. Метод сохранения снимка
saveSnapshot() {
    // Дебаунсинг
    const now = Date.now();
    if (this.lastSave && (now - this.lastSave < 100)) {
        return;
    }
    
    try {
        // Создаем копию SVG без временных элементов
        const svgClone = this.svg.cloneNode(true);
        
        // Удаляем временные элементы
        const tempIds = ['push-indicator', 'eraser-indicator'];
        tempIds.forEach(id => {
            const el = svgClone.querySelector(`#${id}`);
            if (el) el.remove();
        });
        
        // Берем HTML
        const snapshot = svgClone.innerHTML;
        
        // Проверяем, отличается ли от последнего снимка
        const lastSnapshot = this.history.snapshots[this.history.index];
        if (lastSnapshot === snapshot) {
            console.log('Снимок не изменился, пропускаем');
            return;
        }
        
        // Удаляем всё после текущего индекса
        this.history.snapshots = this.history.snapshots.slice(0, this.history.index + 1);
        
        // Добавляем новый снимок
        this.history.snapshots.push(snapshot);
        this.history.index++;
        
        // Ограничиваем историю
        if (this.history.snapshots.length > this.history.max) {
            this.history.snapshots.shift();
            this.history.index--;
        }
        
        // Обновляем кнопки
        this.updateUndoRedoButtons();
        
        this.lastSave = now;
        console.log('✅ Сохранён снимок #' + this.history.index, 
                   'можно отменить:', this.history.index > 0,
                   'можно вернуть:', this.history.index < this.history.snapshots.length - 1);
    } catch (error) {
        console.error('Ошибка при сохранении снимка:', error);
    }
}


// 2. Метод отмены
simpleUndo() {
    if (this.history.index > 0) {
        this.history.index--;
        this.restoreSnapshot();
        console.log('Отмена к снимку #' + this.history.index);
    }
}

// 3. Метод возврата
simpleRedo() {
    if (this.history.index < this.history.snapshots.length - 1) {
        this.history.index++;
        this.restoreSnapshot();
        console.log('Возврат к снимку #' + this.history.index);
    }
}

// 4. Восстановление снимка
restoreSnapshot() {
    const snapshot = this.history.snapshots[this.history.index];
    if (!snapshot) {
        console.error('Снимок не найден по индексу:', this.history.index);
        return;
    }
    
    console.log('Восстанавливаем снимок #' + this.history.index);
    
    try {
        const currentImage = document.getElementById('background-image');
        const imageHTML = currentImage ? currentImage.outerHTML : '';
        this.svg.innerHTML = snapshot;
        if (imageHTML && !this.svg.querySelector('#background-image')) {
            this.svg.insertAdjacentHTML('afterbegin', imageHTML);
        }
        this.updateUndoRedoButtons();  
        console.log('✅ Снимок восстановлен');
    } catch (error) {
        console.error('Ошибка при восстановлении снимка:', error);
    }
}

// 5. Обновление кнопок
updateUndoRedoButtons() {

    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    
    const canUndo = this.history.index > 0;
    const canRedo = this.history.index < this.history.snapshots.length - 1;
    
    console.log('Обновление кнопок:', {
        index: this.history.index,
        total: this.history.snapshots.length,
        canUndo,
        canRedo
    });
    
    undoBtn.disabled = !canUndo;
    redoBtn.disabled = !canRedo;

    undoBtn.style.opacity = canUndo ? '1' : '0.3';
    redoBtn.style.opacity = canRedo ? '1' : '0.3';

    undoBtn.title = canUndo ? 'Отменить (Ctrl+Z)' : 'Нечего отменять';
    redoBtn.title = canRedo ? 'Вернуть (Ctrl+Shift+Z)' : 'Нечего возвращать';
}

setupHotkeys() {
    document.addEventListener('keydown', (e) => {
        // Игнорируем если фокус в поле ввода
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        
        // Ctrl/Cmd + S - сохранить
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            this.saveSVG();
            return;
        }
        
        // Ctrl/Cmd + O - загрузить SVG
        if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
            e.preventDefault();
            document.getElementById('svgInput').click();
            return;
        }
        
        // Esc - сброс инструмента
        if (e.key === 'Escape') {
            this.setTool('select');
            return;
        }
		
		if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
			e.preventDefault();
			if (e.shiftKey) {
				this.simpleRedo();
			} else {
				this.simpleUndo();
			}
			return;
		}
        
        // Горячие клавиши для инструментов
        switch(e.key.toLowerCase()) {
            case 'v': // Выделение
                this.setTool('select');
                break;
            case 'b': // Кривые Безье
                this.setTool('bezier-points');
                break;
            case 'p': // Карандаш
                this.setTool('pen');
                break;
            case 'l': // Линия
                this.setTool('line');
                break;
            case 'r': // Прямоугольник
                this.setTool('rect');
                break;
            case 'c': // Круг
                this.setTool('circle');
                break;
            case 'e': // Ластик
                this.setTool('eraser');
                break;
            case 'u': // Push инструмент
                this.setTool('push');
                break;
            case 'z': // Zoom
                if (e.ctrlKey || e.metaKey) {
                    if (e.shiftKey) {
                        this.zoomIn();
                    } else {
                        this.zoomOut();
                    }
                }
                break;
            case '=': // Zoom in
            case '+':
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    this.zoomIn();
                }
                break;
            case '-': // Zoom out
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    this.zoomOut();
                }
                break;
            case '0': // Сброс zoom
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    this.setZoom(1);
                }
                break;
            case 'delete': // Удалить выделенное
            case 'backspace':
                if (this.state.currentTool === 'bezier-points' && 
                    this.state.bezierSelectedPoint !== null) {
                    this.deleteBezierPoint(this.state.bezierSelectedPoint);
                }
                break;
        }
    });
}

updateAspectRatioDisplay(width, height) {

updateSizeWithAspectRatio(changedField, value) {
    if (!this.state.image || !this.state.originalImageRatio) {
        this.updatePixelDisplay();
        return;
    }
    
    const keepRatio = document.getElementById('keepAspectRatio').checked;
    const widthInput = document.getElementById('mmWidth');
    const heightInput = document.getElementById('mmHeight');
    
    if (!keepRatio) {
        this.updatePixelDisplay();
        return;
    }
    
    try {
        const newValue = parseFloat(value);
        if (isNaN(newValue) || newValue <= 0) return;
        
        if (changedField === 'width') {
            const newHeight = Math.round(newValue / this.state.originalImageRatio);
            heightInput.value = newHeight;
        } else {
            const newWidth = Math.round(newValue * this.state.originalImageRatio);
            widthInput.value = newWidth;
        }

        this.updatePixelDisplay();

        this.updateBackgroundSize();
        
    } catch (error) {
        console.error('Ошибка при обновлении размеров:', error);
    }
}

scalePhoto(scale) {
    const photoElement = document.getElementById('photo-overlay');
    if (!photoElement || !this.state.image) return;
    this.state.photoScale = scale;

    const originalWidth = this.state.originalPhotoWidth || this.state.image.width;
    const originalHeight = this.state.originalPhotoHeight || this.state.image.height;
    const newWidth = originalWidth * scale;
    const newHeight = originalHeight * scale;
    const currentX = parseFloat(photoElement.getAttribute('x')) || 0;
    const currentY = parseFloat(photoElement.getAttribute('y')) || 0;
    const currentWidth = parseFloat(photoElement.getAttribute('width')) || newWidth;
    const currentHeight = parseFloat(photoElement.getAttribute('height')) || newHeight;
    const centerX = currentX + currentWidth / 2;
    const centerY = currentY + currentHeight / 2;
    const newX = centerX - newWidth / 2;
    const newY = centerY - newHeight / 2;
    photoElement.setAttribute('width', newWidth);
    photoElement.setAttribute('height', newHeight);
    photoElement.setAttribute('x', newX);
    photoElement.setAttribute('y', newY);
    
    this.updatePhotoScaleDisplay();
    
    console.log('Фото масштабировано:', scale * 100 + '%', 'Размер:', newWidth, 'x', newHeight);
}

scalePhotoByWidthPercent(percent) {
    const photoElement = document.getElementById('photo-overlay');
    if (!photoElement || !this.state.image) return;

    const worksheetElement = document.getElementById('worksheet-background');
    const worksheetWidth = worksheetElement ? 
        parseFloat(worksheetElement.getAttribute('width')) : 1000;

    const targetWidth = worksheetWidth * (percent / 100);

    const originalWidth = this.state.originalPhotoWidth || this.state.image.width;
    const originalHeight = this.state.originalPhotoHeight || this.state.image.height;
    
    const scale = targetWidth / originalWidth;
    this.state.photoScale = scale;

    const newWidth = originalWidth * scale;
    const newHeight = originalHeight * scale;

    const currentX = parseFloat(photoElement.getAttribute('x')) || 0;
    const currentY = parseFloat(photoElement.getAttribute('y')) || 0;
    const currentWidth = parseFloat(photoElement.getAttribute('width')) || newWidth;
    const currentHeight = parseFloat(photoElement.getAttribute('height')) || newHeight;
    
    const centerX = currentX + currentWidth / 2;
    const centerY = currentY + currentHeight / 2;

    const newX = centerX - newWidth / 2;
    const newY = centerY - newHeight / 2;

    photoElement.setAttribute('width', newWidth);
    photoElement.setAttribute('height', newHeight);
    photoElement.setAttribute('x', newX);
    photoElement.setAttribute('y', newY);

    this.updatePhotoSizeDisplay();
}

fitPhotoToCanvas() {
    const photoElement = document.getElementById('photo-overlay');
    if (!photoElement || !this.state.image) return;

    const worksheetElement = document.getElementById('worksheet-background');
    const worksheetWidth = worksheetElement ? 
        parseFloat(worksheetElement.getAttribute('width')) : 1000;
    
    const img = this.state.image;

    const scale = worksheetWidth / img.width;
    this.state.photoScale = scale;
    
    const newWidth = img.width * scale;
    const newHeight = img.height * scale;

    const viewBoxSize = 1000;
    const newX = (viewBoxSize - newWidth) / 2;
    const newY = (viewBoxSize - newHeight) / 2;
    
    photoElement.setAttribute('width', newWidth);
    photoElement.setAttribute('height', newHeight);
    photoElement.setAttribute('x', newX);
    photoElement.setAttribute('y', newY);

    const percent = Math.round((newWidth / worksheetWidth) * 100);
    this.updatePhotoSizeDisplay(percent);
}

updatePhotoSizeDisplay(percent = null) {
    if (percent === null) {

        const photoElement = document.getElementById('photo-overlay');
        const worksheetElement = document.getElementById('worksheet-background');
        
        if (photoElement && worksheetElement) {
            const photoWidth = parseFloat(photoElement.getAttribute('width')) || 0;
            const worksheetWidth = parseFloat(worksheetElement.getAttribute('width')) || 1000;
            percent = Math.round((photoWidth / worksheetWidth) * 100);
        } else {
            percent = 90;
        }
    }
    
    const slider = document.getElementById('photoSizeSlider');
    const input = document.getElementById('photoSizePercent');
    
    if (slider) slider.value = percent;
    if (input) input.value = percent;
}

updatePhotoScaleDisplay() {
    const percent = Math.round(this.state.photoScale * 100);
    
    const slider = document.getElementById('photoScaleSlider');
    const input = document.getElementById('photoScalePercent');
    
    if (slider) slider.value = percent;
    if (input) input.value = percent;
}
setupCursorRestore() {
    // При движении мыши по всему документу

        // Если мы вне SVG и в режиме push
        if (this.state.currentTool === 'push' && !e.target.closest('#svg-canvas')) {
            // Возвращаем нормальный курсор
            document.body.style.cursor = 'default';
            this.hidePushIndicator();
        }

    // При входе в SVG в режиме push
    this.svg.addEventListener('mouseenter', () => {
        if (this.state.currentTool === 'push') {
            this.updateCursor();
        }
    });
    
    // При выходе из SVG
    this.svg.addEventListener('mouseleave', () => {
        if (this.state.currentTool === 'push') {
            // Возвращаем нормальный курсор
            document.body.style.cursor = 'default';
            this.hidePushIndicator();
        }
    });
    
    // При клике вне SVG в режиме push
    document.addEventListener('mousedown', (e) => {
        if (this.state.currentTool === 'push' && !e.target.closest('#svg-canvas')) {
            // Возвращаем нормальный курсор

            this.hidePushIndicator();
        }
    });

                this.state.zoom = Math.max(0.1, Math.min(10, zoomLevel));
                
                const centerX = this.state.viewBox.x + this.state.viewBox.width / 2;
                const centerY = this.state.viewBox.y + this.state.viewBox.height / 2;
                
                const newWidth = 1000 / this.state.zoom;
                const newHeight = 1000 / this.state.zoom;
                
                this.state.viewBox = {
                    x: centerX - newWidth / 2,
                    y: centerY - newHeight / 2,
                    width: newWidth,
                    height: newHeight
                };
                
                this.svg.setAttribute('viewBox', 
                    `${this.state.viewBox.x} ${this.state.viewBox.y} ${this.state.viewBox.width} ${this.state.viewBox.height}`
                );
                
                this.updateZoomDisplay();
            }
            
            zoomToPoint(x, y, factor) {
                const newWidth = this.state.viewBox.width * factor;
                const newHeight = this.state.viewBox.height * factor;
                
                const mouseXPercent = (x - this.state.viewBox.x) / this.state.viewBox.width;
                const mouseYPercent = (y - this.state.viewBox.y) / this.state.viewBox.height;
                
                this.state.viewBox = {
                    x: x - (mouseXPercent * newWidth),
                    y: y - (mouseYPercent * newHeight),
                    width: newWidth,
                    height: newHeight
                };
                
                this.svg.setAttribute('viewBox', 
                    `${this.state.viewBox.x} ${this.state.viewBox.y} ${this.state.viewBox.width} ${this.state.viewBox.height}`
                );
                
                this.state.zoom = 1000 / newWidth;
                this.updateZoomDisplay();
            }
            
            updateZoomDisplay() {
                document.getElementById('zoomLevel').textContent = 
                    Math.round(this.state.zoom * 100) + '%';
            }

startPanning(e) {
    this.state.isMoving = true;
    this.state.moveStart = {
        x: e.clientX,
        y: e.clientY,
        viewBoxX: this.state.viewBox.x,
        viewBoxY: this.state.viewBox.y
    };
    this.svg.style.cursor = 'grabbing';
}
    
doPanning(e) {
    if (!this.state.isMoving) return;

    const dx = e.clientX - this.state.moveStart.x;
    const dy = e.clientY - this.state.moveStart.y;

    const scaleX = this.state.viewBox.width / this.svg.clientWidth;
    const scaleY = this.state.viewBox.height / this.svg.clientHeight;
    
    this.state.viewBox.x = this.state.moveStart.viewBoxX - dx * scaleX;
    this.state.viewBox.y = this.state.moveStart.viewBoxY - dy * scaleY;
    
    this.svg.setAttribute('viewBox', 
        `${this.state.viewBox.x} ${this.state.viewBox.y} ${this.state.viewBox.width} ${this.state.viewBox.height}`
    );
}

startElementDrag(e, element) {
    const coords = this.getSVGCoordinates(e);
    
    this.state.isDraggingElement = true;
    this.state.draggingElement = element;
    this.state.draggingStartMouseX = coords.x;
    this.state.draggingStartMouseY = coords.y;
    
    const tag = element.tagName.toLowerCase();
    
    if (tag === 'image') {
        const x = parseFloat(element.getAttribute('x'));
        const y = parseFloat(element.getAttribute('y'));
        
        // Если x или y не заданы (NaN), устанавливаем 0
        this.state.draggingStartElementX = isNaN(x) ? 0 : x;
        this.state.draggingStartElementY = isNaN(y) ? 0 : y;
        
        console.log('Фото: начальная позиция', this.state.draggingStartElementX, this.state.draggingStartElementY);
    } else if (tag === 'line') {
        this.state.draggingStartElementX = parseFloat(element.getAttribute('x1')) || 0;
        this.state.draggingStartElementY = parseFloat(element.getAttribute('y1')) || 0;
    } else {
        this.state.draggingStartElementX = parseFloat(element.getAttribute('x')) || 
                                           parseFloat(element.getAttribute('cx')) || 0;
        this.state.draggingStartElementY = parseFloat(element.getAttribute('y')) || 
                                           parseFloat(element.getAttribute('cy')) || 0;
    }
    
    this.svg.style.cursor = 'grabbing';
}

doElementDrag(e) {
    if (!this.state.isDraggingElement || !this.state.draggingElement) return;
    
    const coords = this.getSVGCoordinates(e);
    const dx = coords.x - this.state.draggingStartMouseX;
    const dy = coords.y - this.state.draggingStartMouseY;
    
    const element = this.state.draggingElement;
    const tag = element.tagName.toLowerCase();
    
    if (tag === 'image') {

        const newX = this.state.draggingStartElementX + dx;
        const newY = this.state.draggingStartElementY + dy;

        element.setAttribute('x', newX);
        element.setAttribute('y', newY);
        
        console.log('Фото перемещено в:', newX, newY);

    } else {
        const newX = this.state.draggingStartElementX + dx;
        const newY = this.state.draggingStartElementY + dy;
        
        switch(tag) {
            case 'line':
                const x1 = parseFloat(element.getAttribute('x1')) || 0;
                const y1 = parseFloat(element.getAttribute('y1')) || 0;
                const x2 = parseFloat(element.getAttribute('x2')) || 0;
                const y2 = parseFloat(element.getAttribute('y2')) || 0;
                
                element.setAttribute('x1', x1 + dx);
                element.setAttribute('y1', y1 + dy);
                element.setAttribute('x2', x2 + dx);
                element.setAttribute('y2', y2 + dy);
                
                this.state.draggingStartElementX = parseFloat(element.getAttribute('x1')) || 0;
                this.state.draggingStartElementY = parseFloat(element.getAttribute('y1')) || 0;
                break;
                
            case 'rect':
                element.setAttribute('x', newX);
                element.setAttribute('y', newY);
                this.state.draggingStartElementX = newX;
                this.state.draggingStartElementY = newY;
                break;
                
            case 'circle':
            case 'ellipse':
                element.setAttribute('cx', newX);
                element.setAttribute('cy', newY);
                this.state.draggingStartElementX = newX;
                this.state.draggingStartElementY = newY;
                break;
                
            case 'path':
                const d = element.getAttribute('d');
                if (d) {
                    const newD = this.translatePath(d, dx, dy);
                    element.setAttribute('d', newD);
                }
                break;
        }
    }
    
    this.state.draggingStartMouseX = coords.x;
    this.state.draggingStartMouseY = coords.y;
}

stopPhotoDrag() {

    console.log('Остановка перетаскивания фото');
    
    if (this.state.draggingPhotoElement) {

}

stopElementDrag() {

    console.log('Остановка перетаскивания элемента');
    
    this.state.isDraggingElement = false;
    this.state.draggingElement = null;
    
    if (this.state.currentTool === 'select') {

    } else {
        this.svg.style.cursor = 'crosshair';
    }
}

// Вспомогательный метод для сдвига пути
translatePath(d, dx, dy) {
    const commands = d.match(/[a-df-zA-DF-Z][^a-df-zA-DF-Z]*/g) || [];
    let newPath = '';
    
    commands.forEach(cmd => {
        const command = cmd[0];
        const numbers = cmd.substring(1).trim().split(/[\s,]+/).map(Number);
        let newCmd = command;
        
        if (command === 'Z' || command === 'z') {
            newPath += command + ' ';
            return;
        }
        
        for (let i = 0; i < numbers.length; i += 2) {
            if (i + 1 < numbers.length) {
                const x = numbers[i] + dx;
                const y = numbers[i + 1] + dy;
                newCmd += ` ${x} ${y}`;
            }
        }
        newPath += newCmd + ' ';
    });
    
    return newPath.trim();
}


stopPanning() {
    this.state.isMoving = false;
    if (this.state.currentTool === 'select') {
        this.svg.style.cursor = 'move';
    } else {
        this.svg.style.cursor = 'crosshair';
    }
}
            // ИЗОБРАЖЕНИЕ
addWhiteBackgroundToPNG(img) {
    return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        const imgWithBackground = new Image();
        imgWithBackground.onload = () => {
            resolve(imgWithBackground);
        };
        imgWithBackground.src = canvas.toDataURL();
    });
}

loadSVG(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        // Парсим SVG файл
        const parser = new DOMParser();
        const svgDoc = parser.parseFromString(e.target.result, 'image/svg+xml');
        const loadedSvg = svgDoc.querySelector('svg');
        
        if (!loadedSvg) {
            alert('Файл не является валидным SVG');
            return;
        }

        // Получаем размеры загруженного SVG
        const loadedWidth = parseFloat(loadedSvg.getAttribute('width')) || 
                           parseFloat(loadedSvg.getAttribute('viewBox')?.split(' ')[2]) || 
                           1000;
        const loadedHeight = parseFloat(loadedSvg.getAttribute('height')) || 
                            parseFloat(loadedSvg.getAttribute('viewBox')?.split(' ')[3]) || 
                            1000;

        // Если нет изображения - просто добавляем векторы
        if (!this.state.image) {
            this.loadVectorsToCurrentCanvas(loadedSvg, 1, 1, 0, 0);
            alert('SVG успешно загружен (без изображения)');
            return;
        }

        // Получаем размеры и позицию текущего изображения
        const imageElement = document.getElementById('background-image');
        if (!imageElement) {
            this.loadVectorsToCurrentCanvas(loadedSvg, 1, 1, 0, 0);
            alert('SVG успешно загружен');
            return;
        }

        const currentImageX = parseFloat(imageElement.getAttribute('x')) || 0;
        const currentImageY = parseFloat(imageElement.getAttribute('y')) || 0;
        const currentImageWidth = parseFloat(imageElement.getAttribute('width')) || loadedWidth;
        const currentImageHeight = parseFloat(imageElement.getAttribute('height')) || loadedHeight;

        // Рассчитываем масштаб для преобразования координат
        const scaleX = currentImageWidth / loadedWidth;
        const scaleY = currentImageHeight / loadedHeight;

        // Рассчитываем смещение
        const offsetX = currentImageX;
        const offsetY = currentImageY;

        // Загружаем векторы с преобразованием координат
        this.loadVectorsToCurrentCanvas(loadedSvg, scaleX, scaleY, offsetX, offsetY);
        
    };
    reader.readAsText(file);
}

// Новый метод для загрузки векторов с преобразованием координат
loadVectorsToCurrentCanvas(sourceSvg, scaleX, scaleY, offsetX, offsetY) {

    const vectors = sourceSvg.querySelectorAll('path, line, rect, circle, ellipse');
    
    vectors.forEach(vector => {
        const clonedVector = vector.cloneNode(true);
        const tag = clonedVector.tagName.toLowerCase();

        if (tag === 'path') {
            const d = clonedVector.getAttribute('d') || '';
            if (d.includes(' C ') || d.includes(' c ') || d.startsWith('C') || d.startsWith('c')) {
                this.processBezierFromSVG(clonedVector, scaleX, scaleY, offsetX, offsetY);
                return;
            }
        }
        
        switch(tag) {
            case 'path':
                const d = clonedVector.getAttribute('d');
                if (d) {
                    const transformedD = this.transformPathCoordinates(d, scaleX, scaleY, offsetX, offsetY);
                    clonedVector.setAttribute('d', transformedD);
                }
                break;
                
            case 'line':
                const x1 = parseFloat(clonedVector.getAttribute('x1'));
                const y1 = parseFloat(clonedVector.getAttribute('y1'));
                const x2 = parseFloat(clonedVector.getAttribute('x2'));
                const y2 = parseFloat(clonedVector.getAttribute('y2'));
                
                if (!isNaN(x1) && !isNaN(y1)) {
                    clonedVector.setAttribute('x1', x1 * scaleX + offsetX);
                    clonedVector.setAttribute('y1', y1 * scaleY + offsetY);
                }
                if (!isNaN(x2) && !isNaN(y2)) {
                    clonedVector.setAttribute('x2', x2 * scaleX + offsetX);
                    clonedVector.setAttribute('y2', y2 * scaleY + offsetY);
                }
                break;
                
            case 'rect':
                const rectX = parseFloat(clonedVector.getAttribute('x'));
                const rectY = parseFloat(clonedVector.getAttribute('y'));
                const rectWidth = parseFloat(clonedVector.getAttribute('width'));
                const rectHeight = parseFloat(clonedVector.getAttribute('height'));
                
                if (!isNaN(rectX)) clonedVector.setAttribute('x', rectX * scaleX + offsetX);
                if (!isNaN(rectY)) clonedVector.setAttribute('y', rectY * scaleY + offsetY);
                if (!isNaN(rectWidth)) clonedVector.setAttribute('width', rectWidth * scaleX);
                if (!isNaN(rectHeight)) clonedVector.setAttribute('height', rectHeight * scaleY);
                break;
                
            case 'circle':
                const cx = parseFloat(clonedVector.getAttribute('cx'));
                const cy = parseFloat(clonedVector.getAttribute('cy'));
                const radius = parseFloat(clonedVector.getAttribute('r'));
                
                if (!isNaN(cx)) clonedVector.setAttribute('cx', cx * scaleX + offsetX);
                if (!isNaN(cy)) clonedVector.setAttribute('cy', cy * scaleY + offsetY);
                if (!isNaN(radius)) clonedVector.setAttribute('r', radius * scaleX);
                break;
                
            case 'ellipse':
                const ellipseCx = parseFloat(clonedVector.getAttribute('cx'));
                const ellipseCy = parseFloat(clonedVector.getAttribute('cy'));
                const ellipseRx = parseFloat(clonedVector.getAttribute('rx'));
                const ellipseRy = parseFloat(clonedVector.getAttribute('ry'));
                
                if (!isNaN(ellipseCx)) clonedVector.setAttribute('cx', ellipseCx * scaleX + offsetX);
                if (!isNaN(ellipseCy)) clonedVector.setAttribute('cy', ellipseCy * scaleY + offsetY);
                if (!isNaN(ellipseRx)) clonedVector.setAttribute('rx', ellipseRx * scaleX);
                if (!isNaN(ellipseRy)) clonedVector.setAttribute('ry', ellipseRy * scaleY);
                break;
        }
        
        if (!clonedVector.getAttribute('stroke')) {
            clonedVector.setAttribute('stroke', '#4dabf7');
        }
        if (!clonedVector.getAttribute('stroke-width')) {
            clonedVector.setAttribute('stroke-width', '2');
        }
        if (!clonedVector.getAttribute('fill')) {
            clonedVector.setAttribute('fill', 'none');
        }
        this.svg.appendChild(clonedVector);
    });
}

parseBezierFromSVG(pathElement, scaleX = 1, scaleY = 1, offsetX = 0, offsetY = 0) {
    const d = pathElement.getAttribute('d');
    if (!d) return null;
    const commands = d.split(/(?=[MCL])/);
    
    if (commands.length < 2) return null;

    const firstCmd = commands[0].trim();
    const secondCmd = commands[1].trim();
    
    if (!firstCmd.startsWith('M') || !secondCmd.startsWith('C')) {
        return null; 
    }

    const moveCoords = firstCmd.substring(1).trim().split(/[\s,]+/).map(Number);
    if (moveCoords.length < 2) return null;

    const curveCoords = secondCmd.substring(1).trim().split(/[\s,]+/).map(Number);
    if (curveCoords.length < 6) return null;
    
    const applyTransform = (x, y) => ({
        x: x * scaleX + offsetX,
        y: y * scaleY + offsetY
    });
    
    return {
        startPoint: applyTransform(moveCoords[0], moveCoords[1]),
        control1: applyTransform(curveCoords[0], curveCoords[1]),
        control2: applyTransform(curveCoords[2], curveCoords[3]),
        endPoint: applyTransform(curveCoords[4], curveCoords[5]),
        originalElement: pathElement
    };
}

processBezierFromSVG(pathElement, scaleX, scaleY, offsetX, offsetY) {

    const bezierData = this.parseBezierFromSVG(pathElement, scaleX, scaleY, offsetX, offsetY);
    if (!bezierData) {
        this.svg.appendChild(pathElement);
        return;
    }
    
    const { startPoint, control1, control2, endPoint } = bezierData;
    
    const point1 = {
        x: startPoint.x,
        y: startPoint.y,
        element: null,
        index: this.state.bezierPoints.length
    };
    
    const point2 = {
        x: endPoint.x,
        y: endPoint.y,
        element: null,
        index: this.state.bezierPoints.length + 1
    };
    point1.element = this.createBezierPointElement(point1);
    point2.element = this.createBezierPointElement(point2);
    point1.element.style.display = 'none';
    point2.element.style.display = 'none';
    
    this.svg.appendChild(point1.element);
    this.svg.appendChild(point2.element);
    
    this.state.bezierPoints.push(point1, point2);
    
    const vector = {
        from: point1.index,
        to: point2.index,
        control1: { 
            x: control1.x, 
            y: control1.y, 
            belongsTo: point1.index 
        },
        control2: { 
            x: control2.x, 
            y: control2.y, 
            belongsTo: point2.index 
        },
        path: pathElement,
        guideElements: {}
    };
    
    pathElement.setAttribute('d', 
        `M ${startPoint.x} ${startPoint.y} C ${control1.x} ${control1.y} ${control2.x} ${control2.y} ${endPoint.x} ${endPoint.y}`
    );
    
    pathElement.classList.add('bezier-vector');
    if (!pathElement.getAttribute('stroke')) {
        pathElement.setAttribute('stroke', this.state.strokeColor);
    }
    if (!pathElement.getAttribute('stroke-width')) {
        pathElement.setAttribute('stroke-width', this.state.strokeWidth);
    }
    if (!pathElement.getAttribute('fill')) {
        pathElement.setAttribute('fill', 'none');
    }
    pathElement.setAttribute('stroke-linecap', 'round');
    
    this.svg.appendChild(pathElement);
    
    this.createVectorGuides(vector, point1, point2);
    
    if (vector.guideElements.line1) vector.guideElements.line1.style.display = 'none';
    if (vector.guideElements.control1) vector.guideElements.control1.style.display = 'none';
    if (vector.guideElements.line2) vector.guideElements.line2.style.display = 'none';
    if (vector.guideElements.control2) vector.guideElements.control2.style.display = 'none';
    
    this.state.bezierVectors.push(vector);
}

// Метод для преобразования координат в пути (d атрибут)
transformPathCoordinates(d, scaleX, scaleY, offsetX, offsetY) {
    const commands = d.match(/[MLCQZmlcqz][^MLCQZmlcqz]*/g) || [];
    
    let transformedPath = '';
    
    commands.forEach(commandStr => {
        const command = commandStr[0];
        const numbers = commandStr.substring(1).trim();
        
        if (!numbers) {
            transformedPath += command + ' ';
            return;
        }
        
        const numArray = numbers.split(/[\s,]+/).map(Number);
        let transformedNumbers = '';
        
        for (let i = 0; i < numArray.length; i += 2) {
            if (i + 1 < numArray.length) {
                const x = numArray[i] * scaleX + offsetX;
                const y = numArray[i + 1] * scaleY + offsetY;
                transformedNumbers += `${x} ${y} `;
            }
        }
        
        transformedPath += command + ' ' + transformedNumbers.trim() + ' ';
    });
    
    return transformedPath.trim();
}

// Метод для создания подложки A4
createA4Background() {
    const widthMm = 210;  
    const heightMm = 297; 
	this.state.originalImageRatio = widthMm / heightMm;
    
    const widthPx = Math.round(widthMm * 96 / 25.4);
    const heightPx = Math.round(heightMm * 96 / 25.4);

    document.getElementById('mmHeight').value = heightMm;

    this.createBackground(widthPx, heightPx);
}

// Обновление отображения пикселей
updatePixelDisplay() {
    const widthMm = parseInt(document.getElementById('mmWidth').value) || 210;
    const heightMm = parseInt(document.getElementById('mmHeight').value) || 297;
    const dpi = parseInt(document.getElementById('dpiInput').value) || 96;
    
    const widthPx = Math.round(widthMm * dpi / 25.4);
    const heightPx = Math.round(heightMm * dpi / 25.4);
    
    document.getElementById('pixelSizeDisplay').textContent = `${widthPx}×${heightPx} (${dpi} DPI)`;
}

// Создание подложки из полей ввода
createBackgroundFromInput() {
    const widthMm = parseInt(document.getElementById('mmWidth').value) || 210;
    const heightMm = parseInt(document.getElementById('mmHeight').value) || 297;
    const dpi = parseInt(document.getElementById('dpiInput').value) || 96;
    
    if (widthMm < 10 || heightMm < 10) {
        alert('Минимальный размер 10×10 мм');
        return;
    }
    
    if (widthMm > 1000 || heightMm > 1000) {
        alert('Максимальный размер 1000×1000 мм');
        return;
    }
    
    if (dpi < 10 || dpi > 600) {
        alert('DPI должен быть от 10 до 600');
        return;
    }

    // Преобразуем мм в пиксели с учетом DPI
    const widthPx = Math.round(widthMm * dpi / 25.4);
    const heightPx = Math.round(heightMm * dpi / 25.4);
    
    this.createBackground(widthPx, heightPx);
}

createBackground(width, height) {
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, width, height);
    
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, width - 1, height - 1);
    
    const img = new Image();
    img.onload = () => {
        const oldWorksheet = document.getElementById('worksheet-background');
        if (oldWorksheet) oldWorksheet.remove();
        
        this.state.worksheetImage = img;
        this.state.worksheetUrl = canvas.toDataURL('image/png');
        
        this.displayWorksheet(img);
        
        if (!this.state.image) {
            this.updateImageCache(img);
        }
        
        console.log(`Создана белая подложка ${width}x${height}px`);
    };
    img.src = canvas.toDataURL('image/png');
}

displayWorksheet(img) {
    while (this.worksheetLayer.firstChild) {
        this.worksheetLayer.removeChild(this.worksheetLayer.firstChild);
    }
    
    const worksheetElement = document.createElementNS('http://www.w3.org/2000/svg', 'image');
    worksheetElement.id = 'worksheet-background';
    worksheetElement.setAttribute('href', img.src || this.state.worksheetUrl);
    worksheetElement.style.opacity = '1.0';
    worksheetElement.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    worksheetElement.style.pointerEvents = 'none'; 
    
    this.worksheetLayer.appendChild(worksheetElement);

    this.centerWorksheet();
}

centerWorksheet() {
    if (!this.state.worksheetImage) return;
    
    const img = this.state.worksheetImage;
    const worksheetElement = document.getElementById('worksheet-background');
    if (!worksheetElement) return;
    
    // Фиксированный viewBox 1000x1000
    const viewBoxSize = 1000;
    const scale = Math.min(viewBoxSize / img.width, viewBoxSize / img.height) * 0.9;
    
    worksheetElement.setAttribute('width', img.width * scale);
    worksheetElement.setAttribute('height', img.height * scale);
    
    const x = (viewBoxSize - img.width * scale) / 2;
    const y = (viewBoxSize - img.height * scale) / 2;
    
    worksheetElement.setAttribute('x', x);
    worksheetElement.setAttribute('y', y);
}

loadImage(file) {
    const reader = new FileReader();
    reader.onload = async (e) => {
        const img = new Image();
        img.onload = async () => {
            this.state.image = img;
            this.state.imageUrl = e.target.result;
            this.state.originalImageRatio = img.width / img.height;
            this.updateAspectRatioDisplay(img.width, img.height);
            const display = document.getElementById('loadedImageSizeDisplay');
            if (display) {
                this.updateLoadedImageSizeDisplay(img);
            }

            this.removePhotoOnly();
            
            let imageForDisplay = img;
            let imageForSnapping = img;
            
            if (file.type === 'image/png' || file.name.toLowerCase().endsWith('.png')) {
                try {
                    imageForDisplay = await this.addWhiteBackgroundToPNG(img);
                    imageForSnapping = imageForDisplay;
                    this.state.imageUrl = imageForDisplay.src;
                } catch (error) {
                    console.warn('Не удалось обработать PNG:', error);
                    imageForDisplay = img;
                    imageForSnapping = img;

            }
            
            this.state.imageForDisplay = imageForDisplay;
            this.displayPhoto(imageForDisplay);
            const imageControls = document.getElementById('imageControls');
            if (imageControls) imageControls.style.display = 'block';
            this.updateImageCache(imageForSnapping);
			this.setTool(this.state.currentTool);
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}
displayPhoto(img) {

    while (this.photoLayer.firstChild) {
        this.photoLayer.removeChild(this.photoLayer.firstChild);
    }
    
    // Сохраняем исходные размеры
    this.state.originalPhotoWidth = img.width;
    this.state.originalPhotoHeight = img.height;

    const photoElement = document.createElementNS('http://www.w3.org/2000/svg', 'image');

    const worksheetWidth = worksheetElement ? 
        parseFloat(worksheetElement.getAttribute('width')) : 1000;
    
    const percent = 90;
    const targetWidth = worksheetWidth * (percent / 100);
    const scale = targetWidth / img.width;
    this.state.photoScale = scale;
    
    const newWidth = img.width * scale;
    const newHeight = img.height * scale;
    
    const viewBoxSize = 1000;
    const newX = (viewBoxSize - newWidth) / 2;
    const newY = (viewBoxSize - newHeight) / 2;
    
    photoElement.setAttribute('width', newWidth);
    photoElement.setAttribute('height', newHeight);

simplifyRatio(width, height) {
    // Функция для нахождения наибольшего общего делителя (НОД)
    const gcd = (a, b) => {
        a = Math.abs(a);
        b = Math.abs(b);
        
        // Используем алгоритм Евклида
        while (b !== 0) {
            const temp = b;
            b = a % b;
            a = temp;
        }
        return a;
    };
    
    // Находим НОД для текущих чисел
    let divisor = gcd(width, height);
    
    // Если числа очень большие, пробуем упростить до более читаемого формата
    if (divisor === 1 && (width > 1000 || height > 1000)) {
        // Пробуем делить на 10, 5, 2 для упрощения
        const tryDivisors = [10, 5, 2];
        for (const tryDiv of tryDivisors) {
            if (width % tryDiv === 0 && height % tryDiv === 0) {
                divisor = tryDiv;
                break;
            }
        }
    }
    
    // Упрощаем соотношение
    const simplifiedWidth = width / divisor;
    const simplifiedHeight = height / divisor;
    
    // Форматируем вывод
    return `${simplifiedWidth}/\n${simplifiedHeight}`;
}

switchTools() {
    const current = this.state.currentTool;
    
    if (this.lastTool && this.lastTool !== current) {
        // Переключаемся на предыдущий инструмент
        this.setTool(this.lastTool);
    }
    
    // Сохраняем текущий инструмент как предыдущий
    this.lastTool = current;
}
	
            // ИНСТРУМЕНТЫ
setTool(tool) {
    // Сбрасываем все состояния перетаскивания
    if (this.state.isDraggingPoint) {
        this.endPointDrag();
    }
    if (this.state.isDraggingBezierControl) {
        this.endBezierControlDrag();
    }
    
    this.state.currentElement = null;
    const previousTool = this.state.currentTool;
    
    // Если ВХОДИМ в режим Безье
    if (tool === 'bezier-points') {
        this.state.lastBezierDirection = null;
        this.state.lastBezierLength = null;
        this.showBezierHelpers();
        this.toggleBezierPoints(true);
    } else if (this.state.currentTool === 'bezier-points' && tool !== 'bezier-points') {
        this.deselectAllPoints();
        this.state.lastBezierDirection = null;
        this.state.lastBezierLength = null;
        this.hideBezierHelpers();
        this.toggleBezierPoints(false);
    }
    
    this.state.currentTool = tool;
    
    // === ВАЖНО: МЕНЯЕМ pointer-events ФОТО В ЗАВИСИМОСТИ ОТ ИНСТРУМЕНТА ===
    const photoElement = document.getElementById('photo-overlay');
    if (photoElement) {
        if (tool === 'select') {
            // В режиме выделения фото можно перетаскивать
            photoElement.style.pointerEvents = 'all';
            photoElement.style.cursor = 'move';
        } else {
            // В остальных режимах фото пропускает клики к инструментам рисования
            photoElement.style.pointerEvents = 'none';
            photoElement.style.cursor = 'default';
        }
    }
    
    // Обновляем активные кнопки
    document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    document.querySelector(`[data-tool="${tool}"]`).classList.add('active');
    
    // Показываем/скрываем настройки инструментов
    document.getElementById('penSettings').style.display = 
        tool === 'pen' ? 'block' : 'none';
    
    document.getElementById('pushSettings').style.display = 
        tool === 'push' ? 'block' : 'none';
    
    document.getElementById('eraserSettings').style.display = 
        tool === 'eraser' ? 'block' : 'none';
    
    this.loadSettingsFromUI();
    this.updateCursor();
    
    if (tool !== 'push') {
        this.hidePushIndicator();
    }
    if (tool !== 'eraser') {
        this.hideEraserIndicator();
    }
    
    if (tool !== previousTool) {
        this.lastTool = previousTool;
    }
    
    console.log('Инструмент переключен на:', tool, 'pointer-events фото:', photoElement?.style.pointerEvents);
}


updateCursor() {
    if (!this.svg) return;
    
    if (this.state.currentTool === 'push') {
        this.svg.style.cursor = 'none';
