    // СОЗДАНИЕ ЭЛЕМЕНТА ТОЧКИ
createBezierPointElement(point) {
    const element = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    element.setAttribute('class', 'bezier-point');
    element.setAttribute('cx', point.x);
    element.setAttribute('cy', point.y);
    element.setAttribute('r', '6');
    element.setAttribute('data-index', point.index);
    
    // Добавляем обработчик для начала перетаскивания
    element.addEventListener('mousedown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const coords = this.getSVGCoordinates(e);
        const pointIndex = parseInt(element.getAttribute('data-index'));
        this.selectBezierPoint(pointIndex);
        this.startPointDrag(pointIndex, coords.x, coords.y);
    });
    
    // Двойной клик для удаления
    element.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        this.deleteBezierPoint(point.index);
    });
    
    return element;
}
       
  
    // ============================================
    // ВЫДЕЛЕНИЕ И РЕДАКТИРОВАНИЕ
    // ============================================
    
selectBezierPoint(pointIndex) {
    // Снимаем выделение со всех точек
    this.state.bezierPoints.forEach(point => {
        if (point.element) {
            point.element.classList.remove('selected');
        }
    });
    
    // Выделяем указанную точку
    const point = this.state.bezierPoints[pointIndex];
    if (point && point.element) {
        point.element.classList.add('selected');
        this.state.bezierSelectedPoint = pointIndex;
    }
}
    
    deselectAllPoints() {
        this.state.bezierPoints.forEach(point => {
            if (point.element) {
                point.element.classList.remove('selected');
            }
        });
        this.state.bezierSelectedPoint = null;
    }

    // ФУНКЦИЯ НАЧАЛА ПЕРЕТАСКИВАНИЯ КОНТРОЛЬНОЙ ТОЧКИ БЕЗЬЕ
startBezierControlDrag(e) {
    e.preventDefault();
    e.stopPropagation();
    
    const target = e.target;
    if (!target.classList.contains('bezier-control-point')) return;
    
    const coords = this.getSVGCoordinates(e);
    const controlType = target.getAttribute('data-control-type');
    const belongsTo = parseInt(target.getAttribute('data-belongs-to'));
    
    // Ищем вектор по принадлежности контрольной точки
    const vectorInfo = this.findVectorByControlPoint(controlType, belongsTo);
    
    if (!vectorInfo) {
        console.warn('Вектор не найден для контрольной точки:', controlType, belongsTo);
        return;
    }
    
    const { vector, index: vectorIndex, type } = vectorInfo;
    
    // Запоминаем состояние
    this.state.isDraggingBezierControl = true;
    this.state.draggingBezierControlVectorIndex = vectorIndex;
    this.state.draggingBezierControlType = type;
    this.state.draggingBezierControlStartX = coords.x;
    this.state.draggingBezierControlStartY = coords.y;
    
    // Запоминаем оригинальные координаты
    if (type === 'control1') {
        this.state.draggingBezierControlOriginalX = vector.control1.x;
        this.state.draggingBezierControlOriginalY = vector.control1.y;
    } else {
        this.state.draggingBezierControlOriginalX = vector.control2.x;
        this.state.draggingBezierControlOriginalY = vector.control2.y;
    }
    
    console.log('Начато перетаскивание контрольной точки', type, 'вектора', vectorIndex);
}
   
    // ОБНОВЛЕНИЕ ПЕРЕТАСКИВАНИЯ КОНТРОЛЬНОЙ ТОЧКИ БЕЗЬЕ
updateBezierControlDrag(x, y) {
    if (!this.state.isDraggingBezierControl) return;
    
    const vectorIndex = this.state.draggingBezierControlVectorIndex;
    const vector = this.state.bezierVectors[vectorIndex];
    if (!vector) {
        console.warn('Вектор не найден по индексу:', vectorIndex);
        return;
    }
    
    // Вычисляем смещение
    const dx = x - this.state.draggingBezierControlStartX;
    const dy = y - this.state.draggingBezierControlStartY;
    
    // Обновляем координаты контрольной точки
    if (this.state.draggingBezierControlType === 'control1') {
        vector.control1.x = this.state.draggingBezierControlOriginalX + dx;
        vector.control1.y = this.state.draggingBezierControlOriginalY + dy;
        
        // Обновляем визуальную точку
        if (vector.guideElements.control1) {
            vector.guideElements.control1.setAttribute('cx', vector.control1.x);
            vector.guideElements.control1.setAttribute('cy', vector.control1.y);
        }
        
        // Обновляем линию
        if (vector.guideElements.line1) {
            vector.guideElements.line1.setAttribute('x2', vector.control1.x);
            vector.guideElements.line1.setAttribute('y2', vector.control1.y);
        }
    } else {
        vector.control2.x = this.state.draggingBezierControlOriginalX + dx;
        vector.control2.y = this.state.draggingBezierControlOriginalY + dy;
        
        // Обновляем визуальную точку
        if (vector.guideElements.control2) {
            vector.guideElements.control2.setAttribute('cx', vector.control2.x);
            vector.guideElements.control2.setAttribute('cy', vector.control2.y);
        }
        
        // Обновляем линию
        if (vector.guideElements.line2) {
            vector.guideElements.line2.setAttribute('x2', vector.control2.x);
            vector.guideElements.line2.setAttribute('y2', vector.control2.y);
        }
    }
    
    // Обновляем путь Безье
    this.updateBezierVectorPath(vector);
    
    // Обновляем стартовые координаты для плавности
    this.state.draggingBezierControlStartX = x;
    this.state.draggingBezierControlStartY = y;
    this.state.draggingBezierControlOriginalX = 
        this.state.draggingBezierControlType === 'control1' ? vector.control1.x : vector.control2.x;
    this.state.draggingBezierControlOriginalY = 
        this.state.draggingBezierControlType === 'control1' ? vector.control1.y : vector.control2.y;
}
   
    // ЗАВЕРШЕНИЕ ПЕРЕТАСКИВАНИЯ КОНТРОЛЬНОЙ ТОЧКИ БЕЗЬЕ
    endBezierControlDrag() {
        this.state.isDraggingBezierControl = false;
        this.state.draggingBezierControlVectorIndex = null;
        this.state.draggingBezierControlType = null;
        console.log('Завершено перетаскивание контрольной точки');
    }
        
    // ОБНОВЛЕНИЕ ПУТИ БЕЗЬЕ (после перемещения контрольной точки)
    updateBezierVectorPath(vector) {
        const startPoint = this.state.bezierPoints[vector.from];
        const endPoint = this.state.bezierPoints[vector.to];
        
        if (!startPoint || !endPoint || !vector.path) return;
        
        const d = `M ${startPoint.x} ${startPoint.y} 
                   C ${vector.control1.x} ${vector.control1.y} 
                     ${vector.control2.x} ${vector.control2.y} 
                     ${endPoint.x} ${endPoint.y}`;
        
        vector.path.setAttribute('d', d);
    }
    // ============================================
    // ПЕРЕТАСКИВАНИЕ ТОЧЕК
    // ============================================
    
startPointDrag(pointIndex, x, y) {
    const point = this.state.bezierPoints[pointIndex];
    if (!point) return;
    
    // Выделяем точку
    this.selectBezierPoint(pointIndex);
    
    // Устанавливаем флаги перетаскивания
    this.state.isDraggingPoint = true;
    this.state.draggingPointIndex = pointIndex;
    this.state.draggingPointStartX = x;
    this.state.draggingPointStartY = y;
    this.state.draggingPointOriginalX = point.x;
    this.state.draggingPointOriginalY = point.y;
}
    
updatePointDrag(x, y) {
    if (!this.state.isDraggingPoint) return;
    
    const pointIndex = this.state.draggingPointIndex;
    const point = this.state.bezierPoints[pointIndex];
    if (!point) return;
    
    // Вычисляем смещение
    const dx = x - this.state.draggingPointStartX;
    const dy = y - this.state.draggingPointStartY;
    
    // Обновляем координаты точки в объекте
    point.x = this.state.draggingPointOriginalX + dx;
    point.y = this.state.draggingPointOriginalY + dy;
    
    // Обновляем визуальный элемент
    if (point.element) {
        point.element.setAttribute('cx', point.x);
        point.element.setAttribute('cy', point.y);
    }
    
    // ОБНОВЛЯЕМ ВСЕ СВЯЗАННЫЕ КОНТРОЛЬНЫЕ ТОЧКИ
    this.updateControlPointsForMovedPoint(pointIndex, dx, dy);
    
    // Обновляем стартовую позицию для плавного движения
    this.state.draggingPointStartX = x;
    this.state.draggingPointStartY = y;
    this.state.draggingPointOriginalX = point.x;
    this.state.draggingPointOriginalY = point.y;
}

updateControlPointsForMovedPoint(movedPointIndex, dx, dy) {
    const movedPoint = this.state.bezierPoints[movedPointIndex];
    if (!movedPoint) return;
    
    // Просто двигаем все связанные контрольные точки
    this.state.bezierVectors.forEach(vector => {
        if (vector.from === movedPointIndex) {
            vector.control1.x += dx;
            vector.control1.y += dy;
            
            if (vector.guideElements.control1) {
                vector.guideElements.control1.setAttribute('cx', vector.control1.x);
                vector.guideElements.control1.setAttribute('cy', vector.control1.y);
                vector.guideElements.line1.setAttribute('x2', vector.control1.x);
                vector.guideElements.line1.setAttribute('y2', vector.control1.y);
            }
        }
        
        if (vector.to === movedPointIndex) {
            vector.control2.x += dx;
            vector.control2.y += dy;
            
            if (vector.guideElements.control2) {
                vector.guideElements.control2.setAttribute('cx', vector.control2.x);
                vector.guideElements.control2.setAttribute('cy', vector.control2.y);
                vector.guideElements.line2.setAttribute('x2', vector.control2.x);
                vector.guideElements.line2.setAttribute('y2', vector.control2.y);
            }
        }
        
        this.updateBezierVectorPath(vector);
    });
}

    endPointDrag() {
        this.state.isDraggingPoint = false;
        this.state.draggingPointIndex = null;
    }
   
    // ============================================
    // УДАЛЕНИЕ ЭЛЕМЕНТОВ
    // ============================================
    
    // УДАЛЕНИЕ ТОЧКИ
    deleteBezierPoint(pointIndex) {
        const point = this.state.bezierPoints[pointIndex];
        if (!point) return;
        
        // Удаляем визуальный элемент
        if (point.element && point.element.parentNode) {
            point.element.parentNode.removeChild(point.element);
        }
        
        // Удаляем векторы, связанные с этой точкой
        this.deleteVectorsForPoint(pointIndex);
        
        // Удаляем точку из массива
        this.state.bezierPoints.splice(pointIndex, 1);
        
        // Обновляем индексы
        this.updatePointIndices();
        
        // Сбрасываем выделение если удалили выделенную точку
        if (this.state.bezierSelectedPoint === pointIndex) {
            this.deselectAllPoints();
        }
		    setTimeout(() => this.saveSnapshot(), 100);
    }
    
    deleteVectorsForPoint(pointIndex) {
        // Удаляем с конца чтобы индексы не сбивались
        for (let i = this.state.bezierVectors.length - 1; i >= 0; i--) {
            const vector = this.state.bezierVectors[i];
            
            if (vector.from === pointIndex || vector.to === pointIndex) {
                // Удаляем визуальные элементы
                if (vector.path && vector.path.parentNode) {
                    vector.path.parentNode.removeChild(vector.path);
                }
                
                if (vector.guideElements) {
                    if (vector.guideElements.line1) vector.guideElements.line1.remove();
                    if (vector.guideElements.control1) vector.guideElements.control1.remove();
                    if (vector.guideElements.line2) vector.guideElements.line2.remove();
                    if (vector.guideElements.control2) vector.guideElements.control2.remove();
                }
                
                // Удаляем из массива
                this.state.bezierVectors.splice(i, 1);
            }
        }
    }
    
    updatePointIndices() {
        // Обновляем индексы точек
        this.state.bezierPoints.forEach((point, index) => {
            point.index = index;
            if (point.element) {
                point.element.setAttribute('data-index', index);
            }
        });
        
        // Обновляем индексы в векторах
        this.state.bezierVectors.forEach(vector => {
            // Уменьшаем индекс если он больше удаленного
            if (vector.from > this.state.bezierSelectedPoint) vector.from--;
            if (vector.to > this.state.bezierSelectedPoint) vector.to--;
        });
    }
    

    // ============================================
    // УТИЛИТЫ
    // ============================================
    
    // ПОЛУЧЕНИЕ КООРДИНАТ В SVG
    getSVGCoordinates(e) {
        const pt = this.svg.createSVGPoint();
        pt.x = e.clientX;
        pt.y = e.clientY;
        return pt.matrixTransform(this.svg.getScreenCTM().inverse());
    }
      
// конец безье
// УПРОЩЕННАЯ функция привязки (оптимизированная)
snapToNonWhiteLine(x, y) {
    if (!this.state.image || !this.snapSettings.enabled) return null;
    
    const imageElement = document.getElementById('background-image');
    if (!imageElement) return null;
    
    // Координаты и размеры изображения в SVG
    const imgX = parseFloat(imageElement.getAttribute('x')) || 0;
    const imgY = parseFloat(imageElement.getAttribute('y')) || 0;
    const imgWidth = parseFloat(imageElement.getAttribute('width'));
    const imgHeight = parseFloat(imageElement.getAttribute('height'));
    
    // Используем imageForDisplay (версия с белым фоном для PNG)
    const imageForAnalysis = this.state.imageForDisplay || this.state.image;
    
    // Преобразуем SVG координаты в координаты изображения
    const imgCoordX = ((x - imgX) / imgWidth) * imageForAnalysis.width;
    const imgCoordY = ((y - imgY) / imgHeight) * imageForAnalysis.height;
    
    if (imgCoordX < 0 || imgCoordX >= imageForAnalysis.width || 
        imgCoordY < 0 || imgCoordY >= imageForAnalysis.height) {
        return null;
    }
    
    // Кэш изображения для быстрого доступа
    if (!this.imageCanvasCache) {
        this.imageCanvasCache = document.createElement('canvas');
        this.imageCanvasCache.width = imageForAnalysis.width;
        this.imageCanvasCache.height = imageForAnalysis.height;
        const ctx = this.imageCanvasCache.getContext('2d');
        ctx.drawImage(imageForAnalysis, 0, 0);
        this.imageDataCache = ctx.getImageData(0, 0, imageForAnalysis.width, imageForAnalysis.height);
    }
    
    const data = this.imageDataCache.data;
    const width = imageForAnalysis.width;
    const whiteThreshold = 200; // Фиксированный порог
    const searchRadius = 8; // Уменьшил радиус для скорости
    
    // Простой поиск ближайшего не-белого пикселя
    for (let r = 0; r <= searchRadius; r++) {
        const points = r === 0 ? 1 : r * 6; // Количество точек на радиусе
        
        for (let i = 0; i < points; i++) {
            const angle = (i / points) * Math.PI * 2;
            const px = Math.round(imgCoordX + r * Math.cos(angle));
            const py = Math.round(imgCoordY + r * Math.sin(angle));
            
            if (px < 0 || px >= width || py < 0 || py >= imageForAnalysis.height) {
                continue;
            }
            
            const idx = (py * width + px) * 4;
            const brightness = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
            
            // Если пиксель не белый (яркость < 200)
            if (brightness < whiteThreshold) {
                const snapX = (px / imageForAnalysis.width) * imgWidth + imgX;
                const snapY = (py / imageForAnalysis.height) * imgHeight + imgY;
                
                // Проверяем расстояние привязки
                const dist = Math.sqrt((x - snapX) ** 2 + (y - snapY) ** 2);
                const maxDist = this.snapSettings.snapDistance / this.state.zoom;
                
                if (dist <= maxDist) {
                    return {x: snapX, y: snapY};
                }
            }
        }
    }
    
    return null;
}

// СКРЫТЬ ВСЕ ВСПОМОГАТЕЛЬНЫЕ ЭЛЕМЕНТЫ БЕЗЬЕ

clearVectors() {
    if (!confirm('Удалить все векторы?')) return;
    
    // Удаляем все векторы Безье (и вспомогательные элементы)
    document.querySelectorAll('.bezier-vector, .bezier-guide-line, .bezier-control-point, .bezier-point').forEach(el => {
        el.remove();
    });
    
    // Также удаляем обычные векторы
    const vectorElements = this.svg.querySelectorAll('path:not([id*="indicator"]):not([id*="background"]), line, rect, circle');
    vectorElements.forEach(el => {
        if (!el.classList.contains('bezier-vector') && 
            !el.classList.contains('bezier-guide-line') && 
            !el.classList.contains('bezier-control-point') && 
            !el.classList.contains('bezier-point')) {
            el.remove();
        }
    });
    
    // Сбрасываем состояние
    this.state.currentElement = null;
    this.state.isDrawing = false;
    this.state.penPoints = [];
    this.pushData = null;
    this.state.bezierPoints = [];
    this.state.bezierVectors = [];
    this.state.bezierSelectedPoint = null;
    this.state.lastBezierDirection = null;
    this.state.lastBezierLength = null;
}
          
saveSVG() {
    // Создаем новый SVG элемент для сохранения
    const svgDoc = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    
    // Используем реальные размеры изображения (если есть)
    let baseWidth = 1000;
    let baseHeight = 1000;
    
    if (this.state.image) {
        baseWidth = this.state.image.naturalWidth || this.state.image.width || 1000;
        baseHeight = this.state.image.naturalHeight || this.state.image.height || 1000;
    }
    
    // Устанавливаем размеры сохраненного SVG
    svgDoc.setAttribute('width', baseWidth + 'px');
    svgDoc.setAttribute('height', baseHeight + 'px');
    svgDoc.setAttribute('viewBox', `0 0 ${baseWidth} ${baseHeight}`);
    svgDoc.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    
    // Получаем позицию и размер изображения в текущем viewBox
    const imageElement = document.getElementById('background-image');
    let imageX = 0, imageY = 0, imageWidth = baseWidth, imageHeight = baseHeight;
    
    if (imageElement) {
        imageX = parseFloat(imageElement.getAttribute('x')) || 0;
        imageY = parseFloat(imageElement.getAttribute('y')) || 0;
        imageWidth = parseFloat(imageElement.getAttribute('width')) || baseWidth;
        imageHeight = parseFloat(imageElement.getAttribute('height')) || baseHeight;
    }
    
    // Функция для преобразования координат
    const convertToOriginalCoordinates = (x, y) => {
        // Преобразуем из координат viewBox в координаты изображения
        const scaleX = baseWidth / imageWidth;
        const scaleY = baseHeight / imageHeight;
        
        return {
            x: (x - imageX) * scaleX,
            y: (y - imageY) * scaleY
        };
    };
    
    // Копируем ВСЕ векторные элементы из текущего SVG
    const allElements = this.svg.querySelectorAll('path, line, rect, circle, ellipse');
    
    allElements.forEach(originalElement => {
        // Пропускаем вспомогательные элементы и индикаторы
        if (originalElement.id && originalElement.id.includes('indicator')) {
            return;
        }
        
        if (originalElement.classList && 
            (originalElement.classList.contains('bezier-guide-line') || 
             originalElement.classList.contains('bezier-control-point') ||
             originalElement.classList.contains('bezier-point'))) {
            return;
        }
        
        // Клонируем элемент
        const clonedElement = originalElement.cloneNode(true);
        
        // Для путей (включая кривые Безье)
        if (originalElement.tagName.toLowerCase() === 'path') {
            const d = originalElement.getAttribute('d');
            if (d) {
                // Преобразуем координаты пути
                const convertedD = this.convertPathCoordinates(d, convertToOriginalCoordinates);
                clonedElement.setAttribute('d', convertedD);
            }
        }
        
        // Для линий
        if (originalElement.tagName.toLowerCase() === 'line') {
            const x1 = parseFloat(originalElement.getAttribute('x1'));
            const y1 = parseFloat(originalElement.getAttribute('y1'));
            const x2 = parseFloat(originalElement.getAttribute('x2'));
            const y2 = parseFloat(originalElement.getAttribute('y2'));
            
            if (!isNaN(x1) && !isNaN(y1) && !isNaN(x2) && !isNaN(y2)) {
                const coord1 = convertToOriginalCoordinates(x1, y1);
                const coord2 = convertToOriginalCoordinates(x2, y2);
                
                clonedElement.setAttribute('x1', coord1.x);
                clonedElement.setAttribute('y1', coord1.y);
                clonedElement.setAttribute('x2', coord2.x);
                clonedElement.setAttribute('y2', coord2.y);
            }
        }
        
        // Для прямоугольников
        if (originalElement.tagName.toLowerCase() === 'rect') {
            const x = parseFloat(originalElement.getAttribute('x'));
            const y = parseFloat(originalElement.getAttribute('y'));
            const width = parseFloat(originalElement.getAttribute('width'));
            const height = parseFloat(originalElement.getAttribute('height'));
            
            if (!isNaN(x) && !isNaN(y)) {
                const coord = convertToOriginalCoordinates(x, y);
                clonedElement.setAttribute('x', coord.x);
                clonedElement.setAttribute('y', coord.y);
                
                // Масштабируем размеры
                const scaleX = baseWidth / imageWidth;
                const scaleY = baseHeight / imageHeight;
                
                if (!isNaN(width)) clonedElement.setAttribute('width', width * scaleX);
                if (!isNaN(height)) clonedElement.setAttribute('height', height * scaleY);
            }
        }
        
        // Для кругов
        if (originalElement.tagName.toLowerCase() === 'circle') {
            const cx = parseFloat(originalElement.getAttribute('cx'));
            const cy = parseFloat(originalElement.getAttribute('cy'));
            const r = parseFloat(originalElement.getAttribute('r'));
            
            if (!isNaN(cx) && !isNaN(cy)) {
                const coord = convertToOriginalCoordinates(cx, cy);
                clonedElement.setAttribute('cx', coord.x);
                clonedElement.setAttribute('cy', coord.y);
                
                // Масштабируем радиус
                const scaleX = baseWidth / imageWidth;
                if (!isNaN(r)) clonedElement.setAttribute('r', r * scaleX);
            }
        }
        
        svgDoc.appendChild(clonedElement);
    });
    
    // Создаем строку SVG
    const serializer = new XMLSerializer();
    let svgString = serializer.serializeToString(svgDoc);
    
    // Добавляем заголовок
    svgString = '<?xml version="1.0" encoding="UTF-8"?>\n' + svgString;
    
    // Создаем файл для скачивания
    const blob = new Blob([svgString], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'векторы.svg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    alert('SVG сохранен!');
}

convertPathCoordinates(d, convertFunction) {
    // Парсим команды пути
    const commands = d.match(/[a-df-zA-DF-Z][^a-df-zA-DF-Z]*/g) || [];
    
    let convertedPath = '';
    
    commands.forEach(commandStr => {
        const command = commandStr[0];
        const numbers = commandStr.substring(1).trim();
        
        if (!numbers) {
            convertedPath += command + ' ';
            return;
        }
        
        // Разбиваем числа
        const numArray = numbers.split(/[\s,]+/).map(Number);
        let convertedNumbers = '';
        
        // Обрабатываем пары координат
        for (let i = 0; i < numArray.length; i += 2) {
            if (i + 1 < numArray.length) {
                const x = numArray[i];
                const y = numArray[i + 1];
                
                // Преобразуем координаты
                const converted = convertFunction(x, y);
                convertedNumbers += `${converted.x},${converted.y} `;
            }
        }
        
        convertedPath += command + ' ' + convertedNumbers.trim() + ' ';
    });
    
    return convertedPath.trim();
}
