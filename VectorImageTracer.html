    this._spiralFrame.setAttribute('width', Math.max(0, originalBBox.width - margin * 2));
    this._spiralFrame.setAttribute('height', Math.max(0, originalBBox.height - margin * 2));
    this._spiralFrame.setAttribute('fill', 'none');
    this._spiralFrame.setAttribute('stroke', '#4dabf7');
    this._spiralFrame.setAttribute('stroke-width', '1.5');
    this._spiralFrame.setAttribute('stroke-dasharray', '6,4');
    
    // Поворачиваем рамку на тот же угол и вокруг того же центра, что и фигура
    if (angleRad !== 0) {
        this._spiralFrame.setAttribute('transform', `rotate(${angleDeg}, ${rotCx}, ${rotCy})`);
    }
    
    this.helperLayer.appendChild(this._spiralFrame);
    
    // === ГРУППА СПИРАЛИ ===
    this._spiralGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    
    if (points.length > 1) {
        let d = `M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;
        for (let i = 1; i < points.length; i++) {
            d += ` L ${points[i].x.toFixed(2)} ${points[i].y.toFixed(2)}`;
        }
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('stroke', '#4dabf7');
        path.setAttribute('stroke-width', '2');
        path.setAttribute('stroke-dasharray', '6,4');
        path.setAttribute('fill', 'none');
        path.setAttribute('opacity', '0.8');
        this._spiralGroup.appendChild(path);
        this._spiralPath = path;
    }
    
    this._spiralPoints = points;
    this._spiralOriginalBBox = originalBBox;
    this._spiralAngle = angleDeg;
    this._spiralRotCenter = { x: rotCx, y: rotCy };
    this._spiralCenter = { x: globalCenterX, y: globalCenterY };
    this._spiralMargin = margin;
    this._spiralSpacing = spacing;
    
    this.helperLayer.appendChild(this._spiralGroup);
    
    this.showSpiralPanel();
    this.setupSpiralDragAnywhere();
}

// Перетаскивание за любую часть спирали
setupSpiralDragAnywhere() {
    let dragging = false;
    let startX, startY;
    let startTranslateX, startTranslateY;
    
    if (this._spiralDragHandlers) {
        this.svg.removeEventListener('mousedown', this._spiralDragHandlers.onMouseDown);
        this.svg.removeEventListener('mousemove', this._spiralDragHandlers.onMouseMove);
        this.svg.removeEventListener('mouseup', this._spiralDragHandlers.onMouseUp);
        this._spiralDragHandlers = null;
    }
    
    const onMouseDown = (e) => {
        // ЛЮБОЙ клик на холсте начинает перетаскивание спирали
        if (this._spiralGroup) {
            dragging = true;
            const coords = this.getSVGCoordinates(e);
            startX = coords.x;
            startY = coords.y;
            
            // Получаем текущее положение группы спирали
            const transform = this._spiralGroup.getAttribute('transform');
            if (transform) {
                const match = transform.match(/translate\(([^,]+),\s*([^)]+)\)/);
                if (match) {
                    startTranslateX = parseFloat(match[1]);
                    startTranslateY = parseFloat(match[2]);
                } else {
                    startTranslateX = 0;
                    startTranslateY = 0;
                }
            } else {
                startTranslateX = 0;
                startTranslateY = 0;
            }
            
            this.svg.style.cursor = 'grabbing';
            e.preventDefault();
            e.stopPropagation();
        }
    };
    
    const onMouseMove = (e) => {
        if (!dragging) return;
        e.preventDefault();
        e.stopPropagation();
        
        const coords = this.getSVGCoordinates(e);
        const dx = coords.x - startX;
        const dy = coords.y - startY;
        
        // Перемещаем группу спирали
        const newX = startTranslateX + dx;
        const newY = startTranslateY + dy;
        this._spiralGroup.setAttribute('transform', `translate(${newX}, ${newY})`);
    };
    
    const onMouseUp = (e) => {
        if (dragging) {
            dragging = false;
            this.svg.style.cursor = '';
            e.preventDefault();
            e.stopPropagation();
        }
    };
    
    this.svg.addEventListener('mousedown', onMouseDown);
    this.svg.addEventListener('mousemove', onMouseMove);
    this.svg.addEventListener('mouseup', onMouseUp);
    
    this._spiralDragHandlers = { onMouseDown, onMouseMove, onMouseUp };
}

// Панель с кнопками
showSpiralPanel() {
    // Удаляем старую панель, если есть
    const oldPanel = document.getElementById('spiral-panel');
    if (oldPanel) oldPanel.remove();
    
    const panel = document.createElement('div');
    panel.id = 'spiral-panel';
    panel.style.cssText = `
        position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
        background: #1a1a1a; padding: 12px 20px; border-radius: 8px;
        border: 1px solid #4dabf7; z-index: 10000; display: flex; gap: 15px;
        font-family: Arial, sans-serif;
    `;
    panel.innerHTML = `
        <span style="color:white;">🌀 Перетащите спираль</span>
        <button id="spiral-apply" style="background:#4dabf7; border:none; padding:5px 15px; border-radius:5px; cursor:pointer;">Применить (Enter)</button>
        <button id="spiral-cancel" style="background:#6c757d; border:none; padding:5px 15px; border-radius:5px; cursor:pointer;">Отмена (Esc)</button>
    `;
    document.body.appendChild(panel);
    
    const applyBtn = panel.querySelector('#spiral-apply');
    const cancelBtn = panel.querySelector('#spiral-cancel');
    
    // Обработчики кнопок
    applyBtn.onclick = () => this.applySpiralFill();
    cancelBtn.onclick = () => this.cancelSpiralPreview();
    
    // Обработчики клавиш
    const onKeyDown = (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            this.applySpiralFill();
        } else if (e.key === 'Escape') {
            e.preventDefault();
            this.cancelSpiralPreview();
        }
    };
    
    document.addEventListener('keydown', onKeyDown);
    
    // Сохраняем обработчик для удаления
    this._spiralKeyHandler = onKeyDown;
}

// Применить - обрезаем по контуру фигуры
applySpiralFill() {
    if (!this._spiralPoints || this._spiralPoints.length < 2) {
        this.updateFillInfo('❌ Ошибка: нет точек спирали');
        this.cancelSpiralPreview();
        return;
    }
    
    // Получаем смещение от перетаскивания
    let offsetX = 0, offsetY = 0;
    if (this._spiralGroup) {
        const transform = this._spiralGroup.getAttribute('transform') || '';
        const match = transform.match(/translate\(([^,]+),\s*([^)]+)\)/);
        if (match) {
            offsetX = parseFloat(match[1]) || 0;
            offsetY = parseFloat(match[2]) || 0;
        }
    }
    
    // Смещаем все точки спирали на offset
    let transformedPoints = this._spiralPoints.map(p => ({
        x: p.x + offsetX,
        y: p.y + offsetY
    }));
    
    // === ОБРАТНЫЙ ПОВОРОТ: разворачиваем точки обратно на угол фигуры ===
    if (this._spiralAngle && this._spiralAngle !== 0 && this._spiralRotCenter) {
        const angleRad = -this._spiralAngle * Math.PI / 180; // ОБРАТНЫЙ угол
        const cx = this._spiralRotCenter.x;
        const cy = this._spiralRotCenter.y;
        const cos = Math.cos(angleRad);
        const sin = Math.sin(angleRad);
        
        transformedPoints = transformedPoints.map(p => {
            const dx = p.x - cx;
            const dy = p.y - cy;
            return {
                x: cx + dx * cos - dy * sin,
                y: cy + dx * sin + dy * cos
            };
        });
    }
    
    const marginMM = parseFloat(document.getElementById('fillMarginSlider')?.value) || 0.5;
    const marginPx = this.mmToSvgPixels(marginMM);
    
    // Получаем контур фигуры (как обычно)
    const closedD = this.getClosedShapePath(this._spiralShape);
    if (!closedD) {
        this.updateFillInfo('❌ Не удалось обработать фигуру');
        this.cancelSpiralPreview();
        return;
    }
    
    let calculationD = closedD;
    if (/[CcQq]/.test(closedD)) {
        calculationD = this.convertBezierToPolylineForCalculation(closedD);
    }
    
    let contourPoints = this.parseDToPoints(calculationD);
    if (!contourPoints || contourPoints.length < 3) {
        this.updateFillInfo('❌ Слишком мало точек');
        this.cancelSpiralPreview();
        return;
    }
    
    // Применяем отступ
    if (marginPx > 0) {
        const tag = this._spiralShape.tagName?.toLowerCase();
        if (tag === 'circle') {
            const cx = parseFloat(this._spiralShape.getAttribute('cx')) || 0;
            const cy = parseFloat(this._spiralShape.getAttribute('cy')) || 0;
            const r = parseFloat(this._spiralShape.getAttribute('r')) || 0;
            const newR = Math.max(1, r - marginPx);
            const insetD = this.generatePolygonPath(cx, cy, newR, newR, 60);
            contourPoints = this.parseDToPoints(insetD);
        } else if (tag === 'ellipse') {
            const cx = parseFloat(this._spiralShape.getAttribute('cx')) || 0;
            const cy = parseFloat(this._spiralShape.getAttribute('cy')) || 0;
            const rx = parseFloat(this._spiralShape.getAttribute('rx')) || 0;
            const ry = parseFloat(this._spiralShape.getAttribute('ry')) || 0;
            const newRx = Math.max(1, rx - marginPx);
            const newRy = Math.max(1, ry - marginPx);
            const insetD = this.generatePolygonPath(cx, cy, newRx, newRy, 60);
            contourPoints = this.parseDToPoints(insetD);
        } else if (tag === 'rect') {
            const x = parseFloat(this._spiralShape.getAttribute('x')) || 0;
            const y = parseFloat(this._spiralShape.getAttribute('y')) || 0;
            const w = parseFloat(this._spiralShape.getAttribute('width')) || 0;
            const h = parseFloat(this._spiralShape.getAttribute('height')) || 0;
            const insetD = `M ${x + marginPx} ${y + marginPx} L ${x + w - marginPx} ${y + marginPx} L ${x + w - marginPx} ${y + h - marginPx} L ${x + marginPx} ${y + h - marginPx} Z`;
            contourPoints = this.parseDToPoints(insetD);
        } else {
            contourPoints = this.insetContour(contourPoints, marginPx);
        }
    }
    
    // Обрезаем спираль по контуру (оба в локальных координатах)
    const segments = this.clipSpiralToContour(transformedPoints, contourPoints);
    
    if (!segments || segments.length === 0) {
        this.updateFillInfo('❌ Спираль не попала в фигуру');
        this.cancelSpiralPreview();
        return;
    }
    
    // Соединяем сегменты
    const continuous = document.getElementById('fillContinuousToggle')?.checked ?? true;
    let finalPaths = segments;
    
    if (continuous && segments.length > 1) {
        finalPaths = this.joinContinuousSegments(segments, this._spiralSpacing);
    }
    
    // === ВАЖНО: создаём заливку, передаём transform фигуры ===
    // createSnakePaths применит поворот к координатам
    const parentTransform = this._spiralShape.getAttribute('transform') || '';
    const createdCount = this.createSnakePaths(finalPaths, parentTransform);
    
    const spacingMM = parseFloat(document.getElementById('fillSpacingSlider')?.value) || 2;
    this.updateFillInfo(`✅ Создано: ${createdCount} линий (Спираль, ${spacingMM}мм, отступ ${marginMM}мм)`);
    
    this.cancelSpiralPreview();
    this.saveSnapshot();
}

// Отмена
cancelSpiralPreview() {
    // Удаляем рамку
    if (this._spiralFrame) {
        this._spiralFrame.remove();
        this._spiralFrame = null;
    }
    
    // Удаляем группу спирали
    if (this._spiralGroup) {
        this._spiralGroup.remove();
        this._spiralGroup = null;
    }
    
    // Удаляем обработчики перетаскивания
    if (this._spiralDragHandlers) {
        this.svg.removeEventListener('mousedown', this._spiralDragHandlers.onMouseDown);
        this.svg.removeEventListener('mousemove', this._spiralDragHandlers.onMouseMove);
        this.svg.removeEventListener('mouseup', this._spiralDragHandlers.onMouseUp);
        this._spiralDragHandlers = null;
    }
    
    // Удаляем обработчик клавиш
    if (this._spiralKeyHandler) {
        document.removeEventListener('keydown', this._spiralKeyHandler);
        this._spiralKeyHandler = null;
    }
    
    // Удаляем панель
    const panel = document.getElementById('spiral-panel');
    if (panel) panel.remove();
    
    // Удаляем обработчик клика по фигуре
    if (this._spiralClickHandler) {
        this.svg.removeEventListener('click', this._spiralClickHandler);
        this._spiralClickHandler = null;
    }
    
    this._spiralShape = null;
    this._spiralPoints = null;
    this._spiralPath = null;
    this._spiralBounds = null;
    this._spiralMargin = null;
    this._spiralSpacing = null;
    
    this.svg.style.cursor = '';
    this.isSpiralActive = false;
}

clipSpiralToContour(spiralPoints, contourPoints) {
if (!contourPoints || contourPoints.length < 3) return [];

    const result = [];
    let currentSegment = [];
    let wasInside = false;
    
    for (let i = 0; i < spiralPoints.length; i++) {
        const p = spiralPoints[i];
        const isInside = this.isPointInsideContour(p, contourPoints);
        
        if (isInside) {
            if (!wasInside && i > 0 && currentSegment.length === 0) {
                const prevPoint = spiralPoints[i - 1];
                const intersection = this.getExactIntersection(prevPoint, p, contourPoints);
                if (intersection) currentSegment.push(intersection);
            }
            currentSegment.push(p);
            wasInside = true;
        } else {
            if (wasInside && currentSegment.length > 0) {
                const prevPoint = spiralPoints[i - 1];
                const intersection = this.getExactIntersection(prevPoint, p, contourPoints);
                if (intersection) currentSegment.push(intersection);
                if (currentSegment.length >= 2) result.push([...currentSegment]);
                currentSegment = [];
            }
            wasInside = false;
        }
    }
    
    if (currentSegment.length >= 2) result.push(currentSegment);
    return result;
}

joinContinuousSegments(segments, spacing) {
    if (segments.length <= 1) return segments;
    
    const maxDist = spacing * 3;
    
    const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    
    // Одна итерация соединения
    const onePass = (paths) => {
        if (paths.length <= 1) return paths;
        
        const used = new Array(paths.length).fill(false);
        const result = [];
        
        for (let i = 0; i < paths.length; i++) {
            if (used[i]) continue;
            
            let currentLine = [...paths[i]];
            used[i] = true;
            
            let changed = true;
            let iter = 0;
            
            while (changed && iter < paths.length * 2) {
                changed = false;
                iter++;
                
                const lineStart = currentLine[0];
                const lineEnd = currentLine[currentLine.length - 1];
                
                for (let j = 0; j < paths.length; j++) {
                    if (used[j]) continue;
                    
                    const seg = paths[j];
                    const segStart = seg[0];
                    const segEnd = seg[seg.length - 1];
                    
                    // Конец текущей -> начало сегмента
                    if (distance(lineEnd, segStart) <= maxDist) {
                        const needSkip = distance(lineEnd, segStart) < 0.1;
                        for (let k = needSkip ? 1 : 0; k < seg.length; k++) {
                            currentLine.push(seg[k]);
                        }
                        used[j] = true;
                        changed = true;
                        break;
                    }
                    // Конец текущей -> конец сегмента (разворот)
                    else if (distance(lineEnd, segEnd) <= maxDist) {
                        const needSkip = distance(lineEnd, segEnd) < 0.1;
                        for (let k = (needSkip ? seg.length - 2 : seg.length - 1); k >= 0; k--) {
                            currentLine.push(seg[k]);
                        }
                        used[j] = true;
                        changed = true;
                        break;
                    }
                    // Начало текущей -> начало сегмента
                    else if (distance(lineStart, segStart) <= maxDist) {
                        const needSkip = distance(lineStart, segStart) < 0.1;
                        for (let k = (needSkip ? 1 : 0); k < seg.length; k++) {
                            currentLine.unshift(seg[k]);
                        }
                        used[j] = true;
                        changed = true;
                        break;
                    }
                    // Начало текущей -> конец сегмента
                    else if (distance(lineStart, segEnd) <= maxDist) {
                        const needSkip = distance(lineStart, segEnd) < 0.1;
                        for (let k = (needSkip ? seg.length - 2 : seg.length - 1); k >= 0; k--) {
                            currentLine.unshift(seg[k]);
                        }
                        used[j] = true;
                        changed = true;
                        break;
                    }
                }
            }
            
            result.push(currentLine);
        }
        
        return result;
    };
    
    // Повторяем пока есть изменения
    let current = segments;
    let prevLength = current.length;
    let maxIter = 10;
    
    for (let iter = 0; iter < maxIter; iter++) {
        const next = onePass(current);
        if (next.length === prevLength) break;
        current = next;
        prevLength = current.length;
    }
    
    return current;
}

getExactIntersection(p1, p2, contourPoints) {
    // Проверяем все отрезки контура
    for (let i = 0; i < contourPoints.length; i++) {
        const cp1 = contourPoints[i];
        const cp2 = contourPoints[(i + 1) % contourPoints.length];
        
        // Находим параметры для отрезка p1-p2
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const len = Math.hypot(dx, dy);
        if (len < 0.001) continue;
        
        // Находим пересечение
        const denom = (cp2.y - cp1.y) * dx - (cp2.x - cp1.x) * dy;
        if (Math.abs(denom) < 0.0001) continue;
        
        const u = ((cp2.x - cp1.x) * (p1.y - cp1.y) - (cp2.y - cp1.y) * (p1.x - cp1.x)) / denom;
        const t = ((dx) * (p1.y - cp1.y) - (dy) * (p1.x - cp1.x)) / denom;
        
        if (u >= 0 && u <= 1 && t >= 0 && t <= 1) {
            // Точка пересечения найдена
            const ix = p1.x + u * dx;
            const iy = p1.y + u * dy;
            return { x: ix, y: iy };
        }
    }
    return null;
}

// заливка ADD
updateFillInfo(message) {
    const info = document.getElementById('fillInfo');
    if (info) info.textContent = message;
}

getFullBezierContour(clickedPath) {
    // Находим вектор по пути
    const vector = this.state.bezierVectors.find(v => v.path === clickedPath);
    if (!vector) return null;
    
    // Собираем все связанные векторы
    const visited = new Set();
    const contourVectors = [];
    
    const findConnected = (v) => {
        if (visited.has(v)) return;
        visited.add(v);
        contourVectors.push(v);
        
        // Ищем векторы, связанные через любую из двух точек
        this.state.bezierVectors.forEach(other => {
            if (!visited.has(other)) {
                // Проверяем оба конца текущего вектора с обоими концами другого
                if (other.from === v.from || other.to === v.from ||
                    other.from === v.to || other.to === v.to) {
                    findConnected(other);
                }
            }
        });
    };
    
    findConnected(vector);
    
    if (contourVectors.length < 2) return null;
    
    // Строим упорядоченный путь, начиная с любой точки
    // Находим точку, которая встречается только 1 раз (начало/конец разомкнутого контура)
    const pointCount = new Map();
    contourVectors.forEach(v => {
        pointCount.set(v.from, (pointCount.get(v.from) || 0) + 1);
        pointCount.set(v.to, (pointCount.get(v.to) || 0) + 1);
    });
    
    // Находим начальную точку (где счетчик 1, если есть)
    let startPointIndex = null;
    for (let [idx, count] of pointCount) {
        if (count === 1) {
            startPointIndex = idx;
            break;
        }
    }
    
    // Если все точки имеют счетчик 2 (замкнутый контур), берем любую
    if (startPointIndex === null) {
        startPointIndex = contourVectors[0].from;
    }
    
    let currentPoint = startPointIndex;
    let pathD = '';
    let firstPoint = null;
    const usedVectors = [];
    
    // Обходим контур
    for (let i = 0; i < contourVectors.length; i++) {
        // Ищем вектор, содержащий currentPoint и не использованный
        const nextVector = contourVectors.find(v => 
            !usedVectors.includes(v) && (v.from === currentPoint || v.to === currentPoint)
        );
        
        if (!nextVector) break;
        
        usedVectors.push(nextVector);
        
        const fromPoint = this.state.bezierPoints[nextVector.from];
        const toPoint = this.state.bezierPoints[nextVector.to];
        
        // Определяем направление
        if (nextVector.from === currentPoint) {
            // Идем от from к to
            if (pathD === '') {
                pathD = `M ${fromPoint.x} ${fromPoint.y} `;
                firstPoint = fromPoint;
            }
            pathD += `C ${nextVector.control1.x} ${nextVector.control1.y} ${nextVector.control2.x} ${nextVector.control2.y} ${toPoint.x} ${toPoint.y} `;
            currentPoint = nextVector.to;
        } else {
            // Идем от to к from (обратное направление)
            if (pathD === '') {
                pathD = `M ${toPoint.x} ${toPoint.y} `;
                firstPoint = toPoint;
            }
            pathD += `C ${nextVector.control2.x} ${nextVector.control2.y} ${nextVector.control1.x} ${nextVector.control1.y} ${fromPoint.x} ${fromPoint.y} `;
            currentPoint = nextVector.from;
        }
    }
    
    // Замыкаем контур если нужно
    if (firstPoint && currentPoint !== firstPoint) {
        const currentPointObj = this.state.bezierPoints[currentPoint];
        if (currentPointObj) {
            pathD += `L ${firstPoint.x} ${firstPoint.y} `;
        }
    }
    
    pathD += 'Z';
    
    const tempPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    tempPath.setAttribute('d', pathD);
    tempPath.setAttribute('fill', 'none');
    tempPath.setAttribute('stroke', 'none');
    
    return tempPath;
}

// заливка конец
    // УТИЛИТЫ

    // ПОЛУЧЕНИЕ КООРДИНАТ В SVG
    getSVGCoordinates(e) {
        const pt = this.svg.createSVGPoint();
        pt.x = e.clientX;
        pt.y = e.clientY;
        return pt.matrixTransform(this.svg.getScreenCTM().inverse());
    }
      
// УПРОЩЕННАЯ функция привязки (оптимизированная)
snapToNonWhiteLine(x, y) {
    if (!this.state.image || !this.snapSettings.enabled) return null;
    
    const imageElement = document.getElementById('background-image');
    if (!imageElement) return null;
    
    // Координаты и размеры изображения в SVG
    const imgX = parseFloat(imageElement.getAttribute('x')) || 0;
    const imgY = parseFloat(imageElement.getAttribute('y')) || 0;
    const imgWidth = parseFloat(imageElement.getAttribute('width'));
    const imgHeight = parseFloat(imageElement.getAttribute('height'));
    
    // Используем imageForDisplay (версия с белым фоном для PNG)
    const imageForAnalysis = this.state.imageForDisplay || this.state.image;
    
    // Преобразуем SVG координаты в координаты изображения
    const imgCoordX = ((x - imgX) / imgWidth) * imageForAnalysis.width;
    const imgCoordY = ((y - imgY) / imgHeight) * imageForAnalysis.height;
    
    if (imgCoordX < 0 || imgCoordX >= imageForAnalysis.width || 
        imgCoordY < 0 || imgCoordY >= imageForAnalysis.height) {
        return null;
    }
    
    // Кэш изображения для быстрого доступа
    if (!this.imageCanvasCache) {
        this.imageCanvasCache = document.createElement('canvas');
        this.imageCanvasCache.width = imageForAnalysis.width;
        this.imageCanvasCache.height = imageForAnalysis.height;
        const ctx = this.imageCanvasCache.getContext('2d');
        ctx.drawImage(imageForAnalysis, 0, 0);
        this.imageDataCache = ctx.getImageData(0, 0, imageForAnalysis.width, imageForAnalysis.height);
    }
    
    const data = this.imageDataCache.data;
    const width = imageForAnalysis.width;
    const whiteThreshold = 200; // Фиксированный порог
    const searchRadius = 8; // Уменьшил радиус для скорости
    
    // Простой поиск ближайшего не-белого пикселя
    for (let r = 0; r <= searchRadius; r++) {
        const points = r === 0 ? 1 : r * 6; // Количество точек на радиусе
        
        for (let i = 0; i < points; i++) {
            const angle = (i / points) * Math.PI * 2;
            const px = Math.round(imgCoordX + r * Math.cos(angle));
            const py = Math.round(imgCoordY + r * Math.sin(angle));
            
            if (px < 0 || px >= width || py < 0 || py >= imageForAnalysis.height) {
                continue;
            }
            
            const idx = (py * width + px) * 4;
            const brightness = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
            
            // Если пиксель не белый (яркость < 200)
            if (brightness < whiteThreshold) {
                const snapX = (px / imageForAnalysis.width) * imgWidth + imgX;
                const snapY = (py / imageForAnalysis.height) * imgHeight + imgY;
                
                // Проверяем расстояние привязки
                const dist = Math.sqrt((x - snapX) ** 2 + (y - snapY) ** 2);
                const maxDist = this.snapSettings.snapDistance / this.state.zoom;
                
                if (dist <= maxDist) {
                    return {x: snapX, y: snapY};
                }
            }
        }
    }
    
    return null;
}

			 startLine(x, y) {
                this.state.currentElement = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                this.state.currentElement.setAttribute('x1', x);
                this.state.currentElement.setAttribute('y1', y);
                this.state.currentElement.setAttribute('x2', x);
                this.state.currentElement.setAttribute('y2', y);
                this.state.currentElement.setAttribute('stroke', this.state.strokeColor);
				this.state.currentElement.setAttribute('stroke-width', this.state.strokeWidth);
                this.state.currentElement.setAttribute('fill', 'none');
                
                this.vectorLayer.appendChild(this.state.currentElement);
            }
            
            updateLine(x, y) {
                this.state.currentElement.setAttribute('x2', x);
                this.state.currentElement.setAttribute('y2', y);
            }
            
            startRect(x, y) {
                this.state.currentElement = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                this.state.currentElement.setAttribute('x', x);
                this.state.currentElement.setAttribute('y', y);
                this.state.currentElement.setAttribute('width', '0');
                this.state.currentElement.setAttribute('height', '0');
                this.state.currentElement.setAttribute('stroke', this.state.strokeColor);
                this.state.currentElement.setAttribute('stroke-width', this.state.strokeWidth);
                this.state.currentElement.setAttribute('fill', 'none');
                
                this.svg.appendChild(this.state.currentElement);
            }
            
            updateRect(x, y) {
                const width = x - this.state.startPoint.x;
                const height = y - this.state.startPoint.y;
                
                this.state.currentElement.setAttribute('x', width >= 0 ? this.state.startPoint.x : x);
                this.state.currentElement.setAttribute('y', height >= 0 ? this.state.startPoint.y : y);
                this.state.currentElement.setAttribute('width', Math.abs(width));
                this.state.currentElement.setAttribute('height', Math.abs(height));
            }
            
            startCircle(x, y) {
                this.state.currentElement = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                this.state.currentElement.setAttribute('cx', x);
                this.state.currentElement.setAttribute('cy', y);
                this.state.currentElement.setAttribute('r', '0');
                this.state.currentElement.setAttribute('stroke', this.state.strokeColor);
                this.state.currentElement.setAttribute('stroke-width', this.state.strokeWidth);
                this.state.currentElement.setAttribute('fill', 'none');
                
                this.svg.appendChild(this.state.currentElement);
            }
            
            updateCircle(x, y) {
                const dx = x - this.state.startPoint.x;
                const dy = y - this.state.startPoint.y;
                const radius = Math.sqrt(dx * dx + dy * dy);
                
                this.state.currentElement.setAttribute('r', radius);
            }

            updateCoordinates(e) {
                const coords = this.getSVGCoordinates(e);
                document.getElementById('coordinates').textContent = 
                    `X: ${Math.round(coords.x)}, Y: ${Math.round(coords.y)}`;
            }
// СКРЫТЬ ВСЕ ВСПОМОГАТЕЛЬНЫЕ ЭЛЕМЕНТЫ БЕЗЬЕ
hideBezierHelpers() {
    // Скрываем все вспомогательные линии
    document.querySelectorAll('.bezier-guide-line').forEach(line => {
        line.style.display = 'none';
    });
    
    // Скрываем все контрольные точки
    document.querySelectorAll('.bezier-control-point').forEach(point => {
        point.style.display = 'none';
    });
    
    // Снимаем выделение с точек
    this.deselectAllPoints();
}

// ПОКАЗАТЬ ВСЕ ВСПОМОГАТЕЛЬНЫЕ ЭЛЕМЕНТЫ БЕЗЬЕ
showBezierHelpers() {
    // Показываем направляющие только для тех векторов, где control не совпадает с точкой
    this.state.bezierVectors.forEach(vector => {
        const fromPoint = this.state.bezierPoints[vector.from];
        const toPoint = this.state.bezierPoints[vector.to];
        
        if (!fromPoint || !toPoint) return;
        
        // Проверяем control1 (принадлежит fromPoint)
        const control1Dist = Math.hypot(vector.control1.x - fromPoint.x, vector.control1.y - fromPoint.y);
        
        if (control1Dist > 0.5) {
            // Контрольная точка не совпадает — показываем
            if (vector.guideElements.line1) {
                vector.guideElements.line1.style.display = 'block';
            }
            if (vector.guideElements.control1) {
                vector.guideElements.control1.style.display = 'block';
            }
        } else {
            // Контрольная точка совпадает с точкой — скрываем (угловая точка)
            if (vector.guideElements.line1) {
                vector.guideElements.line1.style.display = 'none';
            }
            if (vector.guideElements.control1) {
                vector.guideElements.control1.style.display = 'none';
            }
        }
        
        // Проверяем control2 (принадлежит toPoint)
        const control2Dist = Math.hypot(vector.control2.x - toPoint.x, vector.control2.y - toPoint.y);
        
        if (control2Dist > 0.5) {
            // Контрольная точка не совпадает — показываем
            if (vector.guideElements.line2) {
                vector.guideElements.line2.style.display = 'block';
            }
            if (vector.guideElements.control2) {
                vector.guideElements.control2.style.display = 'block';
            }
        } else {
            // Контрольная точка совпадает с точкой — скрываем (угловая точка)
            if (vector.guideElements.line2) {
                vector.guideElements.line2.style.display = 'none';
            }
            if (vector.guideElements.control2) {
                vector.guideElements.control2.style.display = 'none';
            }
        }
        
        // Обновляем координаты направляющих (на случай если точки двигались)
        if (control1Dist > 0.5 && vector.guideElements.line1) {
            vector.guideElements.line1.setAttribute('x1', fromPoint.x);
            vector.guideElements.line1.setAttribute('y1', fromPoint.y);
            vector.guideElements.line1.setAttribute('x2', vector.control1.x);
            vector.guideElements.line1.setAttribute('y2', vector.control1.y);
        }
        if (vector.guideElements.control1) {
            vector.guideElements.control1.setAttribute('cx', vector.control1.x);
            vector.guideElements.control1.setAttribute('cy', vector.control1.y);
        }
        
        if (control2Dist > 0.5 && vector.guideElements.line2) {
            vector.guideElements.line2.setAttribute('x1', toPoint.x);
            vector.guideElements.line2.setAttribute('y1', toPoint.y);
            vector.guideElements.line2.setAttribute('x2', vector.control2.x);
            vector.guideElements.line2.setAttribute('y2', vector.control2.y);
        }
        if (vector.guideElements.control2) {
            vector.guideElements.control2.setAttribute('cx', vector.control2.x);
            vector.guideElements.control2.setAttribute('cy', vector.control2.y);
        }
    });
    
    // Снимаем выделение с точек
    this.deselectAllPoints();
}

// СКРЫТЬ/ПОКАЗАТЬ ОСНОВНЫЕ ТОЧКИ БЕЗЬЕ
toggleBezierPoints(show) {
    document.querySelectorAll('.bezier-point').forEach(point => {
        point.style.display = show ? 'block' : 'none';
    });
}
       
clearVectors() {
    if (!confirm('Удалить все векторы?')) return;
    
    // Удаляем все векторы Безье (и вспомогательные элементы)
    document.querySelectorAll('.bezier-vector, .bezier-guide-line, .bezier-control-point, .bezier-point').forEach(el => {
        el.remove();
    });
    
    // Также удаляем обычные векторы
    const vectorElements = this.svg.querySelectorAll('path:not([id*="indicator"]):not([id*="background"]), line, rect, circle');
    vectorElements.forEach(el => {
        if (!el.classList.contains('bezier-vector') && 
            !el.classList.contains('bezier-guide-line') && 
            !el.classList.contains('bezier-control-point') && 
            !el.classList.contains('bezier-point')) {
            el.remove();
        }
    });
    
    // Сбрасываем состояние
    this.state.currentElement = null;
    this.state.isDrawing = false;
    this.state.penPoints = [];
    this.pushData = null;
    this.state.bezierPoints = [];
    this.state.bezierVectors = [];
    this.state.bezierSelectedPoint = null;
    this.state.lastBezierDirection = null;
    this.state.lastBezierLength = null;
}

transformPathToMM(d, toMM) {
    if (!d) return '';
    
    const commands = d.match(/[a-df-zA-DF-Z][^a-df-zA-DF-Z]*/g) || [];
    let result = '';
    
    commands.forEach(cmd => {
        const command = cmd[0];
        const numbers = cmd.substring(1).trim().split(/[\s,]+/).filter(n => n !== '').map(Number);
        
        if (numbers.length === 0) {
            result += command + ' ';
            return;
        }
        
        let newCmd = command;
        
        for (let i = 0; i < numbers.length; i += 2) {
            if (i + 1 < numbers.length) {
                const pt = toMM(numbers[i], numbers[i + 1]);
                newCmd += ` ${pt.x.toFixed(3)} ${pt.y.toFixed(3)}`;
            }
        }
        
        result += newCmd + ' ';
    });
    
    return result.trim();
}
