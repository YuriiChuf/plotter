function handleKeyDown(event) {
    // Если открыто окно ввода текста - не обрабатываем клавиши
    if (isAddingText) {
        // В режиме ввода текста обрабатываем только Escape для отмены
        if (event.key === 'Escape' || event.key === 'Esc') {
            cancelTextInput();
            event.preventDefault();
        }
        return;
    }
    
    // Предотвращаем действие браузера для функциональных клавиш
    const isFunctionalKey = ['Delete', 'Del', 'Escape', 'Esc', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key);
    
    switch(event.key) {
        case 'Delete':
        case 'Del':
            // Проверяем любой выделенный элемент
            if (selectedElementIndex !== -1 || 
                (isSVGSelected && selectedSVGIndex !== -1) ||
                (isQRSelected && selectedQRIndex !== -1)) {
                deleteSelectedElement();
                event.preventDefault();
            }
            break;
            
        case 'Escape':
        case 'Esc':
            // Снимаем выделение с любого элемента
            if (selectedElementIndex !== -1 || 
                (isSVGSelected && selectedSVGIndex !== -1) ||
                (isQRSelected && selectedQRIndex !== -1)) {
                
                selectedElementIndex = -1;
                isSVGSelected = false;
                selectedSVGIndex = -1;
                isQRSelected = false;
                selectedQRIndex = -1;
                
                updateTextElementsList();
                updateSVGElementsList();
                updateQRElementsList();
                updateElementProperties();
                updateDeleteButtonsVisibility();
                drawScene();
                updateStatus('Выделение снято', 'success');
                event.preventDefault();
            }
            break;
            
        case 'ArrowUp':
            if ((selectedElementIndex !== -1 || (isSVGSelected && selectedSVGIndex !== -1)) && event.ctrlKey) {
                // Ctrl+↑ - переместить элемент вверх на 1 мм
                moveSelectedElement(0, 1);
                event.preventDefault();
            } else if ((selectedElementIndex !== -1 || (isSVGSelected && selectedSVGIndex !== -1)) && event.shiftKey) {
                // Shift+↑ - увеличить размер/масштаб
                resizeSelectedElement(0, 1);
                event.preventDefault();
            } else if ((selectedElementIndex !== -1 || (isSVGSelected && selectedSVGIndex !== -1)) && event.altKey) {
                // Alt+↑ - повернуть против часовой стрелки
                rotateSelectedElement(5);
                event.preventDefault();
            }
            break;
            
        case 'ArrowDown':
            if ((selectedElementIndex !== -1 || (isSVGSelected && selectedSVGIndex !== -1)) && event.ctrlKey) {
                // Ctrl+↓ - переместить элемент вниз на 1 мм
                moveSelectedElement(0, -1);
                event.preventDefault();
            } else if ((selectedElementIndex !== -1 || (isSVGSelected && selectedSVGIndex !== -1)) && event.shiftKey) {
                // Shift+↓ - уменьшить размер/масштаб
                resizeSelectedElement(0, -1);
                event.preventDefault();
            } else if ((selectedElementIndex !== -1 || (isSVGSelected && selectedSVGIndex !== -1)) && event.altKey) {
                // Alt+↓ - повернуть по часовой стрелке
                rotateSelectedElement(-5);
                event.preventDefault();
            }
            break;
            
        case 'ArrowLeft':
            if ((selectedElementIndex !== -1 || (isSVGSelected && selectedSVGIndex !== -1)) && event.ctrlKey) {
                // Ctrl+← - переместить элемент влево на 1 мм
                moveSelectedElement(-1, 0);
                event.preventDefault();
            } else if ((selectedElementIndex !== -1 || (isSVGSelected && selectedSVGIndex !== -1)) && event.shiftKey) {
                // Shift+← - уменьшить ширину/размер
                resizeSelectedElement(-1, 0);
                event.preventDefault();
            } else if ((selectedElementIndex !== -1 || (isSVGSelected && selectedSVGIndex !== -1)) && event.altKey) {
                // Alt+← - повернуть против часовой стрелки (мелкий шаг)
                rotateSelectedElement(1);
                event.preventDefault();
            }
            break;
            
        case 'ArrowRight':
            if ((selectedElementIndex !== -1 || (isSVGSelected && selectedSVGIndex !== -1)) && event.ctrlKey) {
                // Ctrl+→ - переместить элемент вправо на 1 мм
                moveSelectedElement(1, 0);
                event.preventDefault();
            } else if ((selectedElementIndex !== -1 || (isSVGSelected && selectedSVGIndex !== -1)) && event.shiftKey) {
                // Shift+→ - увеличить ширину/размер
                resizeSelectedElement(1, 0);
                event.preventDefault();
            } else if ((selectedElementIndex !== -1 || (isSVGSelected && selectedSVGIndex !== -1)) && event.altKey) {
                // Alt+→ - повернуть по часовой стрелке (мелкий шаг)
                rotateSelectedElement(-1);
                event.preventDefault();
            }
            break;
            
        case 'r':
        case 'R':
            if ((selectedElementIndex !== -1 || (isSVGSelected && selectedSVGIndex !== -1)) && event.ctrlKey) {
                // Ctrl+R - сбросить поворот
                resetRotation();
                event.preventDefault();
            }
            break;
            
        case 's':
        case 'S':
            if ((selectedElementIndex !== -1 || (isSVGSelected && selectedSVGIndex !== -1)) && event.ctrlKey) {
                // Ctrl+S - сбросить масштаб к 1
                resetScale();
                event.preventDefault();
            }
            break;
            
        case ' ':
            // Пробел - переключение видимости фона
            if (!event.target.matches('input, textarea, select')) {
                toggleBackground();
                event.preventDefault();
            }
            break;
            
        case 'F1':
            // F1 - показать справку
            showHelp();
            event.preventDefault();
            break;
            
        case 'Tab':
            // Tab - переключение между элементами
            if (!event.target.matches('input, textarea, select')) {
                if (event.shiftKey) {
                    selectPreviousElement();
                } else {
                    selectNextElement();
                }
                event.preventDefault();
            }
            break;
    }
    
    // Если нажата функциональная клавиша, предотвращаем стандартное поведение
    if (isFunctionalKey && (event.ctrlKey || event.shiftKey || event.altKey)) {
        event.preventDefault();
    }
}

function resizeSelectedElement(deltaWidth, deltaHeight) {
    if (isSVGSelected && selectedSVGIndex !== -1) {
        const element = svgElements[selectedSVGIndex];
        const newScale = element.scale + deltaWidth * 0.1;
        if (newScale > 0.1 && newScale < 10) {
            element.scale = newScale;
            updateElementProperties();
            drawScene();
            updateStatus(`Масштаб SVG: ${(element.scale * 100).toFixed(0)}%`, 'success');
        }
    } else if (selectedElementIndex !== -1) {
        const element = textElements[selectedElementIndex];
        const newFontSize = element.fontSize + deltaHeight;
        if (newFontSize >= 1 && newFontSize <= 100) {
            element.updateFontSize(newFontSize);
            updateElementProperties();
            drawScene();
            updateStatus(`Размер шрифта: ${newFontSize}мм`, 'success');
        }
    }
}

function rotateSelectedElement(degrees) {
    const radians = degrees * Math.PI / 180;
    
    if (isSVGSelected && selectedSVGIndex !== -1) {
        const element = svgElements[selectedSVGIndex];
        element.rotation += radians;
        updateElementProperties();
        drawScene();
        updateStatus(`Поворот SVG: ${(element.rotation * 180 / Math.PI).toFixed(1)}°`, 'success');
    } else if (selectedElementIndex !== -1) {
        const element = textElements[selectedElementIndex];
        element.rotation += radians;
        updateElementProperties();
        drawScene();
        updateStatus(`Поворот текста: ${(element.rotation * 180 / Math.PI).toFixed(1)}°`, 'success');
    }
}

function resetRotation() {
    if (isSVGSelected && selectedSVGIndex !== -1) {
        const element = svgElements[selectedSVGIndex];
        element.rotation = 0;
        updateElementProperties();
        drawScene();
        updateStatus('Поворот SVG сброшен', 'success');
    } else if (selectedElementIndex !== -1) {
        const element = textElements[selectedElementIndex];
        element.rotation = 0;

// Общая функция обработки части SVG
function processSVGPart(svgElement, selectionRect, modifyOriginal = false) {
    const pathsInSelection = [];
    const pathsOutsideInWorld = [];
    const rectMinX = selectionRect.x;
    const rectMinY = selectionRect.y;
    const rectMaxX = selectionRect.x + selectionRect.width;
    const rectMaxY = selectionRect.y + selectionRect.height;
    
    const allPaths = svgElement.getGcodePaths();
    
    let extractedMinX = Infinity, extractedMinY = Infinity;
    let extractedMaxX = -Infinity, extractedMaxY = -Infinity;
    
    for (const path of allPaths) {
        const segmentsInRect = [];
        const segmentsOutside = [];
        
        let currentInside = [];
        let currentOutside = [];
        let isInside = false;
        
        for (let i = 0; i < path.length; i++) {
            const point = path[i];
            const inRect = point.x >= rectMinX && point.x <= rectMaxX &&
                          point.y >= rectMinY && point.y <= rectMaxY;
            
            if (inRect) {
                if (!isInside && currentOutside.length > 0) {
                    if (i > 0) {
                        const prevPoint = path[i - 1];
                        const intersection = findIntersectionWithRect(prevPoint, point, selectionRect);
                        if (intersection) {
                            currentOutside.push({ x: intersection.x, y: intersection.y });
                            segmentsOutside.push([...currentOutside]);
                            currentOutside = [];
                            
                            currentInside.push({ x: intersection.x, y: intersection.y });
                        }
                    } else {
                        segmentsOutside.push([...currentOutside]);
                        currentOutside = [];
                    }
                }
                isInside = true;
                currentInside.push({ x: point.x, y: point.y });
                
                extractedMinX = Math.min(extractedMinX, point.x);
                extractedMinY = Math.min(extractedMinY, point.y);
                extractedMaxX = Math.max(extractedMaxX, point.x);
                extractedMaxY = Math.max(extractedMaxY, point.y);
                
            } else {
                if (isInside && currentInside.length > 0) {
                    if (i > 0) {
                        const prevPoint = path[i - 1];
                        const intersection = findIntersectionWithRect(prevPoint, point, selectionRect);
                        if (intersection) {
                            currentInside.push({ x: intersection.x, y: intersection.y });
                            extractedMinX = Math.min(extractedMinX, intersection.x);
                            extractedMinY = Math.min(extractedMinY, intersection.y);
                            extractedMaxX = Math.max(extractedMaxX, intersection.x);
                            extractedMaxY = Math.max(extractedMaxY, intersection.y);
                            
                            segmentsInRect.push([...currentInside]);
                            currentInside = [];
                            
                            currentOutside.push({ x: intersection.x, y: intersection.y });
                        }
                    } else {
                        segmentsInRect.push([...currentInside]);
                        currentInside = [];
                    }
                }
                isInside = false;
                currentOutside.push({ x: point.x, y: point.y });
            }
        }
        
        if (currentInside.length > 0) {
            segmentsInRect.push(currentInside);
        }
        if (currentOutside.length > 0) {
            segmentsOutside.push(currentOutside);
        }
        
        for (const seg of segmentsInRect) {
            if (seg.length >= 2) pathsInSelection.push(seg);
        }
        for (const seg of segmentsOutside) {
            if (seg.length >= 2) pathsOutsideInWorld.push(seg);
        }
    }
    
    if (pathsInSelection.length === 0) {
        return null;
    }
    
    // Обратное преобразование оставшихся путей
    const scale = svgElement.scale * svgElement.baseScale;
    const elementWidth = svgElement.width * svgElement.scale;
    const elementHeight = svgElement.height * svgElement.scale;
    const centerX = svgElement.x + elementWidth / 2;
    const centerY = svgElement.y + elementHeight / 2;
    const cos = Math.cos(svgElement.rotation);
    const sin = Math.sin(svgElement.rotation);
    
    const scaleSquared = scale / scale; // Как вы сказали
    
    const newVectorPaths = pathsOutsideInWorld.map(path => 
        path.map((p, i) => {
            const dx = p.x - centerX;
            const dy = p.y - centerY;
            const unrotatedX = dx * cos + dy * sin + centerX;
            const unrotatedY = -dx * sin + dy * cos + centerY;
            
            const localX = (unrotatedX - svgElement.x) / scaleSquared;
            const localY = (elementHeight - (unrotatedY - svgElement.y)) / scaleSquared;
            
            return { x: localX, y: localY, move: i === 0 };
        })
    ).filter(p => p.length >= 2);
    
    // Обновляем оригинал только если нужно
    if (modifyOriginal) {
        svgElement.vectorPaths = newVectorPaths;
        
        if (newVectorPaths.length === 0) {
            const index = svgElements.indexOf(svgElement);
            if (index !== -1) svgElements.splice(index, 1);
        }
    }
    
    // Создаём новый элемент
    const extractedWidth = extractedMaxX - extractedMinX;
    const extractedHeight = extractedMaxY - extractedMinY;
    
    if (extractedWidth <= 0 || extractedHeight <= 0) {
        return null;
    }
    
    const newSVG = new SVGElement(
        Date.now(),
        '<svg><path/></svg>',
        extractedMinX,
        extractedMinY,
        extractedWidth,
        extractedHeight,
        modifyOriginal ? 'Вырезанная_часть' : 'Копия_части'
    );
    
    const localPaths = pathsInSelection.map(path =>
        path.map((p, i) => ({
            x: p.x - extractedMinX,
            y: extractedHeight - (p.y - extractedMinY),
            move: i === 0
        }))
    );
    
    newSVG.vectorPaths = localPaths;
    newSVG.scale = 1;
    newSVG.rotation = 0;
    newSVG.baseScale = 1;
    newSVG.sourceType = svgElement.sourceType;
    newSVG.x = extractedMinX;
    newSVG.y = extractedMinY;
    newSVG.width = extractedWidth;
    newSVG.height = extractedHeight;
    newSVG.originalWidth = extractedWidth;
    newSVG.originalHeight = extractedHeight;
    
    // Canvas
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(10, Math.min(50, extractedWidth));
    canvas.height = Math.max(10, Math.min(50, extractedHeight));
    
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    
    const scaleX = canvas.width / extractedWidth;
    const scaleY = canvas.height / extractedHeight;
    
    for (const path of localPaths) {
        if (path.length < 2) continue;
        ctx.beginPath();
        ctx.moveTo(path[0].x * scaleX, canvas.height - path[0].y * scaleY);
        for (let i = 1; i < path.length; i++) {
            ctx.lineTo(path[i].x * scaleX, canvas.height - path[i].y * scaleY);
        }
        ctx.stroke();
    }
    
    newSVG.svgImage = canvas;
    
    return newSVG;
}

// Найти пересечение отрезка с прямоугольником
function findIntersectionWithRect(p1, p2, rect) {
    const rectLines = [
        { x1: rect.x, y1: rect.y, x2: rect.x + rect.width, y2: rect.y }, // низ
        { x1: rect.x + rect.width, y1: rect.y, x2: rect.x + rect.width, y2: rect.y + rect.height }, // право
        { x1: rect.x + rect.width, y1: rect.y + rect.height, x2: rect.x, y2: rect.y + rect.height }, // верх
        { x1: rect.x, y1: rect.y + rect.height, x2: rect.x, y2: rect.y } // лево
    ];
    
    for (const line of rectLines) {
        const intersection = lineIntersection(
            p1.x, p1.y, p2.x, p2.y,
            line.x1, line.y1, line.x2, line.y2
        );
        if (intersection) return intersection;
    }
    
    return null;
}

// Найти все пересечения линии с прямоугольником
function findLineRectIntersections(p1, p2, rect) {
    const intersections = [];
    const rectLines = [
        { x1: rect.x, y1: rect.y, x2: rect.x + rect.width, y2: rect.y },
        { x1: rect.x + rect.width, y1: rect.y, x2: rect.x + rect.width, y2: rect.y + rect.height },
        { x1: rect.x + rect.width, y1: rect.y + rect.height, x2: rect.x, y2: rect.y + rect.height },
        { x1: rect.x, y1: rect.y + rect.height, x2: rect.x, y2: rect.y }
    ];
    
    for (const line of rectLines) {
        const intersection = lineIntersection(
            p1.x, p1.y, p2.x, p2.y,
            line.x1, line.y1, line.x2, line.y2
        );
        if (intersection) {
            // Проверяем, нет ли уже такой точки
            const exists = intersections.some(p => 
                Math.abs(p.x - intersection.x) < 0.01 && Math.abs(p.y - intersection.y) < 0.01
            );
            if (!exists) {
                intersections.push(intersection);
            }
        }
    }
    
    return intersections;
}

// Пересечение двух отрезков
function lineIntersection(x1, y1, x2, y2, x3, y3, x4, y4) {
    const denom = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
    if (denom === 0) return null;
    
    const ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denom;
    const ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / denom;
    
    if (ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1) {
        return {
            x: x1 + ua * (x2 - x1),
            y: y1 + ua * (y2 - y1)
        };
    }
    
    return null;
}

// Создать canvas для предпросмотра
function createPreviewCanvas(paths, width, height) {
    const canvas = document.createElement('canvas');
    const maxSize = 100;
    let canvasWidth, canvasHeight;
    
    if (width > height) {
        canvasWidth = maxSize;
        canvasHeight = (height / width) * maxSize;
    } else {
        canvasHeight = maxSize;
        canvasWidth = (width / height) * maxSize;
    }
    
    canvas.width = Math.max(10, canvasWidth);
    canvas.height = Math.max(10, canvasHeight);
    
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1;
    
    const scaleX = canvas.width / width;
    const scaleY = canvas.height / height;
    
    for (const path of paths) {
        if (path.length < 2) continue;
        
        ctx.beginPath();
        ctx.moveTo(path[0].x * scaleX, canvas.height - path[0].y * scaleY); // Инверсия Y для canvas
        
        for (let i = 1; i < path.length; i++) {
            ctx.lineTo(path[i].x * scaleX, canvas.height - path[i].y * scaleY);
        }
        
        ctx.stroke();
    }
    
    return canvas;
}

function CopyPartFromSVG(svgElement, selectionRect) {

    for (const path of gcodePaths) {

                });

    const canvas = document.createElement('canvas');
    canvas.width = Math.max(10, Math.min(50, selectionRect.width));
    canvas.height = Math.max(10, Math.min(50, selectionRect.height));
    
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000000';
    
    const scaleX = canvas.width / selectionRect.width;
    const scaleY = canvas.height / selectionRect.height;
    const scale = Math.min(scaleX, scaleY);
    
    for (const path of pathsInSelection) {
        if (path.length < 4) continue;
        
        ctx.beginPath();
        ctx.moveTo(path[0].x * scale, path[0].y * scale);
        
        for (let i = 1; i < path.length; i++) {
            ctx.lineTo(path[i].x * scale, path[i].y * scale);
        }
        
        ctx.closePath();
        ctx.fill();
    }
    
    newSVG.svgImage = canvas;
    
    return newSVG;
}


// Проверка валидности выделения
function isValidSelection() {
    const rect = getSelectionRect();
    return rect.width > 1 && rect.height > 1;
}

// Получить прямоугольник выделения
function getSelectionRect() {
    return {
        x: Math.min(selectionStart.x, selectionCurrent.x),
        y: Math.min(selectionStart.y, selectionCurrent.y),
        width: Math.abs(selectionCurrent.x - selectionStart.x),
        height: Math.abs(selectionCurrent.y - selectionStart.y)
    };
}

function rectsIntersect(rect1, rect2) {

}

function handleCanvasClick(event) {
    if (justFinishedSelection) {
        justFinishedSelection = false;
        return;
    }
    
    if (isAddingText) return;
    
    // ЕСЛИ ТОЛЬКО ЧТО ПЕРЕМЕЩАЛИ ЭЛЕМЕНТ - НЕ ДОБАВЛЯЕМ ТЕКСТ
    if (isMovingElement) {

        return;
    }
    
    // Дебаунс кликов
    if (clickTimeout) {
        clearTimeout(clickTimeout);
    }
    
    clickTimeout = setTimeout(() => {
        const rect = mainCanvas.getBoundingClientRect();
        const x = (event.clientX - rect.left) / scaleFactor;
        const y = sheetHeight - (event.clientY - rect.top) / scaleFactor;
        
        // Проверяем, есть ли в месте клика уже выделенный элемент
        let clickedOnSelectedElement = false;
        
        // Проверяем выделенный QR элемент
        if (isQRSelected && selectedQRIndex !== -1) {
            const selectedElement = qrElements[selectedQRIndex];
            if (selectedElement && isPointInQRElement(x, y, selectedElement)) {
                clickedOnSelectedElement = true;
            }
        }
        
        // Проверяем выделенный SVG элемент
        if (!clickedOnSelectedElement && isSVGSelected && selectedSVGIndex !== -1) {
            const selectedElement = svgElements[selectedSVGIndex];
            if (selectedElement && isPointInSVGElement(x, y, selectedElement)) {
                clickedOnSelectedElement = true;
            }
        }
        
        // Проверяем выделенный текстовый элемент
        if (!clickedOnSelectedElement && selectedElementIndex !== -1) {
            const selectedElement = textElements[selectedElementIndex];
            if (selectedElement && isPointInTextElement(x, y, selectedElement)) {
                clickedOnSelectedElement = true;
            }
        }
        
        // Если кликнули на уже выделенный элемент - ничего не делаем
        if (clickedOnSelectedElement) {

            clickTimeout = null;
            return;
        }
        
        // Если НЕ кликнули на выделенный элемент - ищем верхний элемент в этой точке
        
        // Сначала проверяем QR элементы (сверху вниз)
        for (let i = qrElements.length - 1; i >= 0; i--) {
            const element = qrElements[i];
            if (isPointInQRElement(x, y, element)) {
                // Нашли QR элемент - выбираем его
                selectedQRIndex = i;
                isQRSelected = true;
                isSVGSelected = false;
                selectedElementIndex = -1;
                selectedSVGIndex = -1;
                
                updateTextElementsList();
                updateSVGElementsList();
                updateQRElementsList();
                updateElementProperties();
                updateDeleteButtonsVisibility();
                drawScene();
                updateStatus(`QR-код выбран`, 'success');
                
                clickTimeout = null;
                return;
            }
        }
        
        // Проверяем SVG элементы
        for (let i = svgElements.length - 1; i >= 0; i--) {
            const element = svgElements[i];
            if (isPointInSVGElement(x, y, element)) {
                selectedSVGIndex = i;
                isSVGSelected = true;
                isQRSelected = false;
                selectedElementIndex = -1;
                selectedQRIndex = -1;
                
                updateTextElementsList();
                updateSVGElementsList();
                updateQRElementsList();
                updateElementProperties();
                updateDeleteButtonsVisibility();
                drawScene();
                
                clickTimeout = null;
                return;
            }
        }
        
        // Проверяем текстовые элементы
        for (let i = textElements.length - 1; i >= 0; i--) {
            const element = textElements[i];
            if (isPointInTextElement(x, y, element)) {
                selectedElementIndex = i;
                isSVGSelected = false;
                isQRSelected = false;
                selectedSVGIndex = -1;
                selectedQRIndex = -1;
                
                updateTextElementsList();
                updateSVGElementsList();
                updateQRElementsList();
                updateElementProperties();
                updateDeleteButtonsVisibility();
                drawScene();
                
                clickTimeout = null;
                return;
            }
        }
        
        // УДАЛЕНО: если не нашли ни одного элемента - просто снимаем выделение, НЕ создаём текст
        selectedElementIndex = -1;
        isSVGSelected = false;
        isQRSelected = false;
        selectedSVGIndex = -1;
        selectedQRIndex = -1;
        updateTextElementsList();
        updateSVGElementsList();
        updateQRElementsList();
        updateElementProperties();
        updateDeleteButtonsVisibility();
        drawScene();

        clickTimeout = null;
    }, 50);
}

function formatQRData(type, input) {
    switch(type) {
        case 'url':
            // Добавляем протокол если его нет
            if (!input.match(/^https?:\/\//i)) {
                return 'http://' + input;
            }
            return input;
            
        case 'phone':
            // Удаляем все кроме цифр и плюса
            let phone = input.replace(/[^\d+]/g, '');
            return 'tel:' + phone;
            
        case 'email':
            return 'mailto:' + input;
            
        case 'sms':
            // Формат: номер|текст
            let parts = input.split('|');
            if (parts.length >= 2) {
                return 'sms:' + parts[0] + '?body=' + encodeURIComponent(parts[1]);
            } else {
                return 'sms:' + input;
            }
            
        case 'wifi':
            // Формат: SSID|password|тип_шифрования (WPA/WEP/none)
            let wifiParts = input.split('|');
            let ssid = wifiParts[0] || '';
            let password = wifiParts[1] || '';
            let encryption = wifiParts[2] || 'WPA';
            
            return `WIFI:S:${ssid};T:${encryption};P:${password};;`;
            
        case 'vcard':
            // Формат: Имя|Фамилия|Телефон|Email|Организация|Должность
            let vcardParts = input.split('|');
            let firstName = vcardParts[0] || '';
            let lastName = vcardParts[1] || '';
            let vcardPhone = vcardParts[2] || '';
            let vcardEmail = vcardParts[3] || '';
            let org = vcardParts[4] || '';
            let title = vcardParts[5] || '';
            
            let vcard = 'BEGIN:VCARD\n';
            vcard += 'VERSION:3.0\n';
            vcard += `N:${lastName};${firstName};;;\n`;
            vcard += `FN:${firstName} ${lastName}\n`;
            if (vcardPhone) vcard += `TEL:${vcardPhone}\n`;
            if (vcardEmail) vcard += `EMAIL:${vcardEmail}\n`;
            if (org) vcard += `ORG:${org}\n`;
            if (title) vcard += `TITLE:${title}\n`;
            vcard += 'END:VCARD';
            
            return vcard;
            
        case 'text':
        default:
            return input;
    }
}

async function addQRElementAtPosition(text, type, x, y) {
    showLoading(true);
    try {
        // Форматируем данные в зависимости от типа
        const formattedData = formatQRData(type, text);

        
        const newQR = new QRElement(
            Date.now(),
            formattedData, // Используем форматированные данные
            x,
            y,
            50, // размер
            type, // тип данных
            0.8 // шаг штриховки
        );
        
        // Сохраняем исходный текст для отображения
        newQR.originalText = text;
        
        qrElements.push(newQR);
        selectedQRIndex = qrElements.length - 1;
        isQRSelected = true;
        
        updateQRElementsList();
        drawScene();
        updateStatus(`QR-код типа "${type}" добавлен`, 'success');
    } catch (error) {
        console.error('Ошибка создания QR-кода:', error);
        updateStatus('Ошибка создания QR-кода: ' + error.message, 'error');
    } finally {
        showLoading(false);
    }
}

function detectQRType(text) {
    text = text.replace(/^(URL:|Тел:|Email:|SMS:|WiFi:|vCard:)\s*/i, '');
    
    if (text.match(/^https?:\/\//i)) return 'url';
    if (text.match(/^\+?\d[\d\s\-\(\)]{7,}/)) return 'phone';
    if (text.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) return 'email';
    if (text.includes('|') && text.split('|')[0].match(/^\+?\d+/)) return 'sms';
    if (text.includes('|') && text.split('|').length >= 2) return 'wifi';
    
    return 'text';
}

function removeTypePrefix(text) {
    return text.replace(/^(URL:|Тел:|Email:|SMS:|WiFi:|vCard:)\s*/i, '');
}

async function updateQRElementText(index, newText, newType) {
    if (index < 0 || index >= qrElements.length) return;
    
    const element = qrElements[index];
    const oldText = element.text;
    const oldType = element.type;
    
    if (oldText === newText && oldType === newType) {
        cancelTextInput();
        return;
    }
    
    showLoading(true);
    try {
        // Форматируем данные для QR кода
        const formattedData = formatQRData(newType, newText);
        
        // Создаем новый QR элемент с обновленным текстом и выбранным типом
        const newQR = new QRElement(
            element.id,
            formattedData,
            element.x,
            element.y,
            element.size,
            newType,
            element.hatchStep || 0.8
        );
        
        // Сохраняем исходный текст
        newQR.originalText = newText;
        
        // Копируем свойства
        newQR.rotation = element.rotation;
        newQR.scale = element.scale;
        
        // Заменяем старый элемент новым
        qrElements[index] = newQR;
        
        updateQRElementsList();
        drawScene();
        updateStatus(`QR-код обновлен: тип ${oldType} -> ${newType}`, 'success');
    } catch (error) {
        console.error('Ошибка обновления QR-кода:', error);
        updateStatus('Ошибка обновления QR-кода: ' + error.message, 'error');
    } finally {
        showLoading(false);
    }
}

			const newSize = parseFloat(elementFontSizeInput.value);

			// Меняем геометрию
			element.x = newX;
			element.y = newY;
			element.scale = newSize / element.size;
			element.rotation = newRotation;
			
			// Применяем новый шаг штриховки и перегенерируем QR-код
			if (Math.abs(element.hatchStep - newHatchStep) > 0.01) {
				element.hatchStep = newHatchStep;
				// Перегенерируем QR-код с новым шагом штриховки
				const originalText = element.originalText || element.text;
				const type = element.type || 'text';
				
				// Создаём новый QR элемент с обновлённым шагом штриховки
				const newQR = new QRElement(
					element.id,
					element.text, // используем текущий текст (уже отформатированный)
					element.x,
					element.y,
					element.size,
					type,
					newHatchStep
				);
				
				// Копируем все свойства
				newQR.originalText = originalText;
				newQR.rotation = element.rotation;
				newQR.scale = element.scale;
				
				// Заменяем старый элемент новым
				qrElements[selectedQRIndex] = newQR;
			}
			
			drawScene();
			updateStatus('Свойства QR-кода обновлены', 'success');
		}
        
        // Обработка SVG элемента
        else if (isSVGSelected && selectedSVGIndex !== -1) {
            const element = svgElements[selectedSVGIndex];
            const newX = parseFloat(elementXInput.value);
            const newY = parseFloat(elementYInput.value);
            const newWidth = parseFloat(elementFontSizeInput.value);
            const newRotation = parseFloat(elementRotationInput.value) * Math.PI / 180;

            element.x = newX;
            element.y = newY;
            element.scale = newWidth / element.width;
            element.rotation = newRotation;

            drawScene();
            updateStatus('Свойства SVG обновлены', 'success');
            
        } 
        
        // Обработка текстового элемента
        else if (selectedElementIndex !== -1) {
            const element = textElements[selectedElementIndex];
            const newX = parseFloat(elementXInput.value);
            const newY = parseFloat(elementYInput.value);
            const newFontSize = parseFloat(elementFontSizeInput.value);
            const newRotation = parseFloat(elementRotationInput.value) * Math.PI / 180;
            const newFontPath = elementFontSelect.value;

            // Проверяем, изменился ли шрифт
            if (newFontPath) {
                const selectedFont = fonts.find(f => f.path === newFontPath);
                if (selectedFont && selectedFont.instance !== element.font) {
                    element.font = selectedFont.instance;
                    await element.generatePaths();
                }
            }

            if (newFontSize !== element.fontSize) {
                await element.updateFontSize(newFontSize);
            }

            element.x = newX;
            element.y = newY;
            element.rotation = newRotation;

            drawScene();
            updateStatus('Свойства элемента обновлены', 'success');
        }
    } catch (error) {
        console.error('Ошибка обновления элемента:', error);
        updateStatus('Ошибка обновления элемента', 'error');
    } finally {
        showLoading(false);
    }

function handleMouseDown(event) {
    event.preventDefault();
    if (isAddingText) return;
    
    const rect = mainCanvas.getBoundingClientRect();
    const x = (event.clientX - rect.left) / scaleFactor;
    const y = sheetHeight - (event.clientY - rect.top) / scaleFactor;

    // Если в режиме выделения
    if (isSelectingSVGPart) {
        isDrawingSelection = true;
        selectionStart = { x: x, y: y };
        selectionCurrent = { x: x, y: y };
        drawScene();
        return;
    }
    
    // Проверка на перо
    const penX = parseFloat(penStartXInput.value) || 0;
    const penY = parseFloat(penStartYInput.value) || 0;
    const distance = Math.sqrt(Math.pow(x - penX, 2) + Math.pow(y - penY, 2));
    
    if (distance < 5) {
        isMovingPen = true;
        penDragStartX = x;
        penDragStartY = y;
        return;
    }
    
    // Проверяем выделенные элементы для перетаскивания
    let clickedOnSelected = false;
    
    if (isQRSelected && selectedQRIndex !== -1) {
        const el = qrElements[selectedQRIndex];
        if (el && isPointInQRElement(x, y, el)) clickedOnSelected = true;
    }
    if (!clickedOnSelected && isSVGSelected && selectedSVGIndex !== -1) {
        const el = svgElements[selectedSVGIndex];
        if (el && isPointInSVGElement(x, y, el)) clickedOnSelected = true;
    }
    if (!clickedOnSelected && selectedElementIndex !== -1) {
        const el = textElements[selectedElementIndex];
        if (el && isPointInTextElement(x, y, el)) clickedOnSelected = true;
    }
    
    if (clickedOnSelected) {
        isDragging = true;
        isMovingElement = true;
        
        if (isQRSelected) {
            dragOffsetX = x - qrElements[selectedQRIndex].x;
            dragOffsetY = y - qrElements[selectedQRIndex].y;
        } else if (isSVGSelected) {
            dragOffsetX = x - svgElements[selectedSVGIndex].x;
            dragOffsetY = y - svgElements[selectedSVGIndex].y;
        } else {
            dragOffsetX = x - textElements[selectedElementIndex].x;
            dragOffsetY = y - textElements[selectedElementIndex].y;
        }
        return;
    }
    
    // Поиск элемента под кликом
    for (let i = qrElements.length - 1; i >= 0; i--) {
        if (isPointInQRElement(x, y, qrElements[i])) {
            selectedQRIndex = i;
            isQRSelected = true;
            isSVGSelected = false;
            selectedElementIndex = -1;
            selectedSVGIndex = -1;
            isDragging = true;
            isMovingElement = true;
            dragOffsetX = x - qrElements[i].x;
            dragOffsetY = y - qrElements[i].y;
            updateAllLists();
            drawScene();
            return;
        }
    }
    
    for (let i = svgElements.length - 1; i >= 0; i--) {
        if (isPointInSVGElement(x, y, svgElements[i])) {
            selectedSVGIndex = i;
            isSVGSelected = true;
            isQRSelected = false;
            selectedElementIndex = -1;
            selectedQRIndex = -1;
            isDragging = true;
            isMovingElement = true;
            dragOffsetX = x - svgElements[i].x;
            dragOffsetY = y - svgElements[i].y;
            updateAllLists();
            drawScene();
            return;
        }
    }
    
    for (let i = textElements.length - 1; i >= 0; i--) {
        if (isPointInTextElement(x, y, textElements[i])) {
            selectedElementIndex = i;
            isSVGSelected = false;
            isQRSelected = false;
            selectedSVGIndex = -1;
            selectedQRIndex = -1;
            isDragging = true;
            isMovingElement = true;
            dragOffsetX = x - textElements[i].x;
            dragOffsetY = y - textElements[i].y;
            updateAllLists();
            drawScene();
            return;
        }
    }
    
    // Снимаем выделение
    selectedElementIndex = -1;
    isSVGSelected = false;
    isQRSelected = false;
    selectedSVGIndex = -1;
    selectedQRIndex = -1;
    updateAllLists();
    drawScene();
}

function isPointInQRElement(x, y, element) {
    const bbox = element.getBoundingBox();
    
    // Центр элемента для поворота
    const centerX = element.x + bbox.width / 2;
    const centerY = element.y + bbox.height / 2;
    
    const cos = Math.cos(element.rotation);
    const sin = Math.sin(element.rotation);
    
    // Преобразуем точку клика относительно центра элемента
    const localX = (x - centerX) * cos - (y - centerY) * sin;
    const localY = (x - centerX) * sin + (y - centerY) * cos;
    
    // Проверяем попадание в bounding box
    return localX >= -bbox.width / 2 && localX <= bbox.width / 2 && 
           localY >= -bbox.height / 2 && localY <= bbox.height / 2;
}

        function drawScene() {
            ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
            
            if (backgroundVisible && backgroundImage) {
                ctx.globalAlpha = 0.3;
                
                if (stretchBackground) {
                    // Растягиваем изображение на весь лист
                    ctx.drawImage(backgroundImage, 0, 0, mainCanvas.width, mainCanvas.height);
                } else {
                    // Сохраняем пропорции
                    const imgAspect = backgroundImage.width / backgroundImage.height;
                    const canvasAspect = sheetWidth / sheetHeight;
                    
                    let drawWidth, drawHeight, offsetX, offsetY;
                    
                    if (imgAspect > canvasAspect) {
                        drawWidth = sheetWidth * scaleFactor;
                        drawHeight = drawWidth / imgAspect;
                        offsetX = 0;
                        offsetY = sheetHeight * scaleFactor - drawHeight;
                    } else {
                        drawHeight = sheetHeight * scaleFactor;
                        drawWidth = drawHeight * imgAspect;
                        offsetX = (sheetWidth * scaleFactor - drawWidth) / 2;
                        offsetY = 0;
                    }
                    
                    ctx.drawImage(backgroundImage, offsetX, offsetY, drawWidth, drawHeight);
                }
                ctx.globalAlpha = 1.0;
            }
			// Отрисовка выделения
			if (isSelectingSVGPart && (selectionStart.x !== selectionCurrent.x || selectionStart.y !== selectionCurrent.y)) {

				const y = (sheetHeight - rect.y - rect.height) * scaleFactor;
				const width = rect.width * scaleFactor;
				const height = rect.height * scaleFactor;
				
				// Рамка выделения
				ctx.strokeStyle = '#ff6600';
				ctx.lineWidth = 2;
				ctx.setLineDash([5, 3]);
				ctx.strokeRect(x, y, width, height);
				
				// Заливка
				ctx.fillStyle = 'rgba(255, 102, 0, 0.1)';
				ctx.fillRect(x, y, width, height);
				
				ctx.setLineDash([]);
				
				// Подсказка
				ctx.fillStyle = '#ff6600';
				ctx.font = '12px Arial';
				ctx.fillText('Выделенная часть SVG', x + 5, y + 15);
			}
            // Остальная отрисовка (сетка, текст и т.д.)
            ctx.strokeStyle = '#cccccc';
            ctx.lineWidth = 1;
            ctx.strokeRect(0, 0, mainCanvas.width, mainCanvas.height);
            
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 0.3;
            ctx.fillStyle = '#666666';
            ctx.font = '10px Arial';
            
            for (let x = 10; x < sheetWidth; x += 10) {
                const screenX = x * scaleFactor;
                ctx.beginPath();
                ctx.moveTo(screenX, 0);
                ctx.lineTo(screenX, mainCanvas.height);
                ctx.stroke();
                
                if (x % 50 === 0) {
                    ctx.fillText(x.toString(), screenX + 2, mainCanvas.height - 2);
                }
            }
            
            for (let y = 10; y < sheetHeight; y += 10) {
                const screenY = mainCanvas.height - y * scaleFactor;
                ctx.beginPath();
                ctx.moveTo(0, screenY);
                ctx.lineTo(mainCanvas.width, screenY);
                ctx.stroke();
                
                if (y % 50 === 0) {
                    ctx.fillText(y.toString(), 2, screenY - 2);
                }

            textElements.forEach((element, index) => {

			svgElements.forEach((element, index) => {

        }
                
function drawTextElement(element, isSelected) {
    ctx.save();

        const startY = (sheetHeight - path[0].y) * scaleFactor;
        
        ctx.moveTo(startX, startY);
        
        for (let i = 1; i < path.length; i++) {
            const pointX = path[i].x * scaleFactor;
            const pointY = (sheetHeight - path[i].y) * scaleFactor;
            ctx.lineTo(pointX, pointY);
        }
        
        ctx.stroke();

    // Рамка выделения

        const centerX = bbox.x + bbox.width / 2;

        // Конвертируем центр в координаты канваса
        const screenCenterX = centerX * scaleFactor;
        const screenCenterY = (sheetHeight - centerY) * scaleFactor;
        
        ctx.save();
        ctx.translate(screenCenterX, screenCenterY);
        // ИНВЕРТИРУЕМ УГОЛ ДЛЯ КАНВАСА (отрицательное вращение)
        ctx.rotate(-element.rotation);

        const markerSize = 8;
        ctx.fillRect(-scaledWidth/2 - markerSize/2, -scaledHeight/2 - markerSize/2, markerSize, markerSize);
        ctx.fillRect(scaledWidth/2 - markerSize/2, -scaledHeight/2 - markerSize/2, markerSize, markerSize);
        ctx.fillRect(-scaledWidth/2 - markerSize/2, scaledHeight/2 - markerSize/2, markerSize, markerSize);
        ctx.fillRect(scaledWidth/2 - markerSize/2, scaledHeight/2 - markerSize/2, markerSize, markerSize);
        
        ctx.restore();
    }
    
    ctx.restore();
}

async function exportToSvg() {
    if (textElements.length === 0 && svgElements.length === 0 && qrElements.length === 0) {
        updateStatus('Нет элементов для экспорта', 'error');
        return;
    }
    
    showLoading(true);
    try {
        // Собираем все пути
        const allPaths = [];
        
        // SVG элементы
        for (let element of svgElements) {
            const paths = element.getGcodePaths();
            for (const path of paths) {
                if (path.length < 2) continue;
                allPaths.push({ type: 'svg', path: path });
            }
        }
        
        // Текстовые элементы
        for (let element of textElements) {
            const paths = element.getGcodePaths();
            for (const path of paths) {
                if (path.length < 2) continue;
                allPaths.push({ type: 'text', path: path });
            }
        }
        
        // QR элементы
        for (let element of qrElements) {
            const paths = element.getGcodePaths();
            for (const path of paths) {
                if (path.length < 2) continue;
                allPaths.push({ type: 'qr', path: path });
            }
        }
        
        if (allPaths.length === 0) {
            updateStatus('Нет путей для экспорта', 'error');
            return;
        }
        
        // Создаем SVG с инверсией Y
        let svgContent = `<?xml version="1.0" encoding="UTF-8"?>
<svg width="${sheetWidth}mm" height="${sheetHeight}mm" viewBox="0 0 ${sheetWidth} ${sheetHeight}" 
     xmlns="http://www.w3.org/2000/svg">
`;
        
        // Экспорт путей с инверсией Y
        for (const item of allPaths) {
            const path = item.path;
            
            // Инвертируем Y координаты: newY = sheetHeight - oldY
            let pathData = `M ${path[0].x.toFixed(3)} ${(sheetHeight - path[0].y).toFixed(3)}`;
            
            for (let i = 1; i < path.length; i++) {
                pathData += ` L ${path[i].x.toFixed(3)} ${(sheetHeight - path[i].y).toFixed(3)}`;
            }
            
            if (item.type === 'qr') {
                svgContent += `  <path fill="black" stroke="none" d="${pathData}"/>\n`;
            } else {
                svgContent += `  <path fill="none" stroke="black" stroke-width="0.3" stroke-linecap="round" stroke-linejoin="round" d="${pathData}"/>\n`;
            }
        }
        
        svgContent += '</svg>';
        
        // Скачиваем файл
        const blob = new Blob([svgContent], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `plotter_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.svg`;
        document.body.appendChild(a);
        a.click();
        
        setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }, 100);
        
        updateStatus(`SVG экспортирован (${sheetWidth}×${sheetHeight} мм)`, 'success');
    } catch (error) {
        console.error('Ошибка экспорта SVG:', error);
        updateStatus('Ошибка экспорта SVG: ' + error.message, 'error');
    } finally {
        showLoading(false);
    }
}

async function exportToGcode() {
    // ИСПРАВЛЕНО: добавляем проверку qrElements
    if (textElements.length === 0 && svgElements.length === 0 && qrElements.length === 0) {
        updateStatus('Нет элементов для экспорта', 'error');
        return;
    }

    showLoading(true);
    try {
        const penStartX = parseFloat(penStartXInput.value) || 0;
        const penStartY = parseFloat(penStartYInput.value) || 0;

        const travelSpeed = parseInt(travelSpeedInput.value) || 3000;
        const drawSpeed = parseInt(drawSpeedInput.value) || 1500;
       
        // ИСПРАВЛЕНО: передаем qrElements в функцию
        let gcode = generateGCode(textElements, svgElements, qrElements, penStartX, penStartY, pauseTime, travelSpeed, drawSpeed);

        const blob = new Blob([gcode], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);

        document.body.appendChild(a);

        updateStatus('G-code файл экспортирован', 'success');
    } catch (error) {

        updateStatus('Ошибка экспорта G-code: ' + error.message, 'error');
    } finally {
        showLoading(false);
    }
}

function simplifyPath(path, minDistance = 0.15) {
    if (path.length < 3) return path;
    
    const result = [path[0]];
    let lastPoint = path[0];
    
    for (let i = 1; i < path.length - 1; i++) {
        const point = path[i];
        const nextPoint = path[i + 1];
        
        const distToLast = Math.sqrt(
            Math.pow(point.x - lastPoint.x, 2) + 
            Math.pow(point.y - lastPoint.y, 2)
        );
        
        if (distToLast < minDistance) {
            const area = Math.abs(
                (lastPoint.x - point.x) * (nextPoint.y - point.y) - 
                (lastPoint.y - point.y) * (nextPoint.x - point.x)
            );
            const baseDist = Math.sqrt(
                Math.pow(nextPoint.x - lastPoint.x, 2) + 
                Math.pow(nextPoint.y - lastPoint.y, 2)
            );
            
            if (baseDist > 0 && area / baseDist < 0.05) {
                continue;
            }
        }
        
        result.push(point);
        lastPoint = point;
    }
    
    if (path.length > 1) {
        result.push(path[path.length - 1]);
    }
    
    return result;
}

function generateGCode(textElements, svgElements, qrElements, penStartX, penStartY, pauseTime, travelSpeed, drawSpeed) {
    let gcode = [];
    
    gcode.push('G21');
    gcode.push('G90');
    gcode.push('G92 X0 Y0 Z0');
    gcode.push('M280 P0 S30.00');  // Перо вверх
    gcode.push('G4 P' + pauseTime);
    gcode.push('');

    // Собираем все пути с упрощением и удалением дубликатов
    let allPaths = [];
    const MIN_DISTANCE = 1 / MAX_POINTS_PER_MM; // ~0.16 мм

    // Функция удаления дубликатов точек в пути
    function removeDuplicatePoints(path, tolerance = 0.01) {
        if (path.length < 2) return path;
        
        const result = [path[0]];
        
        for (let i = 1; i < path.length; i++) {
            const lastPoint = result[result.length - 1];
            const currentPoint = path[i];
            
            // Проверяем расстояние до последней добавленной точки
            const distance = Math.sqrt(
                Math.pow(currentPoint.x - lastPoint.x, 2) + 
                Math.pow(currentPoint.y - lastPoint.y, 2)
            );
            
            // Добавляем только если расстояние больше tolerance
            if (distance > tolerance) {
                result.push(currentPoint);
            }
        }
        
        return result;
    }

    // Текстовые элементы
    textElements.forEach(element => {
        let elementPaths = element.getGcodePaths();
        elementPaths = elementPaths.map(path => {
            const simplified = simplifyPath(path, MIN_DISTANCE);
            return removeDuplicatePoints(simplified, 0.05); // Удаляем дубликаты
        });
        allPaths = allPaths.concat(elementPaths);
    });

    // SVG элементы
    svgElements.forEach(element => {
        if (element.getGcodePaths) {
            let elementPaths = element.getGcodePaths();
            elementPaths = elementPaths.map(path => {
                const simplified = simplifyPath(path, MIN_DISTANCE);
                return removeDuplicatePoints(simplified, 0.05);
            });
            allPaths = allPaths.concat(elementPaths);
        }
    });

    // QR элементы
    qrElements.forEach(element => {
        let elementPaths = element.getGcodePaths();
        elementPaths = elementPaths.map(path => {
            const simplified = simplifyPath(path, MIN_DISTANCE);
            return removeDuplicatePoints(simplified, 0.05);
        });
        allPaths = allPaths.concat(elementPaths);
    });

    // Удаляем пустые пути
    allPaths = allPaths.filter(path => path.length >= 2);
    
    if (allPaths.length === 0) {
        gcode.push('M280 P0 S30.00');
        gcode.push('G4 P' + pauseTime);
        gcode.push('G1 X' + penStartX.toFixed(2) + ' Y' + penStartY.toFixed(2) + ' F' + travelSpeed);
        gcode.push('G4 P' + pauseTime);
        gcode.push('M2');
        return gcode.join('\n');
    }
    
    // ПАРАМЕТРЫ ОПТИМИЗАЦИИ
    const MAX_DISTANCE_NO_LIFT = 0.5;
    
    // Функция для безопасного добавления точки в путь (без дубликатов)
    function addPointToPath(path, point, tolerance = 0.01) {
        if (path.length === 0) {
            path.push(point);
            return true;
        }
        
        const lastPoint = path[path.length - 1];
        const distance = Math.sqrt(
            Math.pow(point.x - lastPoint.x, 2) + 
            Math.pow(point.y - lastPoint.y, 2)
        );
        
        if (distance > tolerance) {
            path.push(point);
            return true;
        }
        
        return false;
    }
    
    // Объединяем близко расположенные пути без дубликатов
    let optimizedPaths = [];
    let currentPath = null;
    
    // Сортируем все начальные точки по расстоянию от стартовой позиции
    allPaths.sort((a, b) => {
        const distA = Math.sqrt(Math.pow(a[0].x - penStartX, 2) + Math.pow(a[0].y - penStartY, 2));
        const distB = Math.sqrt(Math.pow(b[0].x - penStartX, 2) + Math.pow(b[0].y - penStartY, 2));
        return distA - distB;
    });
    
    for (let i = 0; i < allPaths.length; i++) {
        const path = allPaths[i];
        
        if (path.length < 2) continue;
        
        if (!currentPath) {
            currentPath = [];
            // Добавляем точки без дубликатов
            for (const point of path) {
                addPointToPath(currentPath, point, 0.05);
            }
        } else {
            const lastPoint = currentPath[currentPath.length - 1];
            const firstPoint = path[0];
            const distance = Math.sqrt(
                Math.pow(lastPoint.x - firstPoint.x, 2) + 
                Math.pow(lastPoint.y - firstPoint.y, 2)
            );
            
            if (distance <= MAX_DISTANCE_NO_LIFT) {
                // Продолжаем текущий путь, добавляем точки без дубликатов
                for (let j = 0; j < path.length; j++) {
                    addPointToPath(currentPath, path[j], 0.05);
                }
            } else {
                // Сохраняем текущий путь и начинаем новый
                if (currentPath.length >= 2) {
                    optimizedPaths.push(currentPath);
                }
                currentPath = [];
                for (const point of path) {
                    addPointToPath(currentPath, point, 0.05);
                }
            }
        }
    }
    
    if (currentPath && currentPath.length >= 2) {
        optimizedPaths.push(currentPath);
    }
    
    
    // Генерация G-code с оптимизированными путями
    let currentX = penStartX;
    let currentY = penStartY;
    let isPenDown = false;
    
    // Сортировка оптимизированных путей по расстоянию от текущей позиции
    optimizedPaths.sort((a, b) => {
        const distA = Math.sqrt(Math.pow(a[0].x - currentX, 2) + Math.pow(a[0].y - currentY, 2));
        const distB = Math.sqrt(Math.pow(b[0].x - currentX, 2) + Math.pow(b[0].y - currentY, 2));
        return distA - distB;
    });
    
    while (optimizedPaths.length > 0) {
        let closestIndex = 0;
        let closestDistance = Math.sqrt(
            Math.pow(optimizedPaths[0][0].x - currentX, 2) + 
            Math.pow(optimizedPaths[0][0].y - currentY, 2)
        );
        
        for (let i = 1; i < optimizedPaths.length; i++) {
            const pathStart = optimizedPaths[i][0];
            const distance = Math.sqrt(
                Math.pow(pathStart.x - currentX, 2) + 
                Math.pow(pathStart.y - currentY, 2)
            );
            
            if (distance < closestDistance) {
                closestDistance = distance;
                closestIndex = i;
            }
        }
        
        const path = optimizedPaths[closestIndex];
        
        // Перемещение к началу пути
        const distanceToStart = Math.sqrt(
            Math.pow(path[0].x - currentX, 2) + 
            Math.pow(path[0].y - currentY, 2)
        );
        
        if (distanceToStart > 0.1) {
            // Поднимаем перо если нужно
            if (isPenDown) {
                gcode.push('G4 P' + pauseTime);
                gcode.push('M280 P0 S30.00');
                gcode.push('G4 P' + pauseTime);
                isPenDown = false;
            }
            
            // Перемещаемся к началу пути
            gcode.push('G1 X' + path[0].x.toFixed(2) + ' Y' + path[0].y.toFixed(2) + ' F' + travelSpeed);
            currentX = path[0].x;
            currentY = path[0].y;
        }
        
        // Опускаем перо
        if (!isPenDown) {
            gcode.push('G4 P' + pauseTime);
            gcode.push('M280 P0 S0.00');
            gcode.push('G4 P' + pauseTime);
            isPenDown = true;
        }
        
        // Рисование пути (пропускаем первую точку если мы уже на ней)
        let startIndex = (distanceToStart <= 0.1) ? 1 : 0;
        
        for (let i = startIndex; i < path.length; i++) {
            const point = path[i];
            
            // Проверяем, не дублируется ли точка
            const distToCurrent = Math.sqrt(
                Math.pow(point.x - currentX, 2) + 
                Math.pow(point.y - currentY, 2)
            );
            
            if (distToCurrent > 0.05) {  // Пропускаем дубликаты
                gcode.push('G1 X' + point.x.toFixed(2) + ' Y' + point.y.toFixed(2) + ' F' + drawSpeed);
                currentX = point.x;
                currentY = point.y;
            }
        }
        
        // Удаляем обработанный путь
        optimizedPaths.splice(closestIndex, 1);
    }
    
    // Завершение
    if (isPenDown) {
        gcode.push('G4 P' + pauseTime);
        gcode.push('M280 P0 S30.00');
        gcode.push('G4 P' + pauseTime);
    }
    gcode.push('G1 X' + penStartX.toFixed(2) + ' Y' + penStartY.toFixed(2) + ' F' + travelSpeed);
    gcode.push('G4 P' + pauseTime);
    gcode.push('M2');
    
    return gcode.join('\n');
}

        function showLoading(show) {
            loadingDiv.style.display = show ? 'block' : 'none';
        }
        
        function updateStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
		
// Функция парсинга G-code в SVG элемент (без трансформаций, 1:1)
async function parseGCodeToSVGElement(gcodeContent, fileName) {
    const lines = gcodeContent.split('\n');
    const paths = [];
    let currentPath = [];
    
    let currentX = 0, currentY = 0;
    let isPenDown = false;
    let isAbsoluteMode = true;
    let unitMultiplier = 1.0;
    
    let minX = Infinity, maxX = -Infinity;
    let minY = Infinity, maxY = -Infinity;
    
    for (let line of lines) {
        line = line.trim().toUpperCase();
        if (line === '' || line.startsWith(';') || line.startsWith('(')) continue;
        
        const commentIndex = line.indexOf(';');
        if (commentIndex > 0) line = line.substring(0, commentIndex).trim();
        
        if (line === 'G20') { unitMultiplier = 25.4; continue; }
        if (line === 'G21') { unitMultiplier = 1.0; continue; }
        if (line === 'G90') { isAbsoluteMode = true; continue; }
        if (line === 'G91') { isAbsoluteMode = false; continue; }
        if (line.startsWith('G92') || line.startsWith('G4')) continue;
        
        // Опускание пера
        if (line.includes('M280 P0 S0') || line.includes('M280 P0 S0.00') || 
            line === 'M3' || line === 'M4') {
            
            if (!isPenDown) {
                isPenDown = true;
                currentPath = [{ x: currentX, y: currentY }];
                
                minX = Math.min(minX, currentX);
                maxX = Math.max(maxX, currentX);
                minY = Math.min(minY, currentY);
                maxY = Math.max(maxY, currentY);
            }
            continue;
        }
        
        // Поднятие пера
        if (line.includes('M280 P0 S30') || line.includes('M280 P0 S30.00') || 
            line === 'M5') {
            
            if (isPenDown) {
                isPenDown = false;
                if (currentPath.length >= 2) {
                    paths.push([...currentPath]);
                }
                currentPath = [];
            }
            continue;
        }
        
        // Конец программы
        if (line === 'M2' || line === 'M30') {
            if (isPenDown && currentPath.length >= 2) {
                paths.push([...currentPath]);
            }
            currentPath = [];
            isPenDown = false;
            continue;
        }
        
        // Движение
        if (line.startsWith('G0') || line.startsWith('G1') || 
            line.startsWith('G00') || line.startsWith('G01')) {
            
            const xMatch = line.match(/X([-\d.]+)/);
            const yMatch = line.match(/Y([-\d.]+)/);
            
            let newX = currentX;
            let newY = currentY;
            
            if (xMatch) {
                const xVal = parseFloat(xMatch[1]) * unitMultiplier;
                newX = isAbsoluteMode ? xVal : currentX + xVal;
            }
            
            if (yMatch) {
                const yVal = parseFloat(yMatch[1]) * unitMultiplier;
                newY = isAbsoluteMode ? yVal : currentY + yVal;
            }
            
            if (newX !== currentX || newY !== currentY) {
                currentX = newX;
                currentY = newY;
                
                minX = Math.min(minX, currentX);
                maxX = Math.max(maxX, currentX);
                minY = Math.min(minY, currentY);
                maxY = Math.max(maxY, currentY);
                
                if (isPenDown) {
                    const lastPoint = currentPath.length > 0 ? currentPath[currentPath.length - 1] : null;
                    
                    if (!lastPoint || Math.abs(lastPoint.x - currentX) > 0.001 || Math.abs(lastPoint.y - currentY) > 0.001) {
                        currentPath.push({ x: currentX, y: currentY });
                    }
                }
            }
        }
    }
    
    if (currentPath.length >= 2) {
        paths.push([...currentPath]);
    }
    
    const validPaths = paths.filter(path => path.length >= 2);
    
    if (validPaths.length === 0) {
        throw new Error('В G-code не найдено путей рисования');
    }
    
    const sheetWidth = maxX;
    const sheetHeight = maxY;
    
    // ✅ Создаем SVGElement с минимальным SVG и напрямую задаем vectorPaths
    const svgElement = new SVGElement(
        Date.now() + Math.random(),
        '<svg><path/></svg>',
        0, 0,
        sheetWidth,
        sheetHeight,
        fileName
    );
    
    // ✅ НАПРЯМУЮ задаем пути без повторного парсинга
    svgElement.vectorPaths = validPaths.map(path => 
        path.map((p, i) => ({
            x: p.x,
            y: sheetHeight - p.y,  // Инвертируем Y для SVG
            move: i === 0
        }))
    );
    
    svgElement.x = 0;
    svgElement.y = 0;
    svgElement.width = sheetWidth;
    svgElement.height = sheetHeight;
    svgElement.originalWidth = sheetWidth;
    svgElement.originalHeight = sheetHeight;
    svgElement.baseScale = 1.0;
    svgElement.scale = 1.0;
    svgElement.sourceType = 'gcode';
    svgElement.sourceFile = fileName;
    
    // ✅ Создаем превью вручную
    const canvas = document.createElement('canvas');
    const maxSize = 200;
    let previewWidth, previewHeight;
    
    if (sheetWidth > sheetHeight) {
        previewWidth = maxSize;
        previewHeight = (sheetHeight / sheetWidth) * maxSize;
    } else {
        previewHeight = maxSize;
        previewWidth = (sheetWidth / sheetHeight) * maxSize;
    }
    
    canvas.width = Math.max(10, previewWidth);
    canvas.height = Math.max(10, previewHeight);
    
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1.5;
    
    const scaleX = canvas.width / sheetWidth;
    const scaleY = canvas.height / sheetHeight;
    
    for (const path of svgElement.vectorPaths) {
        if (path.length < 2) continue;
        
        ctx.beginPath();
        ctx.moveTo(path[0].x * scaleX, canvas.height - path[0].y * scaleY);
        
        for (let i = 1; i < path.length; i++) {
            ctx.lineTo(path[i].x * scaleX, canvas.height - path[i].y * scaleY);
        }
        
        ctx.stroke();
    }
    
    svgElement.svgImage = canvas;
    
    return svgElement;
}


// Функция загрузки G-code файла
async function loadGCodeFile(file) {
    try {
        const content = await readFileAsText(file);
        
        updateStatus(`Парсинг G-code "${file.name}"...`, 'success');
        
        const svgElement = await parseGCodeToSVGElement(content, file.name);
        
        if (svgElement.vectorPaths.length > 0) {
            svgElements.push(svgElement);
            
            // Выделяем новый элемент
            selectedSVGIndex = svgElements.length - 1;
            isSVGSelected = true;
            selectedElementIndex = -1;
            isQRSelected = false;
            selectedQRIndex = -1;
            
            updateSVGElementsList();
            updateTextElementsList();
            updateQRElementsList();
            updateElementProperties();
            updateDeleteButtonsVisibility();
            drawScene();
            
            updateStatus(`G-code "${file.name}" загружен: ${svgElement.width.toFixed(1)}×${svgElement.height.toFixed(1)} мм, ${svgElement.vectorPaths.length} путей`, 'success');
        } else {
            updateStatus(`В G-code "${file.name}" не найдено путей рисования`, 'error');
        }
    } catch (error) {
        console.error('Ошибка загрузки G-code:', error);
        updateStatus('Ошибка загрузки G-code: ' + error.message, 'error');
    }
}
