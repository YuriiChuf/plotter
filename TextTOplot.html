// Извлечь выделенную часть
function extractSVGPartFromSelection() {
    if (!isValidSelection()) {
        updateStatus('Сначала выделите область', 'error');
        return;
    }
    
    const rect = getSelectionRect();
    let extractedCount = 0;
    
    // Проходим по копии массива, так как мы будем удалять элементы
    const elementsToProcess = [...svgElements];
    
    for (let i = 0; i < elementsToProcess.length; i++) {
        const svg = elementsToProcess[i];
        const svgBounds = svg.getBoundingBox();
        
        // Проверяем пересечение
        if (rectsIntersect(rect, svgBounds)) {
            // Извлекаем часть (функция сама удалит из оригинала)
            const newPart = extractPartFromSVG(svg, rect);
            if (newPart) {
                // Добавляем как новый элемент
                svgElements.push(newPart);
                extractedCount++;
            }
        }
    }
    
    if (extractedCount > 0) {
        updateStatus(`Вырезано ${extractedCount} частей`, 'success');
        updateSVGElementsList();
        drawScene();
    } else {
        updateStatus('В выделенной области нет SVG элементов', 'warning');
    }
    
    clearSelection();
}

// Извлечь часть из SVG элемента
function extractPartFromSVG(svgElement, selectionRect) {
    const pathsInSelection = [];
    const pathsToKeep = [];
    const selectionMinX = selectionRect.x;
    const selectionMinY = selectionRect.y;
    const selectionMaxX = selectionRect.x + selectionRect.width;
    const selectionMaxY = selectionRect.y + selectionRect.height;
    
    const originalPaths = svgElement.vectorPaths || [];
    
    // Находим границы извлеченной части
    let extractedMinX = Infinity;
    let extractedMinY = Infinity;
    let extractedMaxX = -Infinity;
    let extractedMaxY = -Infinity;
    
    for (let pathIndex = 0; pathIndex < originalPaths.length; pathIndex++) {
        const originalPath = originalPaths[pathIndex];
        
        // Конвертируем путь в мировые координаты для проверки
        const worldPath = originalPath.map(point => {
            const worldX = svgElement.x + point.x * svgElement.scale;
            const worldY = svgElement.y + point.y * svgElement.scale;
            return { x: worldX, y: worldY, move: point.move };
        });
        
        let currentExtractedSegment = [];
        let currentKeptSegment = [];
        let lastState = null;
        
        for (let i = 0; i < worldPath.length; i++) {
            const worldPoint = worldPath[i];
            const isInside = worldPoint.x >= selectionMinX && worldPoint.x <= selectionMaxX &&
                           worldPoint.y >= selectionMinY && worldPoint.y <= selectionMaxY;
            const currentState = isInside ? 'inside' : 'outside';
            
            if (lastState === null) {
                lastState = currentState;
                if (isInside) {
                    currentExtractedSegment.push({
                        x: worldPoint.x,
                        y: worldPoint.y,
                        move: true
                    });
                } else {
                    currentKeptSegment.push({
                        x: worldPoint.x,
                        y: worldPoint.y,
                        move: true
                    });
                }
            } else if (currentState === lastState) {
                if (isInside) {
                    currentExtractedSegment.push({
                        x: worldPoint.x,
                        y: worldPoint.y,
                        move: false
                    });
                } else {
                    currentKeptSegment.push({
                        x: worldPoint.x,
                        y: worldPoint.y,
                        move: false
                    });
                }
            } else {
                // Сохраняем сегменты
                if (lastState === 'inside' && currentExtractedSegment.length > 1) {
                    pathsInSelection.push([...currentExtractedSegment]);
                    
                    // Обновляем границы извлеченной части
                    currentExtractedSegment.forEach(p => {
                        extractedMinX = Math.min(extractedMinX, p.x);
                        extractedMinY = Math.min(extractedMinY, p.y);
                        extractedMaxX = Math.max(extractedMaxX, p.x);
                        extractedMaxY = Math.max(extractedMaxY, p.y);
                    });
                }
                if (lastState === 'outside' && currentKeptSegment.length > 1) {
                    // Конвертируем обратно в локальные координаты для сохранения
                    const localKeptSegment = currentKeptSegment.map(p => ({
                        x: (p.x - svgElement.x) / svgElement.scale,
                        y: (p.y - svgElement.y) / svgElement.scale,
                        move: p.move
                    }));
                    pathsToKeep.push(localKeptSegment);
                }
                
                // Начинаем новые сегменты
                currentExtractedSegment = [];
                currentKeptSegment = [];
                
                if (isInside) {
                    currentExtractedSegment.push({
                        x: worldPoint.x,
                        y: worldPoint.y,
                        move: true
                    });
                } else {
                    currentKeptSegment.push({
                        x: worldPoint.x,
                        y: worldPoint.y,
                        move: true
                    });
                }
                
                lastState = currentState;
            }
        }
        
        // Сохраняем последние сегменты
        if (lastState === 'inside' && currentExtractedSegment.length > 1) {
            pathsInSelection.push([...currentExtractedSegment]);
            currentExtractedSegment.forEach(p => {
                extractedMinX = Math.min(extractedMinX, p.x);
                extractedMinY = Math.min(extractedMinY, p.y);
                extractedMaxX = Math.max(extractedMaxX, p.x);
                extractedMaxY = Math.max(extractedMaxY, p.y);
            });
        }
        if (lastState === 'outside' && currentKeptSegment.length > 1) {
            const localKeptSegment = currentKeptSegment.map(p => ({
                x: (p.x - svgElement.x) / svgElement.scale,
                y: (p.y - svgElement.y) / svgElement.scale,
                move: p.move
            }));
            pathsToKeep.push(localKeptSegment);
        }
    }
    
    // Обновляем оригинальный SVG
    svgElement.vectorPaths = pathsToKeep;
    
    // Удаляем пустой SVG
    if (pathsToKeep.length === 0) {
        const index = svgElements.indexOf(svgElement);
        if (index !== -1) {
            svgElements.splice(index, 1);
        }
    }
    
    if (pathsInSelection.length === 0) return null;
    
    // Рассчитываем размер извлеченной части
    const extractedWidth = extractedMaxX - extractedMinX;
    const extractedHeight = extractedMaxY - extractedMinY;
    
    // Создаем новый SVG элемент
    const newSVG = new SVGElement(
        Date.now(),
        '<svg><path/></svg>',
        extractedMinX, // Начальная позиция по минимальным координатам
        extractedMinY,
        extractedWidth,
        extractedHeight
    );
    
    // Преобразуем пути к локальным координатам нового SVG
    const transformedPaths = pathsInSelection.map(path => {
        return path.map(point => ({
            x: (point.x - extractedMinX), // Относительно левого верхнего угла
            y: (point.y - extractedMinY), // Относительно левого верхнего угла
            move: point.move
        }));
    });
    
    newSVG.vectorPaths = transformedPaths;
    newSVG.scale = 1; // Используем масштаб 1, так как координаты уже правильные
    newSVG.rotation = 0;
    
    // Создаем простой canvas для отображения
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(10, Math.min(50, extractedWidth));
    canvas.height = Math.max(10, Math.min(50, extractedHeight));
    
    // Рисуем на canvas для предпросмотра
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = 'black';
    ctx.lineWidth = 1;
    
    for (const path of transformedPaths) {
        if (path.length < 2) continue;
        
        const scaleX = canvas.width / extractedWidth;
        const scaleY = canvas.height / extractedHeight;
        const scale = Math.min(scaleX, scaleY);
        
        ctx.beginPath();
        ctx.moveTo(path[0].x * scale, path[0].y * scale);
        
        for (let i = 1; i < path.length; i++) {
            ctx.lineTo(path[i].x * scale, path[i].y * scale);
        }
        
        ctx.stroke();
    }
    
    newSVG.svgImage = canvas;
    
    return newSVG;
}

function CopySVGPartFromSelection() {
    if (!isValidSelection()) {
        updateStatus('Сначала выделите область', 'error');
        return;
    }
    
    const rect = getSelectionRect();
    let extractedCount = 0;
    
    // Проходим по копии массива, так как мы будем удалять элементы
    const elementsToProcess = [...svgElements];
    
    for (let i = 0; i < elementsToProcess.length; i++) {
        const svg = elementsToProcess[i];
        const svgBounds = svg.getBoundingBox();
        
        // Проверяем пересечение
        if (rectsIntersect(rect, svgBounds)) {
            // Извлекаем часть (функция сама удалит из оригинала)
            const newPart = CopyPartFromSVG(svg, rect);
            if (newPart) {
                // Добавляем как новый элемент
                svgElements.push(newPart);
                extractedCount++;
            }
        }
    }
    
    if (extractedCount > 0) {
        updateStatus(`Вырезано ${extractedCount} частей`, 'success');
        updateSVGElementsList();
        drawScene();
    } else {
        updateStatus('В выделенной области нет SVG элементов', 'warning');
    }
    
    clearSelection();
}

//копировать
function CopyPartFromSVG(svgElement, selectionRect) {
    const pathsInSelection = [];
    const selectionMinX = selectionRect.x;
    const selectionMinY = selectionRect.y;
    const selectionMaxX = selectionRect.x + selectionRect.width;
    const selectionMaxY = selectionRect.y + selectionRect.height;
    
    // Получаем все пути элемента (уже преобразованные с учетом поворота и масштаба)
    const gcodePaths = svgElement.getGcodePaths();
    
    for (const path of gcodePaths) {
        const newPath = [];
        let hasPointsInSelection = false;
        
        for (const point of path) {
            // Проверяем, находится ли точка в выделенной области
            if (point.x >= selectionMinX && point.x <= selectionMaxX &&
                point.y >= selectionMinY && point.y <= selectionMaxY) {
                
                hasPointsInSelection = true;
                // Сохраняем точку относительно начала выделения
                newPath.push({
                    x: point.x - selectionRect.x,
                    y: point.y - selectionRect.y,
                    move: newPath.length === 0 // Первая точка - move
                });
            } else if (hasPointsInSelection && newPath.length > 0) {
                // Если вышли за пределы выделения, завершаем путь
                break;
            }
        }
        
        if (hasPointsInSelection && newPath.length > 1) {
            pathsInSelection.push(newPath);
        }
    }
    
    if (pathsInSelection.length === 0) return null;
    
    // Создаем новый SVG элемент
    const newSVG = new SVGElement(
        Date.now(),
        '<svg><path/></svg>', // Минимальный SVG контент
        selectionRect.x,
        selectionRect.y,
        selectionRect.width,
        selectionRect.height
    );
    
    // Переопределяем векторные пути
    newSVG.vectorPaths = pathsInSelection;
    newSVG.scale = 1;
    newSVG.rotation = 0;
    
    // Создаем простой SVG для отображения
    newSVG.svgImage = document.createElement('canvas');
    newSVG.svgImage.width = 50;
    newSVG.svgImage.height = 50;
    
    return newSVG;
}

// Проверка валидности выделения
function isValidSelection() {
    const rect = getSelectionRect();
    return rect.width > 1 && rect.height > 1;
}

// Получить прямоугольник выделения
function getSelectionRect() {
    return {
        x: Math.min(selectionStart.x, selectionCurrent.x),
        y: Math.min(selectionStart.y, selectionCurrent.y),
        width: Math.abs(selectionCurrent.x - selectionStart.x),
        height: Math.abs(selectionCurrent.y - selectionStart.y)
    };
}

// Очистить выделение
function clearSelection() {
    if (isSelectingSVGPart) {
        isSelectingSVGPart = false;
        isDrawingSelection = false;
        selectionStart = { x: 0, y: 0 };
        selectionCurrent = { x: 0, y: 0 };
        drawScene();
        updateStatus('Режим выделения отключен', 'success');
    }
}
function rectsIntersect(rect1, rect2) {
    return !(rect1.x + rect1.width < rect2.x || 
             rect2.x + rect2.width < rect1.x || 
             rect1.y + rect1.height < rect2.y || 
             rect2.y + rect2.height < rect1.y);
}

function handleCanvasClick(event) {
    if (isAddingText) return;
    
    // ЕСЛИ ТОЛЬКО ЧТО ПЕРЕМЕЩАЛИ ЭЛЕМЕНТ - НЕ ДОБАВЛЯЕМ ТЕКСТ
    if (isMovingElement) {
        console.log('Было перемещение - не добавляем текст');
        return;
    }
    
    // Дебаунс кликов
    if (clickTimeout) {
        clearTimeout(clickTimeout);
    }
    
    clickTimeout = setTimeout(() => {
        const rect = mainCanvas.getBoundingClientRect();
        const x = (event.clientX - rect.left) / scaleFactor;
        const y = sheetHeight - (event.clientY - rect.top) / scaleFactor;
        
        // Проверяем, есть ли в месте клика уже выделенный элемент
        let clickedOnSelectedElement = false;
        
        // Проверяем выделенный QR элемент
        if (isQRSelected && selectedQRIndex !== -1) {
            const selectedElement = qrElements[selectedQRIndex];
            if (selectedElement && isPointInQRElement(x, y, selectedElement)) {
                clickedOnSelectedElement = true;
            }
        }
        
        // Проверяем выделенный SVG элемент
        if (!clickedOnSelectedElement && isSVGSelected && selectedSVGIndex !== -1) {
            const selectedElement = svgElements[selectedSVGIndex];
            if (selectedElement && isPointInSVGElement(x, y, selectedElement)) {
                clickedOnSelectedElement = true;
            }
        }
        
        // Проверяем выделенный текстовый элемент
        if (!clickedOnSelectedElement && selectedElementIndex !== -1) {
            const selectedElement = textElements[selectedElementIndex];
            if (selectedElement && isPointInTextElement(x, y, selectedElement)) {
                clickedOnSelectedElement = true;
            }
        }
        
        // Если кликнули на уже выделенный элемент - ничего не делаем
        if (clickedOnSelectedElement) {
            console.log('Кликнули на выделенный элемент - не меняем выбор');
            clickTimeout = null;
            return;
        }
        
        // Если НЕ кликнули на выделенный элемент - ищем верхний элемент в этой точке
        
        // Сначала проверяем QR элементы (сверху вниз)
        for (let i = qrElements.length - 1; i >= 0; i--) {
            const element = qrElements[i];
            if (isPointInQRElement(x, y, element)) {
                // Нашли QR элемент - выбираем его
                selectedQRIndex = i;
                isQRSelected = true;
                isSVGSelected = false;
                selectedElementIndex = -1;
                selectedSVGIndex = -1;
                
                updateTextElementsList();
                updateSVGElementsList();
                updateQRElementsList();
                updateElementProperties();
                updateDeleteButtonsVisibility();
                drawScene();
                updateStatus(`QR-код выбран`, 'success');
                
                clickTimeout = null;
                return;
            }
        }
        
        // Проверяем SVG элементы
        for (let i = svgElements.length - 1; i >= 0; i--) {
            const element = svgElements[i];
            if (isPointInSVGElement(x, y, element)) {
                selectedSVGIndex = i;
                isSVGSelected = true;
                isQRSelected = false;
                selectedElementIndex = -1;
                selectedQRIndex = -1;
                
                updateTextElementsList();
                updateSVGElementsList();
                updateQRElementsList();
                updateElementProperties();
                updateDeleteButtonsVisibility();
                drawScene();
                
                clickTimeout = null;
                return;
            }
        }
        
        // Проверяем текстовые элементы
        for (let i = textElements.length - 1; i >= 0; i--) {
            const element = textElements[i];
            if (isPointInTextElement(x, y, element)) {
                selectedElementIndex = i;
                isSVGSelected = false;
                isQRSelected = false;
                selectedSVGIndex = -1;
                selectedQRIndex = -1;
                
                updateTextElementsList();
                updateSVGElementsList();
                updateQRElementsList();
                updateElementProperties();
                updateDeleteButtonsVisibility();
                drawScene();
                
                clickTimeout = null;
                return;
            }
        }
        
        // УДАЛЕНО: если не нашли ни одного элемента - просто снимаем выделение, НЕ создаём текст
        selectedElementIndex = -1;
        isSVGSelected = false;

        updateTextElementsList();
        updateSVGElementsList();
        updateQRElementsList();
        updateElementProperties();
        updateDeleteButtonsVisibility();
        drawScene();

        clickTimeout = null;
    }, 50);
}

function formatQRData(type, input) {
    switch(type) {
        case 'url':
            // Добавляем протокол если его нет
            if (!input.match(/^https?:\/\//i)) {
                return 'http://' + input;
            }
            return input;
            
        case 'phone':
            // Удаляем все кроме цифр и плюса
            let phone = input.replace(/[^\d+]/g, '');
            return 'tel:' + phone;
            
        case 'email':
            return 'mailto:' + input;
            
        case 'sms':
            // Формат: номер|текст
            let parts = input.split('|');
            if (parts.length >= 2) {
                return 'sms:' + parts[0] + '?body=' + encodeURIComponent(parts[1]);
            } else {
                return 'sms:' + input;
            }
            
        case 'wifi':
            // Формат: SSID|password|тип_шифрования (WPA/WEP/none)
            let wifiParts = input.split('|');
            let ssid = wifiParts[0] || '';
            let password = wifiParts[1] || '';
            let encryption = wifiParts[2] || 'WPA';
            
            return `WIFI:S:${ssid};T:${encryption};P:${password};;`;
            
        case 'vcard':
            // Формат: Имя|Фамилия|Телефон|Email|Организация|Должность
            let vcardParts = input.split('|');
            let firstName = vcardParts[0] || '';
            let lastName = vcardParts[1] || '';
            let vcardPhone = vcardParts[2] || '';
            let vcardEmail = vcardParts[3] || '';
            let org = vcardParts[4] || '';
            let title = vcardParts[5] || '';
            
            let vcard = 'BEGIN:VCARD\n';
            vcard += 'VERSION:3.0\n';
            vcard += `N:${lastName};${firstName};;;\n`;
            vcard += `FN:${firstName} ${lastName}\n`;
            if (vcardPhone) vcard += `TEL:${vcardPhone}\n`;
            if (vcardEmail) vcard += `EMAIL:${vcardEmail}\n`;
            if (org) vcard += `ORG:${org}\n`;
            if (title) vcard += `TITLE:${title}\n`;
            vcard += 'END:VCARD';
            
            return vcard;
            
        case 'text':
        default:
            return input;
    }
}

function detectQRType(text) {
    text = text.replace(/^(URL:|Тел:|Email:|SMS:|WiFi:|vCard:)\s*/i, '');
    
    if (text.match(/^https?:\/\//i)) return 'url';
    if (text.match(/^\+?\d[\d\s\-\(\)]{7,}/)) return 'phone';
    if (text.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) return 'email';
    if (text.includes('|') && text.split('|')[0].match(/^\+?\d+/)) return 'sms';
    if (text.includes('|') && text.split('|').length >= 2) return 'wifi';
    
    return 'text';
}

function removeTypePrefix(text) {
    return text.replace(/^(URL:|Тел:|Email:|SMS:|WiFi:|vCard:)\s*/i, '');
}

async function updateQRElementText(index, newText, newType) {
    if (index < 0 || index >= qrElements.length) return;
    
    const element = qrElements[index];
    const oldText = element.text;
    const oldType = element.type;
    
    if (oldText === newText && oldType === newType) {
        cancelTextInput();
        return;
    }
    
    showLoading(true);
    try {
        // Форматируем данные для QR кода
        const formattedData = formatQRData(newType, newText);
        
        // Создаем новый QR элемент с обновленным текстом и выбранным типом
        const newQR = new QRElement(
            element.id,
            formattedData,
            element.x,
            element.y,
            element.size,
            newType,
            element.hatchStep || 0.8
        );
        
        // Сохраняем исходный текст
        newQR.originalText = newText;
        
        // Копируем свойства
        newQR.rotation = element.rotation;
        newQR.scale = element.scale;
        
        // Заменяем старый элемент новым
        qrElements[index] = newQR;
        
        updateQRElementsList();
        drawScene();
        updateStatus(`QR-код обновлен: тип ${oldType} -> ${newType}`, 'success');
    } catch (error) {
        console.error('Ошибка обновления QR-кода:', error);
        updateStatus('Ошибка обновления QR-кода: ' + error.message, 'error');
    } finally {
        showLoading(false);
    }
}

async function updateSelectedElement() {
    if (selectedElementIndex === -1 && !isSVGSelected && !isQRSelected) return;

    showLoading(true);
    try {
        // Обработка QR кода - ТОЛЬКО позиция/размер/поворот
		if (isQRSelected && selectedQRIndex !== -1) {
			const element = qrElements[selectedQRIndex];
			const newX = parseFloat(elementXInput.value);
			const newY = parseFloat(elementYInput.value);
			const newSize = parseFloat(elementFontSizeInput.value);
			const newRotation = parseFloat(elementRotationInput.value) * Math.PI / 180;
			const newHatchStep = parseFloat(document.getElementById('elementQRHatch').value);
			
			// Меняем геометрию
			element.x = newX;
			element.y = newY;
			element.scale = newSize / element.size;
			element.rotation = newRotation;
			
			// Применяем новый шаг штриховки и перегенерируем QR-код
			if (Math.abs(element.hatchStep - newHatchStep) > 0.01) {
				element.hatchStep = newHatchStep;
				// Перегенерируем QR-код с новым шагом штриховки
				const originalText = element.originalText || element.text;
				const type = element.type || 'text';
				
				// Создаём новый QR элемент с обновлённым шагом штриховки
				const newQR = new QRElement(
					element.id,
					element.text, // используем текущий текст (уже отформатированный)
					element.x,
					element.y,
					element.size,
					type,
					newHatchStep
				);
				
				// Копируем все свойства
				newQR.originalText = originalText;
				newQR.rotation = element.rotation;
				newQR.scale = element.scale;
				
				// Заменяем старый элемент новым
				qrElements[selectedQRIndex] = newQR;
			}
			
			drawScene();
			updateStatus('Свойства QR-кода обновлены', 'success');
		}
        
        // Обработка SVG элемента
        else if (isSVGSelected && selectedSVGIndex !== -1) {
            const element = svgElements[selectedSVGIndex];
            const newX = parseFloat(elementXInput.value);
            const newY = parseFloat(elementYInput.value);
            const newWidth = parseFloat(elementFontSizeInput.value);
            const newRotation = parseFloat(elementRotationInput.value) * Math.PI / 180;

            element.x = newX;
            element.y = newY;
            element.scale = newWidth / element.width;
            element.rotation = newRotation;

            drawScene();
            updateStatus('Свойства SVG обновлены', 'success');
            
        } 
        
        // Обработка текстового элемента
        else if (selectedElementIndex !== -1) {
            const element = textElements[selectedElementIndex];
            const newX = parseFloat(elementXInput.value);
            const newY = parseFloat(elementYInput.value);
            const newFontSize = parseFloat(elementFontSizeInput.value);
            const newRotation = parseFloat(elementRotationInput.value) * Math.PI / 180;
            const newFontPath = elementFontSelect.value;

            // Проверяем, изменился ли шрифт
            if (newFontPath) {
                const selectedFont = fonts.find(f => f.path === newFontPath);
                if (selectedFont && selectedFont.instance !== element.font) {
                    element.font = selectedFont.instance;
                    await element.generatePaths();
                }
            }

            if (newFontSize !== element.fontSize) {
                await element.updateFontSize(newFontSize);
            }

            element.x = newX;
            element.y = newY;
            element.rotation = newRotation;

            drawScene();
            updateStatus('Свойства элемента обновлены', 'success');
        }
    } catch (error) {
        console.error('Ошибка обновления элемента:', error);
        updateStatus('Ошибка обновления элемента', 'error');
    } finally {
        showLoading(false);
    }
}

function handleMouseDown(event) {
    event.preventDefault();
    if (isAddingText) return;
    
    const rect = mainCanvas.getBoundingClientRect();
    const x = (event.clientX - rect.left) / scaleFactor;
    const y = sheetHeight - (event.clientY - rect.top) / scaleFactor;

    // Если в режиме выделения части SVG
    if (isSelectingSVGPart) {
        isDrawingSelection = true;
        selectionStart = { x: x, y: y };
        selectionCurrent = { x: x, y: y };
        return;
    }
    
    // Проверяем, есть ли в месте клика уже выделенный элемент
    let clickedOnSelectedElement = false;
    
    // Проверяем выделенный QR элемент
    if (isQRSelected && selectedQRIndex !== -1) {
        const selectedElement = qrElements[selectedQRIndex];
        if (selectedElement && isPointInQRElement(x, y, selectedElement)) {
            clickedOnSelectedElement = true;
        }
    }
    
    // Проверяем выделенный SVG элемент
    if (!clickedOnSelectedElement && isSVGSelected && selectedSVGIndex !== -1) {
        const selectedElement = svgElements[selectedSVGIndex];
        if (selectedElement && isPointInSVGElement(x, y, selectedElement)) {
            clickedOnSelectedElement = true;
        }
    }
    
    // Проверяем выделенный текстовый элемент
    if (!clickedOnSelectedElement && selectedElementIndex !== -1) {
        const selectedElement = textElements[selectedElementIndex];
        if (selectedElement && isPointInTextElement(x, y, selectedElement)) {
            clickedOnSelectedElement = true;
        }
    }
    
    // Проверка на перо
    const penX = parseFloat(penStartXInput.value) || 0;
    const penY = parseFloat(penStartYInput.value) || 0;
    const distance = Math.sqrt(Math.pow(x - penX, 2) + Math.pow(y - penY, 2));
    
    if (distance < 5) {
        isMovingPen = true;
        penDragStartX = x;
        penDragStartY = y;
        return;
    }
    
    // Если кликнули на уже выделенный элемент - начинаем перетаскивание
    if (clickedOnSelectedElement) {
        console.log('Начали перетаскивание выделенного элемента');
        isDragging = true;
        isMovingElement = true; // УСТАНАВЛИВАЕМ ФЛАГ
        
        if (isQRSelected && selectedQRIndex !== -1) {
            dragOffsetX = x - qrElements[selectedQRIndex].x;
            dragOffsetY = y - qrElements[selectedQRIndex].y;
        } else if (isSVGSelected && selectedSVGIndex !== -1) {
            dragOffsetX = x - svgElements[selectedSVGIndex].x;
            dragOffsetY = y - svgElements[selectedSVGIndex].y;
        } else if (selectedElementIndex !== -1) {
            dragOffsetX = x - textElements[selectedElementIndex].x;
            dragOffsetY = y - textElements[selectedElementIndex].y;
        }
        return;
    }

    // Сначала проверяем QR элементы (сверху вниз)
    for (let i = qrElements.length - 1; i >= 0; i--) {
        const element = qrElements[i];
        
        if (isPointInQRElement(x, y, element)) {
            selectedQRIndex = i;
            isQRSelected = true;
            isSVGSelected = false;
            isDragging = true;
            isMovingElement = true; // УСТАНАВЛИВАЕМ ФЛАГ
            selectedElementIndex = -1;
            selectedSVGIndex = -1;
            
            dragOffsetX = x - element.x;
            dragOffsetY = y - element.y;
            
            updateTextElementsList();
            updateSVGElementsList();
            updateQRElementsList();
            updateElementProperties();
            updateDeleteButtonsVisibility();
            drawScene();
            return;
        }
    }
    
    // Затем проверяем SVG элементы
    for (let i = svgElements.length - 1; i >= 0; i--) {
        const element = svgElements[i];
        
        if (isPointInSVGElement(x, y, element)) {
            selectedSVGIndex = i;
            isSVGSelected = true;
            isQRSelected = false;
            isDragging = true;
            isMovingElement = true; // УСТАНАВЛИВАЕМ ФЛАГ
            selectedElementIndex = -1;
            selectedQRIndex = -1;
            
            dragOffsetX = x - element.x;
            dragOffsetY = y - element.y;
            
            updateTextElementsList();
            updateSVGElementsList();
            updateQRElementsList();
            updateElementProperties();
            updateDeleteButtonsVisibility();
            drawScene();
            return;
        }
    }
    
    // Затем проверяем текстовые элементы
    for (let i = textElements.length - 1; i >= 0; i--) {
        const element = textElements[i];
        
        if (isPointInTextElement(x, y, element)) {
            selectedElementIndex = i;
            isSVGSelected = false;
            isQRSelected = false;
            isDragging = true;
            isMovingElement = true; // УСТАНАВЛИВАЕМ ФЛАГ
            selectedSVGIndex = -1;
            selectedQRIndex = -1;
            
            dragOffsetX = x - element.x;
            dragOffsetY = y - element.y;
            
            updateTextElementsList();
            updateSVGElementsList();
            updateQRElementsList();
            updateElementProperties();
            updateDeleteButtonsVisibility();
            drawScene();
            return;
        }
    }
    
    // Если не нашли элемент - снимаем выделение
    selectedElementIndex = -1;
    isSVGSelected = false;
    isQRSelected = false;
    selectedSVGIndex = -1;
    selectedQRIndex = -1;
    isDragging = false;
    isMovingElement = false; // СБРАСЫВАЕМ ФЛАГ
    
    updateTextElementsList();
    updateSVGElementsList();
    updateQRElementsList();
    updateElementProperties();
    updateDeleteButtonsVisibility();
    drawScene();
}

function isPointInQRElement(x, y, element) {
    const bbox = element.getBoundingBox();
    
    // Центр элемента для поворота
    const centerX = element.x + bbox.width / 2;
    const centerY = element.y + bbox.height / 2;
    
    const cos = Math.cos(element.rotation);
    const sin = Math.sin(element.rotation);
    
    // Преобразуем точку клика относительно центра элемента
    const localX = (x - centerX) * cos - (y - centerY) * sin;
    const localY = (x - centerX) * sin + (y - centerY) * cos;
    
    // Проверяем попадание в bounding box
    return localX >= -bbox.width / 2 && localX <= bbox.width / 2 && 
           localY >= -bbox.height / 2 && localY <= bbox.height / 2;
}

        function drawScene() {
            ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
            
            if (backgroundVisible && backgroundImage) {
                ctx.globalAlpha = 0.3;
                
                if (stretchBackground) {
                    // Растягиваем изображение на весь лист
                    ctx.drawImage(backgroundImage, 0, 0, mainCanvas.width, mainCanvas.height);
                } else {
                    // Сохраняем пропорции
                    const imgAspect = backgroundImage.width / backgroundImage.height;
                    const canvasAspect = sheetWidth / sheetHeight;
                    
                    let drawWidth, drawHeight, offsetX, offsetY;
                    
                    if (imgAspect > canvasAspect) {
                        drawWidth = sheetWidth * scaleFactor;
                        drawHeight = drawWidth / imgAspect;
                        offsetX = 0;
                        offsetY = sheetHeight * scaleFactor - drawHeight;
                    } else {
                        drawHeight = sheetHeight * scaleFactor;
                        drawWidth = drawHeight * imgAspect;
                        offsetX = (sheetWidth * scaleFactor - drawWidth) / 2;
                        offsetY = 0;
                    }
                    
                    ctx.drawImage(backgroundImage, offsetX, offsetY, drawWidth, drawHeight);
                }
                ctx.globalAlpha = 1.0;
            }
			// Отрисовка выделения
			if (isSelectingSVGPart && (selectionStart.x !== selectionCurrent.x || selectionStart.y !== selectionCurrent.y)) {
				const rect = getSelectionRect();
				const x = rect.x * scaleFactor;
				const y = (sheetHeight - rect.y - rect.height) * scaleFactor;
				const width = rect.width * scaleFactor;
				const height = rect.height * scaleFactor;
				
				// Рамка выделения
				ctx.strokeStyle = '#ff6600';
				ctx.lineWidth = 2;
				ctx.setLineDash([5, 3]);
				ctx.strokeRect(x, y, width, height);
				
				// Заливка
				ctx.fillStyle = 'rgba(255, 102, 0, 0.1)';
				ctx.fillRect(x, y, width, height);
				
				ctx.setLineDash([]);
				
				// Подсказка
				ctx.fillStyle = '#ff6600';
				ctx.font = '12px Arial';
				ctx.fillText('Выделенная часть SVG', x + 5, y + 15);
			}
            // Остальная отрисовка (сетка, текст и т.д.)
            ctx.strokeStyle = '#cccccc';
            ctx.lineWidth = 1;
            ctx.strokeRect(0, 0, mainCanvas.width, mainCanvas.height);
            
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 0.3;
            ctx.fillStyle = '#666666';
            ctx.font = '10px Arial';
            
            for (let x = 10; x < sheetWidth; x += 10) {
                const screenX = x * scaleFactor;
                ctx.beginPath();
                ctx.moveTo(screenX, 0);
                ctx.lineTo(screenX, mainCanvas.height);
                ctx.stroke();
                
                if (x % 50 === 0) {
                    ctx.fillText(x.toString(), screenX + 2, mainCanvas.height - 2);
                }
            }
            
            for (let y = 10; y < sheetHeight; y += 10) {
                const screenY = mainCanvas.height - y * scaleFactor;
                ctx.beginPath();
                ctx.moveTo(0, screenY);
                ctx.lineTo(mainCanvas.width, screenY);
                ctx.stroke();
                
                if (y % 50 === 0) {
                    ctx.fillText(y.toString(), 2, screenY - 2);
                }
            }
            
            textElements.forEach((element, index) => {
                drawTextElement(element, index === selectedElementIndex);
            });
			svgElements.forEach((element, index) => {
				drawSVGElement(element, index === selectedSVGIndex && isSVGSelected);
			});
			
			qrElements.forEach((element, index) => {
				drawQRElement(element, index === selectedQRIndex && isQRSelected);
			});
        }
                
function drawTextElement(element, isSelected) {
    ctx.save();
    
    // Используем displayPaths которые уже повернуты
    const paths = element.getDisplayPaths();
    
    // Рисование текста
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1;
    
    for (const path of paths) {
        if (path.length < 2) continue;
        
        ctx.beginPath();
        // Конвертируем в координаты канваса (инвертируем Y)
        const startX = path[0].x * scaleFactor;
        const startY = (sheetHeight - path[0].y) * scaleFactor;
        
        ctx.moveTo(startX, startY);
        
        for (let i = 1; i < path.length; i++) {
            const pointX = path[i].x * scaleFactor;
            const pointY = (sheetHeight - path[i].y) * scaleFactor;
            ctx.lineTo(pointX, pointY);
        }
        
        ctx.stroke();
    }
    
    // Рамка выделения
    if (isSelected) {
        const bbox = element.getBoundingBox();
        const centerX = bbox.x + bbox.width / 2;
        const centerY = bbox.y + bbox.height / 2;
        
        // Конвертируем центр в координаты канваса
        const screenCenterX = centerX * scaleFactor;
        const screenCenterY = (sheetHeight - centerY) * scaleFactor;
        
        ctx.save();
        ctx.translate(screenCenterX, screenCenterY);
        // ИНВЕРТИРУЕМ УГОЛ ДЛЯ КАНВАСА (отрицательное вращение)
        ctx.rotate(-element.rotation);
        
        const scaledWidth = bbox.width * scaleFactor;
        const scaledHeight = bbox.height * scaleFactor;
        
        ctx.strokeStyle = '#007cba';
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(-scaledWidth / 2, -scaledHeight / 2, scaledWidth, scaledHeight);
        ctx.setLineDash([]);
        
        // Добавим угловые маркеры для наглядности
        ctx.fillStyle = '#007cba';
        const markerSize = 6;
        ctx.fillRect(-scaledWidth/2 - markerSize/2, -scaledHeight/2 - markerSize/2, markerSize, markerSize);
        ctx.fillRect(scaledWidth/2 - markerSize/2, -scaledHeight/2 - markerSize/2, markerSize, markerSize);
        ctx.fillRect(-scaledWidth/2 - markerSize/2, scaledHeight/2 - markerSize/2, markerSize, markerSize);
        ctx.fillRect(scaledWidth/2 - markerSize/2, scaledHeight/2 - markerSize/2, markerSize, markerSize);
        
        ctx.restore();
    }
    
    ctx.restore();
}
   
function drawSVGElement(element, isSelected) {
    if (!element.svgImage) return;
    
    ctx.save();
    
    const paths = element.getDisplayPaths();
    
    ctx.strokeStyle = '#000000';

}

async function exportToSvg() {
    if (textElements.length === 0 && svgElements.length === 0 && qrElements.length === 0) {
        updateStatus('Нет элементов для экспорта', 'error');
        return;
    }
    
    showLoading(true);
    try {
        let svgContent = `<?xml version="1.0" encoding="UTF-8"?>
<svg width="${sheetWidth}mm" height="${sheetHeight}mm" viewBox="0 0 ${sheetWidth} ${sheetHeight}" 
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Styles for the design -->
    <style type="text/css">
      .text-path { fill: none; stroke: black; stroke-width: 0.1; }
      .svg-element { fill: none; stroke: black; stroke-width: 0.1; }
      .qr-element { fill: black; stroke: none; }
    </style>
  </defs>
  
  <!-- Background (if any) -->
  <rect width="100%" height="100%" fill="white"/>
  
  <!-- ДОБАВЛЕНО: Отражаем всю сцену по вертикали -->
  <g transform="scale(1, -1) translate(0, -${sheetHeight})">
`;
        
        // Экспорт текстовых элементов
        for (let element of textElements) {
            const paths = element.getDisplayPaths();
            if (paths.length === 0) continue;
            
            svgContent += `  <g class="text-element">\n`;
            
            for (const path of paths) {
                if (path.length < 2) continue;
                
                let pathData = `M ${path[0].x.toFixed(3)} ${path[0].y.toFixed(3)}`;
                for (let i = 1; i < path.length; i++) {
                    pathData += ` L ${path[i].x.toFixed(3)} ${path[i].y.toFixed(3)}`;
                }
                
                svgContent += `    <path d="${pathData}" class="text-path"/>\n`;
            }
            
            svgContent += `  </g>\n`;
        }
        
        // Экспорт SVG элементов
        for (let element of svgElements) {
            const paths = element.getDisplayPaths();
            if (paths.length === 0) continue;
            
            svgContent += `  <g class="svg-element">\n`;
            
            for (const path of paths) {
                if (path.length < 2) continue;
                
                let pathData = `M ${path[0].x.toFixed(3)} ${path[0].y.toFixed(3)}`;
                for (let i = 1; i < path.length; i++) {
                    pathData += ` L ${path[i].x.toFixed(3)} ${path[i].y.toFixed(3)}`;
                }
                
                svgContent += `    <path d="${pathData}" class="svg-path"/>\n`;
            }
            
            svgContent += `  </g>\n`;
        }
        
        // Экспорт QR элементов (ДОБАВИТЬ ЭТО)
        for (let element of qrElements) {
            const paths = element.getDisplayPaths();
            if (paths.length === 0) continue;
            
            svgContent += `  <g class="qr-element">\n`;
            
            for (const path of paths) {
                if (path.length < 2) continue;
                
                let pathData = `M ${path[0].x.toFixed(3)} ${path[0].y.toFixed(3)}`;
                for (let i = 1; i < path.length; i++) {
                    pathData += ` L ${path[i].x.toFixed(3)} ${path[i].y.toFixed(3)}`;
                }
                
                // Для QR кода делаем заливку черным (это квадратики)
                svgContent += `    <path d="${pathData}" fill="black" stroke="none"/>\n`;
            }
            
            svgContent += `  </g>\n`;
        }
        
        // Закрываем группу отражения
        svgContent += `  </g>\n`;
        
        svgContent += '</svg>';
        
        // Создаем и скачиваем файл
        const blob = new Blob([svgContent], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'plotter_design_' + new Date().toISOString().slice(0,10) + '.svg';
        document.body.appendChild(a);
        a.click();
        
        // Очистка
        setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }, 100);
        
        updateStatus('SVG файл экспортирован', 'success');
    } catch (error) {
        console.error('Ошибка экспорта SVG:', error);
        updateStatus('Ошибка экспорта SVG: ' + error.message, 'error');
    } finally {
        showLoading(false);
    }
}

async function exportToGcode() {
    // ИСПРАВЛЕНО: добавляем проверку qrElements
    if (textElements.length === 0 && svgElements.length === 0 && qrElements.length === 0) {
        updateStatus('Нет элементов для экспорта', 'error');
        return;
    }

    showLoading(true);
    try {
        const penStartX = parseFloat(penStartXInput.value) || 0;
        const penStartY = parseFloat(penStartYInput.value) || 0;
        const pauseTime = parseInt(pauseTimeInput.value) || 100;
        const travelSpeed = parseInt(travelSpeedInput.value) || 3000;
        const drawSpeed = parseInt(drawSpeedInput.value) || 1500;
       
        // ИСПРАВЛЕНО: передаем qrElements в функцию
        let gcode = generateGCode(textElements, svgElements, qrElements, penStartX, penStartY, pauseTime, travelSpeed, drawSpeed);

        const blob = new Blob([gcode], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'plotter_design.gcode';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        updateStatus('G-code файл экспортирован', 'success');
    } catch (error) {
        console.error('Ошибка экспорта G-code:', error);
        updateStatus('Ошибка экспорта G-code: ' + error.message, 'error');
    } finally {
        showLoading(false);
    }
}

function generateGCode(textElements, svgElements, qrElements, penStartX, penStartY, pauseTime, travelSpeed, drawSpeed) {
    let gcode = [];
    
    gcode.push('G21');
    gcode.push('G90');
    gcode.push('G92 X0 Y0 Z0');
    gcode.push('M280 P0 S30.00');  // Перо вверх
    gcode.push('G4 P' + pauseTime);
    gcode.push('');

    // Собираем все пути
    let allPaths = [];
    
    // Текстовые элементы
    textElements.forEach(element => {
        const elementPaths = element.getGcodePaths();
        allPaths = allPaths.concat(elementPaths);
    });
    
    // SVG элементы
    svgElements.forEach(element => {
        if (element.getGcodePaths) {
            const elementPaths = element.getGcodePaths();
            allPaths = allPaths.concat(elementPaths);
        }
    });
    
    // ДОБАВЛЕНО: QR элементы
    qrElements.forEach(element => {
        const elementPaths = element.getGcodePaths();
        allPaths = allPaths.concat(elementPaths);
    });
    
    if (allPaths.length === 0) {
        gcode.push('M280 P0 S30.00');
        gcode.push('G4 P' + pauseTime);
        gcode.push('G1 X' + penStartX.toFixed(2) + ' Y' + penStartY.toFixed(2) + ' F' + travelSpeed);
        gcode.push('M2');
        return gcode.join('\n');
    }
    
    // ПАРАМЕТРЫ ОПТИМИЗАЦИИ
    const MAX_DISTANCE_NO_LIFT = 0.5;
    const MIN_POINTS_IN_PATH = 0;
    
    // Объединяем близко расположенные пути
    let optimizedPaths = [];
    let currentPath = null;
    
    // Сначала сортируем все начальные точки по расстоянию от стартовой позиции
    allPaths.sort((a, b) => {
        const distA = Math.sqrt(Math.pow(a[0].x - penStartX, 2) + Math.pow(a[0].y - penStartY, 2));
        const distB = Math.sqrt(Math.pow(b[0].x - penStartX, 2) + Math.pow(b[0].y - penStartY, 2));
        return distA - distB;
    });
    
    for (let i = 0; i < allPaths.length; i++) {
        const path = allPaths[i];
        
        if (path.length < MIN_POINTS_IN_PATH) continue;
        
        if (!currentPath) {
            currentPath = [...path];
        } else {
            const lastPoint = currentPath[currentPath.length - 1];
            const firstPoint = path[0];
            const distance = Math.sqrt(
                Math.pow(lastPoint.x - firstPoint.x, 2) + 
                Math.pow(lastPoint.y - firstPoint.y, 2)
            );
            
            if (distance <= MAX_DISTANCE_NO_LIFT) {
                for (let j = 1; j < path.length; j++) {
                    currentPath.push(path[j]);
                }
            } else {
                optimizedPaths.push(currentPath);
                currentPath = [...path];
            }
        }
    }
    
    if (currentPath && currentPath.length >= MIN_POINTS_IN_PATH) {
        optimizedPaths.push(currentPath);
    }
    
    console.log(`Оптимизация: было ${allPaths.length} путей, стало ${optimizedPaths.length} путей`);
    
    // Генерация G-code с оптимизированными путями
    let currentX = penStartX;
    let currentY = penStartY;
    
    // Сортировка оптимизированных путей по расстоянию от текущей позиции
    optimizedPaths.sort((a, b) => {
        const distA = Math.sqrt(Math.pow(a[0].x - currentX, 2) + Math.pow(a[0].y - currentY, 2));
        const distB = Math.sqrt(Math.pow(b[0].x - currentX, 2) + Math.pow(b[0].y - currentY, 2));
        return distA - distB;
    });
    
    while (optimizedPaths.length > 0) {
        let closestIndex = 0;
        let closestDistance = Math.sqrt(
            Math.pow(optimizedPaths[0][0].x - currentX, 2) + 
            Math.pow(optimizedPaths[0][0].y - currentY, 2)
        );
        
        for (let i = 1; i < optimizedPaths.length; i++) {
            const pathStart = optimizedPaths[i][0];
            const distance = Math.sqrt(
                Math.pow(pathStart.x - currentX, 2) + 
                Math.pow(pathStart.y - currentY, 2)
            );
            
            if (distance < closestDistance) {
                closestDistance = distance;
                closestIndex = i;
            }
        }
        
        const path = optimizedPaths[closestIndex];
        
        // Перемещение к началу пути (перо вверху)
        gcode.push('G4 P' + pauseTime);
        gcode.push('M280 P0 S30.00');  // Поднять перо
        gcode.push('G4 P' + pauseTime);
        gcode.push('G1 X' + path[0].x.toFixed(2) + ' Y' + path[0].y.toFixed(2) + ' F' + travelSpeed);
        
        // Проверяем, нужно ли опускать перо
        const distanceFromCurrent = Math.sqrt(
            Math.pow(path[0].x - currentX, 2) + 
            Math.pow(path[0].y - currentY, 2)
        );
        
        if (distanceFromCurrent > 0.1) {
            gcode.push('G4 P' + pauseTime);
            gcode.push('M280 P0 S0.00');   // Опустить перо
            gcode.push('G4 P' + pauseTime);
        }
        
        // Рисование пути
        for (let i = 0; i < path.length; i++) {
            const point = path[i];
            const speed = (i === 0 && distanceFromCurrent > 0.1) ? travelSpeed : drawSpeed;
            gcode.push('G1 X' + point.x.toFixed(2) + ' Y' + point.y.toFixed(2) + ' F' + speed);
        }
        
        // Обновляем позицию
        currentX = path[path.length - 1].x;
        currentY = path[path.length - 1].y;
        
        // Удаляем обработанный путь
        optimizedPaths.splice(closestIndex, 1);
    }
    
    // Завершение
    gcode.push('G4 P' + pauseTime);
    gcode.push('M280 P0 S30.00');  // Поднять перо
    gcode.push('G4 P' + pauseTime);
    gcode.push('G1 X' + penStartX.toFixed(2) + ' Y' + penStartY.toFixed(2) + ' F' + travelSpeed);
    gcode.push('M2');
    
    return gcode.join('\n');
}

        function showLoading(show) {
            loadingDiv.style.display = show ? 'block' : 'none';
        }
        
        function updateStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
        
        window.addEventListener('load', init);
    </script>
