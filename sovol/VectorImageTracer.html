    this.state.draggingPointOriginalY = point.y;
}
    
updatePointDrag(x, y) {
    if (!this.state.isDraggingPoint) return;
    
    const pointIndex = this.state.draggingPointIndex;
    const point = this.state.bezierPoints[pointIndex];
    if (!point) return;
    
    // Вычисляем смещение
    const dx = x - this.state.draggingPointStartX;
    const dy = y - this.state.draggingPointStartY;
    
    // Обновляем координаты точки в объекте
    point.x = this.state.draggingPointOriginalX + dx;
    point.y = this.state.draggingPointOriginalY + dy;
    
    // Обновляем визуальный элемент точки
    if (point.element) {
        point.element.setAttribute('cx', point.x);
        point.element.setAttribute('cy', point.y);
    }
    
    // ОБНОВЛЯЕМ ВСЕ СВЯЗАННЫЕ ВЕКТОРЫ И ИХ НАПРАВЛЯЮЩИЕ
    this.state.bezierVectors.forEach(vector => {
        let needsUpdate = false;
        
        // Если точка является началом вектора
        if (vector.from === pointIndex) {
            // Обновляем контрольную точку 1
            vector.control1.x += dx;
            vector.control1.y += dy;
            
            // Обновляем линию направляющей 1
            if (vector.guideElements.line1) {
                vector.guideElements.line1.setAttribute('x1', point.x);
                vector.guideElements.line1.setAttribute('y1', point.y);
                vector.guideElements.line1.setAttribute('x2', vector.control1.x);
                vector.guideElements.line1.setAttribute('y2', vector.control1.y);
            }
            
            // Обновляем контрольную точку 1
            if (vector.guideElements.control1) {
                vector.guideElements.control1.setAttribute('cx', vector.control1.x);
                vector.guideElements.control1.setAttribute('cy', vector.control1.y);
            }
            
            needsUpdate = true;
        }
        
        // Если точка является концом вектора
        if (vector.to === pointIndex) {
            // Обновляем контрольную точку 2
            vector.control2.x += dx;
            vector.control2.y += dy;
            
            // Обновляем линию направляющей 2
            if (vector.guideElements.line2) {
                vector.guideElements.line2.setAttribute('x1', point.x);
                vector.guideElements.line2.setAttribute('y1', point.y);
                vector.guideElements.line2.setAttribute('x2', vector.control2.x);
                vector.guideElements.line2.setAttribute('y2', vector.control2.y);
            }
            
            // Обновляем контрольную точку 2
            if (vector.guideElements.control2) {
                vector.guideElements.control2.setAttribute('cx', vector.control2.x);
                vector.guideElements.control2.setAttribute('cy', vector.control2.y);
            }
            
            needsUpdate = true;
        }
        
        // Обновляем путь Безье если нужно
        if (needsUpdate) {
            this.updateBezierVectorPath(vector);
        }
    });
    
    // Обновляем стартовую позицию для плавного движения
    this.state.draggingPointStartX = x;
    this.state.draggingPointStartY = y;
    this.state.draggingPointOriginalX = point.x;
    this.state.draggingPointOriginalY = point.y;
}

    endPointDrag() {
        this.state.isDraggingPoint = false;
        this.state.draggingPointIndex = null;
    }

mergeTwoBezierVectors(v_in, v_out) {
    const A = this.state.bezierPoints[v_in.from];
    const B = this.state.bezierPoints[v_in.to];
    const C = this.state.bezierPoints[v_out.to];
    
    if (!A || !B || !C) return null;
    
    const c1_old = { x: v_in.control1.x, y: v_in.control1.y };
    const c2_old = { x: v_out.control2.x, y: v_out.control2.y };
    
    // Направления касательных (от A к c1_old и от C к c2_old)
    let d1 = { x: c1_old.x - A.x, y: c1_old.y - A.y };
    let d2 = { x: c2_old.x - C.x, y: c2_old.y - C.y };
    
    const len1 = Math.hypot(d1.x, d1.y) || 1;
    const len2 = Math.hypot(d2.x, d2.y) || 1;
    
    d1 = { x: d1.x / len1, y: d1.y / len1 };
    d2 = { x: d2.x / len2, y: d2.y / len2 };
    
    // Правая часть: R = (8B - A - C)/3 - A - C
    const Rx = (8 * B.x - A.x - C.x) / 3 - A.x - C.x;
    const Ry = (8 * B.y - A.y - C.y) / 3 - A.y - C.y;
    
    // Система:
    //   a·d1.x + b·d2.x = Rx
    //   a·d1.y + b·d2.y = Ry
    const det = d1.x * d2.y - d1.y * d2.x;
    
    let a, b;
    if (Math.abs(det) > 1e-6) {
        a = (Rx * d2.y - Ry * d2.x) / det;
        b = (d1.x * Ry - d1.y * Rx) / det;
    } else {
        // Касательные коллинеарны — упрощённый случай
        a = (Rx * d1.x + Ry * d1.y);
        b = (Rx * d2.x + Ry * d2.y);
    }
    
    // Ограничения: a, b должны быть положительны (иначе кривая "вывернется")
    const minA = len1 * 0.1;
    const maxA = len1 * 3;
    const minB = len2 * 0.1;
    const maxB = len2 * 3;
    
    if (a < minA || a > maxA) a = Math.max(minA, Math.min(maxA, a));
    if (b < minB || b > maxB) b = Math.max(minB, Math.min(maxB, b));
    
    const c1 = { x: A.x + a * d1.x, y: A.y + a * d1.y };
    const c2 = { x: C.x + b * d2.x, y: C.y + b * d2.y };
    
    return {
        from: v_in.from,
        to: v_out.to,
        control1: { x: c1.x, y: c1.y, belongsTo: v_in.from },
        control2: { x: c2.x, y: c2.y, belongsTo: v_out.to }
    };
}

    // УДАЛЕНИЕ ТОЧКИ
deleteBezierPoint(pointIndex) {
    const deletedPoint = this.state.bezierPoints[pointIndex];
    if (!deletedPoint) return;
    
    // === ШАГ 1: Находим все связанные векторы ===
    const relatedVectors = [];
    
    for (let i = this.state.bezierVectors.length - 1; i >= 0; i--) {
        const vector = this.state.bezierVectors[i];
        if (vector.from === pointIndex || vector.to === pointIndex) {
            relatedVectors.push({ vector, index: i });
        }
    }
    
    // === ШАГ 2: Обрабатываем разные случаи ===
    
    // СЛУЧАЙ 1: Один вектор (крайняя точка)
    if (relatedVectors.length === 1) {
        const { vector, index } = relatedVectors[0];
        this.removeVectorAndGuides(vector);
        this.state.bezierVectors.splice(index, 1);
    }
    // СЛУЧАЙ 2: Два вектора (средняя точка в цепочке)
    else if (relatedVectors.length === 2) {
        // Находим входящий и исходящий векторы
        const v1 = relatedVectors[0].vector;
        const v2 = relatedVectors[1].vector;
        
        // Определяем, какая точка A (начало входящего) и C (конец исходящего)
        let pointAIndex, pointCIndex;
        let v_in = null, v_out = null;
		if (v1.to === pointIndex && v2.from === pointIndex) {
			// v1 -> удаляемая, v2 -> от удаляемой
			pointAIndex = v1.from;
			pointCIndex = v2.to;
			v_in = v1;
			v_out = v2;
		} else if (v2.to === pointIndex && v1.from === pointIndex) {
			// v2 -> удаляемая, v1 -> от удаляемой
			pointAIndex = v2.from;
			pointCIndex = v1.to;
			v_in = v2;
			v_out = v1;
		} else {
            // Оба входят или оба исходят — просто удаляем
            relatedVectors.forEach(({ vector, index }) => {
                this.removeVectorAndGuides(vector);
                this.state.bezierVectors.splice(index, 1);
            });
            // Продолжаем удаление точки
        }
        
if (pointAIndex !== undefined && pointCIndex !== undefined) {
    // Сохраняем стиль от старых векторов ДО удаления
    const savedStroke = (v_in && v_in.path) 
        ? v_in.path.getAttribute('stroke') 
        : this.state.strokeColor;
    const savedStrokeWidth = (v_in && v_in.path) 
        ? v_in.path.getAttribute('stroke-width') 
        : this.state.strokeWidth;
    const savedLinecap = (v_in && v_in.path)
        ? (v_in.path.getAttribute('stroke-linecap') || 'round')
        : 'round';
    const savedLinejoin = (v_in && v_in.path)
        ? (v_in.path.getAttribute('stroke-linejoin') || 'round')
        : 'round';
    
    // Удаляем старые векторы (с конца, чтобы индексы не сбились)
    const indices = relatedVectors.map(v => v.index).sort((a, b) => b - a);
    indices.forEach(idx => {
        const vector = this.state.bezierVectors[idx];
        this.removeVectorAndGuides(vector);
        this.state.bezierVectors.splice(idx, 1);
    });
    
    // Получаем точки A и C
    const pointA = this.state.bezierPoints[pointAIndex];
    const pointC = this.state.bezierPoints[pointCIndex];
    
    if (pointA && pointC && v_in && v_out) {
        const merged = this.mergeTwoBezierVectors(v_in, v_out);
        
        if (merged) {
            const newVector = {
                from: merged.from,
                to: merged.to,
                control1: merged.control1,
                control2: merged.control2,
                path: null,
                guideElements: {}
            };
            
            newVector.path = this.createBezierPath(
                pointA.x, pointA.y,
                newVector.control1.x, newVector.control1.y,
                newVector.control2.x, newVector.control2.y,
                pointC.x, pointC.y
            );
            
            // Используем СОХРАНЁННЫЙ стиль
            if (savedStroke) newVector.path.setAttribute('stroke', savedStroke);
            if (savedStrokeWidth) newVector.path.setAttribute('stroke-width', savedStrokeWidth);
            newVector.path.setAttribute('stroke-linecap', savedLinecap);
            newVector.path.setAttribute('stroke-linejoin', savedLinejoin);
            
            this.svg.appendChild(newVector.path);
            this.state.bezierVectors.push(newVector);
            
            this.createVectorGuides(newVector, pointA, pointC);
            
            if (this.state.currentTool !== 'bezier-points') {
                const ge = newVector.guideElements;
                if (ge.line1) ge.line1.style.display = 'none';
                if (ge.control1) ge.control1.style.display = 'none';
                if (ge.line2) ge.line2.style.display = 'none';
                if (ge.control2) ge.control2.style.display = 'none';
            }
        }
    }
}
    }
    // СЛУЧАЙ 3: Больше двух векторов (развилка)
    else {
        const indices = relatedVectors.map(v => v.index).sort((a, b) => b - a);
        indices.forEach(idx => {
            const vector = this.state.bezierVectors[idx];
            this.removeVectorAndGuides(vector);
            this.state.bezierVectors.splice(idx, 1);
        });
    }
    
    // === ШАГ 3: Удаляем точку из массива ===
    if (deletedPoint.element && deletedPoint.element.parentNode) {
        deletedPoint.element.parentNode.removeChild(deletedPoint.element);
    }
    this.state.bezierPoints.splice(pointIndex, 1);
    
    // === ШАГ 4: Обновляем ВСЕ индексы и принадлежность ===
    this.updatePointIndicesAfterDeletion(pointIndex);
    
    // Сбрасываем выделение
    if (this.state.bezierSelectedPoint === pointIndex) {
        this.deselectAllPoints();
    } else if (this.state.bezierSelectedPoint > pointIndex) {
        this.state.bezierSelectedPoint--;
    }
    
    setTimeout(() => this.saveSnapshot(), 100);
}

updatePointIndicesAfterDeletion(deletedIndex) {
    // === 1. Обновляем индексы точек ===
    this.state.bezierPoints.forEach((point, index) => {
        point.index = index;
        if (point.element) {
            point.element.setAttribute('data-index', index);
        }
    });
    
    // === 2. Обновляем индексы from/to в векторах ===
    this.state.bezierVectors.forEach(vector => {
        if (vector.from > deletedIndex) vector.from--;
        if (vector.to > deletedIndex) vector.to--;
        
        // Обновляем data-vector-id у пути
        if (vector.path) {
            vector.path.setAttribute('data-vector-id', `${vector.from}-${vector.to}`);
        }
    });
    
    // === 3. Обновляем belongsTo у контрольных точек ===
    this.state.bezierVectors.forEach((vector, vIndex) => {
        // control1 всегда принадлежит точке from
        vector.control1.belongsTo = vector.from;
        if (vector.guideElements.control1) {
            vector.guideElements.control1.setAttribute('data-belongs-to', vector.from);
            vector.guideElements.control1.setAttribute('data-vector-index', vIndex);
            vector.guideElements.control1.setAttribute('data-control-type', 'control1');
        }
        if (vector.guideElements.line1) {
            vector.guideElements.line1.setAttribute('data-belongs-to', vector.from);
            vector.guideElements.line1.setAttribute('data-vector-index', vIndex);
            vector.guideElements.line1.setAttribute('data-control-type', 'control1');
        }
        
        // control2 всегда принадлежит точке to
        vector.control2.belongsTo = vector.to;
        if (vector.guideElements.control2) {
            vector.guideElements.control2.setAttribute('data-belongs-to', vector.to);
            vector.guideElements.control2.setAttribute('data-vector-index', vIndex);
            vector.guideElements.control2.setAttribute('data-control-type', 'control2');
        }
        if (vector.guideElements.line2) {
            vector.guideElements.line2.setAttribute('data-belongs-to', vector.to);
            vector.guideElements.line2.setAttribute('data-vector-index', vIndex);
            vector.guideElements.line2.setAttribute('data-control-type', 'control2');
        }
        
        // Обновляем координаты направляющих линий
        const fromPoint = this.state.bezierPoints[vector.from];
        const toPoint = this.state.bezierPoints[vector.to];
        
        if (fromPoint && vector.guideElements.line1) {
            vector.guideElements.line1.setAttribute('x1', fromPoint.x);
            vector.guideElements.line1.setAttribute('y1', fromPoint.y);
            vector.guideElements.line1.setAttribute('x2', vector.control1.x);
            vector.guideElements.line1.setAttribute('y2', vector.control1.y);
        }
        
        if (toPoint && vector.guideElements.line2) {
            vector.guideElements.line2.setAttribute('x1', toPoint.x);
            vector.guideElements.line2.setAttribute('y1', toPoint.y);
            vector.guideElements.line2.setAttribute('x2', vector.control2.x);
            vector.guideElements.line2.setAttribute('y2', vector.control2.y);
        }
    });
}

removeVectorAndGuides(vector) {
    if (vector.path && vector.path.parentNode) {
        vector.path.parentNode.removeChild(vector.path);
    }
    if (vector.guideElements) {
        if (vector.guideElements.line1) vector.guideElements.line1.remove();
        if (vector.guideElements.control1) vector.guideElements.control1.remove();
        if (vector.guideElements.line2) vector.guideElements.line2.remove();
        if (vector.guideElements.control2) vector.guideElements.control2.remove();
    }
}

// конец безье

// заливка
fillShapeWithSnake(element) {
    if (!element) {
        this.updateFillInfo('❌ Фигура не выбрана');
        return;
    }
    
    // === МЕНЯЕМ КУРСОР НА "ЗАНЯТ" ===
    const oldCursor = this.svg.style.cursor;
    this.svg.style.cursor = 'wait';
    
    // Используем setTimeout чтобы курсор успел обновиться
    setTimeout(() => {
        try {
            // Сохраняем оригинальный элемент нетронутым
            const fillType = document.getElementById('fillType')?.value || 'linear';
            const spacingMM = parseFloat(document.getElementById('fillSpacingSlider')?.value) || 2.0;
            const marginMM = parseFloat(document.getElementById('fillMarginSlider')?.value) || 0.0;
            const continuous = document.getElementById('fillContinuousToggle')?.checked ?? true;
            const smooth = document.getElementById('fillSmoothToggle')?.checked ?? true;
            
            const spacing = Math.max(2, this.mmToSvgPixels(spacingMM));
            const margin = this.mmToSvgPixels(marginMM);
            
            // Получаем замкнутый путь
            const closedD = this.getClosedShapePath(element);
            if (!closedD) {
                this.updateFillInfo('❌ Не удалось обработать фигуру');
                this.svg.style.cursor = oldCursor;
                return;
            }
            
            // Для расчетов используем полилинию
            let calculationD = closedD;
            if (/[CcQq]/.test(closedD)) {
                calculationD = this.convertBezierToPolylineForCalculation(closedD);
            }
            
            const contourPoints = this.parseDToPoints(calculationD);
            if (!contourPoints || contourPoints.length < 3) {
                this.updateFillInfo('❌ Слишком мало точек');
                this.svg.style.cursor = oldCursor;
                return;
            }
            
            // Отступ внутрь
            let checkContour = contourPoints;
            if (margin > 0) {
                const tag = element.tagName.toLowerCase();
                
                if (tag === 'circle') {
                    const cx = parseFloat(element.getAttribute('cx')) || 0;
                    const cy = parseFloat(element.getAttribute('cy')) || 0;
                    const r = parseFloat(element.getAttribute('r')) || 0;
                    const newR = Math.max(1, r - margin);
                    const insetD = this.generatePolygonPath(cx, cy, newR, newR, 60);
                    checkContour = this.parseDToPoints(insetD);
                } else if (tag === 'ellipse') {
                    const cx = parseFloat(element.getAttribute('cx')) || 0;
                    const cy = parseFloat(element.getAttribute('cy')) || 0;
                    const rx = parseFloat(element.getAttribute('rx')) || 0;
                    const ry = parseFloat(element.getAttribute('ry')) || 0;
                    const newRx = Math.max(1, rx - margin);
                    const newRy = Math.max(1, ry - margin);
                    const insetD = this.generatePolygonPath(cx, cy, newRx, newRy, 60);
                    checkContour = this.parseDToPoints(insetD);
                } else if (tag === 'rect') {
                    const x = parseFloat(element.getAttribute('x')) || 0;
                    const y = parseFloat(element.getAttribute('y')) || 0;
                    const w = parseFloat(element.getAttribute('width')) || 0;
                    const h = parseFloat(element.getAttribute('height')) || 0;
                    const insetD = `M ${x + margin} ${y + margin} L ${x + w - margin} ${y + margin} L ${x + w - margin} ${y + h - margin} L ${x + margin} ${y + h - margin} Z`;
                    checkContour = this.parseDToPoints(insetD);
                } else {
                    checkContour = this.insetContour(contourPoints, margin);
                }
            }
            
            const bbox = this.getPointsBBox(checkContour);
            
            let pathD = '';
            
            if (fillType === 'linear90') {
                pathD = this.createVerticalSnakeSimple(bbox, spacing);
            } else if (fillType === 'linear45') {
                pathD = this.createDiagonalSnakeSimple(bbox, spacing);
            } else if (fillType === 'chaotic') {
                const chaoticPoints = this.collectPointsInContour(checkContour, bbox, spacing);
                
                if (!chaoticPoints || chaoticPoints.length < 2) {
                    this.updateFillInfo('❌ Не удалось создать хаотичную змейку');
                    this.svg.style.cursor = oldCursor;
                    return;
                }
                
                const snakes = this.connectPointsToSnake(chaoticPoints, spacing);
                
                if (!snakes || snakes.length === 0) {
                    this.updateFillInfo('❌ Не удалось соединить точки');
                    this.svg.style.cursor = oldCursor;
                    return;
                }
                
                const createdCount = this.createSnakePaths(snakes);
                this.updateFillInfo(`✅ Хаотичная (${spacingMM}мм)`);
                setTimeout(() => this.saveSnapshot(), 100);
                this.svg.style.cursor = oldCursor;
                return;
            } else if (fillType === 'spiral') {
                this.svg.style.cursor = oldCursor;
                this.startSpiralFill();
                return;
            } else {
                pathD = this.createHorizontalSnakeSimple(bbox, spacing);
            }
            
            if (!pathD) {
                this.updateFillInfo('❌ Не удалось создать змейку');
                this.svg.style.cursor = oldCursor;
                return;
            }
            
            const clippedSegments = this.clipLinesToContour(pathD, checkContour);
            
            if (!clippedSegments || clippedSegments.length === 0) {
                this.updateFillInfo('❌ Змейка не попала в фигуру');
                this.svg.style.cursor = oldCursor;
                return;
            }
            
            let finalSegments;
            if (continuous) {
                finalSegments = this.connectSegmentsSimple(clippedSegments, spacing);
            } else {
                finalSegments = clippedSegments;
            }
            
            const parentTransform = element.getAttribute('transform') || '';
            const createdCount = this.createSnakePaths(finalSegments, parentTransform);
            
            this.updateFillInfo(`✅ Создано: ${createdCount} шт. (${fillType}, ${spacingMM}мм)`);
            setTimeout(() => this.saveSnapshot(), 100);
            
        } catch (error) {
            console.error('Ошибка при создании заливки:', error);
            this.updateFillInfo('❌ Ошибка при создании заливки');
        } finally {
            // Возвращаем курсор
            this.svg.style.cursor = oldCursor;
            this.updateCursor();
        }
    }, 10); // Небольшая задержка чтобы курсор обновился
}

convertBezierToPolylineForCalculation(d) {
    if (!d) return d;
    
    // Если нет кривых Безье, возвращаем как есть
    if (!/[CcQq]/.test(d)) return d;
    
    const commands = this.parsePathCommands(d);
    let polylineD = '';
    let currentX = 0, currentY = 0;
    let firstX = 0, firstY = 0;
    let hasFirstPoint = false;
    
    for (const cmd of commands) {
        const { command, params, isRelative } = cmd;
        
        let absParams = [...params];
        if (isRelative && command !== 'Z' && command !== 'z') {
            for (let i = 0; i < absParams.length; i += 2) {
                if (i + 1 < absParams.length) {
                    absParams[i] += currentX;
                    absParams[i + 1] += currentY;
                }
            }
        }
        
        switch (command.toUpperCase()) {
            case 'M':
                if (absParams.length >= 2) {
                    currentX = absParams[0];
                    currentY = absParams[1];
                    firstX = currentX;
                    firstY = currentY;
                    hasFirstPoint = true;
                    polylineD += `M ${currentX} ${currentY} `;
                }
                break;
                
            case 'L':
                for (let i = 0; i < absParams.length; i += 2) {
                    if (i + 1 < absParams.length) {
                        currentX = absParams[i];
                        currentY = absParams[i + 1];
                        polylineD += `L ${currentX} ${currentY} `;
                    }
                }
                break;
                
            case 'C':
                // Кубическая кривая Безье
                for (let i = 0; i < absParams.length; i += 6) {
                    if (i + 5 < absParams.length) {
                        const segments = this.approximateCubicBezier(
                            currentX, currentY,
                            absParams[i], absParams[i + 1],
                            absParams[i + 2], absParams[i + 3],
                            absParams[i + 4], absParams[i + 5],
                            30  // 30 сегментов для точной аппроксимации
                        );
                        
                        // Добавляем все точки кроме первой
                        for (let j = 1; j < segments.length; j++) {
                            polylineD += `L ${segments[j].x} ${segments[j].y} `;
                        }
                        
                        currentX = absParams[i + 4];
                        currentY = absParams[i + 5];
                    }
                }
                break;
                
            case 'Q':
                // Квадратичная кривая Безье
                for (let i = 0; i < absParams.length; i += 4) {
                    if (i + 3 < absParams.length) {
                        // Преобразуем квадратичную в кубическую
                        const cx1 = currentX + (2/3) * (absParams[i] - currentX);
                        const cy1 = currentY + (2/3) * (absParams[i + 1] - currentY);
                        const cx2 = absParams[i + 2] + (2/3) * (absParams[i] - absParams[i + 2]);
                        const cy2 = absParams[i + 3] + (2/3) * (absParams[i + 1] - absParams[i + 3]);
                        
                        const segments = this.approximateCubicBezier(
                            currentX, currentY,
                            cx1, cy1,
                            cx2, cy2,
                            absParams[i + 2], absParams[i + 3],
                            30
                        );
                        
                        for (let j = 1; j < segments.length; j++) {
                            polylineD += `L ${segments[j].x} ${segments[j].y} `;
                        }
                        
                        currentX = absParams[i + 2];
                        currentY = absParams[i + 3];
                    }
                }
                break;
                
            case 'Z':
            case 'z':
                // Замыкаем к первой точке
                if (hasFirstPoint) {
                    polylineD += `L ${firstX} ${firstY} Z `;
                    currentX = firstX;
                    currentY = firstY;
                }
                break;
        }
    }
    
    // Если путь не замкнут, но должен быть - замыкаем
    const trimmed = polylineD.trim();
    if (!trimmed.endsWith('Z') && !trimmed.endsWith('z') && hasFirstPoint) {
        const dist = Math.sqrt((currentX - firstX) ** 2 + (currentY - firstY) ** 2);
        if (dist < 2) {
            polylineD += ' Z';
        }
    }
    
    return polylineD.trim();
}

parsePathCommands(d) {
    const commands = [];
    const regex = /([MLCQZmlcqz])([^MLCQZmlcqz]*)/g;
    let match;
    
    while ((match = regex.exec(d)) !== null) {
        const command = match[1];
        const isRelative = command === command.toLowerCase();
        const paramsStr = match[2].trim();
        
        if (!paramsStr && command.toUpperCase() !== 'Z') continue;
        
        const params = paramsStr ? paramsStr.split(/[\s,]+/).map(Number).filter(n => !isNaN(n)) : [];
        
        commands.push({
            command,
            params,
            isRelative
        });
    }
    
    return commands;
}

approximateCubicBezier(x1, y1, cx1, cy1, cx2, cy2, x2, y2, numSegments = 20) {
    const points = [];
    
    for (let i = 0; i <= numSegments; i++) {
        const t = i / numSegments;
        const t2 = t * t;
        const t3 = t2 * t;
        const mt = 1 - t;
        const mt2 = mt * mt;
        const mt3 = mt2 * mt;
        
        const x = mt3 * x1 + 3 * mt2 * t * cx1 + 3 * mt * t2 * cx2 + t3 * x2;
        const y = mt3 * y1 + 3 * mt2 * t * cy1 + 3 * mt * t2 * cy2 + t3 * y2;
        
        points.push({ x, y });
    }
    
    return points;
}

collectPointsInContour(contourPoints, bbox, spacing) {
    const points = [];
    
    // Центрируем по X и Y
    const cols = Math.floor(bbox.width / spacing);
    const rows = Math.floor(bbox.height / spacing);
    
    const totalWidth = cols * spacing;
    const totalHeight = rows * spacing;
    
    const startX = bbox.x + (bbox.width - totalWidth) / 2 + spacing / 2;
    const startY = bbox.y + (bbox.height - totalHeight) / 2 + spacing / 2;
    
    for (let row = 0; row < rows; row++) {
        const y = startY + row * spacing;
        
        for (let col = 0; col < cols; col++) {
            const x = startX + col * spacing;
            
            if (this.isPointInsideContour({x, y}, contourPoints)) {
                points.push({x, y});
            }
        }
    }
    
    return points;
}

connectPointsToSnake(points, spacing) {
    if (points.length < 2) return null;
    
    const MAX_STEP = spacing * 1.5;
    const MAX_JUMP = spacing * 2.0;
    
    const snakes = [];
    const used = new Set();
    
    this.shuffleArray(points);
    
    while (used.size < points.length) {
        let current = null;
        for (const p of points) {
            const key = `${p.x},${p.y}`;
            if (!used.has(key)) {
                current = p;
                break;
            }
        }
        
        if (!current) break;
        
        const snake = [current];
        used.add(`${current.x},${current.y}`);
        
        let canContinue = true;
        
        while (canContinue && used.size < points.length) {
            let nearest = null;
            let minDist = Infinity;
            
            for (const p of points) {
                const key = `${p.x},${p.y}`;
                if (used.has(key)) continue;
                
                const dist = Math.hypot(current.x - p.x, current.y - p.y);
                
                if (dist <= MAX_STEP && dist < minDist) {
                    minDist = dist;
                    nearest = p;
                }
            }
            
            if (nearest) {
                snake.push(nearest);
                used.add(`${nearest.x},${nearest.y}`);
                current = nearest;
            } else {
                let jumpPoint = null;
                let jumpDist = Infinity;
                
                for (const p of points) {
                    const key = `${p.x},${p.y}`;
                    if (used.has(key)) continue;
                    
                    const dist = Math.hypot(current.x - p.x, current.y - p.y);
                    
                    if (dist <= MAX_JUMP && dist < jumpDist) {
                        jumpDist = dist;
                        jumpPoint = p;
                    }
                }
                
                if (jumpPoint) {
                    snake.push(jumpPoint);
                    used.add(`${jumpPoint.x},${jumpPoint.y}`);
                    current = jumpPoint;
                } else {
                    canContinue = false;
                }
            }
        }
        
        if (snake.length > 1) {
            snakes.push(snake);
        }
    }
    
    return snakes.length > 0 ? snakes : null;
}

clipLinesToContour(pathD, contourPoints) {
    const lines = this.parseLinesFromD(pathD);
    const resultSegments = [];
    
    for (const line of lines) {
        const intersections = [];
        
        for (let i = 0; i < contourPoints.length; i++) {
            const p1 = contourPoints[i];
            const p2 = contourPoints[(i + 1) % contourPoints.length];
            
            const intersection = this.lineSegmentIntersection(
                line.x1, line.y1, line.x2, line.y2,
                p1.x, p1.y, p2.x, p2.y
            );
            
            if (intersection) {
                intersections.push({
                    x: intersection.x,
                    y: intersection.y,
                    t: this.pointOnLine(line.x1, line.y1, line.x2, line.y2, intersection.x, intersection.y)
                });
            }
        }
        
        if (this.isPointInsideContour({x: line.x1, y: line.y1}, contourPoints)) {
            intersections.push({x: line.x1, y: line.y1, t: 0});
        }
        if (this.isPointInsideContour({x: line.x2, y: line.y2}, contourPoints)) {
            intersections.push({x: line.x2, y: line.y2, t: 1});
        }
        
        intersections.sort((a, b) => a.t - b.t);
        
        const unique = [];
        for (const pt of intersections) {
            if (unique.length === 0 || Math.abs(pt.t - unique[unique.length - 1].t) > 0.001) {
                unique.push(pt);
            }
        }
        
        for (let i = 0; i < unique.length - 1; i += 2) {
            if (i + 1 < unique.length) {
                const start = unique[i];
                const end = unique[i + 1];
                const midX = (start.x + end.x) / 2;
                const midY = (start.y + end.y) / 2;
                
                if (this.isPointInsideContour({x: midX, y: midY}, contourPoints)) {
                    resultSegments.push([
                        {x: start.x, y: start.y},
                        {x: end.x, y: end.y}
                    ]);
                }
            }
        }
    }
    
    return resultSegments;
}

parseLinesFromD(d) {
    const lines = [];
    const commands = d.match(/[ML][^ML]*/g) || [];
    
    let prevPoint = null;
    
    for (const cmd of commands) {
        const coords = cmd.substring(1).trim().split(/[\s,]+/).map(Number);
        
        for (let i = 0; i < coords.length; i += 2) {
            if (i + 1 < coords.length) {
                const x = coords[i];
                const y = coords[i + 1];
                
                if (cmd[0] === 'M') {
                    prevPoint = {x, y};
                } else if (cmd[0] === 'L' && prevPoint) {
                    lines.push({
                        x1: prevPoint.x, y1: prevPoint.y,
                        x2: x, y2: y
                    });
                    prevPoint = {x, y};
                }
            }
        }
    }
    
    return lines;
}

lineSegmentIntersection(x1, y1, x2, y2, x3, y3, x4, y4) {
    const denom = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
    if (Math.abs(denom) < 0.0001) return null;
    
    const ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denom;
    const ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / denom;
    
    if (ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1) {
        return {
            x: x1 + ua * (x2 - x1),
            y: y1 + ua * (y2 - y1)
        };
    }
    
    return null;
}

pointOnLine(x1, y1, x2, y2, px, py) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    if (lenSq === 0) return 0;
    return ((px - x1) * dx + (py - y1) * dy) / lenSq;
}

connectSegmentsSimple(segments, spacing) {
    if (segments.length <= 1) return segments;
    
    const result = [];
    let currentPath = [...segments[0]];
    
    for (let i = 1; i < segments.length; i++) {
        const last = currentPath[currentPath.length - 1];
        const seg = segments[i];
        const first = seg[0];
        const lastOfSeg = seg[seg.length - 1];
        
        const d1 = Math.hypot(last.x - first.x, last.y - first.y);
        const d2 = Math.hypot(last.x - lastOfSeg.x, last.y - lastOfSeg.y);
        
        if (d1 <= d2 && d1 <= spacing * 3) {
            currentPath = currentPath.concat(seg);
        } else if (d2 <= spacing * 3) {
            currentPath = currentPath.concat([...seg].reverse());
        } else {
            result.push(currentPath);
            currentPath = [...seg];
        }
    }
    
    result.push(currentPath);
    return result;
}

createHorizontalSnakeSimple(bbox, spacing) {
    let d = '';
    let goingRight = true;
    
    // Центрируем по вертикали
    const rows = Math.floor(bbox.height / spacing);
    const totalHeight = rows * spacing;
    const startY = bbox.y + (bbox.height - totalHeight) / 2 + spacing / 2;
    
    for (let i = 0; i < rows; i++) {
        const y = startY + i * spacing;
        
        if (goingRight) {
            d += `M ${bbox.x} ${y} L ${bbox.x + bbox.width} ${y} `;
        } else {
            d += `M ${bbox.x + bbox.width} ${y} L ${bbox.x} ${y} `;
        }
        goingRight = !goingRight;
    }
    
    return d || null;
}

createVerticalSnakeSimple(bbox, spacing) {
    let d = '';
    let goingDown = true;
    
    // Центрируем по горизонтали
    const cols = Math.floor(bbox.width / spacing);
    const totalWidth = cols * spacing;
    const startX = bbox.x + (bbox.width - totalWidth) / 2 + spacing / 2;
    
    for (let i = 0; i < cols; i++) {
        const x = startX + i * spacing;
        
        if (goingDown) {
            d += `M ${x} ${bbox.y} L ${x} ${bbox.y + bbox.height} `;
        } else {
            d += `M ${x} ${bbox.y + bbox.height} L ${x} ${bbox.y} `;
        }
        goingDown = !goingDown;
    }
    
    return d || null;
}

createDiagonalSnakeSimple(bbox, spacing) {
    let d = '';
    const w = bbox.width;
    const h = bbox.height;
    
    // Расстояние между параллельными линиями 45° = spacing * √2
    const step = spacing * Math.SQRT2;
    
    // Диагональ bbox
    const diag = Math.sqrt(w * w + h * h);
    
    // Количество линий (гарантируем покрытие всего bbox)
    const numLines = Math.ceil(diag / step) + 2; // +2 для гарантии
    
    // Центр bbox
    const cx = bbox.x + w / 2;
    const cy = bbox.y + h / 2;
    
    let goingRight = true;
    
    for (let i = -numLines; i <= numLines; i++) {
        const offset = i * step;
        
        // Уравнение линии 45°: y = -x + C
        // C = y + x для любой точки на линии
        // Для центра bbox: C_center = cy + cx
        const C = (cy + cx) + offset;
        
        // Находим точку на левой границе (x = bbox.x)
        const yLeft = C - bbox.x;
        
        // Находим точку на правой границе (x = bbox.x + w)
        const yRight = C - (bbox.x + w);
        
        // Находим точку на верхней границе (y = bbox.y)
        const xTop = C - bbox.y;
        
        // Находим точку на нижней границе (y = bbox.y + h)
        const xBottom = C - (bbox.y + h);
        
        // Собираем все точки пересечения с границами bbox
        const points = [];
        
        if (yLeft >= bbox.y && yLeft <= bbox.y + h) {
            points.push({ x: bbox.x, y: yLeft, edge: 'left' });
        }
        if (yRight >= bbox.y && yRight <= bbox.y + h) {
            points.push({ x: bbox.x + w, y: yRight, edge: 'right' });
        }
        if (xTop >= bbox.x && xTop <= bbox.x + w) {
            points.push({ x: xTop, y: bbox.y, edge: 'top' });
        }
        if (xBottom >= bbox.x && xBottom <= bbox.x + w) {
            points.push({ x: xBottom, y: bbox.y + h, edge: 'bottom' });
        }
        
        // Нужны ровно 2 точки пересечения
        if (points.length >= 2) {
            // Убираем дубликаты
            const uniquePoints = [];
            for (const p of points) {
                const isDuplicate = uniquePoints.some(u => 
                    Math.abs(u.x - p.x) < 0.01 && Math.abs(u.y - p.y) < 0.01
                );
                if (!isDuplicate) {
                    uniquePoints.push(p);
                }
            }
            
            if (uniquePoints.length >= 2) {
                const p1 = uniquePoints[0];
                const p2 = uniquePoints[1];
                
                if (goingRight) {
                    d += `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} L ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} `;
                } else {
                    d += `M ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} L ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} `;
                }
                goingRight = !goingRight;
            }
        }
    }
    
    return d || null;
}

mmToSvgPixels(mm) {
    const worksheetElement = document.getElementById('worksheet-background');
    const sheetWidth = parseFloat(worksheetElement?.getAttribute('width')) || 1000;
    const mmWidth = parseFloat(document.getElementById('mmWidth')?.value) || 210;
    
    return (mm / mmWidth) * sheetWidth;
}

getClosedShapePath(element) {
    const tag = element.tagName.toLowerCase();
    let d;
    
    if (tag === 'path') {
        d = element.getAttribute('d');
        // Проверяем, содержит ли путь кривые Безье
        if (d && /[CcQq]/.test(d)) {
            // Для Безье - конвертируем в полилинию (много маленьких отрезков)
            return this.convertBezierPathToPolylineD(d);
        }
        return this.closePathD(d);
    }
    
    if (tag === 'rect') {
        const x = parseFloat(element.getAttribute('x')) || 0;
        const y = parseFloat(element.getAttribute('y')) || 0;
        const w = parseFloat(element.getAttribute('width')) || 0;
        const h = parseFloat(element.getAttribute('height')) || 0;
        return `M ${x} ${y} L ${x + w} ${y} L ${x + w} ${y + h} L ${x} ${y + h} Z`;
    }
    
    if (tag === 'circle') {
        const cx = parseFloat(element.getAttribute('cx')) || 0;
        const cy = parseFloat(element.getAttribute('cy')) || 0;
        const r = parseFloat(element.getAttribute('r')) || 0;
        return this.generatePolygonPath(cx, cy, r, r, 60);
    }
    
    if (tag === 'ellipse') {
        const cx = parseFloat(element.getAttribute('cx')) || 0;
        const cy = parseFloat(element.getAttribute('cy')) || 0;
        const rx = parseFloat(element.getAttribute('rx')) || 0;
        const ry = parseFloat(element.getAttribute('ry')) || 0;
        return this.generatePolygonPath(cx, cy, rx, ry, 60);
    }
    
    if (tag === 'line') {
        const x1 = parseFloat(element.getAttribute('x1')) || 0;
        const y1 = parseFloat(element.getAttribute('y1')) || 0;
        const x2 = parseFloat(element.getAttribute('x2')) || 0;
        const y2 = parseFloat(element.getAttribute('y2')) || 0;
        return `M ${x1} ${y1} L ${x2} ${y2} L ${x1} ${y2} Z`;
    }
    
    return null;
}

convertBezierPathToPolylineD(d) {
    if (!d) return null;
    
    const commands = this.parsePathCommands(d);
    let polylineD = '';
    let currentX = 0, currentY = 0;
    let firstX = 0, firstY = 0;
    let hasFirstPoint = false;
    
    for (const cmd of commands) {
        const { command, params, isRelative } = cmd;
        
        let absParams = [...params];
        if (isRelative && command !== 'Z' && command !== 'z') {
            for (let i = 0; i < absParams.length; i += 2) {
                if (i + 1 < absParams.length) {
                    absParams[i] += currentX;
                    absParams[i + 1] += currentY;
                }
            }
        }
        
        switch (command.toUpperCase()) {
            case 'M':
                if (absParams.length >= 2) {
                    currentX = absParams[0];
                    currentY = absParams[1];
                    firstX = currentX;
                    firstY = currentY;
                    hasFirstPoint = true;
                    polylineD += `M ${currentX.toFixed(4)} ${currentY.toFixed(4)} `;
                }
                break;
                
            case 'L':
                for (let i = 0; i < absParams.length; i += 2) {
                    if (i + 1 < absParams.length) {
                        currentX = absParams[i];
                        currentY = absParams[i + 1];
                        polylineD += `L ${currentX.toFixed(4)} ${currentY.toFixed(4)} `;
                    }
                }
                break;
                
            case 'C':
                // Кубическая кривая Безье
                for (let i = 0; i < absParams.length; i += 6) {
                    if (i + 5 < absParams.length) {
                        const segments = this.approximateCubicBezier(
                            currentX, currentY,
                            absParams[i], absParams[i + 1],
                            absParams[i + 2], absParams[i + 3],
                            absParams[i + 4], absParams[i + 5],
                            30  // 30 сегментов для точной аппроксимации
                        );
                        
                        // Добавляем все точки кроме первой (она уже есть)
                        for (let j = 1; j < segments.length; j++) {
                            polylineD += `L ${segments[j].x.toFixed(4)} ${segments[j].y.toFixed(4)} `;
                        }
                        
                        currentX = absParams[i + 4];
                        currentY = absParams[i + 5];
                    }
                }
                break;
                
            case 'Q':
                // Квадратичная кривая Безье
                for (let i = 0; i < absParams.length; i += 4) {
                    if (i + 3 < absParams.length) {
                        // Преобразуем квадратичную в кубическую
                        const cx1 = currentX + (2/3) * (absParams[i] - currentX);
                        const cy1 = currentY + (2/3) * (absParams[i + 1] - currentY);
                        const cx2 = absParams[i + 2] + (2/3) * (absParams[i] - absParams[i + 2]);
                        const cy2 = absParams[i + 3] + (2/3) * (absParams[i + 1] - absParams[i + 3]);
                        
                        const segments = this.approximateCubicBezier(
                            currentX, currentY,
                            cx1, cy1,
                            cx2, cy2,
                            absParams[i + 2], absParams[i + 3],
                            30
                        );
                        
                        for (let j = 1; j < segments.length; j++) {
                            polylineD += `L ${segments[j].x.toFixed(4)} ${segments[j].y.toFixed(4)} `;
                        }
                        
                        currentX = absParams[i + 2];
                        currentY = absParams[i + 3];
                    }
                }
                break;
                
            case 'Z':
            case 'z':
                // Замыкаем к первой точке
                if (hasFirstPoint) {
                    polylineD += `L ${firstX.toFixed(4)} ${firstY.toFixed(4)} Z `;
                    currentX = firstX;
                    currentY = firstY;
                }
                break;
        }
    }
    
    // Если путь не замкнут, но должен быть - замыкаем
    const trimmed = polylineD.trim();
    if (!trimmed.endsWith('Z') && !trimmed.endsWith('z') && hasFirstPoint) {
        const dist = Math.sqrt((currentX - firstX) ** 2 + (currentY - firstY) ** 2);
        if (dist < 2) {
            // Точки близко - замыкаем
            polylineD += ' Z';
        }
    }
    
    return polylineD.trim() || null;
}

generatePolygonPath(cx, cy, rx, ry, numPoints) {
    const points = [];
    for (let i = 0; i < numPoints; i++) {
        const angle = (i / numPoints) * Math.PI * 2;
        points.push({
            x: cx + Math.cos(angle) * rx,
            y: cy + Math.sin(angle) * ry
        });
    }
    
    let d = `M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;
    for (let i = 1; i < points.length; i++) {
        d += ` L ${points[i].x.toFixed(2)} ${points[i].y.toFixed(2)}`;
    }
    d += ' Z';
    
    return d;
}

closePathD(d) {
    if (!d) return null;
    const trimmed = d.trim();
    
    if (trimmed.endsWith('Z') || trimmed.endsWith('z')) {
        return trimmed;
    }
    
    const numbers = trimmed.match(/[\d.-]+/g);
    if (!numbers || numbers.length < 4) return trimmed + ' Z';
    
    const firstX = parseFloat(numbers[0]);
    const firstY = parseFloat(numbers[1]);
    const lastX = parseFloat(numbers[numbers.length - 2]);
    const lastY = parseFloat(numbers[numbers.length - 1]);
    
    const dist = Math.sqrt((firstX - lastX) ** 2 + (firstY - lastY) ** 2);
    
    return dist < 1 ? trimmed + ' Z' : `${trimmed} L ${firstX} ${firstY} Z`;
}

insetContour(contourPoints, margin) {
    if (margin <= 0 || contourPoints.length < 3) return contourPoints;
    
    const result = [];
    const n = contourPoints.length;
    
    for (let i = 0; i < n; i++) {
        const prev = contourPoints[(i - 1 + n) % n];
        const curr = contourPoints[i];
        const next = contourPoints[(i + 1) % n];
        
        // Векторы к соседним точкам
        const v1x = prev.x - curr.x;
        const v1y = prev.y - curr.y;
        const v2x = next.x - curr.x;
        const v2y = next.y - curr.y;
        
        // Нормализуем
        const len1 = Math.sqrt(v1x * v1x + v1y * v1y) || 1;
        const len2 = Math.sqrt(v2x * v2x + v2y * v2y) || 1;
        
        const n1x = v1x / len1;
        const n1y = v1y / len1;
        const n2x = v2x / len2;
        const n2y = v2y / len2;
        
        // Биссектриса
        let bx = n1x + n2x;
        let by = n1y + n2y;
        const blen = Math.sqrt(bx * bx + by * by);
        
        if (blen < 0.001) {
            // Угол ~180°, используем перпендикуляр
            bx = -n1y;
            by = n1x;
        } else {
            bx /= blen;
            by /= blen;
        }
        
        // Сдвигаем точку внутрь
        const newX = curr.x + bx * margin;
        const newY = curr.y + by * margin;
        
        result.push({ x: newX, y: newY });
    }
    
    // Проверяем, не слишком ли большой отступ (контур не схлопнулся)
    const area = this.polygonArea(result);
    if (area < 10 || isNaN(area)) {
        console.warn('Отступ слишком большой, контур схлопнулся');
        return contourPoints;
    }
    
    return result;
}

polygonArea(points) {
    let area = 0;
    for (let i = 0; i < points.length; i++) {
        const j = (i + 1) % points.length;
        area += points[i].x * points[j].y;
        area -= points[j].x * points[i].y;
    }
    return Math.abs(area) / 2;
}

parseDToPoints(d) {
    const points = [];
    const numbers = d.match(/[\d.-]+/g);
    if (!numbers) return points;
    
    for (let i = 0; i < numbers.length; i += 2) {
        if (i + 1 < numbers.length) {
            points.push({
                x: parseFloat(numbers[i]),
                y: parseFloat(numbers[i + 1])
            });
        }
    }
    
    return points;
}

getPointsBBox(points) {
    if (points.length === 0) return { x: 0, y: 0, width: 0, height: 0 };
    
    let minX = Infinity, minY = Infinity;
    let maxX = -Infinity, maxY = -Infinity;
    
    for (const p of points) {
        minX = Math.min(minX, p.x);
        minY = Math.min(minY, p.y);
        maxX = Math.max(maxX, p.x);
        maxY = Math.max(maxY, p.y);
    }
    
    return {
        x: minX,
        y: minY,
        width: maxX - minX,
        height: maxY - minY
    };
}

isPointInsideContour(point, contourPoints) {
    let inside = false;
    const x = point.x;
    const y = point.y;
    
    for (let i = 0, j = contourPoints.length - 1; i < contourPoints.length; j = i++) {
        const xi = contourPoints[i].x;
        const yi = contourPoints[i].y;
        const xj = contourPoints[j].x;
        const yj = contourPoints[j].y;
        
        const intersect = ((yi > y) !== (yj > y)) &&
            (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        
        if (intersect) inside = !inside;
    }
    
    return inside;
}

shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

createSnakePaths(segments, transform = '') {
    let count = 0;
    
    for (const segment of segments) {
        const points = Array.isArray(segment) ? segment : (segment.points || segment);
        if (!points || points.length < 2) continue;
        
        // === ЕСЛИ ЕСТЬ TRANSFORM, ПРИМЕНЯЕМ ЕГО К КООРДИНАТАМ ===
        let transformedPoints = points;
        if (transform) {
            const rotateMatch = transform.match(/rotate\(([^,]+),\s*([^,]+),\s*([^)]+)\)/);
            if (rotateMatch) {
                const angle = parseFloat(rotateMatch[1]) * Math.PI / 180;
                const cx = parseFloat(rotateMatch[2]);
                const cy = parseFloat(rotateMatch[3]);
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);
                
                transformedPoints = points.map(p => ({
                    x: cx + (p.x - cx) * cos - (p.y - cy) * sin,
                    y: cy + (p.x - cx) * sin + (p.y - cy) * cos
                }));
            }
        }
        
        let d = `M ${transformedPoints[0].x.toFixed(2)} ${transformedPoints[0].y.toFixed(2)}`;
        for (let i = 1; i < transformedPoints.length; i++) {
            d += ` L ${transformedPoints[i].x.toFixed(2)} ${transformedPoints[i].y.toFixed(2)}`;
        }
        
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('stroke', this.state.strokeColor);
        path.setAttribute('stroke-width', this.state.strokeWidth);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');
        
        // ВСЕГДА добавляем напрямую в vectorLayer, без группы
        this.vectorLayer.appendChild(path);
        count++;
    }
    
    return count;
}

findShapeAtPoint(x, y) {
    const shapes = [];
    
    // Собираем ВСЕ фигуры из ВСЕХ слоёв
    const allElements = this.svg.querySelectorAll('rect, circle, ellipse, path');
    
    allElements.forEach(el => {
        // Пропускаем служебные элементы
        if (el.id?.includes('background')) return;
        if (el.id?.includes('indicator')) return;
        if (el.id?.includes('eraser')) return;
        if (el.id?.includes('push')) return;
        if (el.id === 'selection-handles') return;
        if (el.closest('#selection-handles')) return;
        if (el.closest('#helper-layer') && 
            (el.classList?.contains('bezier-guide-line') ||
             el.classList?.contains('bezier-control-point') ||
             el.classList?.contains('bezier-point'))) return;
        
        // Пропускаем вспомогательные элементы Безье
        if (el.classList?.contains('bezier-guide-line')) return;
        if (el.classList?.contains('bezier-control-point')) return;
        if (el.classList?.contains('bezier-point')) return;
        
        // Пропускаем элементы без размеров
        const bbox = el.getBBox();
        if (bbox.width === 0 && bbox.height === 0) return;
        
        shapes.push(el);
    });
    
    // Проверяем каждую фигуру — находится ли точка внутри
    // Проверяем в обратном порядке (последние добавленные сверху)
    for (let i = shapes.length - 1; i >= 0; i--) {
        const shape = shapes[i];
        if (this.isPointInsideShape(x, y, shape)) {
            return shape;
        }
    }
    
    return null;
}

isPointInsideShape(x, y, element) {
    const tag = element.tagName.toLowerCase();
    
    if (tag === 'rect') {
        const rx = parseFloat(element.getAttribute('x')) || 0;
        const ry = parseFloat(element.getAttribute('y')) || 0;
        const rw = parseFloat(element.getAttribute('width')) || 0;
        const rh = parseFloat(element.getAttribute('height')) || 0;
        
        // Проверяем с учётом transform
        const transform = element.getAttribute('transform') || '';
        let px = x, py = y;
        
        const rotateMatch = transform.match(/rotate\(([^,]+),\s*([^,]+),\s*([^)]+)\)/);
        if (rotateMatch) {
            const angle = -parseFloat(rotateMatch[1]) * Math.PI / 180;
            const cx = parseFloat(rotateMatch[2]);
            const cy = parseFloat(rotateMatch[3]);
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            const dx = x - cx;
            const dy = y - cy;
            px = cx + dx * cos - dy * sin;
            py = cy + dx * sin + dy * cos;
        }
        
        return px >= rx && px <= rx + rw && py >= ry && py <= ry + rh;
    }
    
    if (tag === 'circle') {
        const cx = parseFloat(element.getAttribute('cx')) || 0;
        const cy = parseFloat(element.getAttribute('cy')) || 0;
        const r = parseFloat(element.getAttribute('r')) || 0;
        
        const dist = Math.hypot(x - cx, y - cy);
        return dist <= r;
    }
    
    if (tag === 'ellipse') {
        const cx = parseFloat(element.getAttribute('cx')) || 0;
        const cy = parseFloat(element.getAttribute('cy')) || 0;
        const rx = parseFloat(element.getAttribute('rx')) || 0;
        const ry = parseFloat(element.getAttribute('ry')) || 0;
        
        const nx = (x - cx) / rx;
        const ny = (y - cy) / ry;
        return (nx * nx + ny * ny) <= 1;
    }
    
    if (tag === 'path') {
        // Получаем замкнутый контур
        const closedD = this.getClosedShapePath(element);
        if (!closedD) return false;
        
        // Для Безье сначала конвертируем в полилинию для проверки
        let checkD = closedD;
        if (/[CcQq]/.test(closedD)) {
            checkD = this.convertBezierToPolylineForCalculation(closedD);
        }
        
        const contourPoints = this.parseDToPoints(checkD);
        if (!contourPoints || contourPoints.length < 3) return false;
        
        // Проверяем с учётом transform элемента
        let px = x, py = y;
        const transform = element.getAttribute('transform') || '';
        const rotateMatch = transform.match(/rotate\(([^,]+),\s*([^,]+),\s*([^)]+)\)/);
        if (rotateMatch) {
            const angle = -parseFloat(rotateMatch[1]) * Math.PI / 180;
            const cx = parseFloat(rotateMatch[2]);
            const cy = parseFloat(rotateMatch[3]);
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            const dx = x - cx;
            const dy = y - cy;
            px = cx + dx * cos - dy * sin;
            py = cy + dx * sin + dy * cos;
        }
        
        return this.isPointInsideContour({x: px, y: py}, contourPoints);
    }
    
    return false;
}

// Запуск выбора фигуры
startSpiralFill() {
    this.svg.style.cursor = 'pointer';
    
    const onClick = (e) => {
        let target = e.target;
        while (target && target !== this.svg) {
            const tag = target.tagName.toLowerCase();
            
            const isVector = (tag === 'path' || tag === 'rect' || tag === 'circle' || tag === 'ellipse');
            
            if (isVector && target !== this.worksheetLayer && target !== this.photoLayer) {
                this.svg.removeEventListener('click', onClick);
                this.svg.style.cursor = '';
                
                let shapeForSpiral = target;
                
                // ТОЧНО ТАК ЖЕ, КАК В fillShapeWithSnake
                if (target.classList && target.classList.contains('bezier-vector')) {
                    const fullContour = this.getFullBezierContour(target);
                    if (fullContour) {
                        shapeForSpiral = fullContour;
                    }
                }
                
                this.createSpiralPreview(shapeForSpiral);
                return;
            }
            target = target.parentElement;
        }
    };
    
    this.svg.addEventListener('click', onClick);
    this._spiralClickHandler = onClick;
}

// Создаём предпросмотр спирали 
createSpiralPreview(shapeForSpiral) {
    if (this._spiralGroup) return;
    this.isSpiralActive = true;
    
    this._spiralShape = shapeForSpiral;
    
    const spacingMM = parseFloat(document.getElementById('fillSpacingSlider')?.value) || 2;
    const marginMM = parseFloat(document.getElementById('fillMarginSlider')?.value) || 0.5;
    const margin = this.mmToSvgPixels(marginMM);
    const spacing = this.mmToSvgPixels(spacingMM);
    
    // === ПОЛУЧАЕМ ОРИГИНАЛЬНЫЕ ГРАНИЦЫ (без поворота) ===
    const tag = shapeForSpiral.tagName?.toLowerCase();
    let originalBBox, localCenterX, localCenterY;
    
    if (tag === 'rect') {
        const x = parseFloat(shapeForSpiral.getAttribute('x')) || 0;
        const y = parseFloat(shapeForSpiral.getAttribute('y')) || 0;
        const w = parseFloat(shapeForSpiral.getAttribute('width')) || 0;
        const h = parseFloat(shapeForSpiral.getAttribute('height')) || 0;
        originalBBox = { x, y, width: w, height: h };
        localCenterX = x + w / 2;
        localCenterY = y + h / 2;
    } else if (tag === 'circle') {
        const cx = parseFloat(shapeForSpiral.getAttribute('cx')) || 0;
        const cy = parseFloat(shapeForSpiral.getAttribute('cy')) || 0;
        const r = parseFloat(shapeForSpiral.getAttribute('r')) || 0;
        originalBBox = { x: cx - r, y: cy - r, width: r * 2, height: r * 2 };
        localCenterX = cx;
        localCenterY = cy;
    } else if (tag === 'ellipse') {
        const cx = parseFloat(shapeForSpiral.getAttribute('cx')) || 0;
        const cy = parseFloat(shapeForSpiral.getAttribute('cy')) || 0;
        const rx = parseFloat(shapeForSpiral.getAttribute('rx')) || 0;
        const ry = parseFloat(shapeForSpiral.getAttribute('ry')) || 0;
        originalBBox = { x: cx - rx, y: cy - ry, width: rx * 2, height: ry * 2 };
        localCenterX = cx;
        localCenterY = cy;
    } else {
        try {
            const bbox = shapeForSpiral.getBBox();
            originalBBox = { x: bbox.x, y: bbox.y, width: bbox.width, height: bbox.height };
            localCenterX = bbox.x + bbox.width / 2;
            localCenterY = bbox.y + bbox.height / 2;
        } catch(e) {
            originalBBox = { x: 0, y: 0, width: 100, height: 100 };
            localCenterX = 50;
            localCenterY = 50;
        }
    }
    
    // === ПОЛУЧАЕМ ПОВОРОТ ФИГУРЫ ===
    let angleRad = 0;
    let angleDeg = 0;
    let rotCx = localCenterX;
    let rotCy = localCenterY;
    
    const transform = shapeForSpiral.getAttribute('transform') || '';
    const rotateMatch = transform.match(/rotate\(([^,]+),\s*([^,]+),\s*([^)]+)\)/);
    if (rotateMatch) {
        angleDeg = parseFloat(rotateMatch[1]);
        angleRad = angleDeg * Math.PI / 180;
        rotCx = parseFloat(rotateMatch[2]);
        rotCy = parseFloat(rotateMatch[3]);
    }
    
    // === ВЫЧИСЛЯЕМ ГЛОБАЛЬНЫЙ ЦЕНТР (после поворота) ===
    let globalCenterX, globalCenterY;
    if (angleRad !== 0) {
        const cos = Math.cos(angleRad);
        const sin = Math.sin(angleRad);
        const dx = localCenterX - rotCx;
        const dy = localCenterY - rotCy;
        globalCenterX = rotCx + dx * cos - dy * sin;
        globalCenterY = rotCy + dx * sin + dy * cos;
    } else {
        globalCenterX = localCenterX;
        globalCenterY = localCenterY;
    }
    
    // Диагональ для максимального радиуса спирали
    const diag = Math.sqrt(originalBBox.width * originalBBox.width + originalBBox.height * originalBBox.height);
    const maxR = diag * 2;
    const angleStep = Math.PI / 48;
    const a = spacing / (2 * Math.PI);
    
    // Генерируем точки спирали вокруг глобального центра
    const points = [];
    let angle = 0;
    
    while (true) {
        const radius = a * angle;
        if (radius > maxR) break;
        points.push({
            x: globalCenterX + radius * Math.cos(angle),
            y: globalCenterY + radius * Math.sin(angle)
        });
        angle += angleStep;
    }
    
    // === РАМКА ПРЕДПРОСМОТРА (повёрнутая как оригинал) ===
    this._spiralFrame = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    this._spiralFrame.setAttribute('x', originalBBox.x + margin);
    this._spiralFrame.setAttribute('y', originalBBox.y + margin);
    this._spiralFrame.setAttribute('width', Math.max(0, originalBBox.width - margin * 2));
    this._spiralFrame.setAttribute('height', Math.max(0, originalBBox.height - margin * 2));
    this._spiralFrame.setAttribute('fill', 'none');
    this._spiralFrame.setAttribute('stroke', '#4dabf7');
    this._spiralFrame.setAttribute('stroke-width', '1.5');
    this._spiralFrame.setAttribute('stroke-dasharray', '6,4');
    
    // Поворачиваем рамку на тот же угол и вокруг того же центра, что и фигура
    if (angleRad !== 0) {
        this._spiralFrame.setAttribute('transform', `rotate(${angleDeg}, ${rotCx}, ${rotCy})`);
    }
    
    this.helperLayer.appendChild(this._spiralFrame);
    
    // === ГРУППА СПИРАЛИ ===
    this._spiralGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    
    if (points.length > 1) {
        let d = `M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;
        for (let i = 1; i < points.length; i++) {
            d += ` L ${points[i].x.toFixed(2)} ${points[i].y.toFixed(2)}`;
        }
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('stroke', '#4dabf7');
        path.setAttribute('stroke-width', '2');
        path.setAttribute('stroke-dasharray', '6,4');
        path.setAttribute('fill', 'none');
        path.setAttribute('opacity', '0.8');
        this._spiralGroup.appendChild(path);
        this._spiralPath = path;
    }
    
    this._spiralPoints = points;
    this._spiralOriginalBBox = originalBBox;
    this._spiralAngle = angleDeg;
    this._spiralRotCenter = { x: rotCx, y: rotCy };
    this._spiralCenter = { x: globalCenterX, y: globalCenterY };
    this._spiralMargin = margin;
    this._spiralSpacing = spacing;
    
    this.helperLayer.appendChild(this._spiralGroup);
    
    this.showSpiralPanel();
    this.setupSpiralDragAnywhere();
}

// Перетаскивание за любую часть спирали
setupSpiralDragAnywhere() {
    let dragging = false;
    let startX, startY;
    let startTranslateX, startTranslateY;
    
    if (this._spiralDragHandlers) {
        this.svg.removeEventListener('mousedown', this._spiralDragHandlers.onMouseDown);
        this.svg.removeEventListener('mousemove', this._spiralDragHandlers.onMouseMove);
        this.svg.removeEventListener('mouseup', this._spiralDragHandlers.onMouseUp);
        this._spiralDragHandlers = null;
    }
    
    const onMouseDown = (e) => {
        // ЛЮБОЙ клик на холсте начинает перетаскивание спирали
        if (this._spiralGroup) {
            dragging = true;
            const coords = this.getSVGCoordinates(e);
            startX = coords.x;
            startY = coords.y;
            
            // Получаем текущее положение группы спирали
            const transform = this._spiralGroup.getAttribute('transform');
            if (transform) {
                const match = transform.match(/translate\(([^,]+),\s*([^)]+)\)/);
                if (match) {
                    startTranslateX = parseFloat(match[1]);
                    startTranslateY = parseFloat(match[2]);
                } else {
                    startTranslateX = 0;
                    startTranslateY = 0;
                }
            } else {
                startTranslateX = 0;
                startTranslateY = 0;
            }
            
            this.svg.style.cursor = 'grabbing';
            e.preventDefault();
            e.stopPropagation();
        }
    };
    
    const onMouseMove = (e) => {
        if (!dragging) return;
        e.preventDefault();
        e.stopPropagation();
        
        const coords = this.getSVGCoordinates(e);
        const dx = coords.x - startX;
        const dy = coords.y - startY;
        
        // Перемещаем группу спирали
        const newX = startTranslateX + dx;
        const newY = startTranslateY + dy;
        this._spiralGroup.setAttribute('transform', `translate(${newX}, ${newY})`);
    };
    
    const onMouseUp = (e) => {
        if (dragging) {
            dragging = false;
            this.svg.style.cursor = '';
            e.preventDefault();
            e.stopPropagation();
        }
    };
    
    this.svg.addEventListener('mousedown', onMouseDown);
    this.svg.addEventListener('mousemove', onMouseMove);
    this.svg.addEventListener('mouseup', onMouseUp);
    
    this._spiralDragHandlers = { onMouseDown, onMouseMove, onMouseUp };
}

// Панель с кнопками
showSpiralPanel() {
    // Удаляем старую панель, если есть
    const oldPanel = document.getElementById('spiral-panel');
    if (oldPanel) oldPanel.remove();
    
    const panel = document.createElement('div');
    panel.id = 'spiral-panel';
    panel.style.cssText = `
        position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
        background: #1a1a1a; padding: 12px 20px; border-radius: 8px;
        border: 1px solid #4dabf7; z-index: 10000; display: flex; gap: 15px;
        font-family: Arial, sans-serif;
    `;
    panel.innerHTML = `
        <span style="color:white;">🌀 Перетащите спираль</span>
        <button id="spiral-apply" style="background:#4dabf7; border:none; padding:5px 15px; border-radius:5px; cursor:pointer;">Применить (Enter)</button>
        <button id="spiral-cancel" style="background:#6c757d; border:none; padding:5px 15px; border-radius:5px; cursor:pointer;">Отмена (Esc)</button>
    `;
    document.body.appendChild(panel);
    
    const applyBtn = panel.querySelector('#spiral-apply');
    const cancelBtn = panel.querySelector('#spiral-cancel');
    
    // Обработчики кнопок
    applyBtn.onclick = () => this.applySpiralFill();
    cancelBtn.onclick = () => this.cancelSpiralPreview();
    
    // Обработчики клавиш
    const onKeyDown = (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            this.applySpiralFill();
        } else if (e.key === 'Escape') {
            e.preventDefault();
            this.cancelSpiralPreview();
        }
    };
    
    document.addEventListener('keydown', onKeyDown);
    
    // Сохраняем обработчик для удаления
    this._spiralKeyHandler = onKeyDown;
}

// Применить - обрезаем по контуру фигуры
applySpiralFill() {
    if (!this._spiralPoints || this._spiralPoints.length < 2) {
        this.updateFillInfo('❌ Ошибка: нет точек спирали');
        this.cancelSpiralPreview();
        return;
    }
    
    // Получаем смещение от перетаскивания
    let offsetX = 0, offsetY = 0;
    if (this._spiralGroup) {
        const transform = this._spiralGroup.getAttribute('transform') || '';
        const match = transform.match(/translate\(([^,]+),\s*([^)]+)\)/);
        if (match) {
            offsetX = parseFloat(match[1]) || 0;
            offsetY = parseFloat(match[2]) || 0;
        }
    }
    
    // Смещаем все точки спирали на offset
    let transformedPoints = this._spiralPoints.map(p => ({
        x: p.x + offsetX,
        y: p.y + offsetY
    }));
    
    // === ОБРАТНЫЙ ПОВОРОТ: разворачиваем точки обратно на угол фигуры ===
    if (this._spiralAngle && this._spiralAngle !== 0 && this._spiralRotCenter) {
        const angleRad = -this._spiralAngle * Math.PI / 180; // ОБРАТНЫЙ угол
        const cx = this._spiralRotCenter.x;
        const cy = this._spiralRotCenter.y;
        const cos = Math.cos(angleRad);
        const sin = Math.sin(angleRad);
        
        transformedPoints = transformedPoints.map(p => {
            const dx = p.x - cx;
            const dy = p.y - cy;
            return {
                x: cx + dx * cos - dy * sin,
                y: cy + dx * sin + dy * cos
            };
        });
    }
    
    const marginMM = parseFloat(document.getElementById('fillMarginSlider')?.value) || 0.5;
    const marginPx = this.mmToSvgPixels(marginMM);
    
    // Получаем контур фигуры (как обычно)
    const closedD = this.getClosedShapePath(this._spiralShape);
    if (!closedD) {
        this.updateFillInfo('❌ Не удалось обработать фигуру');
        this.cancelSpiralPreview();
        return;
    }
    
    let calculationD = closedD;
    if (/[CcQq]/.test(closedD)) {
        calculationD = this.convertBezierToPolylineForCalculation(closedD);
    }
    
    let contourPoints = this.parseDToPoints(calculationD);
    if (!contourPoints || contourPoints.length < 3) {
        this.updateFillInfo('❌ Слишком мало точек');
        this.cancelSpiralPreview();
        return;
    }
    
    // Применяем отступ
    if (marginPx > 0) {
        const tag = this._spiralShape.tagName?.toLowerCase();
        if (tag === 'circle') {
            const cx = parseFloat(this._spiralShape.getAttribute('cx')) || 0;
            const cy = parseFloat(this._spiralShape.getAttribute('cy')) || 0;
            const r = parseFloat(this._spiralShape.getAttribute('r')) || 0;
            const newR = Math.max(1, r - marginPx);
            const insetD = this.generatePolygonPath(cx, cy, newR, newR, 60);
            contourPoints = this.parseDToPoints(insetD);
        } else if (tag === 'ellipse') {
            const cx = parseFloat(this._spiralShape.getAttribute('cx')) || 0;
            const cy = parseFloat(this._spiralShape.getAttribute('cy')) || 0;
            const rx = parseFloat(this._spiralShape.getAttribute('rx')) || 0;
            const ry = parseFloat(this._spiralShape.getAttribute('ry')) || 0;
            const newRx = Math.max(1, rx - marginPx);
            const newRy = Math.max(1, ry - marginPx);
            const insetD = this.generatePolygonPath(cx, cy, newRx, newRy, 60);
            contourPoints = this.parseDToPoints(insetD);
        } else if (tag === 'rect') {
            const x = parseFloat(this._spiralShape.getAttribute('x')) || 0;
            const y = parseFloat(this._spiralShape.getAttribute('y')) || 0;
            const w = parseFloat(this._spiralShape.getAttribute('width')) || 0;
            const h = parseFloat(this._spiralShape.getAttribute('height')) || 0;
            const insetD = `M ${x + marginPx} ${y + marginPx} L ${x + w - marginPx} ${y + marginPx} L ${x + w - marginPx} ${y + h - marginPx} L ${x + marginPx} ${y + h - marginPx} Z`;
            contourPoints = this.parseDToPoints(insetD);
        } else {
            contourPoints = this.insetContour(contourPoints, marginPx);
        }
    }
    
    // Обрезаем спираль по контуру (оба в локальных координатах)
    const segments = this.clipSpiralToContour(transformedPoints, contourPoints);
    
    if (!segments || segments.length === 0) {
        this.updateFillInfo('❌ Спираль не попала в фигуру');
        this.cancelSpiralPreview();
        return;
    }
    
    // Соединяем сегменты
    const continuous = document.getElementById('fillContinuousToggle')?.checked ?? true;
    let finalPaths = segments;
    
    if (continuous && segments.length > 1) {
        finalPaths = this.joinContinuousSegments(segments, this._spiralSpacing);
    }
    
    // === ВАЖНО: создаём заливку, передаём transform фигуры ===
    // createSnakePaths применит поворот к координатам
    const parentTransform = this._spiralShape.getAttribute('transform') || '';
    const createdCount = this.createSnakePaths(finalPaths, parentTransform);
    
    const spacingMM = parseFloat(document.getElementById('fillSpacingSlider')?.value) || 2;
    this.updateFillInfo(`✅ Создано: ${createdCount} линий (Спираль, ${spacingMM}мм, отступ ${marginMM}мм)`);
    
    this.cancelSpiralPreview();
    this.saveSnapshot();
}

// Отмена
cancelSpiralPreview() {
    // Удаляем рамку
    if (this._spiralFrame) {
        this._spiralFrame.remove();
        this._spiralFrame = null;
    }
    
    // Удаляем группу спирали
    if (this._spiralGroup) {
        this._spiralGroup.remove();
        this._spiralGroup = null;
    }
    
    // Удаляем обработчики перетаскивания
    if (this._spiralDragHandlers) {
        this.svg.removeEventListener('mousedown', this._spiralDragHandlers.onMouseDown);
        this.svg.removeEventListener('mousemove', this._spiralDragHandlers.onMouseMove);
        this.svg.removeEventListener('mouseup', this._spiralDragHandlers.onMouseUp);
        this._spiralDragHandlers = null;
    }
    
    // Удаляем обработчик клавиш
    if (this._spiralKeyHandler) {
        document.removeEventListener('keydown', this._spiralKeyHandler);
        this._spiralKeyHandler = null;
    }
    
    // Удаляем панель
    const panel = document.getElementById('spiral-panel');
    if (panel) panel.remove();
    
    // Удаляем обработчик клика по фигуре
    if (this._spiralClickHandler) {
        this.svg.removeEventListener('click', this._spiralClickHandler);
        this._spiralClickHandler = null;
    }
    
    this._spiralShape = null;
    this._spiralPoints = null;
    this._spiralPath = null;
    this._spiralBounds = null;
    this._spiralMargin = null;
    this._spiralSpacing = null;
    
    this.svg.style.cursor = '';
    this.isSpiralActive = false;
}

clipSpiralToContour(spiralPoints, contourPoints) {
if (!contourPoints || contourPoints.length < 3) return [];

    const result = [];
    let currentSegment = [];
    let wasInside = false;
    
    for (let i = 0; i < spiralPoints.length; i++) {
        const p = spiralPoints[i];
        const isInside = this.isPointInsideContour(p, contourPoints);
        
        if (isInside) {
            if (!wasInside && i > 0 && currentSegment.length === 0) {
                const prevPoint = spiralPoints[i - 1];
                const intersection = this.getExactIntersection(prevPoint, p, contourPoints);
                if (intersection) currentSegment.push(intersection);
            }
            currentSegment.push(p);
            wasInside = true;
        } else {
            if (wasInside && currentSegment.length > 0) {
                const prevPoint = spiralPoints[i - 1];
                const intersection = this.getExactIntersection(prevPoint, p, contourPoints);
                if (intersection) currentSegment.push(intersection);
                if (currentSegment.length >= 2) result.push([...currentSegment]);
                currentSegment = [];
            }
            wasInside = false;
        }
    }
    
    if (currentSegment.length >= 2) result.push(currentSegment);
    return result;
}

joinContinuousSegments(segments, spacing) {
    if (segments.length <= 1) return segments;
    
    const maxDist = spacing * 3;
