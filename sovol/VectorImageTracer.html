// КОНВЕРТАЦИЯ ОБЫЧНЫХ ВЕКТОРОВ В РЕДАКТИРУЕМЫЕ БЕЗЬЕ
// ============================================================

// Проверяет, можно ли конвертировать элемент в безье
canConvertToBezier(element) {
    if (!element || element.nodeType !== 1) return false;
    
    const tag = element.tagName.toLowerCase();
    if (!['path', 'line', 'rect', 'circle', 'ellipse', 'polyline', 'polygon'].includes(tag)) {
        return false;
    }
    
    // Не конвертируем уже безье
    const cls = element.getAttribute('class') || '';
    if (cls.includes('bezier-')) return false;
    if (element.dataset && element.dataset.isBezierContour === 'true') return false;
    
    // Не конвертируем служебные
    const id = element.id || '';
    if (id.includes('background') || id.includes('indicator') || 
        id.includes('eraser') || id.includes('push') ||
        id.includes('selection-handles')) return false;
    
    return true;
}


renderPathToBitmap(d, bounds, size = 200) {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    
    // Белый фон
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, size, size);
    
    // Масштабируем bounds → size
    const scaleX = size / bounds.width;
    const scaleY = size / bounds.height;
    const scale = Math.min(scaleX, scaleY) * 0.9; // отступ
    
    const offsetX = (size - bounds.width * scale) / 2 - bounds.x * scale;
    const offsetY = (size - bounds.height * scale) / 2 - bounds.y * scale;
    
    // Трансформируем
    ctx.translate(offsetX, offsetY);
    ctx.scale(scale, scale);
    
    // Рисуем path
    ctx.strokeStyle = 'black';
    ctx.lineWidth = 2 / scale;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    const path2d = new Path2D(d);
    ctx.stroke(path2d);
    
    return ctx.getImageData(0, 0, size, size);
}

// Извлекает bounds из массива точек
getPointsBounds(points) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const p of points) {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
    }
    return { x: minX, y: minY, width: maxX - minX, height: maxY - minY };
}

// Строит строку d из массива точек
pointsToPathD(points, isClosed) {
    if (points.length === 0) return '';
    let d = `M ${points[0].x} ${points[0].y}`;
    for (let i = 1; i < points.length; i++) {
        d += ` L ${points[i].x} ${points[i].y}`;
    }
    if (isClosed) d += ' Z';
    return d;
}

compareBitmaps(bitmapA, bitmapB) {
    if (bitmapA.width !== bitmapB.width || bitmapA.height !== bitmapB.height) {
        return 0;
    }
    
    const dataA = bitmapA.data;
    const dataB = bitmapB.data;
    const total = bitmapA.width * bitmapA.height;
    let matching = 0;
    
    for (let i = 0; i < dataA.length; i += 4) {
        const aIsBlack = dataA[i] < 128;
        const bIsBlack = dataB[i] < 128;
        if (aIsBlack === bIsBlack) matching++;
    }
    
    return matching / total;
}

// Catmull-Rom сплайн — гладкая кривая через все точки.
// Возвращает много точек (плотно).
catmullRomSpline(points, samplesPerSegment = 20, isClosed = false) {
    if (points.length < 2) return points.slice();
    
    const result = [];
    const n = points.length;
    const limit = isClosed ? n : n - 1;
    
    for (let i = 0; i < limit; i++) {
        const p0 = points[(i - 1 + n) % n];
        const p1 = points[i];
        const p2 = points[(i + 1) % n];
        const p3 = points[(i + 2) % n];
        
        // Если открытая кривая — на краях дублируем точки
        const p0c = (!isClosed && i === 0) ? p1 : p0;
        const p3c = (!isClosed && i === n - 2) ? p2 : p3;
        
        // Сэмплируем сегмент от p1 до p2
        const steps = samplesPerSegment;
        const startStep = (i === 0) ? 0 : 1;  // не дублируем стыки
        for (let s = startStep; s <= steps; s++) {
            const t = s / steps;
            const t2 = t * t;
            const t3 = t2 * t;
            
            const x = 0.5 * (
                (2 * p1.x) +
                (-p0c.x + p2.x) * t +
                (2 * p0c.x - 5 * p1.x + 4 * p2.x - p3c.x) * t2 +
                (-p0c.x + 3 * p1.x - 3 * p2.x + p3c.x) * t3
            );
            const y = 0.5 * (
                (2 * p1.y) +
                (-p0c.y + p2.y) * t +
                (2 * p0c.y - 5 * p1.y + 4 * p2.y - p3c.y) * t2 +
                (-p0c.y + 3 * p1.y - 3 * p2.y + p3c.y) * t3
            );
            
            result.push({ x, y });
        }
    }
    
    return result;
}

// ============================================================
// СРАВНИТЕЛЬНАЯ ОЦЕНКА КОНВЕРТАЦИИ (полилиния → безье)
// ============================================================

// Строит массив кубических кривых из точек с плавными control-точками.
// Возвращает: [{ p0, c1, c2, p3 }, ...]
buildSmoothCurves(points, isClosed) {
    const curves = [];
    if (points.length < 2) return curves;
    
    const total = isClosed ? points.length : points.length - 1;
    
    for (let i = 0; i < total; i++) {
        const fromPoint = points[i];
        const toPoint = points[(i + 1) % points.length];
        
        const prevIdx = (i - 1 + points.length) % points.length;
        const nextIdx = (i + 2) % points.length;
        
        const prev = isClosed || i > 0 ? points[prevIdx] : null;
        const next = isClosed || i < total - 1 ? points[nextIdx] : null;
        
        const c1 = this.calculateSmoothControl(fromPoint, toPoint, prev);
        const c2 = this.calculateSmoothControl(toPoint, fromPoint, next);
        
        curves.push({
            p0: fromPoint,
            c1: c1,
            c2: c2,
            p3: toPoint
        });
    }
    
    return curves;
}

// Сэмплирует набор кривых в N равномерных по длине точках.
sampleCurvesUniform(curves, N) {
    if (!curves || curves.length === 0) return [];
    
    // Приблизительная длина каждой кривой
    const curveSamples = 20;
    const curveLengths = [];
    let totalLength = 0;
    
    for (const curve of curves) {
        let len = 0;
        let prevP = curve.p0;
        for (let i = 1; i <= curveSamples; i++) {
            const t = i / curveSamples;
            const p = this.evaluateCubicBezier(
                curve.p0.x, curve.p0.y,
                curve.c1.x, curve.c1.y,
                curve.c2.x, curve.c2.y,
                curve.p3.x, curve.p3.y,
                t
            );
            len += Math.hypot(p.x - prevP.x, p.y - prevP.y);
            prevP = p;
        }
        curveLengths.push(len);
        totalLength += len;
    }
    
    if (totalLength === 0) {
        return [curves[0].p0];
    }
    
    const result = [];
    const step = totalLength / N;
    
    let curveIdx = 0;
    let curveDist = 0;
    
    for (let i = 0; i <= N; i++) {
        const targetDist = i * step;
        
        while (curveIdx < curveLengths.length && 
               curveDist + curveLengths[curveIdx] < targetDist) {
            curveDist += curveLengths[curveIdx];
            curveIdx++;
        }
        
        if (curveIdx >= curves.length) {
            const last = curves[curves.length - 1];
            result.push({ x: last.p3.x, y: last.p3.y });
            continue;
        }
        
        const curve = curves[curveIdx];
        const localDist = targetDist - curveDist;
        const localT = curveLengths[curveIdx] > 0 
            ? localDist / curveLengths[curveIdx] 
            : 0;
        
        const p = this.evaluateCubicBezier(
            curve.p0.x, curve.p0.y,
            curve.c1.x, curve.c1.y,
            curve.c2.x, curve.c2.y,
            curve.p3.x, curve.p3.y,
            Math.max(0, Math.min(1, localT))
        );
        result.push(p);
    }
    
    return result;
}

// Сравнительная оценка: какая версия (гладкая или угловая) ближе к оригиналу.
// Возвращает: 'smooth' или 'sharp'.
evaluateConversion(originalPoints, isClosed, simplifiedPoints, originalTag) {
    if (!originalPoints || originalPoints.length < 2) return 'sharp';
    if (!simplifiedPoints || simplifiedPoints.length < 2) return 'sharp';
    
    const N = 500;
    
    // Сэмплируем гладкую безье
    const smoothCurves = this.buildSmoothCurves(simplifiedPoints, isClosed);
    const smoothSamples = this.sampleCurvesUniform(smoothCurves, N);
    
    // Средняя ошибка гладкой: для каждой точки оригинала — ближайшая на гладкой
    let smoothError = 0;
    for (const p of originalPoints) {
        let minDist = Infinity;
        for (let i = 0; i < smoothSamples.length; i++) {
            const s = smoothSamples[i];
            const d = Math.hypot(p.x - s.x, p.y - s.y);
            if (d < minDist) minDist = d;
        }
        smoothError += minDist;
    }
    smoothError /= originalPoints.length;
    
    // Средняя ошибка угловой: расстояние от точки до полилинии
    let sharpError = 0;
    const limit = isClosed ? simplifiedPoints.length : simplifiedPoints.length - 1;
    for (const p of originalPoints) {
        let minDist = Infinity;
        for (let i = 0; i < limit; i++) {
            const a = simplifiedPoints[i];
            const b = simplifiedPoints[(i + 1) % simplifiedPoints.length];
            const d = this.distanceToSegment(p.x, p.y, a.x, a.y, b.x, b.y);
            if (d < minDist) minDist = d;
        }
        sharpError += minDist;
    }
    sharpError /= originalPoints.length;
    
    console.log(`Средняя ошибка: гладкая=${smoothError.toFixed(3)}, угловая=${sharpError.toFixed(3)}`);
    
    const diff = smoothError - sharpError;
    
    // Гладкая заметно хуже — угловая
    if (diff > 0.3) return 'sharp';
    // Гладкая заметно лучше — гладкая
    if (diff < -0.3) return 'smooth';
    
    // Близко — по originalTag
    if (originalTag === 'rect' || originalTag === 'line' || originalTag === 'polygon') {
        return 'sharp';
    }
    if (originalTag === 'circle' || originalTag === 'ellipse') {
        return 'smooth';
    }
    return simplifiedPoints.length > 12 ? 'smooth' : 'sharp';
}

// Строит d-строку с безье из точек (с контролами)
smoothPointsToPathD(points, isClosed) {
    if (points.length === 0) return '';
    
    let d = `M ${points[0].x} ${points[0].y}`;
    const total = isClosed ? points.length : points.length - 1;
    
    for (let i = 0; i < total; i++) {
        const fromPoint = points[i];
        const toPoint = points[(i + 1) % points.length];
        
        const prevIdx = (i - 1 + points.length) % points.length;
        const nextIdx = (i + 2) % points.length;
        
        const prev = isClosed || i > 0 ? points[prevIdx] : null;
        const next = isClosed || i < total - 1 ? points[nextIdx] : null;
        
        const c1 = this.calculateSmoothControl(fromPoint, toPoint, prev);
        const c2 = this.calculateSmoothControl(toPoint, fromPoint, next);
        
        d += ` C ${c1.x} ${c1.y} ${c2.x} ${c2.y} ${toPoint.x} ${toPoint.y}`;
    }
    
    if (isClosed) d += ' Z';
    return d;
}

// Строит d-строку с углами (прямые линии)
sharpPointsToPathD(points, isClosed) {
    if (points.length === 0) return '';
    let d = `M ${points[0].x} ${points[0].y}`;
    for (let i = 1; i < points.length; i++) {
        d += ` L ${points[i].x} ${points[i].y}`;
    }
    if (isClosed) d += ' Z';
    return d;
}

// Основной метод: конвертирует выделенный обычный вектор в безье.
// Возвращает true при успехе.
convertSelectionToBezier() {
    if (!this.selectedElement) {
        console.warn('Нет выделенного элемента');
        return false;
    }
    
    const element = this.selectedElement;
    
    if (!this.canConvertToBezier(element)) {
        console.warn('Элемент нельзя конвертировать в безье');
        return false;
    }
    
    // Сбрасываем выделение ПЕРЕД конвертацией (чтобы не было конфликтов)
    this.removeSelectionHandles();
    this.selectedElement = null;
    
    // Шаг 1: получаем единый <path> с d
    let pathElement = element;
    if (element.tagName.toLowerCase() !== 'path') {
        pathElement = this.convertToPath(element);
        if (!pathElement) {
            console.warn('Не удалось получить path');
            return false;
        }
    }
    
    const d = pathElement.getAttribute('d');
    if (!d) {
        console.warn('У path нет d');
        return false;
    }
    
    // Сохраняем стиль
    const strokeColor = pathElement.getAttribute('stroke') || this.state.strokeColor;
    const strokeWidth = pathElement.getAttribute('stroke-width') || this.state.strokeWidth;
    const linecap = pathElement.getAttribute('stroke-linecap') || 'round';
    const linejoin = pathElement.getAttribute('stroke-linejoin') || 'round';
    
    // Шаг 2: парсим d
    let rawPoints = [];
    let isClosed = false;
    
    if (/[CcQqSs]/.test(d)) {
        // Уже кривые — импортируем как кривые
        const segments = this.parseBezierSegmentsFromD(d);
        if (segments.length === 0) {
            console.warn('Не удалось распарсить кривые');
            return false;
        }
        // Собираем точки и контрольные
        rawPoints = segments; // массив { start, c1, c2, end }
    } else {
        // Полилиния — упрощаем и усредняем
        const parsed = this.parsePathToPoints(d);
        rawPoints = parsed.points;
        isClosed = parsed.isClosed;
    }
    
    if (rawPoints.length < 2) {
        console.warn('Слишком мало точек');
        return false;
    }
    
    // Удаляем оригинал
    if (pathElement.parentNode) pathElement.parentNode.removeChild(pathElement);
    
    // Шаг 3: создаём безье-структуру
    const newPoints = [];
    const newVectors = [];
    
    if (/[CcQqSs]/.test(d)) {
        // ИМПОРТ кривых
        this.importBezierSegments(rawPoints, newPoints, newVectors, strokeColor, strokeWidth, linecap, linejoin);
} else {
    const segments = this.parsePathToSegments(d);
    
    if (segments.length === 0) {
        console.warn('Не удалось разбить на сегменты');
        return false;
    }
    
    const originalTag = element.tagName.toLowerCase();
    
    for (const segment of segments) {
        if (segment.points.length < 2) continue;
        
        const simplified = this.simplifyPolylineRDP(segment.points, 2.5);
        const isClosedShape = segment.isClosed && simplified.length > 2;
        const totalVectors = isClosedShape ? simplified.length : simplified.length - 1;
        
        if (totalVectors === 0) continue;
        
// === ОПРЕДЕЛЯЕМ: сглаживать или нет ===
let allSharp;

// Считаем среднюю длину сегмента оригинала
let totalLen = 0;
for (let i = 1; i < segment.points.length; i++) {
    totalLen += Math.hypot(
        segment.points[i].x - segment.points[i-1].x,
        segment.points[i].y - segment.points[i-1].y
    );
}
const avgSegLen = segment.points.length > 1 
    ? totalLen / (segment.points.length - 1) 
    : 0;

// Плотный карандаш — гладкая
const isPenLike = (avgSegLen < 6 && segment.points.length > 15);

console.log(`[CONV] tag=${originalTag}, точек=${segment.points.length}, avgSegLen=${avgSegLen.toFixed(2)}, isPenLike=${isPenLike}`);

if (originalTag === 'circle' || originalTag === 'ellipse') {
    allSharp = false;
} else if (originalTag === 'rect' || originalTag === 'line' || originalTag === 'polygon') {
    allSharp = true;
} else if (simplified.length <= 3) {
    allSharp = true;
} else if (isPenLike) {
    // Карандаш (плотная полилиния) — гладкая
    allSharp = false;
} else {
    // Сравнительный анализ
    const result = this.evaluateConversion(
        segment.points,
        isClosedShape,
        simplified,
        originalTag
    );
    allSharp = (result === 'sharp');
}
        // Создаём точки
        const segmentPoints = [];
        for (const p of simplified) {
            const newPoint = {
                x: p.x,
                y: p.y,
                element: null,
                index: this.state.bezierPoints.length + newPoints.length
            };
            newPoint.element = this.createBezierPointElement(newPoint);
            this.svg.appendChild(newPoint.element);
            newPoints.push(newPoint);
            segmentPoints.push(newPoint);
        }
        
        const sharp = new Array(simplified.length).fill(allSharp);
        
        // Создаём векторы
        for (let i = 0; i < totalVectors; i++) {
            const fromIdx = i;
            const toIdx = (i + 1) % simplified.length;
            
            const fromPoint = segmentPoints[fromIdx];
            const toPoint = segmentPoints[toIdx];
            
            const prevIdx = (i - 1 + simplified.length) % simplified.length;
            const nextIdx = (i + 2) % simplified.length;
            
            const prev = isClosedShape || i > 0 ? segmentPoints[prevIdx] : null;
            const next = isClosedShape || i < totalVectors - 1 ? segmentPoints[nextIdx] : null;
            
            let c1, c2;
            
            if (sharp[fromIdx]) {
                c1 = { x: fromPoint.x, y: fromPoint.y };
            } else {
                c1 = this.calculateSmoothControl(fromPoint, toPoint, prev);
            }
            
            if (sharp[toIdx]) {
                c2 = { x: toPoint.x, y: toPoint.y };
            } else {
                c2 = this.calculateSmoothControl(toPoint, fromPoint, next);
            }
            
            const vector = {
                from: fromPoint.index,
                to: toPoint.index,
                control1: { x: c1.x, y: c1.y, belongsTo: fromPoint.index },
                control2: { x: c2.x, y: c2.y, belongsTo: toPoint.index },
                path: null,
                guideElements: {}
            };
            
            vector.path = this.createBezierPath(
                fromPoint.x, fromPoint.y,
                vector.control1.x, vector.control1.y,
                vector.control2.x, vector.control2.y,
                toPoint.x, toPoint.y
            );
            vector.path.setAttribute('stroke', strokeColor);
            vector.path.setAttribute('stroke-width', strokeWidth);
            vector.path.setAttribute('stroke-linecap', linecap);
            vector.path.setAttribute('stroke-linejoin', linejoin);
            
            this.svg.appendChild(vector.path);
            newVectors.push(vector);
        }
    }
}
    
    // Регистрируем всё в state
    for (const p of newPoints) {
        this.state.bezierPoints.push(p);
    }
    for (const v of newVectors) {
        this.state.bezierVectors.push(v);
    }
    
    // Создаём направляющие
    for (const v of newVectors) {
        const fromPoint = this.state.bezierPoints[v.from];
        const toPoint = this.state.bezierPoints[v.to];
        if (fromPoint && toPoint) {
            this.createVectorGuides(v, fromPoint, toPoint);
        }
    }
    
    // Шаг 4: переключаемся в режим безье (как клик по кнопке B)
    this.setTool('bezier-points');
    
    // Спрячем кнопку «В безье», если она показывалась
    const btnBlock = document.getElementById('toBezierBlock');
    if (btnBlock) btnBlock.hidden = true;
    
    this.saveSnapshot();
    return true;
}

// Импортирует существующие кривые (M+C) как безье-структуру
importBezierSegments(segments, newPoints, newVectors, strokeColor, strokeWidth, linecap, linejoin) {
    // Собираем уникальные точки: start первой + end каждой
    for (const seg of segments) {
        const fromPoint = {
            x: seg.start.x,
            y: seg.start.y,
            element: null,
            index: this.state.bezierPoints.length + newPoints.length
        };
        fromPoint.element = this.createBezierPointElement(fromPoint);
        this.svg.appendChild(fromPoint.element);
        newPoints.push(fromPoint);
    }
    
    // Точка to последнего сегмента
    const lastSeg = segments[segments.length - 1];
    const lastPoint = {
        x: lastSeg.end.x,
        y: lastSeg.end.y,
        element: null,
        index: this.state.bezierPoints.length + newPoints.length
    };
    lastPoint.element = this.createBezierPointElement(lastPoint);
    this.svg.appendChild(lastPoint.element);
    newPoints.push(lastPoint);
    
    // Создаём векторы
    for (let i = 0; i < segments.length; i++) {
        const seg = segments[i];
        const fromPoint = newPoints[i];
        const toPoint = newPoints[i + 1];
        
        const vector = {
            from: fromPoint.index,
            to: toPoint.index,
            control1: { x: seg.c1.x, y: seg.c1.y, belongsTo: fromPoint.index },
            control2: { x: seg.c2.x, y: seg.c2.y, belongsTo: toPoint.index },
            path: null,
            guideElements: {}
        };
        
        vector.path = this.createBezierPath(
            fromPoint.x, fromPoint.y,
            vector.control1.x, vector.control1.y,
            vector.control2.x, vector.control2.y,
            toPoint.x, toPoint.y
        );
        vector.path.setAttribute('stroke', strokeColor);
        vector.path.setAttribute('stroke-width', strokeWidth);
        vector.path.setAttribute('stroke-linecap', linecap);
        vector.path.setAttribute('stroke-linejoin', linejoin);
        
        this.svg.appendChild(vector.path);
        newVectors.push(vector);
    }
}

// Парсит строку d, содержащую кривые (M/C/Q/S) — возвращает массив сегментов
// Формат: [{ start: {x,y}, c1: {x,y}, c2: {x,y}, end: {x,y} }, ...]
parseBezierSegmentsFromD(d) {
    if (!d) return [];
    
    const segments = [];
    const commands = this.parsePathCommands(d);
    
    let currentX = 0, currentY = 0;
    let startX = 0, startY = 0;
    let prevC2x = 0, prevC2y = 0;
    let lastCmd = '';
    
    // Для обработки M после первого
    let isFirstMove = true;
    
    for (const cmd of commands) {
        const { command, params, isRelative } = cmd;
        const upper = command.toUpperCase();
        
        let absParams = [...params];
        if (isRelative && upper !== 'Z') {
            for (let i = 0; i < absParams.length; i += 2) {
                if (i + 1 < absParams.length) {
                    absParams[i] += currentX;
                    absParams[i + 1] += currentY;
                }
            }
        }
        
        switch (upper) {
            case 'M':
                if (absParams.length >= 2) {
                    currentX = absParams[0];
                    currentY = absParams[1];
                    if (isFirstMove) {
                        startX = currentX;
                        startY = currentY;
                        isFirstMove = false;
                    }
                }
                break;
            
            case 'L':
                for (let i = 0; i < absParams.length; i += 2) {
                    if (i + 1 < absParams.length) {
                        const nx = absParams[i];
                        const ny = absParams[i + 1];
                        // Линия = вырожденная кривая Безье (c1=start, c2=end)
                        segments.push({
                            start: { x: currentX, y: currentY },
                            c1:    { x: currentX, y: currentY },
                            c2:    { x: nx, y: ny },
                            end:   { x: nx, y: ny }
                        });
                        currentX = nx;
                        currentY = ny;
                        prevC2x = currentX;
                        prevC2y = currentY;
                    }
                }
                break;
            
            case 'C':
                for (let i = 0; i < absParams.length; i += 6) {
                    if (i + 5 < absParams.length) {
                        const c1x = absParams[i],   c1y = absParams[i+1];
                        const c2x = absParams[i+2], c2y = absParams[i+3];
                        const ex = absParams[i+4],  ey = absParams[i+5];
                        segments.push({
                            start: { x: currentX, y: currentY },
                            c1:    { x: c1x, y: c1y },
                            c2:    { x: c2x, y: c2y },
                            end:   { x: ex, y: ey }
                        });
                        currentX = ex;
                        currentY = ey;
                        prevC2x = c2x;
                        prevC2y = c2y;
                    }
                }
                break;
            
            case 'S':
                for (let i = 0; i < absParams.length; i += 4) {
                    if (i + 3 < absParams.length) {
                        const c2x = absParams[i], c2y = absParams[i+1];
                        const ex = absParams[i+2],  ey = absParams[i+3];
                        // c1 отражается от предыдущего
                        let c1x, c1y;
                        if (lastCmd === 'C' || lastCmd === 'S') {
                            c1x = 2 * currentX - prevC2x;
                            c1y = 2 * currentY - prevC2y;
                        } else {
                            c1x = currentX;
                            c1y = currentY;
                        }
                        segments.push({
                            start: { x: currentX, y: currentY },
                            c1:    { x: c1x, y: c1y },
                            c2:    { x: c2x, y: c2y },
                            end:   { x: ex, y: ey }
                        });
                        currentX = ex;
                        currentY = ey;
                        prevC2x = c2x;
                        prevC2y = c2y;
                    }
                }
                break;
            
            case 'Q':
                for (let i = 0; i < absParams.length; i += 4) {
                    if (i + 3 < absParams.length) {
                        const qx = absParams[i], qy = absParams[i+1];
                        const ex = absParams[i+2], ey = absParams[i+3];
                        // Квадратичная в кубическую
                        const c1x = currentX + (2/3) * (qx - currentX);
                        const c1y = currentY + (2/3) * (qy - currentY);
                        const c2x = ex + (2/3) * (qx - ex);
                        const c2y = ey + (2/3) * (qy - ey);
                        segments.push({
                            start: { x: currentX, y: currentY },
                            c1:    { x: c1x, y: c1y },
                            c2:    { x: c2x, y: c2y },
                            end:   { x: ex, y: ey }
                        });
                        currentX = ex;
                        currentY = ey;
                        prevC2x = c2x;
                        prevC2y = c2y;
                    }
                }
                break;
        }
        
        lastCmd = upper;
    }
    
    return segments;
}

// Упрощение полилинии (Ramer-Douglas-Peucker)
simplifyPolylineRDP(points, tolerance) {
    if (points.length < 3) return points;
    
    const sqTolerance = tolerance * tolerance;
    
    const getSqSegDist = (p, a, b) => {
        let x = a.x, y = a.y;
        let dx = b.x - x, dy = b.y - y;
        if (dx !== 0 || dy !== 0) {
            const t = ((p.x - x) * dx + (p.y - y) * dy) / (dx * dx + dy * dy);
            if (t > 1) { x = b.x; y = b.y; }
            else if (t > 0) { x += dx * t; y += dy * t; }
        }
        dx = p.x - x;
        dy = p.y - y;
        return dx * dx + dy * dy;
    };
    
    const simplifyStep = (pts, first, last, sqTol, out) => {
        let maxSqDist = sqTol;
        let index = -1;
        for (let i = first + 1; i < last; i++) {
            const sqDist = getSqSegDist(pts[i], pts[first], pts[last]);
            if (sqDist > maxSqDist) {
                index = i;
                maxSqDist = sqDist;
            }
        }
        if (maxSqDist > sqTol) {
            if (index - first > 1) simplifyStep(pts, first, index, sqTol, out);
            out.push(pts[index]);
            if (last - index > 1) simplifyStep(pts, index, last, sqTol, out);
        }
    };
    
    const out = [points[0]];
    simplifyStep(points, 0, points.length - 1, sqTolerance, out);
    out.push(points[points.length - 1]);
    return out;
}

// Рассчитывает контрольную точку для плавной кривой (направление от соседа)
calculateSmoothControl(point, target, prevPoint) {
    // Направление: от prevPoint к target (касательная через point)
    let dirX, dirY;
    
    if (prevPoint) {
        dirX = target.x - prevPoint.x;
        dirY = target.y - prevPoint.y;
    } else {
        dirX = target.x - point.x;
        dirY = target.y - point.y;
    }
    
    const len = Math.hypot(dirX, dirY) || 1;
    const dist = Math.hypot(target.x - point.x, target.y - point.y);
    
    // Длина касательной = 0.39 от расстояния (как в createBezierVector)
    const controlLength = dist * 0.39;
    
    return {
        x: point.x + (dirX / len) * controlLength,
        y: point.y + (dirY / len) * controlLength
    };
}

// Функция конвертации конкретного элемента в путь
convertToPath(element) {
    if (!element || element.nodeType !== 1) return null;
    
    const tag = element.tagName.toLowerCase();
    
    // Безье не трогаем
    const className = element.getAttribute('class') || '';
    if (className.includes('bezier-')) return null;
    
    // Уже path — ничего не делаем, возвращаем как есть
    if (tag === 'path') return element;
    
    let pathData = '';
    
    switch (tag) {
        case 'line': {
            const x1 = parseFloat(element.getAttribute('x1')) || 0;
            const y1 = parseFloat(element.getAttribute('y1')) || 0;
            const x2 = parseFloat(element.getAttribute('x2')) || 0;
            const y2 = parseFloat(element.getAttribute('y2')) || 0;
            pathData = `M ${x1} ${y1} L ${x2} ${y2}`;
            break;
        }
        case 'rect': {
            const x = parseFloat(element.getAttribute('x')) || 0;
            const y = parseFloat(element.getAttribute('y')) || 0;
            const w = parseFloat(element.getAttribute('width')) || 0;
            const h = parseFloat(element.getAttribute('height')) || 0;
            pathData = `M ${x} ${y} L ${x + w} ${y} L ${x + w} ${y + h} L ${x} ${y + h} Z`;
            break;
        }
        case 'circle': {
            const cx = parseFloat(element.getAttribute('cx')) || 0;
            const cy = parseFloat(element.getAttribute('cy')) || 0;
            const r  = parseFloat(element.getAttribute('r'))  || 0;
            pathData = this.approximateCircleAsPath(cx, cy, r, 60);
            break;
        }
        case 'ellipse': {
            const cx = parseFloat(element.getAttribute('cx')) || 0;
            const cy = parseFloat(element.getAttribute('cy')) || 0;
            const rx = parseFloat(element.getAttribute('rx')) || 0;
            const ry = parseFloat(element.getAttribute('ry')) || 0;
            pathData = this.approximateEllipseAsPath(cx, cy, rx, ry, 60);
            break;
        }
        case 'polyline': {
            const pts = element.getAttribute('points') || '';
            const nums = pts.split(/[\s,]+/).map(parseFloat).filter(n => !isNaN(n));
            if (nums.length < 4) return null;
            let d = `M ${nums[0]} ${nums[1]}`;
            for (let i = 2; i < nums.length; i += 2) {
                if (i + 1 < nums.length) d += ` L ${nums[i]} ${nums[i + 1]}`;
            }
            pathData = d;
            break;
        }
        case 'polygon': {
            const pts = element.getAttribute('points') || '';
            const nums = pts.split(/[\s,]+/).map(parseFloat).filter(n => !isNaN(n));
            if (nums.length < 4) return null;
            let d = `M ${nums[0]} ${nums[1]}`;
            for (let i = 2; i < nums.length; i += 2) {
                if (i + 1 < nums.length) d += ` L ${nums[i]} ${nums[i + 1]}`;
            }
            pathData = d + ' Z';
            break;
        }
        default:
            return null;
    }
    
    if (!pathData) return null;
    
    // Создаём новый <path> с теми же стилевыми атрибутами
    const newPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    newPath.setAttribute('d', pathData);
    
    // Переносим стиль (stroke, fill и т.д.)
    const styleAttrs = [
        'stroke', 'stroke-width', 'stroke-linecap', 'stroke-linejoin',
        'stroke-dasharray', 'stroke-opacity',
        'fill', 'fill-rule', 'fill-opacity',
        'opacity'
    ];
    for (const attr of styleAttrs) {
        const val = element.getAttribute(attr);
        if (val !== null) newPath.setAttribute(attr, val);
    }
    
    // Значения по умолчанию, если не заданы
    if (!newPath.getAttribute('stroke')) newPath.setAttribute('stroke', this.state.strokeColor || '#4dabf7');
    if (!newPath.getAttribute('stroke-width')) newPath.setAttribute('stroke-width', String(this.state.strokeWidth || 3));
    if (!newPath.getAttribute('fill')) newPath.setAttribute('fill', 'none');
    
    // Переносим transform? — НЕТ. transform должен быть запечён ДО вызова этой функции.
    // Если у элемента остался transform — переносим его, чтобы не потерять вид.
    // (но в ластике мы вызываем сначала bakeElementForErase)
    const transform = element.getAttribute('transform');
    if (transform) newPath.setAttribute('transform', transform);
    
    // Подменяем в DOM
    if (element.parentNode) {
        element.parentNode.replaceChild(newPath, element);
    }
    
    return newPath;
}

// Аппроксимирует круг как path (полигон из numPoints точек)
approximateCircleAsPath(cx, cy, r, numPoints = 60) {
    if (r <= 0) return '';
    const pts = [];
    for (let i = 0; i < numPoints; i++) {
        const a = (i / numPoints) * Math.PI * 2;
        pts.push({
            x: cx + Math.cos(a) * r,
            y: cy + Math.sin(a) * r
        });
    }
    let d = `M ${pts[0].x.toFixed(3)} ${pts[0].y.toFixed(3)}`;
    for (let i = 1; i < pts.length; i++) {
        d += ` L ${pts[i].x.toFixed(3)} ${pts[i].y.toFixed(3)}`;
    }
    return d + ' Z';
}

// Аппроксимирует эллипс как path
approximateEllipseAsPath(cx, cy, rx, ry, numPoints = 60) {
    if (rx <= 0 || ry <= 0) return '';
    const pts = [];
    for (let i = 0; i < numPoints; i++) {
        const a = (i / numPoints) * Math.PI * 2;
        pts.push({
            x: cx + Math.cos(a) * rx,
            y: cy + Math.sin(a) * ry
        });
    }
    let d = `M ${pts[0].x.toFixed(3)} ${pts[0].y.toFixed(3)}`;
    for (let i = 1; i < pts.length; i++) {
        d += ` L ${pts[i].x.toFixed(3)} ${pts[i].y.toFixed(3)}`;
    }
    return d + ' Z';
}

// Запекает transform в элемент перед обработкой (ластик, push и т.д.).
// Учитывает родительские <g transform>.
// Возвращает актуальный элемент после возможной подмены (rect→path и т.п.).
bakeElementForErase(element) {
    if (!element || element.nodeType !== 1) return element;
    
    // Собираем матрицу (включая родительские <g>)
    const matrix = this.getElementTransformMatrix(element);
    
    // Проверяем, есть ли вообще трансформация (собственная или родительская)
    const hasOwnTransform = !!element.getAttribute('transform');
    const hasAnyTransform = !this.isIdentityMatrix(matrix);
    
    if (!hasAnyTransform && !hasOwnTransform) {
        // Нет трансформации — ничего запекать не надо
        // Но если родитель был <g transform>, всё равно надо "вынуть" элемент
        // — иначе координаты элемента в системе родителя, а не SVG.
        // Проверяем: если родитель — не слой, а <g transform> — надо поднять.
        if (element.parentNode && 
            element.parentNode.tagName &&
            element.parentNode.tagName.toLowerCase() === 'g' &&
            element.parentNode.getAttribute('transform')) {
            // Нужно запечь, даже если собственный transform пуст
        } else {
            return element;
        }
    }
    
    // Применяем запекание
    const result = this.bakeTransformInElement(element);
    
    if (result && result.replaced && result.newElement) {
        return result.newElement;
    }
    
    return element;
}

// ============================================================
// РАСТРОВАЯ МАСКА ДЛЯ РЕЗКИ ОБЫЧНЫХ ПУТЕЙ
// ============================================================

// Строит off-screen canvas 1000x1000 с траекторией маски.
// Возвращает ImageData (белые пиксели = область стирания).
buildEraserMaskCanvas(points, radius) {
    const size = 1000;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = 'black';
    ctx.fillRect(0, 0, size, size);
    
    ctx.strokeStyle = 'white';
    ctx.fillStyle = 'white';
    ctx.lineWidth = radius * 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    if (points.length === 1) {
        ctx.beginPath();
        ctx.arc(points[0].x, points[0].y, radius, 0, Math.PI * 2);
        ctx.fill();
    } else {
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
            ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.stroke();
        
        // Закрашиваем концы кругами (для скругления)
        ctx.beginPath();
        ctx.arc(points[0].x, points[0].y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(points[points.length - 1].x, points[points.length - 1].y, radius, 0, Math.PI * 2);
        ctx.fill();
    }
    
    return ctx.getImageData(0, 0, size, size);
}

// Быстрая проверка: пиксель в маске?
isPointInMask(imageData, x, y) {
    const w = imageData.width;
    const h = imageData.height;
    const px = Math.floor(x);
    const py = Math.floor(y);
    if (px < 0 || px >= w || py < 0 || py >= h) return false;
    const idx = (py * w + px) * 4;
    return imageData.data[idx] > 128;
}

// Бинарный поиск точки перехода через границу маски на отрезке p1-p2.
// p1InMask — флаг p1 (true = внутри маски).
findMaskBoundary(imageData, p1, p2, p1InMask) {
    let lo = 0, hi = 1;
    for (let it = 0; it < 20; it++) {
        const mid = (lo + hi) / 2;
        const mx = p1.x + (p2.x - p1.x) * mid;
        const my = p1.y + (p2.y - p1.y) * mid;
        const inside = this.isPointInMask(imageData, mx, my);
        if (inside === p1InMask) lo = mid;
        else hi = mid;
    }
    const t = (lo + hi) / 2;
    return {
        x: p1.x + (p2.x - p1.x) * t,
        y: p1.y + (p2.y - p1.y) * t,
        t: t
    };
}

// Режет обычный <path> по растровой маске.
// Возвращает:
//   'delete' — если путь целиком внутри маски
//   null — если путь целиком снаружи (не трогаем)
//   { segments: [ [ {x,y}, ... ], ... ], newPath: <path> } — если разрезан
cutPathByMask(pathElement, imageData) {
    const d = pathElement.getAttribute('d');
    if (!d) return null;
    
    const { points: rawPoints, isClosed } = this.parsePathToPoints(d);
    if (rawPoints.length < 2) return null;
    
    // === РАЗБИВАЕМ ДЛИННЫЕ СЕГМЕНТЫ НА МЕЛКИЕ ===
    // Шаг = 2 пикселя (в единицах viewBox 1000x1000)
    const MAX_STEP = 2;
    const points = [];
    
    const n0 = rawPoints.length;
    const lastI = isClosed ? n0 : n0 - 1;
    
    for (let i = 0; i < lastI; i++) {
        const a = rawPoints[i];
        const b = rawPoints[(i + 1) % n0];
        points.push(a);
        
        const dist = Math.hypot(b.x - a.x, b.y - a.y);
        if (dist > MAX_STEP) {
            const steps = Math.ceil(dist / MAX_STEP);
            for (let s = 1; s < steps; s++) {
                const t = s / steps;
                points.push({
                    x: a.x + (b.x - a.x) * t,
                    y: a.y + (b.y - a.y) * t
                });
            }
        }
    }
    if (!isClosed) {
        points.push(rawPoints[rawPoints.length - 1]);
    }
    
    // === Дальше — как раньше, но с новым массивом points ===
    const flags = points.map(p => this.isPointInMask(imageData, p.x, p.y));
    
    if (flags.every(f => !f)) return null;
    if (flags.every(f => f)) return 'delete';
    
    // ... остальной код такой же, но помним,
    // что точки теперь промежуточные (включая "плотные") ...
    
    const segments = [];
    let current = null;
    const n = points.length;
    
    let startIdx = 0;
    if (isClosed) {
        const outsideIdx = flags.findIndex(f => !f);
        if (outsideIdx > 0) startIdx = outsideIdx;
    }
    
    for (let s = 0; s < n; s++) {
        const i = (startIdx + s) % n;
        const p = points[i];
        const inside = flags[i];
        
        if (!inside) {
            if (!current) current = [];
            current.push(p);
        } else {
            if (current && current.length > 0) {
                const prevIdx = (i - 1 + n) % n;
                if (s > 0 || isClosed) {
                    const boundary = this.findMaskBoundary(
                        imageData, points[prevIdx], p, false
                    );
                    if (boundary) current.push({x: boundary.x, y: boundary.y});
                }
                if (current.length >= 2) segments.push(current);
                current = null;
            }
        }
    }
    
    if (current && current.length >= 2) {
        if (isClosed && segments.length > 0 && flags[startIdx] === false) {
            segments[0] = [...current, ...segments[0]];
        } else {
            segments.push(current);
        }
    }
    
    if (segments.length === 0) return 'delete';
    
    const validSegments = segments.filter(s => s.length >= 2);
    if (validSegments.length === 0) return 'delete';
    if (validSegments.length === 1 && validSegments[0].length === points.length) {
        return null;
    }
    
    // === УПРОЩАЕМ СЕГМЕНТЫ: убираем промежуточные точки, 
    //     которые лежат на одной прямой (чтобы не раздувать d) ===
    const simplified = validSegments.map(seg => this.simplifyPolyline(seg, 0.5));
    
    return { segments: simplified };
}

// Упрощение полилинии (алгоритм Рамера-Дугласа-Пека)
simplifyPolyline(points, tolerance = 0.5) {
    if (points.length < 3) return points;
    
    const sqTolerance = tolerance * tolerance;
    
    const getSqSegDist = (p, a, b) => {
        let x = a.x, y = a.y;
        let dx = b.x - x, dy = b.y - y;
        if (dx !== 0 || dy !== 0) {
            const t = ((p.x - x) * dx + (p.y - y) * dy) / (dx * dx + dy * dy);
            if (t > 1) { x = b.x; y = b.y; }
            else if (t > 0) { x += dx * t; y += dy * t; }
        }
        dx = p.x - x;
        dy = p.y - y;
        return dx * dx + dy * dy;
    };
    
    const simplifyStep = (pts, first, last, sqTol, out) => {
        let maxSqDist = sqTol;
        let index = -1;
        for (let i = first + 1; i < last; i++) {
            const sqDist = getSqSegDist(pts[i], pts[first], pts[last]);
            if (sqDist > maxSqDist) {
                index = i;
                maxSqDist = sqDist;
            }
        }
        if (maxSqDist > sqTol) {
            if (index - first > 1) simplifyStep(pts, first, index, sqTol, out);
            out.push(pts[index]);
            if (last - index > 1) simplifyStep(pts, index, last, sqTol, out);
        }
    };
    
    const out = [points[0]];
    simplifyStep(points, 0, points.length - 1, sqTolerance, out);
    out.push(points[points.length - 1]);
    return out;
}

// РЕЗКА БЕЗЬЕ ЧЕРЕЗ МАСКУ (сохранение безье)
splitCubicBezier(p0, c1, c2, p3, t) {
    const lerp = (a, b, k) => ({
        x: a.x + (b.x - a.x) * k,
        y: a.y + (b.y - a.y) * k
    });
    
    const p01 = lerp(p0, c1, t);
    const p12 = lerp(c1, c2, t);
    const p23 = lerp(c2, p3, t);
    const p012 = lerp(p01, p12, t);
    const p123 = lerp(p12, p23, t);
    const p = lerp(p012, p123, t);
    
    return {
        first: { c1: p01, c2: p012, p: p },   // первая кривая: p0 -> p01 -> p012 -> p
        second: { c1: p123, c2: p23, p: p3 }  // вторая кривая: p -> p123 -> p23 -> p3
    };
}

cutBezierVectorByMask(vector, imageData, numSamples = 60) {
    const fromPoint = this.state.bezierPoints[vector.from];
    const toPoint = this.state.bezierPoints[vector.to];
    if (!fromPoint || !toPoint) return null;
    
    // Сэмплируем кривую
    const samples = [];
    for (let i = 0; i <= numSamples; i++) {
        const t = i / numSamples;
        const p = this.evaluateCubicBezier(
            fromPoint.x, fromPoint.y,
            vector.control1.x, vector.control1.y,
            vector.control2.x, vector.control2.y,
            toPoint.x, toPoint.y,
            t
        );
        samples.push({
            t: t,
            x: p.x,
            y: p.y,
            inside: this.isPointInMask(imageData, p.x, p.y)
        });
    }
    
    const allInside = samples.every(s => s.inside);
    const allOutside = samples.every(s => !s.inside);
    
    if (allInside) return 'delete';
    if (allOutside) return null;
    
    // Ищем границы t (переходы inside↔outside)
    const cuts = [];
    for (let i = 0; i < samples.length - 1; i++) {
        const a = samples[i];
        const b = samples[i + 1];
        
        if (a.inside !== b.inside) {
            // Бинарный поиск точного t
            let lo = a.t, hi = b.t;
            for (let it = 0; it < 20; it++) {
                const mid = (lo + hi) / 2;
                const p = this.evaluateCubicBezier(
                    fromPoint.x, fromPoint.y,
                    vector.control1.x, vector.control1.y,
                    vector.control2.x, vector.control2.y,
                    toPoint.x, toPoint.y,
                    mid
                );
                const inside = this.isPointInMask(imageData, p.x, p.y);
                if (inside === a.inside) lo = mid;
                else hi = mid;
            }
            const t = (lo + hi) / 2;
            const p = this.evaluateCubicBezier(
                fromPoint.x, fromPoint.y,
                vector.control1.x, vector.control1.y,
                vector.control2.x, vector.control2.y,
                toPoint.x, toPoint.y,
                t
            );
            cuts.push({ t, point: p, fromInside: a.inside });
        }
    }
    
    return { cuts };
}

// Применяет резку ко всем безье-векторам.
cutAllBeziersByMask(imageData) {
    // Собираем информацию о векторах
    const vectorsToProcess = [...this.state.bezierVectors];
    let changesCount = 0;
    
    // Карта: какие векторы удалить целиком
    const vectorsToDelete = new Set();
    
    // План разбиений: { vector, cuts: [{t, point}, ...] }
    const splitPlan = [];
    
    // Сначала проходим и собираем план (не меняем структуру)
    for (const vector of vectorsToProcess) {
        const result = this.cutBezierVectorByMask(vector, imageData);
        
        if (result === 'delete') {
            vectorsToDelete.add(vector);
        } else if (result && result.cuts.length > 0) {
            splitPlan.push({ vector, cuts: result.cuts });
        }
    }
    for (const plan of splitPlan) {
        this.applySplitsToBezierVector(plan.vector, plan.cuts);
        changesCount++;
    }

    for (const vector of vectorsToDelete) {
        if (this.state.bezierVectors.includes(vector)) {
            this.deleteBezierVector(vector);
            changesCount++;
        }
    }
    changesCount += this.cleanupInnerBezierSegments(imageData);
    if (changesCount > 0 && this.state.currentTool !== 'bezier-points') {
    this.cleanupOrphanBezierPoints();
}
    return changesCount;
}

// Убираем точки, которые больше не принадлежат ни одному вектору
cleanupOrphanBezierPoints() {
    const usedIndices = new Set();
    for (const v of this.state.bezierVectors) {
        usedIndices.add(v.from);
        usedIndices.add(v.to);
    }
    
    // Собираем индексы сирот
    const orphans = [];
    for (let i = 0; i < this.state.bezierPoints.length; i++) {
        if (!usedIndices.has(i)) orphans.push(i);
    }
    
    // Удаляем с конца, чтобы индексы не сбивались
    orphans.sort((a, b) => b - a);
    for (const idx of orphans) {
        const p = this.state.bezierPoints[idx];
        if (p && p.element && p.element.parentNode) {
            p.element.parentNode.removeChild(p.element);
        }
        this.state.bezierPoints.splice(idx, 1);
    }
    
    // Обновляем индексы оставшихся
    if (orphans.length > 0) {
        this.state.bezierPoints.forEach((point, i) => {
            point.index = i;
            if (point.element) point.element.setAttribute('data-index', i);
        });
        
        // Обновляем from/to в векторах
        this.state.bezierVectors.forEach(v => {
            let fromShift = 0, toShift = 0;
            for (const oi of orphans) {
                if (v.from > oi) fromShift++;
                if (v.to > oi) toShift++;
            }
            v.from -= fromShift;
            v.to -= toShift;
        });
    }
}

// Разбивает один безье-вектор в нескольких точках t.
applySplitsToBezierVector(vector, cuts) {
    // Сортируем по t возрастанию
    cuts.sort((a, b) => a.t - b.t);
    
    let currentVector = vector;
    let accumulatedT = 0;  // накопленный параметр для пересчёта t
    
    for (const cut of cuts) {
        // Пересчитываем локальный t для currentVector
        // (после предыдущего разреза длина оставшейся части = 1 - accumulatedT)
        const localT = (cut.t - accumulatedT) / (1 - accumulatedT);
        
        if (localT <= 0.001 || localT >= 0.999) {
            accumulatedT = cut.t;
            continue;
        }
        
        // Разбиваем currentVector в localT
        const result = this.splitOneBezierVector(currentVector, localT);
        if (result) {
            currentVector = result.second;  // продолжаем работу со второй частью
        }
        
        accumulatedT = cut.t;
    }
}

splitOneBezierVector(vector, t) {
    const fromPoint = this.state.bezierPoints[vector.from];
    const toPoint = this.state.bezierPoints[vector.to];
    if (!fromPoint || !toPoint) return null;
    
    // Точка на кривой
    const midPointCoords = this.evaluateCubicBezier(
        fromPoint.x, fromPoint.y,
        vector.control1.x, vector.control1.y,
        vector.control2.x, vector.control2.y,
        toPoint.x, toPoint.y,
        t
    );
    
    // Де Кастельо — точное разбиение
    const split = this.splitCubicBezier(
        { x: fromPoint.x, y: fromPoint.y },
        { x: vector.control1.x, y: vector.control1.y },
        { x: vector.control2.x, y: vector.control2.y },
        { x: toPoint.x, y: toPoint.y },
        t
    );
    
    // Создаём новую точку
    const newPoint = {
        x: midPointCoords.x,
        y: midPointCoords.y,
        element: null,
        index: this.state.bezierPoints.length
    };
    newPoint.element = this.createBezierPointElement(newPoint);
    this.svg.appendChild(newPoint.element);
    this.state.bezierPoints.push(newPoint);
    
    // Сохраняем стиль
    const strokeColor = vector.path.getAttribute('stroke') || this.state.strokeColor;
    const strokeWidth = vector.path.getAttribute('stroke-width') || this.state.strokeWidth;
    
    const vector1 = {
        from: vector.from,
        to: newPoint.index,
        control1: {
            x: split.first.c1.x,
            y: split.first.c1.y,
            belongsTo: vector.from
        },
        control2: {
            x: split.first.c2.x,
            y: split.first.c2.y,
            belongsTo: newPoint.index
        },
        path: null,
        guideElements: {}
    };
    
    const vector2 = {
        from: newPoint.index,
        to: vector.to,
        control1: {
            x: split.second.c1.x,
            y: split.second.c1.y,
            belongsTo: newPoint.index
        },
        control2: {
            x: split.second.c2.x,
            y: split.second.c2.y,
            belongsTo: vector.to
        },
        path: null,
        guideElements: {}
    };
    
    // Создаём path для каждого
    vector1.path = this.createBezierPath(
        fromPoint.x, fromPoint.y,
        vector1.control1.x, vector1.control1.y,
        vector1.control2.x, vector1.control2.y,
        newPoint.x, newPoint.y
    );
    vector1.path.setAttribute('stroke', strokeColor);
    vector1.path.setAttribute('stroke-width', strokeWidth);
    
    vector2.path = this.createBezierPath(
        newPoint.x, newPoint.y,
        vector2.control1.x, vector2.control1.y,
        vector2.control2.x, vector2.control2.y,
        toPoint.x, toPoint.y
    );
    vector2.path.setAttribute('stroke', strokeColor);
    vector2.path.setAttribute('stroke-width', strokeWidth);
    
    this.svg.appendChild(vector1.path);
    this.svg.appendChild(vector2.path);
    
    // Удаляем старый вектор (но НЕ точку vector.from и vector.to!)
    const oldIndex = this.state.bezierVectors.indexOf(vector);
    if (oldIndex !== -1) {
        if (vector.path && vector.path.parentNode) vector.path.remove();
        // Направляющие элементы — удалим, но пересоздадим ниже
        if (vector.guideElements) {
            if (vector.guideElements.line1) vector.guideElements.line1.remove();
            if (vector.guideElements.control1) vector.guideElements.control1.remove();
            if (vector.guideElements.line2) vector.guideElements.line2.remove();
            if (vector.guideElements.control2) vector.guideElements.control2.remove();
        }
        this.state.bezierVectors.splice(oldIndex, 1);
    }
    
    // Создаём направляющие для новых векторов
    this.createVectorGuides(vector1, fromPoint, newPoint);
    this.createVectorGuides(vector2, newPoint, toPoint);
    
    // Скрываем направляющие, если инструмент не безье
    if (this.state.currentTool !== 'bezier-points') {
        Object.values(vector1.guideElements).forEach(el => {
            if (el) el.style.display = 'none';
        });
        Object.values(vector2.guideElements).forEach(el => {
            if (el) el.style.display = 'none';
        });
    }
    
    // Добавляем новые векторы в массив
    this.state.bezierVectors.push(vector1, vector2);
    this.state.pendingConnectPoint = newPoint.index;
    return { first: vector1, second: vector2 };
}

// После разбиения — удаляем векторы, которые целиком внутри маски.
cleanupInnerBezierSegments(imageData) {
    let removed = 0;
    const vectorsToRemove = [];
    
    for (const vector of this.state.bezierVectors) {
        const fromPoint = this.state.bezierPoints[vector.from];
        const toPoint = this.state.bezierPoints[vector.to];
        if (!fromPoint || !toPoint) continue;
        
        // Проверяем середину кривой (t=0.5)
        const mid = this.evaluateCubicBezier(
            fromPoint.x, fromPoint.y,
            vector.control1.x, vector.control1.y,
            vector.control2.x, vector.control2.y,
            toPoint.x, toPoint.y,
            0.5
        );
        
        if (this.isPointInMask(imageData, mid.x, mid.y)) {
            vectorsToRemove.push(vector);
        }
    }
    
    for (const vector of vectorsToRemove) {
        this.deleteBezierVector(vector);
        removed++;
    }
    
    return removed;
}

parsePathToSegments(d) {
    if (!d) return [];
    
    const segments = [];
    const commands = this.parsePathCommands(d);
    
    let currentX = 0, currentY = 0;
    let currentSegment = null;
    let allClosed = true;  // флаг: все ли сегменты закрыты
    
    for (const cmd of commands) {
        const { command, params, isRelative } = cmd;
        const upper = command.toUpperCase();
        
        let absParams = [...params];
        if (isRelative && upper !== 'Z') {
            for (let i = 0; i < absParams.length; i += 2) {
                if (i + 1 < absParams.length) {
                    absParams[i] += currentX;
                    absParams[i + 1] += currentY;
                }
            }
        }
        
        switch (upper) {
            case 'M':
                // Начинаем новый сегмент
                if (currentSegment && currentSegment.points.length >= 2) {
                    segments.push(currentSegment);
                }
                currentSegment = { points: [], isClosed: false };
                if (absParams.length >= 2) {
                    currentX = absParams[0];
                    currentY = absParams[1];
                    currentSegment.points.push({ x: currentX, y: currentY });
                }
                break;
            
            case 'L':
                if (!currentSegment) {
                    currentSegment = { points: [{ x: currentX, y: currentY }], isClosed: false };
                }
                for (let i = 0; i < absParams.length; i += 2) {
                    if (i + 1 < absParams.length) {
                        currentX = absParams[i];
                        currentY = absParams[i + 1];
                        currentSegment.points.push({ x: currentX, y: currentY });
                    }
                }
                break;
            
            case 'C':
            case 'S':
            case 'Q':

                break;
            
            case 'Z':
                if (currentSegment) {
                    currentSegment.isClosed = true;
                }
                break;
        }
    }
    
    if (currentSegment && currentSegment.points.length >= 2) {
        segments.push(currentSegment);
    }
    
    return segments;
}

// Парсинг пути в точки
parsePathToPoints(d) {
    if (!d || d.trim() === '') {
        return { points: [], isClosed: false };
    }
    
    // Проверяем кэш (Map может использовать строки как ключи)
    if (this.pathCache.has(d)) {
        return this.pathCache.get(d);
    }
    
    const isClosed = d.includes(' Z') || d.includes('z');
    
    try {
        const points = [];
        const numbers = d.match(/[+-]?\d*\.?\d+(?:[eE][+-]?\d+)?/g) || [];
        
        for (let i = 0; i < numbers.length; i += 2) {
            if (i + 1 < numbers.length) {
                points.push({
                    x: parseFloat(numbers[i]),
                    y: parseFloat(numbers[i + 1])
                });
            }
        }
        
        const result = { points, isClosed };
        
        // Кэшируем только для часто используемых путей
        if (d.length < 1000) {
            this.pathCache.set(d, result);
        }
        
        return result;
    } catch (error) {
        console.error('Ошибка парсинга пути:', error, d);
        return { points: [], isClosed: false };
    }
}

// Преобразование точек в путь
pointsToPath(points, wasOriginallyClosed = false) {
    if (points.length === 0) return '';
    
    let pathData = `M ${points[0].x} ${points[0].y}`;
    
    for (let i = 1; i < points.length; i++) {
        pathData += ` L ${points[i].x} ${points[i].y}`;
    }
    
    // Закрываем путь ТОЛЬКО если он изначально был закрыт
    if (wasOriginallyClosed && points.length > 2) {
        pathData += ' Z';
    }
    
    return pathData;
}

insertPointIntoPath(path, afterIndex, x, y) {
    const d = path.getAttribute('d');
    if (!d) return -1;
    
    const { points, isClosed } = this.parsePathToPoints(d);
    
    // Проверяем что точка не существует уже
    const tolerance = 0.1;
    const exists = points.some(p => 
        Math.abs(p.x - x) < tolerance && Math.abs(p.y - y) < tolerance
    );
    
    if (exists) return -1;
    
    if (afterIndex >= 0 && afterIndex < points.length) {
        // Вставляем точку
        points.splice(afterIndex + 1, 0, {x: x, y: y});
        
        // Перестраиваем путь
        const newPath = this.pointsToPath(points, isClosed);
        path.setAttribute('d', newPath);
        
        return afterIndex + 1;
    }
    
    return -1;
}

// Функция расстояния до отрезка
distanceToSegment(px, py, x1, y1, x2, y2) {
    const A = px - x1;
    const B = py - y1;
    const C = x2 - x1;
    const D = y2 - y1;

    const dot = A * C + B * D;
    const lenSq = C * C + D * D;
    let param = -1;
    
    if (lenSq !== 0) param = dot / lenSq;

    let xx, yy;

    if (param < 0) {
        xx = x1;
        yy = y1;
    } else if (param > 1) {
        xx = x2;
        yy = y2;
    } else {
        xx = x1 + param * C;
        yy = y1 + param * D;
    }

    const dx = px - xx;
    const dy = py - yy;
    
    return Math.sqrt(dx * dx + dy * dy);
}

// Вспомогательные методы
findVectorByControlPoint(controlType, belongsToPointIndex) {
    // Находим ВСЕ векторы, где контрольная точка принадлежит указанной точке
    const results = [];
    
    for (let i = 0; i < this.state.bezierVectors.length; i++) {
        const vector = this.state.bezierVectors[i];
        
        // Проверяем ВСЕ связи:
        
        // 1. Если контрольная точка 1 принадлежит указанной точке
        if (controlType === 'control1' && vector.control1.belongsTo === belongsToPointIndex) {
            results.push({ vector, index: i, type: 'control1' });
        }
        
        // 2. Если контрольная точка 2 принадлежит указанной точке
        if (controlType === 'control2' && vector.control2.belongsTo === belongsToPointIndex) {
            results.push({ vector, index: i, type: 'control2' });
        }
        
        // 3. Также проверяем обратные связи
        // (точка может быть концом вектора и иметь control2, который технически connectedTo другую точку)
        if (controlType === 'control2' && vector.to === belongsToPointIndex) {
            results.push({ vector, index: i, type: 'control2' });
        }
        
        if (controlType === 'control1' && vector.from === belongsToPointIndex) {
            results.push({ vector, index: i, type: 'control1' });
        }
    }
    
    // Возвращаем первый найденный результат
    return results.length > 0 ? results[0] : null;
}

schedulePendingBezierConvert() {
    // Сбрасываем предыдущий таймер
    if (this._pendingConvertTimer) {
        clearTimeout(this._pendingConvertTimer);
    }
    
    // Ставим новый на 2.5 секунды
    this._pendingConvertTimer = setTimeout(() => {
        this.commitPendingBezierConvert();
    }, 2500);
}
orderVectorsIntoChains(vectors) {
    // Строим map: pointIndex → список исходящих/входящих векторов
    const outgoing = new Map();  // from → [vector]
    const incoming = new Map();  // to → [vector]
    
    for (const v of vectors) {
        if (!outgoing.has(v.from)) outgoing.set(v.from, []);
        outgoing.get(v.from).push(v);
        if (!incoming.has(v.to)) incoming.set(v.to, []);
        incoming.get(v.to).push(v);
    }
    
    const used = new Set();
    const chains = [];
    
    // Ищем «начала» — точки, у которых нет входящего вектора
    const startPoints = [];
    const pointSet = new Set();
    for (const v of vectors) {
        pointSet.add(v.from);
        pointSet.add(v.to);
    }
    for (const pt of pointSet) {
        const inCount = (incoming.get(pt) || []).length;
        if (inCount === 0) startPoints.push(pt);
    }
    
    // Если есть замкнутый контур (нет начал) — начнём с любой точки
    if (startPoints.length === 0 && vectors.length > 0) {
        startPoints.push(vectors[0].from);
    }
    
    // Строим цепочки
    for (const start of startPoints) {
        let currentPoint = start;
        const chain = [];
        
        while (true) {
            const outList = (outgoing.get(currentPoint) || []).filter(v => !used.has(v));
            if (outList.length === 0) break;
            
            const next = outList[0];
            used.add(next);
            chain.push(next);
            currentPoint = next.to;
        }
        
        if (chain.length > 0) chains.push(chain);
    }
    
    // Если остались неиспользованные (замкнутые контуры) — обходим их
    for (const v of vectors) {
        if (used.has(v)) continue;
        
        let currentPoint = v.from;
        const chain = [];
        
        while (true) {
            const outList = (outgoing.get(currentPoint) || []).filter(vv => !used.has(vv));
            if (outList.length === 0) break;
            
            const next = outList[0];
            used.add(next);
            chain.push(next);
            currentPoint = next.to;
        }
        
        if (chain.length > 0) chains.push(chain);
    }
    
    return chains;
}

// Принудительно конвертировать (вызывается при смене инструмента, клике и т.д.)
commitPendingBezierConvert() {
    if (this._pendingConvertTimer) {
        clearTimeout(this._pendingConvertTimer);
        this._pendingConvertTimer = null;
    }
    
    if (!this._pendingBezierConvert) return;
    
    const task = this._pendingBezierConvert;
    this._pendingBezierConvert = null;
    
    const { tempPath, vectors } = task;
    
    if (!tempPath || !tempPath.parentNode) return;  // уже удалён
    
    // 1. Удаляем оригинальные векторы из state и DOM
    for (const v of vectors) {
        if (v.path && v.path.parentNode) v.path.remove();
        const ge = v.guideElements || {};
        if (ge.line1) ge.line1.remove();
        if (ge.control1) ge.control1.remove();
        if (ge.line2) ge.line2.remove();
        if (ge.control2) ge.control2.remove();
        
        const idx = this.state.bezierVectors.indexOf(v);
        if (idx !== -1) this.state.bezierVectors.splice(idx, 1);
    }
    
    // 2. Убираем неиспользуемые точки
    const pointsToRemove = new Set();
    for (const v of vectors) {
        pointsToRemove.add(v.from);
        pointsToRemove.add(v.to);
    }
    
    const stillUsed = new Set();
    for (const v of this.state.bezierVectors) {
        stillUsed.add(v.from);
        stillUsed.add(v.to);
    }
    
    const toDelete = [...pointsToRemove].filter(i => !stillUsed.has(i)).sort((a, b) => b - a);
    for (const idx of toDelete) {
        const p = this.state.bezierPoints[idx];
        if (p && p.element && p.element.parentNode) p.element.remove();
        this.state.bezierPoints.splice(idx, 1);
    }
    
    // 3. Обновляем индексы
    this.state.bezierPoints.forEach((p, i) => {
        p.index = i;
        if (p.element) p.element.setAttribute('data-index', i);
    });
    for (const v of this.state.bezierVectors) {
        let fromShift = 0, toShift = 0;
        for (const del of toDelete) {
            if (v.from > del) fromShift++;
            if (v.to > del) toShift++;
        }
        v.from -= fromShift;
        v.to -= toShift;
    }
    
    // 4. Конвертируем tempPath в безье
    this.selectedElement = tempPath;
    this._convertPathElementToBezier(tempPath);
    
    this.saveSnapshot();
}

// Внутренний метод — конвертация path (без проверки selectedElement)
_convertPathElementToBezier(pathElement) {
    if (!pathElement || pathElement.tagName.toLowerCase() !== 'path') return false;
    
    const d = pathElement.getAttribute('d');
    if (!d) return false;
    
    // Сохраняем стиль
    const strokeColor = pathElement.getAttribute('stroke') || this.state.strokeColor;
    const strokeWidth = pathElement.getAttribute('stroke-width') || this.state.strokeWidth;
    const linecap = pathElement.getAttribute('stroke-linecap') || 'round';
    const linejoin = pathElement.getAttribute('stroke-linejoin') || 'round';
    
    // Парсим полилинию
    const segments = this.parsePathToSegments(d);
    if (segments.length === 0) return false;
    
    // Удаляем оригинал
    if (pathElement.parentNode) pathElement.parentNode.removeChild(pathElement);
    
    const newPoints = [];
    const newVectors = [];
    const originalTag = 'path';
    
    for (const segment of segments) {
        if (segment.points.length < 2) continue;
        
        const simplified = this.simplifyPolylineRDP(segment.points, 2.5);
        const isClosedShape = segment.isClosed && simplified.length > 2;
        const totalVectors = isClosedShape ? simplified.length : simplified.length - 1;
        
        if (totalVectors === 0) continue;
        
        // Определяем allSharp (ваша логика)
        let allSharp;
        
        let totalLen = 0;
        for (let i = 1; i < segment.points.length; i++) {
            totalLen += Math.hypot(
                segment.points[i].x - segment.points[i-1].x,
                segment.points[i].y - segment.points[i-1].y
            );
        }
        const avgSegLen = segment.points.length > 1 
            ? totalLen / (segment.points.length - 1) 
            : 0;
        const isPenLike = (avgSegLen < 6 && segment.points.length > 15);
        
        if (originalTag === 'circle' || originalTag === 'ellipse') {
            allSharp = false;
        } else if (originalTag === 'rect' || originalTag === 'line' || originalTag === 'polygon') {
            allSharp = true;
        } else if (simplified.length <= 3) {
            allSharp = true;
        } else if (isPenLike) {
            allSharp = false;
        } else {
            const result = this.evaluateConversion(
                segment.points,
                isClosedShape,
                simplified,
                originalTag
            );
            allSharp = (result === 'sharp');
        }
        
        // Создаём точки
        const segmentPoints = [];
        for (const p of simplified) {
            const newPoint = {
                x: p.x,
                y: p.y,
                element: null,
                index: this.state.bezierPoints.length + newPoints.length
            };
            newPoint.element = this.createBezierPointElement(newPoint);
            this.svg.appendChild(newPoint.element);
            newPoints.push(newPoint);
            segmentPoints.push(newPoint);
        }
        
        const sharp = new Array(simplified.length).fill(allSharp);
        
        // Создаём векторы
        for (let i = 0; i < totalVectors; i++) {
            const fromIdx = i;
            const toIdx = (i + 1) % simplified.length;
            const fromPoint = segmentPoints[fromIdx];
            const toPoint = segmentPoints[toIdx];
            
            const prevIdx = (i - 1 + simplified.length) % simplified.length;
            const nextIdx = (i + 2) % simplified.length;
            
            const prev = isClosedShape || i > 0 ? segmentPoints[prevIdx] : null;
            const next = isClosedShape || i < totalVectors - 1 ? segmentPoints[nextIdx] : null;
            
            let c1, c2;
            if (sharp[fromIdx]) {
                c1 = { x: fromPoint.x, y: fromPoint.y };
            } else {
                c1 = this.calculateSmoothControl(fromPoint, toPoint, prev);
            }
            if (sharp[toIdx]) {
                c2 = { x: toPoint.x, y: toPoint.y };
            } else {
                c2 = this.calculateSmoothControl(toPoint, fromPoint, next);
            }
            
            const vector = {
                from: fromPoint.index,
                to: toPoint.index,
                control1: { x: c1.x, y: c1.y, belongsTo: fromPoint.index },
                control2: { x: c2.x, y: c2.y, belongsTo: toPoint.index },
                path: null,
                guideElements: {}
            };
            
            vector.path = this.createBezierPath(
                fromPoint.x, fromPoint.y,
                vector.control1.x, vector.control1.y,
                vector.control2.x, vector.control2.y,
                toPoint.x, toPoint.y
            );
            vector.path.setAttribute('stroke', strokeColor);
            vector.path.setAttribute('stroke-width', strokeWidth);
            vector.path.setAttribute('stroke-linecap', linecap);
            vector.path.setAttribute('stroke-linejoin', linejoin);
            
            this.svg.appendChild(vector.path);
            newVectors.push(vector);
        }
    }
    
    // Регистрируем
    for (const p of newPoints) this.state.bezierPoints.push(p);
    for (const v of newVectors) this.state.bezierVectors.push(v);
    
// Направляющие
for (const v of newVectors) {
    const fromPoint = this.state.bezierPoints[v.from];
    const toPoint = this.state.bezierPoints[v.to];
    if (fromPoint && toPoint) {
        this.createVectorGuides(v, fromPoint, toPoint);
    }
}

// Скрываем guide-элементы (мы не в режиме bezier-points)
for (const v of newVectors) {
    const ge = v.guideElements || {};
    if (ge.line1) ge.line1.style.display = 'none';
    if (ge.control1) ge.control1.style.display = 'none';
    if (ge.line2) ge.line2.style.display = 'none';
    if (ge.control2) ge.control2.style.display = 'none';
}

// Скрываем точки (они нужны только в режиме bezier-points)
this.toggleBezierPoints(false);

    return true;
}

// Захватывает все точки элемента (для path/line/rect/circle/ellipse)
captureElementPoints(element) {
    const tag = element.tagName.toLowerCase();
    const points = [];
    
    if (tag === 'path') {
        const d = element.getAttribute('d');
        const parsed = this.parsePathToPoints(d);
        for (const p of parsed.points) {
            points.push({ x: p.x, y: p.y });
        }
    } else if (tag === 'line') {
        points.push({ x: parseFloat(element.getAttribute('x1')) || 0, y: parseFloat(element.getAttribute('y1')) || 0 });
        points.push({ x: parseFloat(element.getAttribute('x2')) || 0, y: parseFloat(element.getAttribute('y2')) || 0 });
    } else if (tag === 'rect') {
        const x = parseFloat(element.getAttribute('x')) || 0;
        const y = parseFloat(element.getAttribute('y')) || 0;
        const w = parseFloat(element.getAttribute('width')) || 0;
        const h = parseFloat(element.getAttribute('height')) || 0;
        points.push({ x, y }, { x: x + w, y }, { x: x + w, y: y + h }, { x, y: y + h });
    } else if (tag === 'circle' || tag === 'ellipse') {
        const cx = parseFloat(element.getAttribute('cx')) || 0;
        const cy = parseFloat(element.getAttribute('cy')) || 0;
        points.push({ x: cx, y: cy });  // только центр
    }
    
    return points;
}

applyPushToBezier(mouseX, mouseY) {
    const vector = this._pushTargetVector;
    if (!vector) return;
    
    // Сохраняем оригинальные данные при первом движении
    if (!this._pushOriginalBezierData) {
        const fromPoint = this.state.bezierPoints[vector.from];
        const toPoint = this.state.bezierPoints[vector.to];
        
        this._pushOriginalBezierData = {
            from: fromPoint ? { x: fromPoint.x, y: fromPoint.y } : null,
            to: toPoint ? { x: toPoint.x, y: toPoint.y } : null,
            c1: { x: vector.control1.x, y: vector.control1.y },
            c2: { x: vector.control2.x, y: vector.control2.y },
            // Дополнительно — все точки вектора, включая связанные
            allPointsOriginal: null
        };
    }
    
    const startX = this._pushStartX;
    const startY = this._pushStartY;
    const radius = this._pushRadius;
    const strength = this.state.pushStrength;
    
    const dx = mouseX - startX;
    const dy = mouseY - startY;
    
    const fromPoint = this.state.bezierPoints[vector.from];
    const toPoint = this.state.bezierPoints[vector.to];
    const orig = this._pushOriginalBezierData;
    
    // Функция сдвига точки
    const shiftPoint = (px, py, ox, oy) => {
        const dist = Math.hypot(ox - startX, oy - startY);
        if (dist > radius) return { x: ox, y: oy };
        const force = 1 - (dist / radius);
        const factor = force * strength;
        return { x: ox + dx * factor, y: oy + dy * factor };
    };
    
    // Двигаем точку from
    if (fromPoint && orig.from) {
        const p = shiftPoint(fromPoint.x, fromPoint.y, orig.from.x, orig.from.y);
        fromPoint.x = p.x;
        fromPoint.y = p.y;
        if (fromPoint.element) {
            fromPoint.element.setAttribute('cx', p.x);
            fromPoint.element.setAttribute('cy', p.y);
        }
    }
    
    // Двигаем точку to
    if (toPoint && orig.to) {
        const p = shiftPoint(toPoint.x, toPoint.y, orig.to.x, orig.to.y);
        toPoint.x = p.x;
        toPoint.y = p.y;
        if (toPoint.element) {
            toPoint.element.setAttribute('cx', p.x);
            toPoint.element.setAttribute('cy', p.y);
        }
    }
    
    // Двигаем control1
    if (orig.c1) {
        const p = shiftPoint(vector.control1.x, vector.control1.y, orig.c1.x, orig.c1.y);
        vector.control1.x = p.x;
        vector.control1.y = p.y;
    }
    
    // Двигаем control2
    if (orig.c2) {
        const p = shiftPoint(vector.control2.x, vector.control2.y, orig.c2.x, orig.c2.y);
        vector.control2.x = p.x;
        vector.control2.y = p.y;
    }
    
    // Обновляем path
    this.updateBezierVectorPath(vector);
    this.updateVectorGuides(vector);
}

highlightBezierPushTarget(vector) {

    if (!vector || !vector.path) return;
    
    const clone = vector.path.cloneNode(true);
