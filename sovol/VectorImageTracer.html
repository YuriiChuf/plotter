// Применяет сдвиг к точкам элемента по позиции курсора
applyPush(element, mouseX, mouseY) {
    // === ЕСЛИ ЭТО БЕЗЬЕ-ВЕКТОР ===
    if (this._pushTargetVector) {
        this.applyPushToBezier(mouseX, mouseY);
        return;
    }
    
    // === ОБЫЧНЫЙ ПУТЬ ===
    if (!this._pushOriginalPoints) return;
    
    const startX = this._pushStartX;
    const startY = this._pushStartY;
    const radius = this._pushRadius;
    const strength = this.state.pushStrength;
    
    const dx = mouseX - startX;
    const dy = mouseY - startY;
    
    const tag = element.tagName.toLowerCase();
    
    if (tag === 'path') {
        const d = element.getAttribute('d');
        const parsed = this.parsePathToPoints(d);
        const newPoints = parsed.points.map((p, i) => {
            const orig = this._pushOriginalPoints[i];
            if (!orig) return p;
            
            const dist = Math.hypot(orig.x - startX, orig.y - startY);
            if (dist > radius) return orig;
            
            const force = 1 - (dist / radius);
            const factor = force * strength;
            
            return {
                x: orig.x + dx * factor,
                y: orig.y + dy * factor
            };
        });
        
        const newD = this.pointsToPath(newPoints, parsed.isClosed);
        element.setAttribute('d', newD);
    }
    else if (tag === 'line') {
        const x1o = this._pushOriginalPoints[0];
        const y1o = this._pushOriginalPoints[1];
        const x2o = this._pushOriginalPoints[2];
        const y2o = this._pushOriginalPoints[3];
        
        const calc = (ox, oy) => {
            const dist = Math.hypot(ox - startX, oy - startY);
            if (dist > radius) return { x: ox, y: oy };
            const force = 1 - (dist / radius);
            const factor = force * strength;
            return { x: ox + dx * factor, y: oy + dy * factor };
        };
        
        const p1 = calc(x1o, y1o);
        const p2 = calc(x2o, y2o);
        
        element.setAttribute('x1', p1.x);
        element.setAttribute('y1', p1.y);
        element.setAttribute('x2', p2.x);
        element.setAttribute('y2', p2.y);
    }
    else if (tag === 'rect') {
        // Двигаем весь прямоугольник пропорционально
        const cx = this._pushOriginalPoints[0].x + 
                   (this._pushOriginalPoints[2].x - this._pushOriginalPoints[0].x) / 2;
        const cy = this._pushOriginalPoints[0].y + 
                   (this._pushOriginalPoints[2].y - this._pushOriginalPoints[0].y) / 2;
        
        const dist = Math.hypot(cx - startX, cy - startY);
        if (dist <= radius) {
            const force = 1 - (dist / radius);
            const factor = force * strength;
            
            const x = parseFloat(element.getAttribute('x')) || 0;
            const y = parseFloat(element.getAttribute('y')) || 0;
            element.setAttribute('x', x + dx * factor);
            element.setAttribute('y', y + dy * factor);
        }
    }
    else if (tag === 'circle' || tag === 'ellipse') {
        const cx = parseFloat(element.getAttribute('cx')) || 0;
        const cy = parseFloat(element.getAttribute('cy')) || 0;
        const origCx = this._pushOriginalPoints[0].x;
        const origCy = this._pushOriginalPoints[0].y;
        
        const dist = Math.hypot(origCx - startX, origCy - startY);
        if (dist <= radius) {
            const force = 1 - (dist / radius);
            const factor = force * strength;
            
            element.setAttribute('cx', origCx + dx * factor);
            element.setAttribute('cy', origCy + dy * factor);
        }
    }
}

densifyPathForPush(pathElement, maxSegmentLength = 4) {
    if (!pathElement || pathElement.tagName.toLowerCase() !== 'path') return;
    
    const d = pathElement.getAttribute('d');
    if (!d) return;
    
    // Парсим как полилинию (безье сюда не попадает — там отдельная логика)
    const parsed = this.parsePathToPoints(d);
    if (!parsed.points || parsed.points.length < 2) return;
    
    const newPoints = [];
    const pts = parsed.points;
    const isClosed = parsed.isClosed;
    
    const limit = isClosed ? pts.length : pts.length - 1;
    
    for (let i = 0; i < limit; i++) {
        const a = pts[i];
        const b = pts[(i + 1) % pts.length];
        
        newPoints.push(a);
        
        const dist = Math.hypot(b.x - a.x, b.y - a.y);
        if (dist > maxSegmentLength) {
            const steps = Math.ceil(dist / maxSegmentLength);
            for (let s = 1; s < steps; s++) {
                const t = s / steps;
                newPoints.push({
                    x: a.x + (b.x - a.x) * t,
                    y: a.y + (b.y - a.y) * t
                });
            }
        }
    }
    
    if (!isClosed) {
        newPoints.push(pts[pts.length - 1]);
    }
    
    // Собираем обратно в d
    let newD = `M ${newPoints[0].x.toFixed(3)} ${newPoints[0].y.toFixed(3)}`;
    for (let i = 1; i < newPoints.length; i++) {
        newD += ` L ${newPoints[i].x.toFixed(3)} ${newPoints[i].y.toFixed(3)}`;
    }
    if (isClosed) newD += ' Z';
    
    pathElement.setAttribute('d', newD);
}

// МЫШЬ            
onMouseDown(e) {

            this.fillShapeWithSnake(target);

    }

        if (foundElement.classList?.contains('bezier-vector')) {
            const contourElement = this.getFullBezierContour(foundElement);
            if (contourElement) {
                this.fillShapeWithSnake(contourElement);
            } else {
                this.fillShapeWithSnake(foundElement);

}

    if (target.id === 'photo-overlay' && this.state.currentTool === 'select') {

    // Режим Безье точек

        } else {
            // Нет выделенной точки — просто создаём новую точку
            this.createSingleBezierPoint(coords.x, coords.y);
        }

    if (target.classList && target.classList.contains('bezier-vector')) {

        return;

    return;
}

if (this.state.currentTool === 'select') {
    e.preventDefault();
    
    const targetClass = target.getAttribute('class') || '';
    const isBezierVector = targetClass.includes('bezier-vector');
    const isBezierPoint = targetClass.includes('bezier-point');
    const isBezierControl = targetClass.includes('bezier-control-point');
    const isBezierGuide = targetClass.includes('bezier-guide-line');
    
    const isHandle = target.parentElement?.id === 'selection-handles';
    if (isHandle) return;
    
    if (isBezierPoint || isBezierControl || isBezierGuide) return;
    
    const tag = target.tagName?.toLowerCase();
    const isVectorElement = tag === 'path' || tag === 'line' || tag === 'rect' || tag === 'circle' || tag === 'ellipse';

// Клик по фейковому path безье-контура (уже выделен) — просто перетаскиваем
if (target.dataset && target.dataset.isBezierContour === 'true') {
    this.startElementDrag(e, target);
    return;
}
    // === БЕЗЬЕ-ВЕКТОР: выделяем и перетаскиваем весь контур ===
	if (isBezierVector) {
		this.selectBezierContour(target);
		this.startBezierContourDrag(e, target);
		return;
	}
    
    // === ОБЫЧНЫЙ ВЕКТОР: выделяем и перетаскиваем ===
    if (isVectorElement && target !== this.worksheetLayer) {
        if (this.selectedElement && this.selectedElement !== target) {
            this.clearSelection();
            this.selectionAngle = 0;
        }
        this.selectElement(target);
        this.startElementDrag(e, target);
        return;
    }
    
    // Пустое место
    this.clearSelection();
    this.startPanning(e);
    return;
}

    
if (this.state.currentTool === 'push') {
    e.preventDefault();
    
    const coords = this.getSVGCoordinates(e);
    const radius = this.state.pushRadius / this.getScreenScale();
    
    // === ПРОДОЛЖЕНИЕ СУЩЕСТВУЮЩЕГО TEMPATH ===
const existingTemp = document.getElementById('bezier-convert-temp');

if (existingTemp && this._pendingBezierConvert) {
    console.log('Продолжаем работу с существующим tempPath');
    
    // Отменяем отложенную конвертацию
    if (this._pendingConvertTimer) {
        clearTimeout(this._pendingConvertTimer);
        this._pendingConvertTimer = null;
    }
    
    // Восстанавливаем контекст
    this._pushBezierContext = this._pendingBezierConvert.context || null;
    this._pendingBezierConvert = null;
    
    this._pushTargetVector = null;
    this._pushTarget = existingTemp;
    this._pushOriginalPoints = this.captureElementPoints(existingTemp);
    this._pushRadius = radius;
    this._pushStartX = coords.x;
    this._pushStartY = coords.y;
    this.state.isDrawing = true;
    this.showPushIndicator(coords.x, coords.y, radius);
    return;
}
    
    
    // Собираем ВСЕ элементы, включая безье
    const allElements = Array.from(this.svg.querySelectorAll('path, line, rect, circle, ellipse'))
        .filter(el => {
            if (!el.parentNode) return false;
            const id = el.id || '';
            const cls = el.getAttribute('class') || '';
            if (id.includes('background')) return false;
            if (id.includes('indicator')) return false;
            if (id.includes('eraser')) return false;
            if (id.includes('push')) return false;
            if (id.includes('selection-handles')) return false;
            if (id.includes('push-target-highlight')) return false;
            if (cls.includes('bezier-guide-line') || 
                cls.includes('bezier-control-point') || 
                cls.includes('bezier-point')) return false;
            return true;
        });
    
    // Ищем ближайший элемент — и по bbox, и по реальной близости
    let closest = null;
    let closestVector = null;   // если это безье-вектор
    let minDist = Infinity;
    
    for (const el of allElements) {
        // Проверяем, является ли это безье-вектором
        const isBezier = el.classList && el.classList.contains('bezier-vector');
        let vector = null;
        if (isBezier) {
            vector = this.state.bezierVectors.find(v => v.path === el);
        }
        
        // Считаем расстояние до точек (не до bbox центра)
        let d = Infinity;
        
        if (isBezier && vector) {
            // Для безье — расстояние до ближайшей точки вектора
            const fromP = this.state.bezierPoints[vector.from];
            const toP = this.state.bezierPoints[vector.to];
            if (fromP) d = Math.min(d, Math.hypot(coords.x - fromP.x, coords.y - fromP.y));
            if (toP) d = Math.min(d, Math.hypot(coords.x - toP.x, coords.y - toP.y));
            
            // Также — до контрольных точек
            d = Math.min(d, Math.hypot(coords.x - vector.control1.x, coords.y - vector.control1.y));
            d = Math.min(d, Math.hypot(coords.x - vector.control2.x, coords.y - vector.control2.y));
        } else {
            // Для обычных — через bbox
            try {
                const bb = el.getBBox();
                const cx = bb.x + bb.width / 2;
                const cy = bb.y + bb.height / 2;
                d = Math.hypot(coords.x - cx, coords.y - cy);
            } catch(e) { continue; }
        }
        
        if (d < minDist) {
            minDist = d;
            closest = el;
            closestVector = vector;
        }
    }
    
    if (!closest) return;
    
    // Если это безье — сохраняем объект вектора
if (closestVector) {
    // 1. Собираем весь контур
    const allVectors = this.findAllConnectedBezierVectors(closestVector);
    
    // 2. Сэмплируем каждый вектор в полилинию
	const chains = this.orderVectorsIntoChains(allVectors);
	let combinedD = '';
	const allSampledPoints = [];
const MAX_SEGMENT_LENGTH = 4;   // макс. длина между сэмплами (в единицах viewBox)

for (const chain of chains) {
    let firstInChain = true;
    
    for (const v of chain) {
        const fromP = this.state.bezierPoints[v.from];
        const toP = this.state.bezierPoints[v.to];
        if (!fromP || !toP) continue;
        
        // Оцениваем примерную длину вектора через контрольные точки
        const approxLength = 
            Math.hypot(v.control1.x - fromP.x, v.control1.y - fromP.y) +
            Math.hypot(v.control2.x - v.control1.x, v.control2.y - v.control1.y) +
            Math.hypot(toP.x - v.control2.x, toP.y - v.control2.y);
        
        // Число сэмплов — пропорционально длине
        const numSamples = Math.max(20, Math.ceil(approxLength / MAX_SEGMENT_LENGTH));
        
        const samples = [];
        for (let i = 0; i <= numSamples; i++) {
            const t = i / numSamples;
            const p = this.evaluateCubicBezier(
                fromP.x, fromP.y,
                v.control1.x, v.control1.y,
                v.control2.x, v.control2.y,
                toP.x, toP.y,
                t
            );
            samples.push(p);
        }
        
        if (firstInChain) {
            combinedD += `M ${samples[0].x} ${samples[0].y}`;
            firstInChain = false;
            allSampledPoints.push(samples[0]);
        }
        
        for (let i = 1; i < samples.length; i++) {
            combinedD += ` L ${samples[i].x} ${samples[i].y}`;
            allSampledPoints.push(samples[i]);
        }
    }
    
    combinedD += ' ';
}
  
    // 3. Создаём один path-полилинию
    const style = allVectors[0].path;
    const stroke = style.getAttribute('stroke') || this.state.strokeColor;
    const strokeWidth = style.getAttribute('stroke-width') || this.state.strokeWidth;
    const linecap = style.getAttribute('stroke-linecap') || 'round';
    const linejoin = style.getAttribute('stroke-linejoin') || 'round';
    
    const polylinePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    polylinePath.setAttribute('d', combinedD.trim());
    polylinePath.setAttribute('stroke', stroke);
    polylinePath.setAttribute('stroke-width', strokeWidth);
    polylinePath.setAttribute('stroke-linecap', linecap);
    polylinePath.setAttribute('stroke-linejoin', linejoin);
    polylinePath.setAttribute('fill', 'none');
    polylinePath.id = 'bezier-convert-temp';
    
    this.svg.appendChild(polylinePath);
    
    // 4. Скрываем оригинальные безье-элементы
    for (const v of allVectors) {
        if (v.path) v.path.style.display = 'none';
        const ge = v.guideElements || {};
        if (ge.line1) ge.line1.style.display = 'none';
        if (ge.control1) ge.control1.style.display = 'none';
        if (ge.line2) ge.line2.style.display = 'none';
        if (ge.control2) ge.control2.style.display = 'none';
    }

    // 5. Сохраняем контекст
    this._pushTargetVector = null; 
    this._pushTarget = polylinePath;
    this._pushBezierContext = {
        vectors: allVectors,
        tempPath: polylinePath,
        originalPoints: allSampledPoints,   // опционально
        selectedPointIndex: null
    };
    this._pushOriginalPoints = this.captureElementPoints(polylinePath);
    this._pushOriginalBezierData = null;
    
    // Подсветка — сам temp path
    this.highlightPushTarget(polylinePath);
    
    this._pushRadius = radius;
    this._pushStartX = coords.x;
    this._pushStartY = coords.y;
    
    this.state.isDrawing = true;
    this.showPushIndicator(coords.x, coords.y, radius);
    return;
} else {
    // Обычный путь
    this._pushTargetVector = null;
	this._pushTarget = closest;

	// Уплотняем path (разбиваем длинные сегменты)
	const tag = closest.tagName.toLowerCase();
	if (tag === 'path') {
		this.densifyPathForPush(closest);
	} else {
		const converted = this.convertToPath(closest);
		if (converted) {
			this._pushTarget = converted;
			this.densifyPathForPush(converted);
		}
	}

	this._pushOriginalPoints = this.captureElementPoints(this._pushTarget);
    
    // ЗАХВАТ ТОЧЕК СРАЗУ
    this._pushOriginalPoints = this.captureElementPoints(this._pushTarget);
}
    
    this._pushRadius = radius;
    this._pushStartX = coords.x;
    this._pushStartY = coords.y;
    this._pushOriginalBezierData = null;
    
    this.state.isDrawing = true;
    this.showPushIndicator(coords.x, coords.y, radius);
    return;
}


// Инструмент ластик 
if (this.state.currentTool === 'eraser') {
    e.preventDefault();
    
    const coords = this.getSVGCoordinates(e);
    this.state.isDrawing = true;
    this._eraserDeleteMode = e.ctrlKey || e.metaKey;
    this.startEraserStroke(coords.x, coords.y);
    return;
}
	
    this.state.isDrawing = true;
    
    // ДЛЯ КАРАНДАША: 
if (this.state.currentTool === 'pen') {
    // Если ВЫКЛЮЧЕНО продолжение вектора - начинаем новый путь
    if (!this.snapSettings.continueVector) {
        this.state.currentElement = null;
    }
    
    // Если есть currentElement и продолжение ВКЛЮЧЕНО
        if (this.snapSettings.continueVector && this.state.currentElement) {
            // Получаем последнюю точку текущего пути
            const d = this.state.currentElement.getAttribute('d');
            if (d) {
                const points = d.match(/[\d.-]+/g);
                if (points && points.length >= 2) {
                    // Берем последние координаты
                    const lastX = parseFloat(points[points.length - 2]);
                    const lastY = parseFloat(points[points.length - 1]);
                    
                    // Устанавливаем стартовую точку как последнюю точку пути
                    this.state.startPoint = {x: lastX, y: lastY};
                    
                    // Начинаем рисовать с этой точки
                    this.state.penPoints = [{x: lastX, y: lastY}];
                    return;
                }
            }
        }
    
    // НОВЫЙ КОД: Найти последний путь карандаша и его реальную последнюю точку
    if (this.snapSettings.continueVector) {
        // Ищем все пути карандаша (обычно это пути без fill)
        const allPaths = Array.from(this.svg.querySelectorAll('path'))
            .filter(path => {
                const fill = path.getAttribute('fill');
                const stroke = path.getAttribute('stroke');
                // Это путь карандаша если: нет fill или fill='none', и есть stroke
                return (!fill || fill === 'none') && stroke && 
                       !path.id?.includes('indicator') && 
                       !path.id?.includes('background');
            });
        
        if (allPaths.length > 0) {
            // Берем последний добавленный путь (предположительно последний нарисованный)
            const lastPath = allPaths[allPaths.length - 1];
            
            // Получаем его точки
            const d = lastPath.getAttribute('d');
            if (d) {
                // Парсим путь чтобы найти последнюю точку
                const { points } = this.parsePathToPoints(d);
                
                if (points.length > 0) {
                    // Берем ПОСЛЕДНЮЮ точку пути
                    const lastPoint = points[points.length - 1];
                    
                    // Начинаем с этой точки
                    this.state.currentElement = lastPath;
                    this.state.startPoint = {x: lastPoint.x, y: lastPoint.y};
                    this.state.penPoints = [{x: lastPoint.x, y: lastPoint.y}];
                    return;
                }
            }
        }
    }
    
    // Если ничего не нашли - начинаем новый путь
    this.state.startPoint = {x: coords.x, y: coords.y};
    this.startPen(coords.x, coords.y);
    return;
}
    // НАЧИНАЕМ НОВЫЙ ПУТЬ (если не продолжили существующий)
    this.state.startPoint = {x: coords.x, y: coords.y};
    
    switch(this.state.currentTool) {
        case 'pen':
            this.startPen(coords.x, coords.y);
            break;
        case 'line':
            this.startLine(coords.x, coords.y);
            break;
        case 'rect':
            this.startRect(coords.x, coords.y);
            break;
        case 'circle':
            this.startCircle(coords.x, coords.y);
            break;
    }
}

onMouseMove(e) {
    this.updateCoordinates(e);
    const coords = this.getSVGCoordinates(e);
    this.state.lastMouseX = coords.x;
    this.state.lastMouseY = coords.y;
    if (this.state.isDraggingPhoto && this.state.draggingPhotoElement) {
        e.preventDefault();
        
        const dx = coords.x - this.state.photoDragStartX;
        const dy = coords.y - this.state.photoDragStartY;
        
        const newX = this.state.photoStartX + dx;
        const newY = this.state.photoStartY + dy;
        
        this.state.draggingPhotoElement.setAttribute('x', newX);
        this.state.draggingPhotoElement.setAttribute('y', newY);
        return;
    }
	
    if (this.state.isDraggingElement) {
        e.preventDefault();
        this.doElementDrag(e);
        return;
    }
    if (this.state.isMoving) {
        e.preventDefault();
        this.doPanning(e);
        return;
    }

if (this.isResizing) {
    e.preventDefault();
    this.doResize(e);
    return;
}

if (this.isRotating) {
    e.preventDefault();
    this.doRotate(e);
    return;
}

if (this.isDraggingPivot) {
    e.preventDefault();
    this.doPivotDrag(e);
    return;
}
    if (this.state.currentTool === 'bezier-points') {
        if (this.state.isDraggingPoint) {
            this.updatePointDrag(coords.x, coords.y);
            return;
        }
        
        if (this.state.isDraggingBezierControl) {
            this.updateBezierControlDrag(coords.x, coords.y);
            return;
        }
    }
    // Для инструмента пуш: обновляем индикатор при наведении
if (this.state.currentTool === 'push') {
    const radius = this.state.pushRadius / this.getScreenScale();
    
    if (!this.state.isDrawing) {
        this.showPushIndicator(coords.x, coords.y, radius);
		} else if (this._pushTarget || this._pushBezierContext) {
			if (this._pushTarget) {
				this.applyPush(this._pushTarget, coords.x, coords.y);
			} else if (this._pushBezierContext) {
				// Двигаем полилинию как обычный path
				this.applyPush(this._pushBezierContext.tempPath, coords.x, coords.y);
			}
			this.showPushIndicator(coords.x, coords.y, radius);
		}
}

	
    //Для инструмента ластик onMouseMove
if (this.state.currentTool === 'eraser') {
    this.svg.style.cursor = 'none';
    
    if (this.state.isDrawing && this._eraserMask) {
        this.continueEraserStroke(coords.x, coords.y);
    } else {
		const radius = (this.state.eraserSize / 2) / this.getScreenScale();
		this.showEraserIndicator(coords.x, coords.y, radius);
    }
    return;
}

    // Обновляем рисование (если рисуем)
    if (this.state.isDrawing) {
        switch(this.state.currentTool) {
        case 'pen':
            this.drawPen(coords.x, coords.y);
            break;
        case 'line':
            this.updateLine(coords.x, coords.y);
            break;
        case 'rect':
            this.updateRect(coords.x, coords.y);
            break;
        case 'circle':
            this.updateCircle(coords.x, coords.y);
            break;
        }
    }
}

onMouseUp() {
    
    if (this.isResizing || this.isRotating) {
		if (this.isResizing) {
			this.isResizing = false;
			this.resizeStart = null;
			this.updateSelectionHandles();
			this.saveSnapshot();
			return;
		}

		if (this.isRotating) {
			this.isRotating = false;
			this.rotateStart = null;
			this.updateSelectionHandles();
			this.saveSnapshot();
			return;
		}
    }
	
	if (this.isDraggingPivot) {
		this.stopPivotDrag();
	}
    // Завершаем перетаскивание фото
    if (this.state.isDraggingPhoto) {
        this.stopPhotoDrag();
    }
    
    // Завершаем перетаскивание вектора
    if (this.state.isDraggingElement) {
        this.stopElementDrag();
    }
    
    // Завершаем панорамирование
    if (this.state.isMoving) {
        this.stopPanning();
    }

    // Завершаем рисование ластиком
if (this.state.isDrawing && this.state.currentTool === 'eraser') {
    this.state.isDrawing = false;
    this.hideEraserIndicator();
    
    if (this._eraserMask) {
        this.finishEraserStroke(this._eraserDeleteMode);
        this._eraserDeleteMode = false;
    }
}
    
    // Завершаем рисование других инструментов
    if (this.state.isDrawing) {
        // Если рисуем карандашом
        if (this.state.currentTool === 'pen') {
            // Применяем привязку к НЕ-белым линиям
            if (this.state.image && this.snapSettings.enabled) {
                this.snapPathToNonWhiteLine(this.state.currentElement);
            }
            
            // Если ВЫКЛЮЧЕНО продолжение вектора - сбрасываем currentElement
            if (!this.snapSettings.continueVector) {
                this.state.currentElement = null;
            }
            
            // Сбрасываем флаги рисования
            this.state.isDrawing = false;
            this.state.penPoints = [];
            
        } else {
            // Для других инструментов - сбрасываем как обычно
            this.state.currentElement = null;
            this.state.isDrawing = false;
        }
        
        this.hidePushIndicator();
    }
    
    // Завершаем push
if (this.state.currentTool === 'push') {
    this.state.isDrawing = false;
    
    // Если мы деформировали безье — откладываем конвертацию
    if (this._pushBezierContext) {
        const ctx = this._pushBezierContext;
        this._pushBezierContext = null;
        
        // Запоминаем «отложенную» задачу
        this._pendingBezierConvert = {
            tempPath: ctx.tempPath,
            vectors: ctx.vectors,
			context: ctx,
            timestamp: Date.now()
        };
        
        // Скрываем guide-элементы
        for (const v of ctx.vectors) {
            const ge = v.guideElements || {};
            if (ge.line1) ge.line1.style.display = 'none';
            if (ge.control1) ge.control1.style.display = 'none';
            if (ge.line2) ge.line2.style.display = 'none';
            if (ge.control2) ge.control2.style.display = 'none';
        }
        
        // Установка таймера
        this.schedulePendingBezierConvert();
    }
    
    this._pushTarget = null;
    this._pushTargetVector = null;
    this._pushOriginalPoints = null;
    this._pushOriginalBezierData = null;
    this._pushStartX = null;
    this._pushStartY = null;
    this.hidePushIndicator();
    this.clearPushHighlight();
    this.saveSnapshot();
}
    
    // Скрываем индикатор ластика
    this.hideEraserIndicator();
    
    // Сохраняем состояние
    this.saveSnapshot();
}

onMouseLeave() {
	if (this.state.isDraggingElement) {
        this.stopElementDrag();
    }
	
    if (this.state.isMoving) {
        this.stopPanning();
    }
    
    if (this.state.isDrawing) {
        this.state.isDrawing = false;
        this.state.pushData = null;
        this.hidePushIndicator();
        this.hideEraserIndicator();
    }
    document.body.style.cursor = 'default';
}

startPhotoDrag(e, photoElement) {
    const coords = this.getSVGCoordinates(e);
    
    let currentX = parseFloat(photoElement.getAttribute('x'));
    let currentY = parseFloat(photoElement.getAttribute('y'));
    
    if (isNaN(currentX)) currentX = 0;
    if (isNaN(currentY)) currentY = 0;
    this.state.isDraggingPhoto = true;
    this.state.draggingPhotoElement = photoElement;
    this.state.photoDragStartX = coords.x;
    this.state.photoDragStartY = coords.y;
    this.state.photoStartX = currentX;
    this.state.photoStartY = currentY;
    
    this.svg.style.cursor = 'grabbing';
    
    photoElement.style.outline = '2px solid #ff6b6b';
    photoElement.style.outlineOffset = '2px';
    
    e.preventDefault();
    e.stopPropagation();
}

updatePathPointFast(path, pointIndex, newX, newY) {
    // Если это виртуальная точка (дробный индекс) - НЕ обновляем путь
    // Виртуальные точки существуют только для движения, но не сохраняются
    if (pointIndex % 1 !== 0) {
        return; // Виртуальная точка - не обновляем путь
    }
    
    const d = path.getAttribute('d');
    if (!d) return;
    
    const parts = d.split(/(?=[ML])/);
    let currentIdx = 0;
    
    for (let i = 0; i < parts.length; i++) {
        const part = parts[i];
        const coords = part.substring(1).trim().split(/\s+/);
        
        for (let j = 0; j < coords.length; j += 2) {
            if (currentIdx === Math.floor(pointIndex)) {
                coords[j] = newX;
                coords[j + 1] = newY;
                parts[i] = part.charAt(0) + ' ' + coords.join(' ');
                path.setAttribute('d', parts.join(''));
                return;
            }
            currentIdx++;
        }
    }
}

// Находит параметр t (0..1) на кубической безье, при котором точка кривой
// ближе всего к (x, y). Использует грубый сэмплинг + уточнение.
findClosestTOnBezier(fromPoint, control1, control2, toPoint, x, y) {
    const SAMPLES = 100;
    let bestT = 0.5;
    let bestDistSq = Infinity;
    
    // Грубый проход
    for (let i = 0; i <= SAMPLES; i++) {
        const t = i / SAMPLES;
        const p = this.evaluateCubicBezier(
            fromPoint.x, fromPoint.y,
            control1.x, control1.y,
            control2.x, control2.y,
            toPoint.x, toPoint.y,
            t
        );
        const dx = p.x - x;
        const dy = p.y - y;
        const distSq = dx * dx + dy * dy;
        
        if (distSq < bestDistSq) {
            bestDistSq = distSq;
            bestT = t;
        }
    }
    
    // Уточнение бинарным поиском вокруг bestT
    let lo = Math.max(0, bestT - 1 / SAMPLES);
    let hi = Math.min(1, bestT + 1 / SAMPLES);
    
    for (let iter = 0; iter < 25; iter++) {
        const mid1 = lo + (hi - lo) / 3;
        const mid2 = hi - (hi - lo) / 3;
        
        const p1 = this.evaluateCubicBezier(
            fromPoint.x, fromPoint.y,
            control1.x, control1.y,
            control2.x, control2.y,
            toPoint.x, toPoint.y,
            mid1
        );
        const p2 = this.evaluateCubicBezier(
            fromPoint.x, fromPoint.y,
            control1.x, control1.y,
            control2.x, control2.y,
            toPoint.x, toPoint.y,
            mid2
        );
        
        const d1 = (p1.x - x) ** 2 + (p1.y - y) ** 2;
        const d2 = (p2.x - x) ** 2 + (p2.y - y) ** 2;
        
        if (d1 < d2) {
            hi = mid2;
        } else {
            lo = mid1;
        }
    }
    
    return (lo + hi) / 2;
}

// Вычисление точки на кубической Безье
evaluateCubicBezier(x0, y0, x1, y1, x2, y2, x3, y3, t) {
    const mt = 1 - t;
    const mt2 = mt * mt;
    const mt3 = mt2 * mt;
    const t2 = t * t;
    const t3 = t2 * t;
    
    return {
        x: mt3 * x0 + 3 * mt2 * t * x1 + 3 * mt * t2 * x2 + t3 * x3,
        y: mt3 * y0 + 3 * mt2 * t * y1 + 3 * mt * t2 * y2 + t3 * y3
    };
}


// fin ЛАСТИК ДЛЯ КРИВЫХ БЕЗЬЕ

pointToRectDistance(px, py, rect) {
    // Находим ближайшую точку прямоугольника к заданной точке
    const closestX = Math.max(rect.x, Math.min(px, rect.x + rect.width));
    const closestY = Math.max(rect.y, Math.min(py, rect.y + rect.height));
    
    // Расстояние до ближайшей точки
    const dx = px - closestX;
    const dy = py - closestY;
    
    return Math.sqrt(dx * dx + dy * dy);
}

// Расстояние между двумя точками
pointDistance(p1, p2) {
    return Math.sqrt((p2.x - p1.x)**2 + (p2.y - p1.y)**2);
}

            // РИСОВАНИЕ
startPen(x, y) {
    this.state.penPoints = [{x, y}];
    
    this.state.currentElement = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    this.state.currentElement.setAttribute('d', `M ${x} ${y}`);
    this.state.currentElement.setAttribute('stroke', this.state.strokeColor);
    this.state.currentElement.setAttribute('stroke-width', this.state.strokeWidth);
    this.state.currentElement.setAttribute('fill', 'none');
    this.state.currentElement.setAttribute('stroke-linecap', 'round');
    this.state.currentElement.setAttribute('stroke-linejoin', 'round');
    
    this.vectorLayer.appendChild(this.state.currentElement);
}
            
drawPen(x, y) {
    let snappedPoint = null;
    
    // Привязка к не-белым линиям
    if (this.state.image && this.snapSettings.enabled) {
        snappedPoint = this.snapToNonWhiteLine(x, y);
    }
    
    // Привязка к существующим векторам (если включено)
    if (!snappedPoint && this.snapSettings.continueVector) {
        const snapVectorResult = this.findNearestVectorEndpoint(x, y);
        snappedPoint = snapVectorResult.point;
    }
    
    // Используем привязанную точку или оригинальную
    const finalPoint = snappedPoint || {x, y};
    
    // Добавляем точку
    this.state.penPoints.push(finalPoint);
    
    // Сглаживание
    const smoothing = Math.min(this.state.smoothing, this.state.penPoints.length);
    const startIdx = this.state.penPoints.length - smoothing;
    
    let avgX = 0, avgY = 0;
    for (let i = startIdx; i < this.state.penPoints.length; i++) {
        avgX += this.state.penPoints[i].x;
        avgY += this.state.penPoints[i].y;
    }
    avgX /= smoothing;
    avgY /= smoothing;
    
    // Обновляем путь
    const currentPath = this.state.currentElement.getAttribute('d');
    this.state.currentElement.setAttribute('d', currentPath + ` L ${avgX} ${avgY}`);
}

    findNearestVectorEndpoint(x, y) {
        const snapDistance = this.snapSettings.vectorSnapDistance / this.state.zoom;
        
        // Получаем все пути и линии (кроме текущего)
        const allVectors = Array.from(this.svg.querySelectorAll('path, line'))
            .filter(el => el !== this.state.currentElement);
        
        let nearestPoint = null;
        let minDistance = snapDistance;
        let nearestElement = null;
        
        allVectors.forEach(vector => {
            let endpoints = [];
            
            if (vector.tagName === 'LINE') {
                // Для линии: начало и конец
                endpoints = [
                    {x: parseFloat(vector.getAttribute('x1')), 
                     y: parseFloat(vector.getAttribute('y1'))},
                    {x: parseFloat(vector.getAttribute('x2')), 
                     y: parseFloat(vector.getAttribute('y2'))}
                ];
            } 
            else if (vector.tagName === 'PATH') {
                // Для пути: первая и последняя точка
                const d = vector.getAttribute('d');
                const commands = d.split(/(?=[ML])/); // Разделяем по командам
                
                if (commands.length > 0) {
                    // Первая точка
                    const firstCmd = commands[0];
                    const firstMatch = firstCmd.match(/[\d.-]+/g);
                    if (firstMatch && firstMatch.length >= 2) {
                        endpoints.push({
                            x: parseFloat(firstMatch[0]),
                            y: parseFloat(firstMatch[1])
                        });
                    }
                    
                    // Последняя точка
                    const lastCmd = commands[commands.length - 1];
                    const lastMatch = lastCmd.match(/[\d.-]+/g);
                    if (lastMatch && lastMatch.length >= 2) {
                        endpoints.push({
                            x: parseFloat(lastMatch[lastMatch.length - 2]),
                            y: parseFloat(lastMatch[lastMatch.length - 1])
                        });
                    }
                }
            }
            
            // Проверяем все концевые точки
            endpoints.forEach(point => {
                if (point.x === undefined || point.y === undefined) return;
                
                const dist = Math.sqrt(Math.pow(x - point.x, 2) + Math.pow(y - point.y, 2));
                if (dist < minDistance) {
                    minDistance = dist;
                    nearestPoint = point;
                    nearestElement = vector;
                }
            });
        });
        
        return {point: nearestPoint, element: nearestElement, distance: minDistance};
    }
   
snapPathToNonWhiteLine(pathElement) {
    if (!pathElement || !this.state.image || !this.snapSettings.enabled) return;
    
    const d = pathElement.getAttribute('d');
    if (!d) return;
    
    const { points } = this.parsePathToPoints(d);
    
    // Привязываем только каждую 3-ю точку для скорости
    for (let i = 0; i < points.length; i += 3) {
        const point = points[i];
        const snapped = this.snapToNonWhiteLine(point.x, point.y);
        
        if (snapped) {
            // Немного сдвигаем точку к привязанной позиции
            points[i].x = point.x * 0.7 + snapped.x * 0.3;
            points[i].y = point.y * 0.7 + snapped.y * 0.3;
        }
    }
    
    // Перестраиваем путь
    let newPath = `M ${points[0].x} ${points[0].y}`;
    for (let i = 1; i < points.length; i++) {
        newPath += ` L ${points[i].x} ${points[i].y}`;
    }
    
    pathElement.setAttribute('d', newPath);
}

// безье
    createSingleBezierPoint(x, y) {
        const point = {
            x: x,
            y: y,
            element: null,
            index: this.state.bezierPoints.length
        };
        
        // Создаем элемент точки
        point.element = this.createBezierPointElement(point);
        this.svg.appendChild(point.element);
        this.state.bezierPoints.push(point);
        this.selectBezierPoint(point.index);
		this.state.pendingConnectPoint = point.index;
    }
  
createNewBezierVector(x, y) {
    const fromPoint = this.state.bezierPoints[this.state.bezierSelectedPoint];
    if (!fromPoint) return;
    
    // Проверяем настройку гладкости
    const createSmooth = document.getElementById('bezierSmoothToggle')?.checked ?? true;
    
    // Проверяем, является ли точка крайней
    const incomingCount = this.state.bezierVectors.filter(v => v.to === fromPoint.index).length;
    const outgoingCount = this.state.bezierVectors.filter(v => v.from === fromPoint.index).length;
    const isEndpoint = (incomingCount + outgoingCount) <= 1;
    
    let actualFromPoint;
    let previousVector = null;
    
    if (isEndpoint) {
        // Крайняя точка — используем её напрямую
        actualFromPoint = fromPoint;
        
        // Ищем предыдущий вектор (для гладкого соединения)
        if (incomingCount === 1) {
            previousVector = this.state.bezierVectors.find(v => v.to === fromPoint.index);
        } else if (outgoingCount === 1) {
            previousVector = this.state.bezierVectors.find(v => v.from === fromPoint.index);
        }
    } else {
        // Средняя точка — создаём новую точку в том же месте
        actualFromPoint = {
            x: fromPoint.x,
            y: fromPoint.y,
            element: null,
            index: this.state.bezierPoints.length
        };
        
        actualFromPoint.element = this.createBezierPointElement(actualFromPoint);
        this.svg.appendChild(actualFromPoint.element);
        this.state.bezierPoints.push(actualFromPoint);
        
        // Для новой точки нет предыдущего вектора
        previousVector = null;
    }
    
    // Создаем новую точку (там где кликнули)
    const toPoint = {
        x: x,
        y: y,
        element: null,
        index: this.state.bezierPoints.length
    };
    
    // Создаем элемент точки
    toPoint.element = this.createBezierPointElement(toPoint);
    this.svg.appendChild(toPoint.element);
    
    // Добавляем в массив
    this.state.bezierPoints.push(toPoint);
    
    // Создаем вектор Безье
    const newVector = this.createBezierVector(actualFromPoint, toPoint, previousVector);
    
    if (createSmooth) {
        // Гладкий режим: выравниваем касательные
        if (previousVector) {
            this.alignTangentsForSmoothConnection(newVector, previousVector);
        }
    } else {
        // Угловой режим: прячем контрольные точки
        newVector.control1.x = actualFromPoint.x;
        newVector.control1.y = actualFromPoint.y;
        newVector.control2.x = toPoint.x;
        newVector.control2.y = toPoint.y;
        
        if (newVector.guideElements.control1) {
            newVector.guideElements.control1.setAttribute('cx', actualFromPoint.x);
            newVector.guideElements.control1.setAttribute('cy', actualFromPoint.y);
            newVector.guideElements.control1.style.display = 'none';
        }
        if (newVector.guideElements.line1) {
            newVector.guideElements.line1.style.display = 'none';
        }
        if (newVector.guideElements.control2) {
            newVector.guideElements.control2.setAttribute('cx', toPoint.x);
            newVector.guideElements.control2.setAttribute('cy', toPoint.y);
            newVector.guideElements.control2.style.display = 'none';
        }
        if (newVector.guideElements.line2) {
            newVector.guideElements.line2.style.display = 'none';
        }
        
        this.updateBezierVectorPath(newVector);
    }
    
    // Снимаем выделение со старой точки (fromPoint)
    if (fromPoint.element) {
        fromPoint.element.classList.remove('selected');
    }
    
    // Выделяем новую точку
    this.selectBezierPoint(toPoint.index);
    this.state.pendingConnectPoint = toPoint.index;
    setTimeout(() => this.saveSnapshot(), 100);
    return newVector;
}

addPointToBezierPath(pathElement, x, y) {
    const vector = this.state.bezierVectors.find(v => v.path === pathElement);
    if (!vector) return;
    
    const fromPoint = this.state.bezierPoints[vector.from];
    const toPoint = this.state.bezierPoints[vector.to];
    if (!fromPoint || !toPoint) return;
    
    const createSmooth = document.getElementById('bezierSmoothToggle')?.checked ?? true;
    
    // 1. t на кривой
    const t = this.findClosestTOnBezier(
        fromPoint, vector.control1, vector.control2, toPoint, x, y
    );
    
    // 2. Точка на кривой
    const newPos = this.evaluateCubicBezier(
        fromPoint.x, fromPoint.y,
        vector.control1.x, vector.control1.y,
        vector.control2.x, vector.control2.y,
        toPoint.x, toPoint.y,
        t
    );
    
    // 3. Создаём точку
    const newPoint = {
        x: newPos.x,
        y: newPos.y,
        element: null,
        index: this.state.bezierPoints.length
    };
    newPoint.element = this.createBezierPointElement(newPoint);
    this.svg.appendChild(newPoint.element);
    this.state.bezierPoints.push(newPoint);
    
    // 4. Стиль
    const strokeColor = vector.path.getAttribute('stroke') || this.state.strokeColor;
    const strokeWidth = vector.path.getAttribute('stroke-width') || this.state.strokeWidth;
    
    // 5. Control-точки
    let c1_first, c2_first, c1_second, c2_second;
    
    if (createSmooth) {
        // Гладкая — де Кастельо
        const split = this.splitCubicBezier(
            { x: fromPoint.x, y: fromPoint.y },
            { x: vector.control1.x, y: vector.control1.y },
            { x: vector.control2.x, y: vector.control2.y },
            { x: toPoint.x, y: toPoint.y },
            t
        );
        c1_first  = { x: split.first.c1.x,  y: split.first.c1.y  };
        c2_first  = { x: split.first.c2.x,  y: split.first.c2.y  };
        c1_second = { x: split.second.c1.x, y: split.second.c1.y };
        c2_second = { x: split.second.c2.x, y: split.second.c2.y };
    } else {
        // Угловая:
        // control1 первого = исходный control1 (сохраняем касательную from)
        // control2 первого = new (схлопнут)
        // control1 второго = new (схлопнут)
        // control2 второго = исходный control2 (сохраняем касательную to)
        c1_first  = { x: vector.control1.x, y: vector.control1.y };
        c2_first  = { x: newPoint.x, y: newPoint.y };
        c1_second = { x: newPoint.x, y: newPoint.y };
        c2_second = { x: vector.control2.x, y: vector.control2.y };
    }
    
    // 6. Два вектора
    const vector1 = {
        from: vector.from,
        to: newPoint.index,
        control1: { x: c1_first.x, y: c1_first.y, belongsTo: vector.from },
        control2: { x: c2_first.x, y: c2_first.y, belongsTo: newPoint.index },
        path: null,
        guideElements: {}
    };
    const vector2 = {
        from: newPoint.index,
        to: vector.to,
        control1: { x: c1_second.x, y: c1_second.y, belongsTo: newPoint.index },
        control2: { x: c2_second.x, y: c2_second.y, belongsTo: vector.to },
        path: null,
        guideElements: {}
    };
    
    // 7. Пути
    vector1.path = this.createBezierPath(
        fromPoint.x, fromPoint.y,
        vector1.control1.x, vector1.control1.y,
        vector1.control2.x, vector1.control2.y,
        newPoint.x, newPoint.y
    );
    vector1.path.setAttribute('stroke', strokeColor);
    vector1.path.setAttribute('stroke-width', strokeWidth);
    
    vector2.path = this.createBezierPath(
        newPoint.x, newPoint.y,
        vector2.control1.x, vector2.control1.y,
        vector2.control2.x, vector2.control2.y,
        toPoint.x, toPoint.y
    );
    vector2.path.setAttribute('stroke', strokeColor);
    vector2.path.setAttribute('stroke-width', strokeWidth);
    
    this.svg.appendChild(vector1.path);
    this.svg.appendChild(vector2.path);
    
    // 8. Удаляем старый вектор
    this.deleteBezierVector(vector);
    
    // 9. Пуш в массив ДО создания направляющих
    this.state.bezierVectors.push(vector1);
    this.state.bezierVectors.push(vector2);
    
    // 10. Создаём направляющие
    this.createVectorGuides(vector1, fromPoint, newPoint);
    this.createVectorGuides(vector2, newPoint, toPoint);
    
    // 11. Прячем направляющие, если не в bezier-points
    const inBezierMode = (this.state.currentTool === 'bezier-points');
    
    if (!inBezierMode) {
        // Полностью скрываем всё
        [vector1, vector2].forEach(v => {
            const ge = v.guideElements;
            if (!ge) return;
            if (ge.line1) ge.line1.style.display = 'none';
            if (ge.control1) ge.control1.style.display = 'none';
            if (ge.line2) ge.line2.style.display = 'none';
            if (ge.control2) ge.control2.style.display = 'none';
        });
    } else if (!createSmooth) {
        // В режиме безье, но угловая — прячем направляющие ТОЛЬКО новой точки
        // У vector1 direction новая точка = control2 (line2)
        // У vector2 direction новая точка = control1 (line1)
        const ge1 = vector1.guideElements;
        if (ge1) {
            if (ge1.line2) ge1.line2.style.display = 'none';
            if (ge1.control2) ge1.control2.style.display = 'none';
        }
        const ge2 = vector2.guideElements;
        if (ge2) {
            if (ge2.line1) ge2.line1.style.display = 'none';
            if (ge2.control1) ge2.control1.style.display = 'none';
        }
    }
    // Гладкая в bezier-points — все направляющие видны.
    
    // 12. Выделяем новую точку
    this.selectBezierPoint(newPoint.index);
    this.state.pendingConnectPoint = newPoint.index;
    setTimeout(() => this.saveSnapshot(), 100);
}

// Вспомогательный метод для удаления одного вектора
deleteBezierVector(vector) {
    const index = this.state.bezierVectors.indexOf(vector);
    if (index === -1) return;
    
    // Удаляем визуальные элементы
    if (vector.path && vector.path.parentNode) {
        vector.path.parentNode.removeChild(vector.path);
    }
    if (vector.guideElements.line1) vector.guideElements.line1.remove();
    if (vector.guideElements.control1) vector.guideElements.control1.remove();
    if (vector.guideElements.line2) vector.guideElements.line2.remove();
    if (vector.guideElements.control2) vector.guideElements.control2.remove();
    
    // Удаляем из массива
    this.state.bezierVectors.splice(index, 1);
}

    // СОЗДАНИЕ ВЕКТОРА БЕЗЬЕ МЕЖДУ ДВУМЯ ТОЧКАМИ
createBezierVector(fromPoint, toPoint, previousVector = null, createGuides = true) {
    // Рассчитываем контрольные точки
    const controlPoints = this.calculateBezierControlPoints(fromPoint, toPoint, previousVector);
    
    // Создаем объект вектора
    const vector = {
        from: fromPoint.index,
        to: toPoint.index,
        control1: {
            x: controlPoints.cp1.x,
            y: controlPoints.cp1.y,
            belongsTo: fromPoint.index
        },
        control2: {
            x: controlPoints.cp2.x,
            y: controlPoints.cp2.y,
            belongsTo: toPoint.index
        },
        path: null,
        guideElements: {}
    };
    
    // Создаем SVG путь
    vector.path = this.createBezierPath(
        fromPoint.x, fromPoint.y,
        vector.control1.x, vector.control1.y,
        vector.control2.x, vector.control2.y,
        toPoint.x, toPoint.y
    );
    
    this.svg.appendChild(vector.path);
    
    // Создаем направляющие элементы ТОЛЬКО если нужно
    if (createGuides) {
        this.createVectorGuides(vector, fromPoint, toPoint);
    }
    
    // Сохраняем вектор
    this.state.bezierVectors.push(vector);
    
    return vector;
}

createBezierPath(x1, y1, cx1, cy1, cx2, cy2, x2, y2) {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const d = `M ${x1} ${y1} C ${cx1} ${cy1} ${cx2} ${cy2} ${x2} ${y2}`;
    
    path.setAttribute('d', d);
    path.setAttribute('stroke', this.state.strokeColor);
    path.setAttribute('stroke-width', this.state.strokeWidth);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-linecap', 'round');
    path.classList.add('bezier-vector');
    
    return path;
}
    
createVectorGuides(vector, fromPoint, toPoint) {
if (!vector || !vector.path) return;
    const vectorIndex = this.state.bezierVectors.length - 1;
    vector.path.setAttribute('data-vector-id', `${vector.from}-${vector.to}`);
    // ЛИНИЯ 1: от точки "from" к ЕЁ контрольной точке (control1)
    vector.guideElements.line1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    vector.guideElements.line1.setAttribute('class', 'bezier-guide-line');
    vector.guideElements.line1.setAttribute('x1', fromPoint.x);
    vector.guideElements.line1.setAttribute('y1', fromPoint.y);
    vector.guideElements.line1.setAttribute('x2', vector.control1.x);
    vector.guideElements.line1.setAttribute('y2', vector.control1.y);
    vector.guideElements.line1.setAttribute('data-vector-index', vectorIndex);
    vector.guideElements.line1.setAttribute('data-belongs-to', fromPoint.index);
    vector.guideElements.line1.setAttribute('data-control-type', 'control1');
    
    // КОНТРОЛЬНАЯ ТОЧКА 1: принадлежит точке "from"
    vector.guideElements.control1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    vector.guideElements.control1.setAttribute('class', 'bezier-control-point');
    vector.guideElements.control1.setAttribute('cx', vector.control1.x);
    vector.guideElements.control1.setAttribute('cy', vector.control1.y);
    vector.guideElements.control1.setAttribute('r', '4');
    vector.guideElements.control1.setAttribute('data-vector-index', vectorIndex);
    vector.guideElements.control1.setAttribute('data-control-type', 'control1');
    vector.guideElements.control1.setAttribute('data-belongs-to', fromPoint.index);
    
    // ЛИНИЯ 2: от точки "to" к ЕЁ контрольной точке (control2)
    vector.guideElements.line2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    vector.guideElements.line2.setAttribute('class', 'bezier-guide-line');
    vector.guideElements.line2.setAttribute('x1', toPoint.x);
    vector.guideElements.line2.setAttribute('y1', toPoint.y);
    vector.guideElements.line2.setAttribute('x2', vector.control2.x);
    vector.guideElements.line2.setAttribute('y2', vector.control2.y);
    vector.guideElements.line2.setAttribute('data-vector-index', vectorIndex);
    vector.guideElements.line2.setAttribute('data-belongs-to', toPoint.index);
    vector.guideElements.line2.setAttribute('data-control-type', 'control2');
    
    // КОНТРОЛЬНАЯ ТОЧКА 2: принадлежит точке "to"
    vector.guideElements.control2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    vector.guideElements.control2.setAttribute('class', 'bezier-control-point');
    vector.guideElements.control2.setAttribute('cx', vector.control2.x);
    vector.guideElements.control2.setAttribute('cy', vector.control2.y);
    vector.guideElements.control2.setAttribute('r', '4');
    vector.guideElements.control2.setAttribute('data-vector-index', vectorIndex);
    vector.guideElements.control2.setAttribute('data-control-type', 'control2');
    vector.guideElements.control2.setAttribute('data-belongs-to', toPoint.index);
    
    // НОВЫЕ ОБРАБОТЧИКИ - используем единую функцию startBezierControlDrag
    vector.guideElements.control1.addEventListener('mousedown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        this.startBezierControlDrag(e);
    });
    
    vector.guideElements.control2.addEventListener('mousedown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        this.startBezierControlDrag(e);
    });
    
    // Добавляем в SVG
    this.svg.appendChild(vector.guideElements.line1);
    this.svg.appendChild(vector.guideElements.control1);
    this.svg.appendChild(vector.guideElements.line2);
    this.svg.appendChild(vector.guideElements.control2);
}
  
calculateBezierControlPoints(pointA, pointB, previousVector = null) {
    const dx = pointB.x - pointA.x;
    const dy = pointB.y - pointA.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    
    if (distance === 0) {
        return {
            cp1: { x: pointA.x, y: pointA.y },
            cp2: { x: pointB.x, y: pointB.y }
        };
    }
    
    // Простые встречные касательные длиной 0.39
    const dirX = dx / distance;
    const dirY = dy / distance;
    const tangentLength = distance * 0.39;
    
    // Всегда создаем встречные касательные
    const cp1 = {
        x: pointA.x + dirX * tangentLength,
        y: pointA.y + dirY * tangentLength
    };
    
    const cp2 = {
        x: pointB.x - dirX * tangentLength,
        y: pointB.y - dirY * tangentLength
    };
    
    return { cp1, cp2 };
}

alignTangentsForSmoothConnection(newVector, previousVector) {
    if (!previousVector || !newVector) return;
    
    // Общая точка - где соединяются векторы
    const commonPointIndex = newVector.from; // Это точка 2 в 1-2-3
    const commonPoint = this.state.bezierPoints[commonPointIndex];
    
    // Точка 1 (начало предыдущего вектора)
    const point1 = this.state.bezierPoints[previousVector.from];
    // Точка 3 (конец нового вектора)
    const point3 = this.state.bezierPoints[newVector.to];
    
    // Вектор 1->2 (от точки 1 к общей точке 2)
    const vec1to2 = {
        x: commonPoint.x - point1.x,
        y: commonPoint.y - point1.y
    };
    
    // Вектор 2->3 (от общей точки 2 к точке 3)
    const vec2to3 = {
        x: point3.x - commonPoint.x,
        y: point3.y - commonPoint.y
    };
    
    // Вычисляем длины
    const length1to2 = Math.sqrt(vec1to2.x * vec1to2.x + vec1to2.y * vec1to2.y);
    const length2to3 = Math.sqrt(vec2to3.x * vec2to3.x + vec2to3.y * vec2to3.y);
    
    if (length1to2 === 0 || length2to3 === 0) return;
    
    // Нормализуем векторы
    const dir1to2 = { x: vec1to2.x / length1to2, y: vec1to2.y / length1to2 };
    const dir2to3 = { x: vec2to3.x / length2to3, y: vec2to3.y / length2to3 };
    
    // Вычисляем биссектрису угла ВНУТРИ угла 1-2-3
    // Для этого нужно усреднить НАПРАВЛЕНИЯ 1->2 и 2->3
    // Но сначала инвертируем направление 1->2, потому что смотрим ИЗ точки 2
    const dirFrom2to1 = { x: -dir1to2.x, y: -dir1to2.y }; // Направление от 2 к 1
    const dirFrom2to3 = dir2to3; // Направление от 2 к 3
    
    // Биссектриса угла в точке 2 между направлениями к 1 и к 3
    const bisector = {
        x: dirFrom2to1.x + dirFrom2to3.x,
        y: dirFrom2to1.y + dirFrom2to3.y
    };
    
    const bisectorLength = Math.sqrt(bisector.x * bisector.x + bisector.y * bisector.y);
    
    let tangentDir;
    
    if (bisectorLength === 0) {
        // Направления противоположны (180°) - используем любой перпендикуляр
        tangentDir = { x: -dirFrom2to1.y, y: dirFrom2to1.x };
    } else {
        // Нормализуем биссектрису
        const normalizedBisector = {
            x: bisector.x / bisectorLength,
            y: bisector.y / bisectorLength
        };
        
        // Касательная перпендикулярна биссектрисе
        tangentDir = {
            x: -normalizedBisector.y,
            y: normalizedBisector.x
        };
    }
    
    // Теперь ОЧЕНЬ ВАЖНО: касательные должны быть направлены:
    // - Для вектора 1-2 (previousVector): control2 должен указывать ОТ точки 2 К точке 1
    // - Для вектора 2-3 (newVector): control1 должен указывать ОТ точки 2 К точке 3
    
    // Проверяем, правильно ли направлена касательная для вектора 2->3
    // Она должна иметь положительную проекцию на dirFrom2to3
    const dotProductWith2to3 = tangentDir.x * dirFrom2to3.x + tangentDir.y * dirFrom2to3.y;
    
    if (dotProductWith2to3 < 0) {
        // Если касательная направлена не туда - инвертируем её
        tangentDir.x = -tangentDir.x;
        tangentDir.y = -tangentDir.y;
    }
    
    // Длины касательных (0.39 от длины вектора)
    const tangentLength1to2 = length1to2 * 0.39;
    const tangentLength2to3 = length2to3 * 0.39;
    
    // Обновляем контрольные точки:
    
    // 1. Для вектора 1-2: control2 (в точке 2) должен указывать К точке 1
    // Это означает, что он должен быть направлен ПРОТИВОПОЛОЖНО tangentDir
    previousVector.control2.x = commonPoint.x - tangentDir.x * tangentLength1to2;
    previousVector.control2.y = commonPoint.y - tangentDir.y * tangentLength1to2;
    
    // 2. Для вектора 2-3: control1 (в точке 2) должен указывать К точке 3
    // Это означает, что он должен быть направлен ВДОЛЬ tangentDir
    newVector.control1.x = commonPoint.x + tangentDir.x * tangentLength2to3;
    newVector.control1.y = commonPoint.y + tangentDir.y * tangentLength2to3;
    
    // Обновляем визуализацию
    if (previousVector.guideElements.control2) {
        previousVector.guideElements.control2.setAttribute('cx', previousVector.control2.x);
        previousVector.guideElements.control2.setAttribute('cy', previousVector.control2.y);
        if (previousVector.guideElements.line2) {
            previousVector.guideElements.line2.setAttribute('x2', previousVector.control2.x);
            previousVector.guideElements.line2.setAttribute('y2', previousVector.control2.y);
        }
    }
    
    if (newVector.guideElements.control1) {
        newVector.guideElements.control1.setAttribute('cx', newVector.control1.x);
        newVector.guideElements.control1.setAttribute('cy', newVector.control1.y);
        if (newVector.guideElements.line1) {
            newVector.guideElements.line1.setAttribute('x2', newVector.control1.x);
            newVector.guideElements.line1.setAttribute('y2', newVector.control1.y);
        }
    }
    
    this.updateBezierVectorPath(previousVector);
    this.updateBezierVectorPath(newVector);
    
}

    // СОЗДАНИЕ ЭЛЕМЕНТА ТОЧКИ
createBezierPointElement(point) {
    const element = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    element.setAttribute('class', 'bezier-point');
    element.setAttribute('cx', point.x);
    element.setAttribute('cy', point.y);
    element.setAttribute('r', '6');
    element.setAttribute('data-index', point.index);
    
    // Добавляем обработчик для начала перетаскивания
element.addEventListener('mousedown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    
    const pointIndex = parseInt(element.getAttribute('data-index'));
    
    // Если Shift нажат И есть предыдущая точка — соединяем
    if (e.shiftKey && this.state.pendingConnectPoint !== null && 
        this.state.pendingConnectPoint !== pointIndex) {
        
        console.log('🔗 СОЕДИНЕНИЕ:', this.state.pendingConnectPoint, '→', pointIndex);
        
        this.connectTwoBezierPoints(
            this.state.pendingConnectPoint,
            pointIndex
        );
        
        // После соединения запоминаем НОВУЮ точку как последнюю
        this.state.pendingConnectPoint = pointIndex;
        
        // Выделяем новую точку
        this.selectBezierPoint(pointIndex);
        return;
    }
    
    // ИНАЧЕ — просто запоминаем точку и выделяем
    this.state.pendingConnectPoint = pointIndex;
    
    console.log('📌 Запомнена точка:', pointIndex);
    
    this.selectBezierPoint(pointIndex);
    this.startPointDrag(pointIndex, this.getSVGCoordinates(e).x, this.getSVGCoordinates(e).y);
}); 
    // Двойной клик — переключение угловой/гладкой точки
    element.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        e.preventDefault();
        this.toggleBezierPointType(point.index);
    });
    
    return element;
}

toggleBezierPointType(pointIndex) {
    const point = this.state.bezierPoints[pointIndex];
    if (!point) return;
    
    // Находим все векторы, где эта точка — from (control1 принадлежит ей)
    // или to (control2 принадлежит ей)
    const relatedVectors = [];
    
    this.state.bezierVectors.forEach((vector, index) => {
        if (vector.from === pointIndex || vector.to === pointIndex) {
            relatedVectors.push({ vector, index });
        }
    });
    
    if (relatedVectors.length === 0) {
        return;
    }
    
    let isFlat = true;
    
    relatedVectors.forEach(({ vector }) => {
        if (vector.from === pointIndex) {
            // Проверяем control1
            const dist = Math.hypot(vector.control1.x - point.x, vector.control1.y - point.y);
            if (dist > 0.5) isFlat = false;
        }
        if (vector.to === pointIndex) {
            // Проверяем control2
            const dist = Math.hypot(vector.control2.x - point.x, vector.control2.y - point.y);
            if (dist > 0.5) isFlat = false;
        }
    });
    
    if (isFlat) {
        // Точка "пустая" — делаем её гладкой (восстанавливаем контрольные точки)
        relatedVectors.forEach(({ vector }) => {
            if (vector.from === pointIndex) {
                // Находим вторую точку вектора
                const otherPoint = this.state.bezierPoints[vector.to];
                if (otherPoint) {
                    const dx = otherPoint.x - point.x;
                    const dy = otherPoint.y - point.y;
                    const dist = Math.hypot(dx, dy) * 0.39;
                    vector.control1.x = point.x + dx * 0.39;
                    vector.control1.y = point.y + dy * 0.39;
                    
                    // Обновляем визуальные элементы
                    if (vector.guideElements.control1) {
                        vector.guideElements.control1.setAttribute('cx', vector.control1.x);
                        vector.guideElements.control1.setAttribute('cy', vector.control1.y);
                        vector.guideElements.control1.style.display = 'block';
                    }
                    if (vector.guideElements.line1) {
                        vector.guideElements.line1.setAttribute('x2', vector.control1.x);
                        vector.guideElements.line1.setAttribute('y2', vector.control1.y);
                        vector.guideElements.line1.style.display = 'block';
                    }
                }
            }
            if (vector.to === pointIndex) {
                const otherPoint = this.state.bezierPoints[vector.from];
                if (otherPoint) {
                    const dx = point.x - otherPoint.x;
                    const dy = point.y - otherPoint.y;
                    vector.control2.x = point.x - dx * 0.39;
                    vector.control2.y = point.y - dy * 0.39;
                    
                    if (vector.guideElements.control2) {
                        vector.guideElements.control2.setAttribute('cx', vector.control2.x);
                        vector.guideElements.control2.setAttribute('cy', vector.control2.y);
                        vector.guideElements.control2.style.display = 'block';
                    }
                    if (vector.guideElements.line2) {
                        vector.guideElements.line2.setAttribute('x2', vector.control2.x);
                        vector.guideElements.line2.setAttribute('y2', vector.control2.y);
                        vector.guideElements.line2.style.display = 'block';
                    }
                }
            }
            
            this.updateBezierVectorPath(vector);
        });
        
    } else {
        // Точка гладкая — делаем её "пустой" (угловой)
        relatedVectors.forEach(({ vector }) => {
            if (vector.from === pointIndex) {
                // Перемещаем control1 в саму точку
                vector.control1.x = point.x;
                vector.control1.y = point.y;
                
                if (vector.guideElements.control1) {
                    vector.guideElements.control1.setAttribute('cx', point.x);
                    vector.guideElements.control1.setAttribute('cy', point.y);
                    vector.guideElements.control1.style.display = 'none';
                }
                if (vector.guideElements.line1) {
                    vector.guideElements.line1.style.display = 'none';
                }
            }
            if (vector.to === pointIndex) {
                vector.control2.x = point.x;
                vector.control2.y = point.y;
                
                if (vector.guideElements.control2) {
                    vector.guideElements.control2.setAttribute('cx', point.x);
                    vector.guideElements.control2.setAttribute('cy', point.y);
                    vector.guideElements.control2.style.display = 'none';
                }
                if (vector.guideElements.line2) {
                    vector.guideElements.line2.style.display = 'none';
                }
            }
            
            // Обновляем путь
            this.updateBezierVectorPath(vector);
        });

    }
    
    // Сохраняем состояние
    setTimeout(() => this.saveSnapshot(), 100);
}
 
reverseBezierVector(vector) {
    if (!vector) return null;
    
    const idx = this.state.bezierVectors.indexOf(vector);
    if (idx === -1) return null;
    
    const fromPoint = this.state.bezierPoints[vector.to];   // ← меняем
    const toPoint = this.state.bezierPoints[vector.from];   // ← меняем
    if (!fromPoint || !toPoint) return null;
    
    // Стиль
    const stroke = vector.path.getAttribute('stroke') || this.state.strokeColor;
    const strokeWidth = vector.path.getAttribute('stroke-width') || this.state.strokeWidth;
    const linecap = vector.path.getAttribute('stroke-linecap') || 'round';
    const linejoin = vector.path.getAttribute('stroke-linejoin') || 'round';
    
    // Удаляем старый
    if (vector.path && vector.path.parentNode) vector.path.remove();
    if (vector.guideElements) {
        const ge = vector.guideElements;
        if (ge.line1) ge.line1.remove();
        if (ge.control1) ge.control1.remove();
        if (ge.line2) ge.line2.remove();
        if (ge.control2) ge.control2.remove();
    }
    
    // Создаём новый вектор
    const newVector = {
        from: vector.to,
        to: vector.from,
        control1: { 
            x: vector.control2.x, 
            y: vector.control2.y, 
            belongsTo: vector.to 
        },
        control2: { 
            x: vector.control1.x, 
            y: vector.control1.y, 
            belongsTo: vector.from 
        },
        path: null,
        guideElements: {}
    };
    
    newVector.path = this.createBezierPath(
        fromPoint.x, fromPoint.y,
        newVector.control1.x, newVector.control1.y,
        newVector.control2.x, newVector.control2.y,
        toPoint.x, toPoint.y
    );
    newVector.path.setAttribute('stroke', stroke);
    newVector.path.setAttribute('stroke-width', strokeWidth);
    newVector.path.setAttribute('stroke-linecap', linecap);
    newVector.path.setAttribute('stroke-linejoin', linejoin);
    
    this.svg.appendChild(newVector.path);
    
    // Заменяем в массиве
    this.state.bezierVectors[idx] = newVector;
    
    // Направляющие
    this.createVectorGuides(newVector, fromPoint, toPoint);
    
    // Скрываем, если не в режиме B
    if (this.state.currentTool !== 'bezier-points') {
        const ge = newVector.guideElements;
        if (ge.line1) ge.line1.style.display = 'none';
        if (ge.control1) ge.control1.style.display = 'none';
        if (ge.line2) ge.line2.style.display = 'none';
        if (ge.control2) ge.control2.style.display = 'none';
    }
    
    // Возвращаем НОВЫЙ вектор
    return newVector;
}

console.log('  aIn=' + aIn.length + ' aOut=' + aOut.length + ' aTotal=' + aTotal + ' aRole=' + aRole);
console.log('  bIn=' + bIn.length + ' bOut=' + bOut.length + ' bTotal=' + bTotal + ' bRole=' + bRole); 
 
    if (aRole === 'to' && bRole === 'from') {

console.log('  connectorFrom=' + connectorFrom + ' connectorTo=' + connectorTo);

    );

    connector.path.setAttribute('stroke-width', strokeWidth);

// Слияние двух точек, находящихся почти в одном месте
mergeTwoBezierPointsAtSamePlace(keepIdx, deleteIdx) {
    // Оставляем keepIdx, удаляем deleteIdx.
    // Все векторы, ссылающиеся на deleteIdx, перенаправляем на keepIdx.
    
    const keepPoint = this.state.bezierPoints[keepIdx];
    const deletePoint = this.state.bezierPoints[deleteIdx];
    if (!keepPoint || !deletePoint) return;
    
    // Сдвигаем keepPoint к средней позиции (или оставляем)
    keepPoint.x = (keepPoint.x + deletePoint.x) / 2;
    keepPoint.y = (keepPoint.y + deletePoint.y) / 2;
    if (keepPoint.element) {
        keepPoint.element.setAttribute('cx', keepPoint.x);
        keepPoint.element.setAttribute('cy', keepPoint.y);
    }
    
    // Перенаправляем векторы
    for (const v of this.state.bezierVectors) {
        if (v.from === deleteIdx) {
            v.from = keepIdx;
            v.control1.belongsTo = keepIdx;
        }
        if (v.to === deleteIdx) {
            v.to = keepIdx;
            v.control2.belongsTo = keepIdx;
        }
        // Обновляем пути
        this.updateBezierVectorPath(v);
        this.updateVectorGuides(v);
    }
    
    // Удаляем deletePoint
    if (deletePoint.element && deletePoint.element.parentNode) {
        deletePoint.element.remove();
    }
    this.state.bezierPoints.splice(deleteIdx, 1);
    
    // Пересчитываем индексы
    this.state.bezierPoints.forEach((p, i) => {
        p.index = i;
        if (p.element) p.element.setAttribute('data-index', i);
    });
    
    for (const v of this.state.bezierVectors) {
        if (v.from > deleteIdx) v.from--;
        if (v.to > deleteIdx) v.to--;
        v.control1.belongsTo = v.from;
        v.control2.belongsTo = v.to;
    }
    
    this.saveSnapshot();
}

selectBezierPoint(pointIndex) {
    // Снимаем выделение со всех точек
    this.state.bezierPoints.forEach(point => {
        if (point.element) {
            point.element.classList.remove('selected');
        }
    });
    
    // Выделяем указанную точку
    const point = this.state.bezierPoints[pointIndex];
    if (point && point.element) {
        point.element.classList.add('selected');
        this.state.bezierSelectedPoint = pointIndex;
    }
}
    
    deselectAllPoints() {
        this.state.bezierPoints.forEach(point => {
            if (point.element) {
                point.element.classList.remove('selected');
            }
        });
        this.state.bezierSelectedPoint = null;
    }

    // ФУНКЦИЯ НАЧАЛА ПЕРЕТАСКИВАНИЯ КОНТРОЛЬНОЙ ТОЧКИ БЕЗЬЕ
startBezierControlDrag(e) {
    e.preventDefault();
    e.stopPropagation();
    
    const target = e.target;
    if (!target.classList.contains('bezier-control-point')) return;
    
    const coords = this.getSVGCoordinates(e);
    const controlType = target.getAttribute('data-control-type');
    const belongsTo = parseInt(target.getAttribute('data-belongs-to'));
    
    // Ищем вектор по принадлежности контрольной точки
    const vectorInfo = this.findVectorByControlPoint(controlType, belongsTo);
    
    if (!vectorInfo) {
        console.warn('Вектор не найден для контрольной точки:', controlType, belongsTo);
        return;
    }
    
    const { vector, index: vectorIndex, type } = vectorInfo;
    
    // Запоминаем состояние
    this.state.isDraggingBezierControl = true;
    this.state.draggingBezierControlVectorIndex = vectorIndex;
    this.state.draggingBezierControlType = type;
    this.state.draggingBezierControlStartX = coords.x;
    this.state.draggingBezierControlStartY = coords.y;
    
    // Запоминаем оригинальные координаты
    if (type === 'control1') {
        this.state.draggingBezierControlOriginalX = vector.control1.x;
        this.state.draggingBezierControlOriginalY = vector.control1.y;
    } else {
        this.state.draggingBezierControlOriginalX = vector.control2.x;
        this.state.draggingBezierControlOriginalY = vector.control2.y;
    }
    
}
   
    // ОБНОВЛЕНИЕ ПЕРЕТАСКИВАНИЯ КОНТРОЛЬНОЙ ТОЧКИ БЕЗЬЕ
updateBezierControlDrag(x, y) {
    if (!this.state.isDraggingBezierControl) return;
    
    const vectorIndex = this.state.draggingBezierControlVectorIndex;
    const vector = this.state.bezierVectors[vectorIndex];
    if (!vector) {
        console.warn('Вектор не найден по индексу:', vectorIndex);
        return;
    }
    
    // Вычисляем смещение
    const dx = x - this.state.draggingBezierControlStartX;
    const dy = y - this.state.draggingBezierControlStartY;
    
    // Обновляем координаты контрольной точки
    if (this.state.draggingBezierControlType === 'control1') {
        vector.control1.x = this.state.draggingBezierControlOriginalX + dx;
        vector.control1.y = this.state.draggingBezierControlOriginalY + dy;
        
        // Обновляем визуальную точку
        if (vector.guideElements.control1) {
            vector.guideElements.control1.setAttribute('cx', vector.control1.x);
            vector.guideElements.control1.setAttribute('cy', vector.control1.y);
        }
        
        // Обновляем линию
        if (vector.guideElements.line1) {
            vector.guideElements.line1.setAttribute('x2', vector.control1.x);
            vector.guideElements.line1.setAttribute('y2', vector.control1.y);
        }
    } else {
        vector.control2.x = this.state.draggingBezierControlOriginalX + dx;
        vector.control2.y = this.state.draggingBezierControlOriginalY + dy;
        
        // Обновляем визуальную точку
        if (vector.guideElements.control2) {
            vector.guideElements.control2.setAttribute('cx', vector.control2.x);
            vector.guideElements.control2.setAttribute('cy', vector.control2.y);
        }
        
        // Обновляем линию
        if (vector.guideElements.line2) {
            vector.guideElements.line2.setAttribute('x2', vector.control2.x);
            vector.guideElements.line2.setAttribute('y2', vector.control2.y);
        }
    }
    
    // Обновляем путь Безье
    this.updateBezierVectorPath(vector);
    
    // Обновляем стартовые координаты для плавности
    this.state.draggingBezierControlStartX = x;
    this.state.draggingBezierControlStartY = y;
    this.state.draggingBezierControlOriginalX = 
        this.state.draggingBezierControlType === 'control1' ? vector.control1.x : vector.control2.x;
    this.state.draggingBezierControlOriginalY = 
        this.state.draggingBezierControlType === 'control1' ? vector.control1.y : vector.control2.y;
}
   
    // ЗАВЕРШЕНИЕ ПЕРЕТАСКИВАНИЯ КОНТРОЛЬНОЙ ТОЧКИ БЕЗЬЕ
    endBezierControlDrag() {
        this.state.isDraggingBezierControl = false;
        this.state.draggingBezierControlVectorIndex = null;
        this.state.draggingBezierControlType = null;
    }

updateVectorGuides(vector) {
    const fromPoint = this.state.bezierPoints[vector.from];
    const toPoint = this.state.bezierPoints[vector.to];
    if (!fromPoint || !toPoint) return;
    
    const ge = vector.guideElements || {};
    
    if (ge.line1) {
        ge.line1.setAttribute('x1', fromPoint.x);
        ge.line1.setAttribute('y1', fromPoint.y);
        ge.line1.setAttribute('x2', vector.control1.x);
        ge.line1.setAttribute('y2', vector.control1.y);
    }
    
    if (ge.control1) {
        ge.control1.setAttribute('cx', vector.control1.x);
        ge.control1.setAttribute('cy', vector.control1.y);
    }
    
    if (ge.line2) {
        ge.line2.setAttribute('x1', toPoint.x);
        ge.line2.setAttribute('y1', toPoint.y);
        ge.line2.setAttribute('x2', vector.control2.x);
        ge.line2.setAttribute('y2', vector.control2.y);
    }
    
    if (ge.control2) {
        ge.control2.setAttribute('cx', vector.control2.x);
        ge.control2.setAttribute('cy', vector.control2.y);
    }
}
    // ОБНОВЛЕНИЕ ПУТИ БЕЗЬЕ (после перемещения контрольной точки)
updateBezierVectorPath(vector) {
if (!vector || !vector.path) return;
    const startPoint = this.state.bezierPoints[vector.from];
    const endPoint = this.state.bezierPoints[vector.to];
    
    if (!startPoint || !endPoint || !vector.path) return;
    
    const d = `M ${startPoint.x} ${startPoint.y} C ${vector.control1.x} ${vector.control1.y} ${vector.control2.x} ${vector.control2.y} ${endPoint.x} ${endPoint.y}`;
    
    vector.path.setAttribute('d', d);
    
    // Также обновляем атрибут data-vector-id если нужно
    vector.path.setAttribute('data-vector-id', `${vector.from}-${vector.to}`);
}

startPointDrag(pointIndex, x, y) {
    const point = this.state.bezierPoints[pointIndex];
    if (!point) return;
    
    // Выделяем точку
    this.selectBezierPoint(pointIndex);
    
    // Устанавливаем флаги перетаскивания
    this.state.isDraggingPoint = true;
    this.state.draggingPointIndex = pointIndex;
    this.state.draggingPointStartX = x;
    this.state.draggingPointStartY = y;
    this.state.draggingPointOriginalX = point.x;
