// Полная очистка выделения — рамка + фейковый path + сброс ссылок
clearSelection() {
    // Запекаем изменения безье-контура (если был выделен)
    if (this.selectedBezierContour) {
        this.commitBezierContourChanges();
    }
    
    this.removeSelectionHandles();
    
    if (this.selectedBezierContour && this.selectedBezierContour.fakePath) {
        this.selectedBezierContour.fakePath.remove();
    }
    this.selectedBezierContour = null;
    this.selectedElement = null;
	const block = document.getElementById('toBezierBlock');
    if (block) block.hidden = true;
}

// Применяет трансформации фейкового path обратно в оригинальные безье-векторы
commitBezierContourChanges() {
    const contour = this.selectedBezierContour;
    if (!contour) return;
    
    const fakePath = contour.fakePath;
    const newD = fakePath.getAttribute('d') || '';
    const transform = fakePath.getAttribute('transform') || '';
    
    // Парсим сегменты из d
    const segments = this.parseBezierSegments(newD);
    
    // Считаем матрицу трансформации
    let matrix = null;
    if (transform) {
        matrix = this.parseTransformString(transform);
    }
    
    const apply = (x, y) => {
        if (!matrix) return { x, y };
        return this.applyMatrixToPoint(matrix, x, y);
    };
    
    if (segments.length === 0) {
        // Нет сегментов — показываем оригинал как есть
        this.showBezierContourVisuals(contour.vectors);
        return;
    }
    
    // Применяем к оригинальным векторам
    const count = Math.min(segments.length, contour.vectors.length);
    
    for (let i = 0; i < count; i++) {
        const seg = segments[i];
        const vector = contour.vectors[i];
        
        const fromPoint = this.state.bezierPoints[vector.from];
        const toPoint = this.state.bezierPoints[vector.to];
        if (!fromPoint || !toPoint) continue;
        
        const startPt = apply(seg.start.x, seg.start.y);
        const c1 = apply(seg.c1.x, seg.c1.y);
        const c2 = apply(seg.c2.x, seg.c2.y);
        const endPt = apply(seg.end.x, seg.end.y);
        
        fromPoint.x = startPt.x;
        fromPoint.y = startPt.y;
        if (fromPoint.element) {
            fromPoint.element.setAttribute('cx', fromPoint.x);
            fromPoint.element.setAttribute('cy', fromPoint.y);
        }
        
        toPoint.x = endPt.x;
        toPoint.y = endPt.y;
        if (toPoint.element) {
            toPoint.element.setAttribute('cx', toPoint.x);
            toPoint.element.setAttribute('cy', toPoint.y);
        }
        
        vector.control1.x = c1.x;
        vector.control1.y = c1.y;
        vector.control2.x = c2.x;
        vector.control2.y = c2.y;
        
        this.updateBezierVectorPath(vector);
        this.updateVectorGuides(vector);
    }
    
    // Показываем оригинал
    this.showBezierContourVisuals(contour.vectors);
    
    // Сохраняем снимок
    this.saveSnapshot();
}

// Парсит строку d в массив сегментов (M + C)
parseBezierSegments(d) {
    if (!d) return [];
    
    const segments = [];
    const regex = /M\s*([\d.eE+-]+)\s+([\d.eE+-]+)\s+C\s*([\d.eE+-]+)\s+([\d.eE+-]+)\s+([\d.eE+-]+)\s+([\d.eE+-]+)\s+([\d.eE+-]+)\s+([\d.eE+-]+)/g;
    
    let match;
    while ((match = regex.exec(d)) !== null) {
        segments.push({
            start: { x: parseFloat(match[1]), y: parseFloat(match[2]) },
            c1:    { x: parseFloat(match[3]), y: parseFloat(match[4]) },
            c2:    { x: parseFloat(match[5]), y: parseFloat(match[6]) },
            end:   { x: parseFloat(match[7]), y: parseFloat(match[8]) }
        });
    }
    
    return segments;
}

updateSelectionHandles() {
    if (this.selectedElement) {
        this.showSelectionHandles(this.selectedElement);
    }
}

// ПЕРЕМЕЩЕНИЕ
startElementDrag(e, element) {
    const coords = this.getSVGCoordinates(e);
    
    const isBezierVector = element.classList && element.classList.contains('bezier-vector');
    
    if (isBezierVector) {
        this.startBezierContourDrag(e, element);
        return;
    }
    
    this.state.isDraggingElement = true;
    this.state.draggingElement = element;
    this.state.draggingStartMouseX = coords.x;
    this.state.draggingStartMouseY = coords.y;
    
    const tag = element.tagName.toLowerCase();
    
    // Сохраняем начальные координаты
    if (tag === 'image') {
        this.state.draggingStartElementX = parseFloat(element.getAttribute('x')) || 0;
        this.state.draggingStartElementY = parseFloat(element.getAttribute('y')) || 0;
    } else if (tag === 'line') {
        this.state.lineDragData = {
            x1: parseFloat(element.getAttribute('x1')) || 0,
            y1: parseFloat(element.getAttribute('y1')) || 0,
            x2: parseFloat(element.getAttribute('x2')) || 0,
            y2: parseFloat(element.getAttribute('y2')) || 0
        };
    } else if (tag === 'rect') {
        this.state.draggingStartElementX = parseFloat(element.getAttribute('x')) || 0;
        this.state.draggingStartElementY = parseFloat(element.getAttribute('y')) || 0;
    } else if (tag === 'circle' || tag === 'ellipse') {
        this.state.draggingStartElementX = parseFloat(element.getAttribute('cx')) || 0;
        this.state.draggingStartElementY = parseFloat(element.getAttribute('cy')) || 0;
    } else if (tag === 'path') {
        const d = element.getAttribute('d');
        if (d) {
            this.state.draggingStartPathD = d;
        }
    }
    
    // === СОХРАНЯЕМ ЦЕНТР ПОВОРОТА ===
    const transform = element.getAttribute('transform') || '';
    const rotateMatch = transform.match(/rotate\(([^,]+),\s*([^,]+),\s*([^)]+)\)/);
    if (rotateMatch) {
        this.state.draggingRotationCenter = {
            x: parseFloat(rotateMatch[2]),
            y: parseFloat(rotateMatch[3])
        };
    } else {
        this.state.draggingRotationCenter = null;
    }
    
    this.svg.style.cursor = 'grabbing';
}

getElementPosition(element) {
    const tag = element.tagName.toLowerCase();
    
    if (tag === 'image') {
        return {
            x: parseFloat(element.getAttribute('x')) || 0,
            y: parseFloat(element.getAttribute('y')) || 0
        };
    } else if (tag === 'line') {
        return {
            x1: parseFloat(element.getAttribute('x1')) || 0,
            y1: parseFloat(element.getAttribute('y1')) || 0,
            x2: parseFloat(element.getAttribute('x2')) || 0,
            y2: parseFloat(element.getAttribute('y2')) || 0
        };
    } else if (tag === 'rect') {
        return {
            x: parseFloat(element.getAttribute('x')) || 0,
            y: parseFloat(element.getAttribute('y')) || 0,
            width: parseFloat(element.getAttribute('width')) || 0,
            height: parseFloat(element.getAttribute('height')) || 0
        };
    } else if (tag === 'circle') {
        return {
            cx: parseFloat(element.getAttribute('cx')) || 0,
            cy: parseFloat(element.getAttribute('cy')) || 0,
            r: parseFloat(element.getAttribute('r')) || 0
        };
    } else if (tag === 'ellipse') {
        return {
            cx: parseFloat(element.getAttribute('cx')) || 0,
            cy: parseFloat(element.getAttribute('cy')) || 0,
            rx: parseFloat(element.getAttribute('rx')) || 0,
            ry: parseFloat(element.getAttribute('ry')) || 0
        };
    } else if (tag === 'path') {
        return {
            d: element.getAttribute('d') || ''
        };
    }
    
    return {};
}

doElementDrag(e) {
    if (!this.state.isDraggingElement) return;
    
    const coords = this.getSVGCoordinates(e);
    
    if (this.state.bezierContourDragData) {
        this.doBezierContourDrag(coords.x, coords.y);
        return;
    }
    
    if (!this.state.draggingElement) return;
    
    const element = this.state.draggingElement;
    const tag = element.tagName.toLowerCase();
    
    const dx = coords.x - this.state.draggingStartMouseX;
    const dy = coords.y - this.state.draggingStartMouseY;
    
    // Двигаем координаты элемента
    if (tag === 'image') {
        element.setAttribute('x', this.state.draggingStartElementX + dx);
        element.setAttribute('y', this.state.draggingStartElementY + dy);
    } else if (tag === 'line') {
        element.setAttribute('x1', this.state.lineDragData.x1 + dx);
        element.setAttribute('y1', this.state.lineDragData.y1 + dy);
        element.setAttribute('x2', this.state.lineDragData.x2 + dx);
        element.setAttribute('y2', this.state.lineDragData.y2 + dy);
    } else if (tag === 'rect') {
        element.setAttribute('x', this.state.draggingStartElementX + dx);
        element.setAttribute('y', this.state.draggingStartElementY + dy);
    } else if (tag === 'circle' || tag === 'ellipse') {
        element.setAttribute('cx', this.state.draggingStartElementX + dx);
        element.setAttribute('cy', this.state.draggingStartElementY + dy);
    } else if (tag === 'path') {
        if (this.state.draggingStartPathD) {
            const newD = this.translatePath(this.state.draggingStartPathD, dx, dy);
            element.setAttribute('d', newD);
        }
    }
    
    // === СДВИГАЕМ ЦЕНТР ПОВОРОТА ВМЕСТЕ С ЭЛЕМЕНТОМ ===
    if (this.state.draggingRotationCenter) {
        const transform = element.getAttribute('transform') || '';
        const rotateMatch = transform.match(/rotate\(([^,]+),\s*([^,]+),\s*([^)]+)\)/);
        if (rotateMatch) {
            const angle = rotateMatch[1];
            const newCx = this.state.draggingRotationCenter.x + dx;
            const newCy = this.state.draggingRotationCenter.y + dy;
            
            // Заменяем rotate с новым центром
            const newTransform = transform.replace(
                /rotate\([^)]+\)/,
                `rotate(${angle}, ${newCx}, ${newCy})`
            );
            element.setAttribute('transform', newTransform);
        }
    }
    
    // Обновляем рамку
    if (this.selectedElement === element) {
        this.updateSelectionHandles();
    }
}

stopElementDrag() {
    if (!this.state.isDraggingElement) return;
    
    this.state.bezierContourDragData = null;
    this.state.lineDragData = null;
    this.state.draggingStartPathD = null;
    this.state.draggingRotationCenter = null;
    
    this.state.isDraggingElement = false;
    this.state.draggingElement = null;
    
    if (this.selectedElement) {
        this.updateSelectionHandles();
    }
    
    if (this.state.currentTool === 'select') {
        this.svg.style.cursor = 'move';
    } else {
        this.svg.style.cursor = 'crosshair';
    }
}

// ПЕРЕМЕЩЕНИЕ ОПОРНОЙ ТОЧКИ
startPivotDrag(e) {
    if (!this.selectedElement) return;
    
    const coords = this.getSVGCoordinates(e);
    const element = this.selectedElement;
    const rotation = this.getElementRotation(element);
    
    // Сохраняем угол и временно убираем поворот
    this.isDraggingPivot = true;
    this.pivotDragData = {
        startX: coords.x,
        startY: coords.y,
        element: element,
        angle: rotation.angle,
        savedTransform: element.getAttribute('transform') || ''
    };
    
    // Временно убираем rotate
    if (rotation.angle !== 0) {
        element.setAttribute('transform', `rotate(0, ${coords.x}, ${coords.y})`);
    } else {
        element.setAttribute('transform', `rotate(0, ${coords.x}, ${coords.y})`);
    }
    
    this.svg.style.cursor = 'grabbing';
    this.updateSelectionHandles();
}

// В doPivotDrag - просто визуальное обновление без изменения transform
doPivotDrag(e) {
    if (!this.isDraggingPivot || !this.pivotDragData) return;
    
    const coords = this.getSVGCoordinates(e);
    this.pivotDragData.endX = coords.x;
    this.pivotDragData.endY = coords.y;
    
    this.updatePivotPreview(coords.x, coords.y);
}

// В stopPivotDrag - одно применение
stopPivotDrag() {
    if (!this.isDraggingPivot || !this.pivotDragData) return;
    
    const data = this.pivotDragData;
    const element = data.element;
    
    if (data.endX !== undefined) {
        // Возвращаем сохранённый угол с новой позицией pivot
        const angleDeg = data.angle * 180 / Math.PI;
        element.setAttribute('transform', `rotate(${angleDeg}, ${data.endX}, ${data.endY})`);
    } else {
        // Восстанавливаем оригинальный transform
        element.setAttribute('transform', data.savedTransform);
    }
    
    this.isDraggingPivot = false;
    this.pivotDragData = null;
    this.svg.style.cursor = 'move';
    this.updateSelectionHandles();
}

updatePivotPreview(x, y) {
    const handles = document.getElementById('selection-handles');
    if (!handles) return;
    
    // Находим точку центра вращения
    const pivotPoint = handles.querySelector('[data-type="pivot"]');
    if (pivotPoint) {
        pivotPoint.setAttribute('cx', x);
        pivotPoint.setAttribute('cy', y);
    }
    
}

// МАСШТАБИРОВАНИЕ
startResizing(e, handleType) {
    if (!this.selectedElement) return;
    
    const coords = this.getSVGCoordinates(e);
    const element = this.selectedElement;
    
    this.isResizing = true;
    
    // Сохраняем начальные данные
    this.resizeStart = {
        mouseX: coords.x,
        mouseY: coords.y,
        bbox: this.getElementBBox(element),
        position: this.getElementPosition(element),
        center: this.getElementCenter(element),
        rotation: this.getElementRotation(element),
        type: handleType,
        element: element
    };
}

doResize(e) {
    if (!this.isResizing || !this.resizeStart) return;
    
    const coords = this.getSVGCoordinates(e);
    const data = this.resizeStart;
    const element = data.element;
    
    // Смещение мыши в глобальных координатах
    let dx = coords.x - data.mouseX;
    let dy = coords.y - data.mouseY;
    
    // Если фигура повёрнута — преобразуем смещение в локальные координаты
    if (data.rotation.angle !== 0) {
        const rotated = this.rotatePoint(
            data.mouseX + dx, 
            data.mouseY + dy, 
            data.center.x, 
            data.center.y, 
            -data.rotation.angle
        );
        const original = this.rotatePoint(
            data.mouseX, 
            data.mouseY, 
            data.center.x, 
            data.center.y, 
            -data.rotation.angle
        );
        dx = rotated.x - original.x;
        dy = rotated.y - original.y;
    }
    
    let newBBox = { ...data.bbox };
    const type = data.type;
    
    // Изменяем bbox в зависимости от типа хендла
    if (type.includes('e')) {
        newBBox.width = Math.max(10, data.bbox.width + dx);
    }
    if (type.includes('w')) {
        newBBox.width = Math.max(10, data.bbox.width - dx);
        newBBox.x = data.bbox.x + data.bbox.width - newBBox.width;
    }
    if (type.includes('s')) {
        newBBox.height = Math.max(10, data.bbox.height + dy);
    }
    if (type.includes('n')) {
        newBBox.height = Math.max(10, data.bbox.height - dy);
        newBBox.y = data.bbox.y + data.bbox.height - newBBox.height;
    }
    
    // Применяем новый bbox к элементу
    this.applyBBoxToElement(element, newBBox, data.position);
    
    this.updateSelectionHandles();
}

applyBBoxToElement(element, bbox, originalPosition) {
    const tag = element.tagName.toLowerCase();
    const cx = bbox.x + bbox.width / 2;
    const cy = bbox.y + bbox.height / 2;
    
    if (tag === 'circle') {
        const r = Math.min(bbox.width, bbox.height) / 2;
        element.setAttribute('cx', cx);
        element.setAttribute('cy', cy);
        element.setAttribute('r', r);
        
    } else if (tag === 'rect') {
        element.setAttribute('x', bbox.x);
        element.setAttribute('y', bbox.y);
        element.setAttribute('width', bbox.width);
        element.setAttribute('height', bbox.height);
        
    } else if (tag === 'line') {
        const oldCenter = {
            x: (originalPosition.x1 + originalPosition.x2) / 2,
            y: (originalPosition.y1 + originalPosition.y2) / 2
        };
        const scaleX = bbox.width / (Math.abs(originalPosition.x2 - originalPosition.x1) || 1);
        const scaleY = bbox.height / (Math.abs(originalPosition.y2 - originalPosition.y1) || 1);
        
        element.setAttribute('x1', oldCenter.x + (originalPosition.x1 - oldCenter.x) * scaleX);
        element.setAttribute('y1', oldCenter.y + (originalPosition.y1 - oldCenter.y) * scaleY);
        element.setAttribute('x2', oldCenter.x + (originalPosition.x2 - oldCenter.x) * scaleX);
        element.setAttribute('y2', oldCenter.y + (originalPosition.y2 - oldCenter.y) * scaleY);
        
        const newCenter = this.getElementCenter(element);
        element.setAttribute('x1', parseFloat(element.getAttribute('x1')) + cx - newCenter.x);
        element.setAttribute('y1', parseFloat(element.getAttribute('y1')) + cy - newCenter.y);
        element.setAttribute('x2', parseFloat(element.getAttribute('x2')) + cx - newCenter.x);
        element.setAttribute('y2', parseFloat(element.getAttribute('y2')) + cy - newCenter.y);
        
    } else if (tag === 'path') {
        // Перемещаем каждую точку относительно центра
        const d = element.getAttribute('d');
        if (!d) return;
        
        const oldBBox = this.getElementBBox(element);
        const oldCx = oldBBox.x + oldBBox.width / 2;
        const oldCy = oldBBox.y + oldBBox.height / 2;
        const scaleX = bbox.width / (oldBBox.width || 1);
        const scaleY = bbox.height / (oldBBox.height || 1);
        
        // Преобразуем все координаты в path
        const commands = d.match(/[a-zA-Z][^a-zA-Z]*/g) || [];
        let newD = '';
        
        commands.forEach(cmd => {
            const type = cmd[0];
            const coords = cmd.slice(1).trim().split(/[\s,]+/).map(Number);
            let newCmd = type;
            
            for (let i = 0; i < coords.length; i += 2) {
                if (i + 1 < coords.length) {
                    // Масштабируем относительно старого центра
                    const x = oldCx + (coords[i] - oldCx) * scaleX;
                    // Сдвигаем к новому центру
                    const newX = x + (cx - oldCx);
                    const y = oldCy + (coords[i + 1] - oldCy) * scaleY;
                    const newY = y + (cy - oldCy);
                    newCmd += ` ${newX} ${newY}`;
                }
            }
            newD += newCmd + ' ';
        });
        
        element.setAttribute('d', newD.trim());
    }
	
}

// ПОВОРОТ
startRotating(e) {
    if (!this.selectedElement) return;
    
    const coords = this.getSVGCoordinates(e);
    const element = this.selectedElement;
    const center = this.getElementCenter(element);
    const rotation = this.getElementRotation(element);
    
    // Вычисляем начальный угол между мышью и центром
    const dx = coords.x - center.x;
    const dy = coords.y - center.y;
    const startMouseAngle = Math.atan2(dy, dx);
    
    this.isRotating = true;
    this.rotateStart = {
        center: center,
        startMouseAngle: startMouseAngle,
        startFigureAngle: rotation.angle,
        element: element
    };
}

doRotate(e) {
    if (!this.isRotating || !this.rotateStart) return;
    
    const coords = this.getSVGCoordinates(e);
    const data = this.rotateStart;
    
    // Текущий угол между мышью и центром
    const dx = coords.x - data.center.x;
    const dy = coords.y - data.center.y;
    const currentMouseAngle = Math.atan2(dy, dx);
    
    // Изменение угла
    const deltaAngle = currentMouseAngle - data.startMouseAngle;
    
    // Новый угол фигуры
    const newAngle = data.startFigureAngle + deltaAngle;
    const newAngleDeg = newAngle * 180 / Math.PI;
    
    // Применяем поворот
    this.setElementRotation(
        data.element, 
        newAngleDeg, 
        data.center.x, 
        data.center.y
    );
    
    // Обновляем рамку
    this.updateSelectionHandles();
}

            // ИЗОБРАЖЕНИЕ
addWhiteBackgroundToPNG(img) {
    return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        const imgWithBackground = new Image();
        imgWithBackground.onload = () => {
            resolve(imgWithBackground);
        };
        imgWithBackground.src = canvas.toDataURL();
    });
}
          
saveSVG() {
    // Получаем физические размеры листа из полей ввода
    const mmWidth = parseFloat(document.getElementById('mmWidth')?.value) || 210;
    const mmHeight = parseFloat(document.getElementById('mmHeight')?.value) || 297;
    
    // Находим подложку рабочего листа
    const worksheetElement = document.getElementById('worksheet-background');    
    const sheetX = parseFloat(worksheetElement.getAttribute('x')) || 0;
    const sheetY = parseFloat(worksheetElement.getAttribute('y')) || 0;
    const sheetWidth = parseFloat(worksheetElement.getAttribute('width')) || 1000;
    const sheetHeight = parseFloat(worksheetElement.getAttribute('height')) || 1000;

    // Создаем SVG с размерами в мм и сохраняем масштабы
    let svgContent = `<?xml version="1.0" encoding="UTF-8"?>
<svg width="${mmWidth}mm" height="${mmHeight}mm" viewBox="0 0 ${mmWidth} ${mmHeight}" 
     xmlns="http://www.w3.org/2000/svg">
`;

    const scaleX = mmWidth / sheetWidth;
    const scaleY = mmHeight / sheetHeight;
    const avgScale = (scaleX + scaleY) / 2;
	
    const photoElement = document.getElementById('photo-overlay');
    
    
    // Функция преобразования координат из viewBox в мм
    // Вычитаем sheetX и sheetY чтобы привязаться к левому верхнему углу листа
    const toMM = (x, y) => {
        return {
            x: (x - sheetX) * scaleX,
            y: (y - sheetY) * scaleY
        };
    };
    
    // 1. Сохраняем подложку (белый лист)
    /*if (this.state.worksheetUrl) {
        svgContent += `  <!-- Рабочий лист -->\n`;
        svgContent += `  <image x="0" y="0" width="${mmWidth}" height="${mmHeight}" 
                    href="${this.state.worksheetUrl}" preserveAspectRatio="none"/>\n`;
    }*/
    
    // 2. Сохраняем фото (если есть)
    if (photoElement && this.state.imageUrl) {
        const photoX = parseFloat(photoElement.getAttribute('x')) || 0;
        const photoY = parseFloat(photoElement.getAttribute('y')) || 0;
        const photoWidth = parseFloat(photoElement.getAttribute('width')) || 0;
        const photoHeight = parseFloat(photoElement.getAttribute('height')) || 0;
        const opacity = photoElement.style.opacity || 1;
        
        const pos = toMM(photoX, photoY);
        const widthMM = photoWidth * scaleX;
        const heightMM = photoHeight * scaleY;
        
        svgContent += `  <!-- Фото -->\n`;
        svgContent += `  <image x="${pos.x.toFixed(3)}" y="${pos.y.toFixed(3)}" 
                    width="${widthMM.toFixed(3)}" height="${heightMM.toFixed(3)}" 
                    opacity="${opacity}" href="${this.state.imageUrl}" 
                    preserveAspectRatio="none"/>\n`;
    }
    
    // 3. Сохраняем все векторные элементы
    const vectorElements = this.svg.querySelectorAll('path:not([id*="indicator"]), line:not([id*="indicator"]), rect:not([id*="indicator"]), circle:not([id*="indicator"]), ellipse:not([id*="indicator"])');
	
    vectorElements.forEach(el => {
        // Пропускаем фоновые элементы и фото
        if (el.id && (el.id.includes('background') || el.id === 'photo-overlay')) {
            return;
        }
        
        // Пропускаем вспомогательные элементы Безье
        if (el.classList && 
            (el.classList.contains('bezier-guide-line') || 
             el.classList.contains('bezier-control-point') ||
             el.classList.contains('bezier-point'))) {
            return;
        }
        
        const tag = el.tagName.toLowerCase();
        const stroke = el.getAttribute('stroke') || '#000000';
        const strokeWidth = parseFloat(el.getAttribute('stroke-width')) || 1;
		const scaledStrokeWidth = (strokeWidth * avgScale).toFixed(3);
        const fill = el.getAttribute('fill') || 'none';
        const strokeLinecap = el.getAttribute('stroke-linecap') || 'round';
        const strokeLinejoin = el.getAttribute('stroke-linejoin') || 'round';
        
        
        if (tag === 'path') {
            const d = el.getAttribute('d');
            if (d) {
                const convertedD = this.transformPathToMM(d, toMM);
                svgContent += `  <path d="${convertedD}" fill="${fill}" stroke="${stroke}" 
                         stroke-width="${scaledStrokeWidth}" stroke-linecap="${strokeLinecap}" 
                         stroke-linejoin="${strokeLinejoin}"/>\n`;
            }
        } else if (tag === 'line') {
            const x1 = parseFloat(el.getAttribute('x1'));
            const y1 = parseFloat(el.getAttribute('y1'));
            const x2 = parseFloat(el.getAttribute('x2'));
            const y2 = parseFloat(el.getAttribute('y2'));
            
            if (!isNaN(x1) && !isNaN(y1) && !isNaN(x2) && !isNaN(y2)) {
                const p1 = toMM(x1, y1);
                const p2 = toMM(x2, y2);
                svgContent += `  <line x1="${p1.x.toFixed(3)}" y1="${p1.y.toFixed(3)}" 
                             x2="${p2.x.toFixed(3)}" y2="${p2.y.toFixed(3)}" 
                             stroke="${stroke}" stroke-width="${scaledStrokeWidth}" 
                             stroke-linecap="${strokeLinecap}"/>\n`;
            }
        } else if (tag === 'rect') {
            const x = parseFloat(el.getAttribute('x'));
            const y = parseFloat(el.getAttribute('y'));
            const width = parseFloat(el.getAttribute('width'));
            const height = parseFloat(el.getAttribute('height'));
            
            if (!isNaN(x) && !isNaN(y) && !isNaN(width) && !isNaN(height)) {
                const pos = toMM(x, y);
                const wMM = width * scaleX;
                const hMM = height * scaleY;
                svgContent += `  <rect x="${pos.x.toFixed(3)}" y="${pos.y.toFixed(3)}" 
                             width="${wMM.toFixed(3)}" height="${hMM.toFixed(3)}" 
                             fill="${fill}" stroke="${stroke}" stroke-width="${scaledStrokeWidth}"/>\n`;
            }
        } else if (tag === 'circle') {
            const cx = parseFloat(el.getAttribute('cx'));
            const cy = parseFloat(el.getAttribute('cy'));
            const r = parseFloat(el.getAttribute('r'));
            
            if (!isNaN(cx) && !isNaN(cy) && !isNaN(r)) {
                const center = toMM(cx, cy);
                const rMM = r * scaleX;
                svgContent += `  <circle cx="${center.x.toFixed(3)}" cy="${center.y.toFixed(3)}" 
                             r="${rMM.toFixed(3)}" fill="${fill}" stroke="${stroke}" 
                             stroke-width="${scaledStrokeWidth}"/>\n`;
            }
        } else if (tag === 'ellipse') {
            const cx = parseFloat(el.getAttribute('cx'));
            const cy = parseFloat(el.getAttribute('cy'));
            const rx = parseFloat(el.getAttribute('rx'));
            const ry = parseFloat(el.getAttribute('ry'));
            
            if (!isNaN(cx) && !isNaN(cy) && !isNaN(rx) && !isNaN(ry)) {
                const center = toMM(cx, cy);
                const rxMM = rx * scaleX;
                const ryMM = ry * scaleY;
                svgContent += `  <ellipse cx="${center.x.toFixed(3)}" cy="${center.y.toFixed(3)}" 
                             rx="${rxMM.toFixed(3)}" ry="${ryMM.toFixed(3)}" 
                             fill="${fill}" stroke="${stroke}" stroke-width="${scaledStrokeWidth}"/>\n`;
            }
        }
    });
    
    svgContent += '</svg>';
    
    // Скачиваем файл
    const blob = new Blob([svgContent], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `vector_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.svg`;
    document.body.appendChild(a);
    a.click();
    
    setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }, 100);
    
}

loadSVG(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        const parser = new DOMParser();
        const svgDoc = parser.parseFromString(e.target.result, 'image/svg+xml');
        const loadedSvg = svgDoc.querySelector('svg');
        
        if (!loadedSvg) {
            alert('Файл не является валидным SVG');
            return;
        }

        // Получаем размеры загруженного SVG в мм
        let svgWidthMM, svgHeightMM;
        
        const widthAttr = loadedSvg.getAttribute('width');
        const heightAttr = loadedSvg.getAttribute('height');
        
        svgWidthMM = parseFloat(widthAttr);
        svgHeightMM = parseFloat(heightAttr);
        
        if (isNaN(svgWidthMM) || isNaN(svgHeightMM)) {
            const viewBox = loadedSvg.getAttribute('viewBox');
            if (viewBox) {
                const parts = viewBox.split(' ');
                svgWidthMM = parseFloat(parts[2]) || 1000;
                svgHeightMM = parseFloat(parts[3]) || 1000;
            } else {
                svgWidthMM = 1000;
                svgHeightMM = 1000;
            }
        }
        
        // Получаем текущий лист
        const worksheetElement = document.getElementById('worksheet-background');
        const sheetX = parseFloat(worksheetElement?.getAttribute('x')) || 0;
        const sheetY = parseFloat(worksheetElement?.getAttribute('y')) || 0;
        const sheetWidth = parseFloat(worksheetElement?.getAttribute('width')) || 1000;
        const sheetHeight = parseFloat(worksheetElement?.getAttribute('height')) || 1000;
        
        // КООРДИНАТНЫЙ масштаб: из мм в viewBox
        const coordScaleX = sheetWidth / svgWidthMM;
        const coordScaleY = sheetHeight / svgHeightMM;
        
        // МАСШТАБ ТОЛЩИНЫ: такой же как при сохранении!
        const currentMmWidth = parseFloat(document.getElementById('mmWidth')?.value) || 210;
        const currentMmHeight = parseFloat(document.getElementById('mmHeight')?.value) || 297;
        const thicknessScale = (currentMmWidth / sheetWidth + currentMmHeight / sheetHeight) / 2;
        
        // Загружаем: для координат - coordScale, для толщины - thicknessScale
        this.loadVectorsToCurrentCanvas(loadedSvg, coordScaleX, coordScaleY, sheetX, sheetY, thicknessScale);
        
        setTimeout(() => this.saveSnapshot(), 100);
    };
    reader.readAsText(file);
}

// Новый метод для загрузки векторов с преобразованием координат
loadVectorsToCurrentCanvas(sourceSvg, coordScaleX, coordScaleY, offsetX, offsetY, thicknessScale) {
    const vectors = sourceSvg.querySelectorAll('path, line, rect, circle, ellipse');
    
    vectors.forEach(vector => {
        const clonedVector = vector.cloneNode(true);
        const tag = clonedVector.tagName.toLowerCase();

        // Масштабируем толщину линии
        const strokeWidth = parseFloat(clonedVector.getAttribute('stroke-width'));
        if (!isNaN(strokeWidth)) {
            clonedVector.setAttribute('stroke-width', (strokeWidth / thicknessScale).toFixed(2));
        }
        
        if (tag === 'path') {
            const d = clonedVector.getAttribute('d') || '';
            if (d.includes(' C ') || d.includes(' c ') || d.startsWith('C') || d.startsWith('c')) {
                this.processBezierFromSVG(clonedVector, coordScaleX, coordScaleY, offsetX, offsetY);
                return;
            }
        }
        
        switch(tag) {
            case 'path':
                const d = clonedVector.getAttribute('d');
                if (d) {
                    const transformedD = this.transformPathCoordinates(d, coordScaleX, coordScaleY, offsetX, offsetY);
                    clonedVector.setAttribute('d', transformedD);
                }
                break;
                
            case 'line':
                const x1 = parseFloat(clonedVector.getAttribute('x1'));
                const y1 = parseFloat(clonedVector.getAttribute('y1'));
                const x2 = parseFloat(clonedVector.getAttribute('x2'));
                const y2 = parseFloat(clonedVector.getAttribute('y2'));
                
                if (!isNaN(x1) && !isNaN(y1)) {
                    clonedVector.setAttribute('x1', x1 * coordScaleX + offsetX);
                    clonedVector.setAttribute('y1', y1 * coordScaleY + offsetY);
                }
                if (!isNaN(x2) && !isNaN(y2)) {
                    clonedVector.setAttribute('x2', x2 * coordScaleX + offsetX);
                    clonedVector.setAttribute('y2', y2 * coordScaleY + offsetY);
                }
                break;
                
            case 'rect':
                const rectX = parseFloat(clonedVector.getAttribute('x'));
                const rectY = parseFloat(clonedVector.getAttribute('y'));
                const rectWidth = parseFloat(clonedVector.getAttribute('width'));
                const rectHeight = parseFloat(clonedVector.getAttribute('height'));
                
                if (!isNaN(rectX)) clonedVector.setAttribute('x', rectX * coordScaleX + offsetX);
                if (!isNaN(rectY)) clonedVector.setAttribute('y', rectY * coordScaleY + offsetY);
                if (!isNaN(rectWidth)) clonedVector.setAttribute('width', rectWidth * coordScaleX);
                if (!isNaN(rectHeight)) clonedVector.setAttribute('height', rectHeight * coordScaleY);
                break;
                
            case 'circle':
                const cx = parseFloat(clonedVector.getAttribute('cx'));
                const cy = parseFloat(clonedVector.getAttribute('cy'));
                const radius = parseFloat(clonedVector.getAttribute('r'));
                
                if (!isNaN(cx)) clonedVector.setAttribute('cx', cx * coordScaleX + offsetX);
                if (!isNaN(cy)) clonedVector.setAttribute('cy', cy * coordScaleY + offsetY);
                if (!isNaN(radius)) clonedVector.setAttribute('r', radius * coordScaleX);
                break;
                
            case 'ellipse':
                const ellipseCx = parseFloat(clonedVector.getAttribute('cx'));
                const ellipseCy = parseFloat(clonedVector.getAttribute('cy'));
                const ellipseRx = parseFloat(clonedVector.getAttribute('rx'));
                const ellipseRy = parseFloat(clonedVector.getAttribute('ry'));
                
                if (!isNaN(ellipseCx)) clonedVector.setAttribute('cx', ellipseCx * coordScaleX + offsetX);
                if (!isNaN(ellipseCy)) clonedVector.setAttribute('cy', ellipseCy * coordScaleY + offsetY);
                if (!isNaN(ellipseRx)) clonedVector.setAttribute('rx', ellipseRx * coordScaleX);
                if (!isNaN(ellipseRy)) clonedVector.setAttribute('ry', ellipseRy * coordScaleY);
                break;
        }
        
        if (!clonedVector.getAttribute('stroke')) {
            clonedVector.setAttribute('stroke', '#4dabf7');
        }
        if (!clonedVector.getAttribute('stroke-width')) {
            clonedVector.setAttribute('stroke-width', '2');
        }
        if (!clonedVector.getAttribute('fill')) {
            clonedVector.setAttribute('fill', 'none');
        }
        this.svg.appendChild(clonedVector);
    });
}

parseBezierFromSVG(pathElement, scaleX = 1, scaleY = 1, offsetX = 0, offsetY = 0) {
    const d = pathElement.getAttribute('d');
    if (!d) return null;
    const commands = d.split(/(?=[MCL])/);
    
    if (commands.length < 2) return null;

    const firstCmd = commands[0].trim();
    const secondCmd = commands[1].trim();
    
    if (!firstCmd.startsWith('M') || !secondCmd.startsWith('C')) {
        return null; 
    }

    const moveCoords = firstCmd.substring(1).trim().split(/[\s,]+/).map(Number);
    if (moveCoords.length < 2) return null;

    const curveCoords = secondCmd.substring(1).trim().split(/[\s,]+/).map(Number);
    if (curveCoords.length < 6) return null;
    
    const applyTransform = (x, y) => ({
        x: x * scaleX + offsetX,
        y: y * scaleY + offsetY
    });
    
    return {
        startPoint: applyTransform(moveCoords[0], moveCoords[1]),
        control1: applyTransform(curveCoords[0], curveCoords[1]),
        control2: applyTransform(curveCoords[2], curveCoords[3]),
        endPoint: applyTransform(curveCoords[4], curveCoords[5]),
        originalElement: pathElement
    };
}

processBezierFromSVG(pathElement, scaleX, scaleY, offsetX, offsetY) {

    const bezierData = this.parseBezierFromSVG(pathElement, scaleX, scaleY, offsetX, offsetY);
    if (!bezierData) {
        this.svg.appendChild(pathElement);
        return;
    }
    
    const { startPoint, control1, control2, endPoint } = bezierData;
    
    const point1 = {
        x: startPoint.x,
        y: startPoint.y,
        element: null,
        index: this.state.bezierPoints.length
    };
    
    const point2 = {
        x: endPoint.x,
        y: endPoint.y,
        element: null,
        index: this.state.bezierPoints.length + 1
    };
    point1.element = this.createBezierPointElement(point1);
    point2.element = this.createBezierPointElement(point2);
    point1.element.style.display = 'none';
    point2.element.style.display = 'none';
    
    this.svg.appendChild(point1.element);
    this.svg.appendChild(point2.element);
    
    this.state.bezierPoints.push(point1, point2);
    
    const vector = {
        from: point1.index,
        to: point2.index,
        control1: { 
            x: control1.x, 
            y: control1.y, 
            belongsTo: point1.index 
        },
        control2: { 
            x: control2.x, 
            y: control2.y, 
            belongsTo: point2.index 
        },
        path: pathElement,
        guideElements: {}
    };
    
    pathElement.setAttribute('d', 
        `M ${startPoint.x} ${startPoint.y} C ${control1.x} ${control1.y} ${control2.x} ${control2.y} ${endPoint.x} ${endPoint.y}`
    );
    
    pathElement.classList.add('bezier-vector');
    if (!pathElement.getAttribute('stroke')) {
        pathElement.setAttribute('stroke', this.state.strokeColor);
    }
    if (!pathElement.getAttribute('stroke-width')) {
        pathElement.setAttribute('stroke-width', this.state.strokeWidth);
    }
    if (!pathElement.getAttribute('fill')) {
        pathElement.setAttribute('fill', 'none');
    }
    pathElement.setAttribute('stroke-linecap', 'round');
    
    this.svg.appendChild(pathElement);
    
    this.createVectorGuides(vector, point1, point2);
    
    if (vector.guideElements.line1) vector.guideElements.line1.style.display = 'none';
    if (vector.guideElements.control1) vector.guideElements.control1.style.display = 'none';
    if (vector.guideElements.line2) vector.guideElements.line2.style.display = 'none';
    if (vector.guideElements.control2) vector.guideElements.control2.style.display = 'none';
    
    this.state.bezierVectors.push(vector);
}

// Метод для преобразования координат в пути (d атрибут)
transformPathCoordinates(d, scaleX, scaleY, offsetX, offsetY) {
    const commands = d.match(/[MLCQZmlcqz][^MLCQZmlcqz]*/g) || [];
    
    let transformedPath = '';
    
    commands.forEach(commandStr => {
        const command = commandStr[0];
        const numbers = commandStr.substring(1).trim();
        
        if (!numbers) {
            transformedPath += command + ' ';
            return;
        }
        
        const numArray = numbers.split(/[\s,]+/).map(Number);
        let transformedNumbers = '';
        
        for (let i = 0; i < numArray.length; i += 2) {
            if (i + 1 < numArray.length) {
                const x = numArray[i] * scaleX + offsetX;
                const y = numArray[i + 1] * scaleY + offsetY;
                transformedNumbers += `${x} ${y} `;
            }
        }
        
        transformedPath += command + ' ' + transformedNumbers.trim() + ' ';
    });
    
    return transformedPath.trim();
}

// Метод для создания подложки A4
createA4Background() {
    const widthMm = 210;  
    const heightMm = 297; 
	this.state.originalImageRatio = widthMm / heightMm;
    
    const widthPx = Math.round(widthMm * 96 / 25.4);
    const heightPx = Math.round(heightMm * 96 / 25.4);
    
    document.getElementById('mmWidth').value = widthMm;
    document.getElementById('mmHeight').value = heightMm;
    this.updatePixelDisplay();
    this.createBackground(widthPx, heightPx);
}

// Обновление отображения пикселей
updatePixelDisplay() {
    const widthMm = parseInt(document.getElementById('mmWidth').value) || 210;
    const heightMm = parseInt(document.getElementById('mmHeight').value) || 297;
    const dpi = parseInt(document.getElementById('dpiInput').value) || 96;
    
    const widthPx = Math.round(widthMm * dpi / 25.4);
    const heightPx = Math.round(heightMm * dpi / 25.4);
    
    document.getElementById('pixelSizeDisplay').textContent = `${widthPx}×${heightPx} (${dpi} DPI)`;
}

// Создание подложки из полей ввода
createBackgroundFromInput() {
    const widthMm = parseInt(document.getElementById('mmWidth').value) || 210;
    const heightMm = parseInt(document.getElementById('mmHeight').value) || 297;
    const dpi = parseInt(document.getElementById('dpiInput').value) || 96;
    
    if (widthMm < 10 || heightMm < 10) {
        alert('Минимальный размер 10×10 мм');
        return;
    }
    
    if (widthMm > 1000 || heightMm > 1000) {
        alert('Максимальный размер 1000×1000 мм');
        return;
    }
    
    if (dpi < 10 || dpi > 600) {
        alert('DPI должен быть от 10 до 600');
        return;
    }

    // Преобразуем мм в пиксели с учетом DPI
    const widthPx = Math.round(widthMm * dpi / 25.4);
    const heightPx = Math.round(heightMm * dpi / 25.4);
    
    this.createBackground(widthPx, heightPx);
}

createBackground(width, height) {
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, width, height);
    
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, width - 1, height - 1);
    
    const img = new Image();
    img.onload = () => {
        const oldWorksheet = document.getElementById('worksheet-background');
        if (oldWorksheet) oldWorksheet.remove();
        
        this.state.worksheetImage = img;
        this.state.worksheetUrl = canvas.toDataURL('image/png');
        
        this.displayWorksheet(img);
        
        if (!this.state.image) {
            this.updateImageCache(img);
        }
    };
    img.src = canvas.toDataURL('image/png');
}

displayWorksheet(img) {
    while (this.worksheetLayer.firstChild) {
        this.worksheetLayer.removeChild(this.worksheetLayer.firstChild);
    }
    
    const worksheetElement = document.createElementNS('http://www.w3.org/2000/svg', 'image');
    worksheetElement.id = 'worksheet-background';
    worksheetElement.setAttribute('href', img.src || this.state.worksheetUrl);
    worksheetElement.style.opacity = '1.0';
    worksheetElement.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    worksheetElement.style.pointerEvents = 'none'; 
    
    this.worksheetLayer.appendChild(worksheetElement);

    this.centerWorksheet();
}

centerWorksheet() {
    if (!this.state.worksheetImage) return;
    
    const img = this.state.worksheetImage;
    const worksheetElement = document.getElementById('worksheet-background');
    if (!worksheetElement) return;
    
    // Фиксированный viewBox 1000x1000
    const viewBoxSize = 1000;
    const scale = Math.min(viewBoxSize / img.width, viewBoxSize / img.height) * 0.9;
    
    worksheetElement.setAttribute('width', img.width * scale);
    worksheetElement.setAttribute('height', img.height * scale);
    
    const x = (viewBoxSize - img.width * scale) / 2;
    const y = (viewBoxSize - img.height * scale) / 2;
    
    worksheetElement.setAttribute('x', x);
    worksheetElement.setAttribute('y', y);
}

loadImage(file) {
    const reader = new FileReader();
    reader.onload = async (e) => {
        const img = new Image();
        img.onload = async () => {
            this.state.image = img;
            this.state.imageUrl = e.target.result;
            this.state.originalImageRatio = img.width / img.height;
            this.updateAspectRatioDisplay(img.width, img.height);
            const display = document.getElementById('loadedImageSizeDisplay');
            if (display) {
                this.updateLoadedImageSizeDisplay(img);
            }

            this.removePhotoOnly();
            
            let imageForDisplay = img;
            let imageForSnapping = img;
            
            if (file.type === 'image/png' || file.name.toLowerCase().endsWith('.png')) {
                try {
                    imageForDisplay = await this.addWhiteBackgroundToPNG(img);
                    imageForSnapping = imageForDisplay;
                    this.state.imageUrl = imageForDisplay.src;
                } catch (error) {
                    console.warn('Не удалось обработать PNG:', error);
                    imageForDisplay = img;
                    imageForSnapping = img;
                }
            }
            
            this.state.imageForDisplay = imageForDisplay;
            this.displayPhoto(imageForDisplay);
            const imageControls = document.getElementById('imageControls');
            if (imageControls) imageControls.style.display = 'block';
            this.updateImageCache(imageForSnapping);
			this.setTool(this.state.currentTool);
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}
displayPhoto(img) {
    // Очищаем слой фото
    while (this.photoLayer.firstChild) {
        this.photoLayer.removeChild(this.photoLayer.firstChild);
    }
    
    // Сохраняем исходные размеры
    this.state.originalPhotoWidth = img.width;
    this.state.originalPhotoHeight = img.height;
    
    // Создаем фото
    const photoElement = document.createElementNS('http://www.w3.org/2000/svg', 'image');
    photoElement.id = 'photo-overlay';
    photoElement.setAttribute('href', img.src || this.state.imageUrl);
    
    const opacitySlider = document.getElementById('opacitySlider');
    photoElement.style.opacity = (opacitySlider?.value || 50) / 100;
    photoElement.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    
    if (this.state.currentTool === 'select') {
        photoElement.style.pointerEvents = 'all';
        photoElement.style.cursor = 'move';
    } else {
        photoElement.style.pointerEvents = 'none';
        photoElement.style.cursor = 'default';
    }
    
    this.photoLayer.appendChild(photoElement);
    
    // === НОВОЕ: вычисляем размер фото в пикселях SVG на основе DPI ===
    const currentDpi = parseInt(document.getElementById('dpiInput')?.value) || 96;
    
    // Получаем физический размер фото в дюймах (из пикселей / DPI)
    const photoWidthInches = img.width / currentDpi;
    const photoHeightInches = img.height / currentDpi;
    
    // Получаем размер рабочего листа в пикселях SVG
    const worksheetElement = document.getElementById('worksheet-background');
    const worksheetSvgWidth = worksheetElement ? 
        parseFloat(worksheetElement.getAttribute('width')) : 1000;
    const worksheetSvgHeight = worksheetElement ? 
        parseFloat(worksheetElement.getAttribute('height')) : 1000;
    
    // Получаем физический размер рабочего листа в мм из полей ввода
    const worksheetMmWidth = parseFloat(document.getElementById('mmWidth')?.value) || 210;
    const worksheetMmHeight = parseFloat(document.getElementById('mmHeight')?.value) || 297;
    
    // Переводим мм в дюймы (1 дюйм = 25.4 мм)
    const worksheetWidthInches = worksheetMmWidth / 25.4;
    const worksheetHeightInches = worksheetMmHeight / 25.4;
    
    // Вычисляем масштаб: сколько SVG-пикселей приходится на 1 дюйм
    const svgPixelsPerInchX = worksheetSvgWidth / worksheetWidthInches;
    const svgPixelsPerInchY = worksheetSvgHeight / worksheetHeightInches;
    
    // Вычисляем размер фото в SVG-пикселях (сохраняя его физический размер)
    const photoSvgWidth = photoWidthInches * svgPixelsPerInchX;
    const photoSvgHeight = photoHeightInches * svgPixelsPerInchY;
    
    // Сохраняем масштаб относительно исходного размера
    this.state.photoScale = photoSvgWidth / img.width;
    
    // Вычисляем процент от ширины листа для отображения в UI

simplifyRatio(width, height) {
    // Функция для нахождения наибольшего общего делителя (НОД)
    const gcd = (a, b) => {
        a = Math.abs(a);
        b = Math.abs(b);
        
        // Используем алгоритм Евклида
        while (b !== 0) {
            const temp = b;
            b = a % b;
            a = temp;
        }
        return a;
    };
    
    // Находим НОД для текущих чисел
    let divisor = gcd(width, height);
    
    // Если числа очень большие, пробуем упростить до более читаемого формата
    if (divisor === 1 && (width > 1000 || height > 1000)) {
        // Пробуем делить на 10, 5, 2 для упрощения
        const tryDivisors = [10, 5, 2];
        for (const tryDiv of tryDivisors) {
            if (width % tryDiv === 0 && height % tryDiv === 0) {
                divisor = tryDiv;
                break;
            }
        }
    }
    
    // Упрощаем соотношение
    const simplifiedWidth = width / divisor;
    const simplifiedHeight = height / divisor;
    
    // Форматируем вывод
    return `${simplifiedWidth}/\n${simplifiedHeight}`;
}

    // Сохраняем текущий инструмент как предыдущий
    this.lastTool = current;

// ИНСТРУМЕНТЫ            
setTool(tool) {
this.commitPendingBezierConvert();
	document.getElementById('fillSettings').style.display = 
    tool === 'fill-shape' ? 'block' : 'none';
    document.getElementById('bezierSettings').style.display = 
        tool === 'bezier-points' ? 'block' : 'none';
    // Сбрасываем все состояния перетаскивания
    if (this.state.isDraggingPoint) {
        this.endPointDrag();
    }
    if (this.state.isDraggingBezierControl) {
        this.endBezierControlDrag();
    }
    if (this.selectedElement && tool !== 'select') {
        this.clearSelection();
    }
    this.state.currentElement = null;
    const previousTool = this.state.currentTool;
    
    // Если ВХОДИМ в режим Безье
    if (tool === 'bezier-points') {
        this.state.lastBezierDirection = null;
        this.state.lastBezierLength = null;
        this.showBezierHelpers();
        this.toggleBezierPoints(true);
    } else if (this.state.currentTool === 'bezier-points' && tool !== 'bezier-points') {
        this.deselectAllPoints();
        this.state.lastBezierDirection = null;
        this.state.lastBezierLength = null;
        this.hideBezierHelpers();
        this.toggleBezierPoints(false);
    }
    
    this.state.currentTool = tool;
    
    // === ВАЖНО: МЕНЯЕМ pointer-events ФОТО В ЗАВИСИМОСТИ ОТ ИНСТРУМЕНТА ===
    const photoElement = document.getElementById('photo-overlay');
    if (photoElement) {
        if (tool === 'select') {
            // В режиме выделения фото можно перетаскивать
            photoElement.style.pointerEvents = 'all';
            photoElement.style.cursor = 'move';
        } else {
            // В остальных режимах фото пропускает клики к инструментам рисования
            photoElement.style.pointerEvents = 'none';
            photoElement.style.cursor = 'default';
        }
    }
    
    // Обновляем активные кнопки
    document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    document.querySelector(`[data-tool="${tool}"]`).classList.add('active');
    
    // Показываем/скрываем настройки инструментов
    document.getElementById('penSettings').style.display = 
        tool === 'pen' ? 'block' : 'none';
    
    document.getElementById('pushSettings').style.display = 
        tool === 'push' ? 'block' : 'none';
    
    document.getElementById('eraserSettings').style.display = 
        tool === 'eraser' ? 'block' : 'none';
    
    this.loadSettingsFromUI();
    this.updateCursor();
    
    if (tool !== 'push') {
        this.hidePushIndicator();
    }
    if (tool !== 'eraser') {
        this.hideEraserIndicator();
    }
    
    if (tool !== previousTool) {
        this.lastTool = previousTool;
    }
}

updateCursor() {
    if (!this.svg) return;
    
    if (this.state.currentTool === 'push') {
        this.svg.style.cursor = 'none';
    } else if (this.state.currentTool === 'eraser') {
        // Проверяем, зажат ли Ctrl
        if (window.event && (window.event.ctrlKey || window.event.metaKey)) {
            this.svg.style.cursor = 'pointer';
        } else {
            this.svg.style.cursor = 'none';
        }
    } else if (this.state.currentTool === 'select') {
        this.svg.style.cursor = this.state.isMoving ? 'grabbing' : 'move';
    } else if (this.state.currentTool === 'bezier-points') {
        this.svg.style.cursor = 'crosshair';
    } else {
        this.svg.style.cursor = 'crosshair';
    }
}

deleteEntireVectorAt(e) {
    const coords = this.getSVGCoordinates(e);
    const target = e.target;
    
    // Скрываем индикатор ластика
    this.hideEraserIndicator();
    
    // Проверяем, кликнули ли на вектор Безье
    if (target.classList && target.classList.contains('bezier-vector')) {
        // Находим все связанные векторы Безье
        const vector = this.state.bezierVectors.find(v => v.path === target);
        if (vector) {
            const connectedVectors = this.findAllConnectedBezierVectors(vector);
            this.deleteBezierVectors(connectedVectors);
            return;
        }
    }
    
    // Проверяем, кликнули ли на точку Безье
    if (target.classList && target.classList.contains('bezier-point')) {
        const pointIndex = parseInt(target.getAttribute('data-index'));
        if (!isNaN(pointIndex)) {
            this.deleteBezierPoint(pointIndex);
            return;
        }
    }
    
    // Ищем обычные векторы под курсором
    const radius = 10; // Небольшой радиус для поиска
    
    // Ищем path
    const paths = Array.from(this.svg.querySelectorAll('path'))
        .filter(p => !p.id?.includes('background') && 
                     !p.id?.includes('indicator') &&
                     !p.classList?.contains('bezier-guide-line') &&
                     !p.classList?.contains('bezier-point') &&
                     !p.classList?.contains('bezier-control-point'));
    
    for (const path of paths) {
        if (this.isPointNearPath(coords.x, coords.y, path, radius)) {
            if (path.parentNode) {
                path.parentNode.removeChild(path);
                return;
            }
        }
    }
    
    // Ищем line
    const lines = Array.from(this.svg.querySelectorAll('line'))
        .filter(l => !l.id?.includes('background'));
    
    for (const line of lines) {
        const x1 = parseFloat(line.getAttribute('x1')) || 0;
        const y1 = parseFloat(line.getAttribute('y1')) || 0;
        const x2 = parseFloat(line.getAttribute('x2')) || 0;
        const y2 = parseFloat(line.getAttribute('y2')) || 0;
        
        const dist = this.distanceToSegment(coords.x, coords.y, x1, y1, x2, y2);
        if (dist <= radius) {
            if (line.parentNode) {
                line.parentNode.removeChild(line);
                return;
            }
        }
    }
    
    // Ищем rect
    const rects = Array.from(this.svg.querySelectorAll('rect'))
        .filter(r => !r.id?.includes('background'));
    
    for (const rect of rects) {
        const x = parseFloat(rect.getAttribute('x')) || 0;
        const y = parseFloat(rect.getAttribute('y')) || 0;
        const w = parseFloat(rect.getAttribute('width')) || 0;
        const h = parseFloat(rect.getAttribute('height')) || 0;
        
        if (coords.x >= x && coords.x <= x + w && 
            coords.y >= y && coords.y <= y + h) {
            if (rect.parentNode) {
                rect.parentNode.removeChild(rect);
                return;
            }
        }
    }
    
    // Ищем circle
    const circles = Array.from(this.svg.querySelectorAll('circle'))
        .filter(c => !c.id?.includes('background'));
    
    for (const circle of circles) {
        const cx = parseFloat(circle.getAttribute('cx')) || 0;
        const cy = parseFloat(circle.getAttribute('cy')) || 0;
        const r = parseFloat(circle.getAttribute('r')) || 0;
        
        const dist = Math.sqrt((coords.x - cx) ** 2 + (coords.y - cy) ** 2);
        if (dist <= r + radius) {
            if (circle.parentNode) {
                circle.parentNode.removeChild(circle);
                return;
            }
        }
    }
    
    // Ищем ellipse
    const ellipses = Array.from(this.svg.querySelectorAll('ellipse'))
        .filter(el => !el.id?.includes('background'));
    
    for (const ellipse of ellipses) {
        const cx = parseFloat(ellipse.getAttribute('cx')) || 0;
        const cy = parseFloat(ellipse.getAttribute('cy')) || 0;
        const rx = parseFloat(ellipse.getAttribute('rx')) || 0;
        const ry = parseFloat(ellipse.getAttribute('ry')) || 0;
        
        // Упрощенная проверка
        const dist = Math.sqrt((coords.x - cx) ** 2 + (coords.y - cy) ** 2);
        if (dist <= Math.max(rx, ry) + radius) {
            if (ellipse.parentNode) {
                ellipse.parentNode.removeChild(ellipse);
                return;
            }
        }
    }
    
    // Сохраняем состояние после удаления
    this.saveSnapshot();
}

isPointNearPath(x, y, path, maxDistance) {
    const d = path.getAttribute('d');
    if (!d) return false;
    
    const { points } = this.parsePathToPoints(d);
    if (points.length < 2) return false;
    
    for (let i = 0; i < points.length - 1; i++) {
        const dist = this.distanceToSegment(
            x, y, 
            points[i].x, points[i].y, 
            points[i + 1].x, points[i + 1].y
        );
        if (dist <= maxDistance) return true;
    }
    
    return false;
}

deleteBezierVectors(vectors) {
    // Собираем все точки, которые нужно удалить
    const pointsToDelete = new Set();
    vectors.forEach(v => {
        pointsToDelete.add(v.from);
        pointsToDelete.add(v.to);
        
        // Удаляем визуальные элементы
        if (v.path && v.path.parentNode) {
            v.path.parentNode.removeChild(v.path);
        }
        if (v.guideElements.line1) v.guideElements.line1.remove();
        if (v.guideElements.control1) v.guideElements.control1.remove();
        if (v.guideElements.line2) v.guideElements.line2.remove();
        if (v.guideElements.control2) v.guideElements.control2.remove();
    });
    
    // Удаляем векторы из массива (с конца)
    for (let i = this.state.bezierVectors.length - 1; i >= 0; i--) {
        if (vectors.includes(this.state.bezierVectors[i])) {
            this.state.bezierVectors.splice(i, 1);
        }
    }
    
    // Удаляем точки
    const sortedPoints = Array.from(pointsToDelete).sort((a, b) => b - a);
    sortedPoints.forEach(pointIndex => {
        const point = this.state.bezierPoints[pointIndex];
        if (point && point.element && point.element.parentNode) {
            point.element.parentNode.removeChild(point.element);
        }
        this.state.bezierPoints.splice(pointIndex, 1);
    });
    
    // Обновляем индексы
    this.state.bezierPoints.forEach((point, index) => {
        point.index = index;
        if (point.element) {
            point.element.setAttribute('data-index', index);
        }
    });
    
    // Обновляем индексы в оставшихся векторах
    this.state.bezierVectors.forEach(vector => {
        // Корректируем индексы
        let fromShift = 0, toShift = 0;
        sortedPoints.forEach(removedIndex => {
            if (vector.from > removedIndex) fromShift++;
            if (vector.to > removedIndex) toShift++;
        });
        vector.from -= fromShift;
        vector.to -= toShift;
    });
    
    // Сбрасываем выделение
    this.deselectAllPoints();
    
    // Сохраняем состояние
    this.saveSnapshot();
}
