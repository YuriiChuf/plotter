
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простой векторный редактор</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #2d2d2d;
            color: white;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 250px;
            background: #1a1a1a;
            padding: 20px;
            border-right: 1px solid #444;
			overflow-y: auto;
        }
        
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #1a1a1a;
        }
        
        #svg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        
        .panel {
            background: #333;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }
		.panel label {
			font-size: 10px;
		}
        
        h3 {
            margin-bottom: 15px;
            color: #4dabf7;
        }
        
        button {
            background: #4dabf7;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        
        button:hover {
            background: #339af0;
        }
        
        .tool-btn {
            background: #444;
            margin: 5px;
            width: 40px;
            height: 40px;
			padding: 6px;
        }
        
        .tool-btn.active {
            background: #4dabf7;
        }
		.tool-btn:hover::after {
    content: attr(hotkey);
}
        
        .tools {
            display: flex;
            flex-wrap: wrap;
            gap: 0px;
            margin-bottom: 0px;
        }
        
        input[type="range"] {
            width: 100%;
            margin: 0;
        }
        
        input[type="color"] {
			width: 35px;
			height: 6px;
			margin: 7px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            display: flex;
            gap: 10px;
        }
        
        .zoom-btn {
            width: 40px;
            height: 40px;
            background: #444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 20px;
        }
        
        .zoom-level {
            color: white;
            line-height: 40px;
            padding: 0 10px;
        }
        
        .coordinates {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
#eraser-indicator {
    pointer-events: none;
    stroke: #ff6b6b;
    stroke-width: 2;
    fill: rgba(255, 107, 107, 0.2);
    stroke-dasharray: 5,5;
}
#push-indicator {
    pointer-events: none;
    stroke: #ff6b6b;
    stroke-width: 1;
    fill: rgba(255, 107, 107, 0.1);
    stroke-dasharray: 3,3;
}
.push-mode {
    cursor: none !important;
}
@keyframes pulse-ring {
	0% { stroke-opacity: 0.7; }
	50% { stroke-opacity: 1; }
	100% { stroke-opacity: 0.7; }
}
/* Точка НЕ выделена */
.bezier-point {
    fill: #4dabf7;
    stroke: #1971c2;
    stroke-width: 2;
    r: 1%;
	opacity: 0.5;
    cursor: move;
}

.bezier-point.selected {
    fill: #ff6b6b;
    stroke: #e03131;
    stroke-width: 3;
	opacity: 0.5;
}

/* Векторы Безье */
.bezier-vector {
    fill: none;
    stroke-linecap: round;
}

/* Направляющие Безье */
.bezier-guide-line {
    stroke: #868e96;
    stroke-width: 1;
    stroke-dasharray: 3,3;
    opacity: 0.5;
}

.bezier-control-point {
    fill: #ffd43b;
    stroke: #f08c00;
    stroke-width: 1;
    r: 0.7%;
    cursor: pointer;
	opacity: 0.5;
	
}

.undo-controls {
    position: absolute;
    bottom: 90px; /* Располагаем выше зума */
    right: 20px;
    background: rgba(0,0,0,0.7);
    padding: 10px;
    border-radius: 5px;
    display: flex;
    gap: 10px;
    z-index: 1000;
}

.undo-btn, .redo-btn {
    width: 40px;
    height: 40px;
    background: #444;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.undo-btn:hover {
    background: #4dabf7;
}

.redo-btn:hover {
    background: #ff6b6b;
}

.undo-btn:disabled, .redo-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
}

    </style>
</head>

    <script>
        class VectorEditor {
constructor() {
    // Состояние редактора
    this.state = {
		lastMouseX: 0,
		lastMouseY: 0,
        currentTool: 'select',
        isDrawing: false,
        currentElement: null,
        startPoint: {x: 0, y: 0},
        image: null,
        imageUrl: null,
        zoom: 1,
        viewBox: {x: 0, y: 0, width: 1000, height: 1000},
        strokeColor: '#4dabf7',
        strokeWidth: 3,
        smoothing: 5,
        penPoints: [],
        pushRadius: 20,
        pushStrength: 0.5,
        pushSmooth: true,
        imageForDisplay: null,
        eraserSize: 20,
        isMoving: false,
        moveStart: {x: 0, y: 0},
        viewBoxStart: {x: 0, y: 0, width: 0, height: 0},
        bezierSelectedPoint: null,
        bezierPoints: [],
        bezierVectors: [],
        originalImageRatio: 1,
        photoScale: 1,
        originalPhotoWidth: 0,
        originalPhotoHeight: 0,
        isDraggingPhoto: false,
        draggingPhotoElement: null,
        photoDragStartX: 0,
        photoDragStartY: 0,
        photoStartX: 0,
        photoStartY: 0,
        worksheetImage: null,
        worksheetUrl: null,
        isDraggingPoint: false,
        draggingPointIndex: null,
        draggingPointStartX: 0,
        draggingPointStartY: 0,
        draggingPointOriginalX: 0,
        draggingPointOriginalY: 0,
        lastBezierDirection: null,
        lastBezierLength: null,
        isDraggingElement: false,
        draggingElement: null,
        draggingStartMouseX: 0,
        draggingStartMouseY: 0,
        draggingStartElementX: 0,
		pendingConnectPoint: null
    };
    
    this.snapSettings = {
        enabled: true,
        snapDistance: 10,
        whiteThreshold: 200,
        searchRadius: 15,
        continueVector: true
    };
	this.selectedElement = null; 
	this.isResizing = false;
	this.isRotating = false;
	this.selectedBezierContour = null;   // { vectors: [...], fakePath: <path> } — для безье-контура
	this.selectionAngle = 0;
	this.resizeStart = { x: 0, y: 0, width: 0, height: 0, angle: 0 };
	this.isSpiralActive = false;
    this.worksheetLayer = null;
    this.photoLayer = null;
    this.vectorLayer = null;
    this.helperLayer = null;
    this.lastTool = null;
    this.pushData = null;
    this.pathCache = new Map();
    this.lastEraseTime = null;
    this.lastErasePoint = null;
    this.imageCanvasCache = null;
    this.imageDataCache = null;
    this.isDraggingPivot = false;
	this.pivotDragData = null;
    this.history = {
        snapshots: [],
        index: -1,
        max: 10
    };
    
    this.lastSave = 0;
    
    this.setupHotkeys();
    this.init();
    this.setupSimpleUndoRedo();
}			
		// ВИЗУАЛЬНЫЙ ИНДИКАТОР ЛАСТИКА
		showEraserIndicator(x, y, radius) {
			let indicator = document.getElementById('eraser-indicator');
			
			if (!indicator) {
				indicator = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
				indicator.id = 'eraser-indicator';
				indicator.setAttribute('stroke', '#ff6b6b');
				indicator.setAttribute('stroke-width', '2');
				indicator.setAttribute('fill', 'rgba(255, 107, 107, 0.2)');
				indicator.setAttribute('stroke-dasharray', '5,5');
				indicator.style.pointerEvents = 'none';

				const pushIndicator = document.getElementById('push-indicator');
				if (pushIndicator) {
					this.svg.insertBefore(indicator, pushIndicator.nextSibling);
				} else {
					this.svg.appendChild(indicator);
				}
			}
			
			indicator.setAttribute('cx', x);
			indicator.setAttribute('cy', y);
			indicator.setAttribute('r', radius);
			indicator.style.display = 'block';
			indicator.style.animation = 'none';
			indicator.style.zIndex = '9999';
		}

// ============================================================
// ЛАСТИК ЧЕРЕЗ МАСКУ
// ============================================================

startEraserStroke(x, y) {
    const D = this.state.eraserSize / this.getScreenScale();
    
    // 1. Круг в начальной точке (заливка) — временный
    const startCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    startCircle.setAttribute('cx', x);
    startCircle.setAttribute('cy', y);
    startCircle.setAttribute('r', D / 2);
    startCircle.setAttribute('fill', '#ff6b6b');
    startCircle.setAttribute('opacity', '0.35');
    startCircle.setAttribute('pointer-events', 'none');
    
    // 2. Путь траектории (толстая линия)
    const trail = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    trail.setAttribute('fill', 'none');
    trail.setAttribute('stroke', '#ff6b6b');
    trail.setAttribute('stroke-width', String(D));
    trail.setAttribute('stroke-linecap', 'round');
    trail.setAttribute('stroke-linejoin', 'round');
    trail.setAttribute('opacity', '0.35');
    trail.setAttribute('pointer-events', 'none');
    trail.setAttribute('d', `M ${x} ${y}`);
    
    const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    group.id = 'eraser-mask';
    group.setAttribute('pointer-events', 'none');
    group.appendChild(startCircle);
    group.appendChild(trail);
    
    this.hideEraserIndicator();
    this.svg.appendChild(group);
    
    this._eraserMaskPoints = [{x, y}];
    this._eraserMask = group;
    this._eraserMaskTrail = trail;
    this._eraserMaskStartCircle = startCircle;
}

continueEraserStroke(x, y) {
    if (!this._eraserMask || !this._eraserMaskTrail) return;
    
    const last = this._eraserMaskPoints[this._eraserMaskPoints.length - 1];
    const dist = Math.hypot(x - last.x, y - last.y);
    const step = this.state.eraserSize / this.state.zoom / 4;
    
    if (dist < step) return;
    if (this._eraserMaskPoints.length > 3000) return;
    
    // Первое движение — удаляем круг, оставляем только линию
    if (this._eraserMaskStartCircle) {
        this._eraserMaskStartCircle.remove();
        this._eraserMaskStartCircle = null;
    }
    
    this._eraserMaskPoints.push({x, y});
    
    const d = this._eraserMaskTrail.getAttribute('d');
    this._eraserMaskTrail.setAttribute('d', d + ` L ${x} ${y}`);
}

finishEraserStroke(deleteWhole) {
const mask = this._eraserMask;
const points = this._eraserMaskPoints;
const trail = this._eraserMaskTrail;
this._eraserMask = null;
this._eraserMaskPoints = null;
this._eraserMaskTrail = null;
this._eraserMaskStartCircle = null;

if (!mask) return;
if (mask.parentNode) mask.remove();
    if (!points || points.length === 0) return;
    
    const radius = (this.state.eraserSize / 2) / this.getScreenScale();
    
    // === 1. Запекаем transform у элементов под маской ===
    try {
        const maskBBox = this.computePointsBBox(points, radius + 5);
        const candidates = Array.from(this.svg.querySelectorAll('[transform]'));
        for (const el of candidates) {
            if (!el.parentNode) continue;
            const id = el.id || '';
            const cls = el.getAttribute('class') || '';
            if (id.includes('background') || id.includes('indicator') ||
                id.includes('eraser') || id.includes('push') ||
                id.includes('selection-handles')) continue;
            if (cls.includes('bezier-')) continue;
            try {
                const bb = el.getBBox();
                if (bb.x + bb.width < maskBBox.x || bb.x > maskBBox.x + maskBBox.width) continue;
                if (bb.y + bb.height < maskBBox.y || bb.y > maskBBox.y + maskBBox.height) continue;
                this.bakeElementForErase(el);
            } catch(e) {}
        }
    } catch(e) {}
    
    // === 2. Строим растровую маску ===
    const imageData = this.buildEraserMaskCanvas(points, radius);
    
    // === 3. Обрабатываем обычные пути (не безье) ===
    if (!deleteWhole) {
        const allPaths = Array.from(this.svg.querySelectorAll('path, line, rect, circle, ellipse, polyline, polygon'))
            .filter(el => {
                if (!el.parentNode) return false;
                const id = el.id || '';
                const cls = el.getAttribute('class') || '';
                if (id.includes('background')) return false;
                if (id.includes('indicator')) return false;
                if (id.includes('eraser')) return false;
                if (id.includes('push')) return false;
                if (id.includes('selection-handles')) return false;
                if (cls.includes('bezier-')) return false; // Безье отдельно
                return true;
            });
        
        for (const el of allPaths) {
            if (!el.parentNode) continue;
            
            // Быстрая bbox-проверка
            try {
                const bb = el.getBBox();
                const pad = radius + 10;
                const maskBBox = this.computePointsBBox(points, pad);
                if (bb.x + bb.width < maskBBox.x || bb.x > maskBBox.x + maskBBox.width ||
                    bb.y + bb.height < maskBBox.y || bb.y > maskBBox.y + maskBBox.height) {
                    continue;
                }
            } catch(e) { continue; }
            
            // Конвертируем в path, если нужно
            let elPath = el;
            if (el.tagName.toLowerCase() !== 'path') {
                elPath = this.convertToPath(el);
                if (!elPath) continue;
            }
            
            const result = this.cutPathByMask(elPath, imageData);
            
            if (result === 'delete') {
                if (elPath.parentNode) elPath.parentNode.removeChild(elPath);
            } else if (result && result.segments) {
                // Заменяем путь на сегменты
                const parent = elPath.parentNode;
                if (!parent) continue;
                
                const attrs = {};
                for (const a of ['stroke','stroke-width','stroke-linecap','stroke-linejoin','stroke-dasharray','fill','opacity']) {
                    attrs[a] = elPath.getAttribute(a);
                }
                if (!attrs.fill) attrs.fill = 'none';
                
                parent.removeChild(elPath);
                
                for (const seg of result.segments) {
                    if (seg.length < 2) continue;
                    let dd = `M ${seg[0].x.toFixed(3)} ${seg[0].y.toFixed(3)}`;
                    for (let k = 1; k < seg.length; k++) {
                        dd += ` L ${seg[k].x.toFixed(3)} ${seg[k].y.toFixed(3)}`;
                    }
                    const newPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    newPath.setAttribute('d', dd);
                    for (const [k, v] of Object.entries(attrs)) {
                        if (v !== null) newPath.setAttribute(k, v);
                    }
                    parent.appendChild(newPath);
                }
            }
        }
    }
    
    // === 4. Обрабатываем безье (с сохранением безье) ===
    if (!deleteWhole && this.state.bezierVectors.length > 0) {
        this.cutAllBeziersByMask(imageData);
    }
    
    // === 5. Для Ctrl+протяжки — удаляем целиком ===
    if (deleteWhole) {
        const allPaths = Array.from(this.svg.querySelectorAll('path, line, rect, circle, ellipse, polyline, polygon'))
            .filter(el => {
                if (!el.parentNode) return false;
                const id = el.id || '';
                const cls = el.getAttribute('class') || '';
                if (id.includes('background') || id.includes('indicator') ||
                    id.includes('eraser') || id.includes('push') ||
                    id.includes('selection-handles')) return false;
                if (cls.includes('bezier-')) return false;
                return true;
            });
        
        for (const el of allPaths) {
            try {
                const bb = el.getBBox();
                const cx = bb.x + bb.width / 2;
                const cy = bb.y + bb.height / 2;
                if (this.isPointInMask(imageData, cx, cy)) {
                    el.remove();
                }
            } catch(e) {}
        }
        
        // Безье — тоже удаляем целиком, если середина в маске
        const vectorsToDelete = [];
        for (const vector of this.state.bezierVectors) {
            const fromPoint = this.state.bezierPoints[vector.from];
            const toPoint = this.state.bezierPoints[vector.to];
            if (!fromPoint || !toPoint) continue;
            const mid = this.evaluateCubicBezier(
                fromPoint.x, fromPoint.y,
                vector.control1.x, vector.control1.y,
                vector.control2.x, vector.control2.y,
                toPoint.x, toPoint.y,
                0.5
            );
            if (this.isPointInMask(imageData, mid.x, mid.y)) {
                vectorsToDelete.push(vector);
            }
        }
        for (const v of vectorsToDelete) this.deleteBezierVector(v);
    }
    
    this.saveSnapshot();
}

// Вспомогательный метод: bbox набора точек + отступ
computePointsBBox(points, pad = 0) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const p of points) {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
    }
    return {
        x: minX - pad,
        y: minY - pad,
        width: (maxX - minX) + pad * 2,
        height: (maxY - minY) + pad * 2
    };
}

// Приблизительная точка на границе маски между двумя точками пути
_approxBoundaryPoint(points, indexInside, flags, isInsideMask) {
    // indexInside — текущая точка (внутри). Предыдущая — снаружи.
    const outsideIdx = indexInside - 1;
    if (outsideIdx < 0) return points[indexInside];
    
    const a = points[outsideIdx];
    const b = points[indexInside];
    
    // Бинарный поиск между a и b
    let lo = 0, hi = 1;
    for (let it = 0; it < 8; it++) {
        const mid = (lo + hi) / 2;
        const px = a.x + (b.x - a.x) * mid;
        const py = a.y + (b.y - a.y) * mid;
        if (isInsideMask(px, py)) hi = mid;
        else lo = mid;
    }
    return {
        x: a.x + (b.x - a.x) * hi,
        y: a.y + (b.y - a.y) * hi
    };
}

// Удаление целиком (Ctrl+клик)
deleteElementsAlongStroke(maskPoints) {
    const radius = (this.state.eraserSize / this.state.zoom) / 2;
    
    const elems = Array.from(this.svg.querySelectorAll('path, line, rect, circle, ellipse, polyline, polygon'))
        .filter(el => {
            if (!el.parentNode) return false;
            const id = el.id || '';
            const cls = el.getAttribute('class') || '';
            if (id.includes('background')) return false;
            if (id.includes('indicator')) return false;
            if (id.includes('eraser')) return false;
            if (id.includes('push')) return false;
            if (id.includes('selection-handles')) return false;
            if (cls.includes('bezier-')) return false;
            return true;
        });
    
    // Проверяем: центр bbox элемента попадает в маску?
    for (const el of elems) {
        let bb;
        try { bb = el.getBBox(); } catch(e) { continue; }
        const cx = bb.x + bb.width / 2;
        const cy = bb.y + bb.height / 2;
        
        let hit = false;
        for (const m of maskPoints) {
            const dx = cx - m.x;
            const dy = cy - m.y;
            if (dx * dx + dy * dy <= radius * radius) { hit = true; break; }
        }
        
        if (hit && el.parentNode) el.parentNode.removeChild(el);
    }
}

// 1. Метод сохранения снимка
saveSnapshot() {
    if (this.isSpiralActive) {
        return;
    }
    const now = Date.now();
    if (this.lastSave && (now - this.lastSave < 100)) {
        return;
    }
    
    try {
        const svgClone = this.svg.cloneNode(true);
        
        const tempIds = ['push-indicator', 'eraser-indicator'];
        tempIds.forEach(id => {
            const el = svgClone.querySelector(`#${id}`);
            if (el) el.remove();
        });
        
        const snapshot = svgClone.innerHTML;
        
        const lastSnapshot = this.history.snapshots[this.history.index];
        if (lastSnapshot === snapshot) {
            return;
        }
        
        this.history.snapshots = this.history.snapshots.slice(0, this.history.index + 1);

        this.history.snapshots.push(snapshot);
        this.history.index++;

        if (this.history.snapshots.length > this.history.max) {
            this.history.snapshots.shift();
            this.history.index--;
        }

        this.updateUndoRedoButtons();
        
        this.lastSave = now;
    } catch (error) {
        console.error('Ошибка при сохранении снимка:', error);
    }
}


// 2. Метод отмены
simpleUndo() {
    if (this.history.index > 0) {
        this.history.index--;
        this.restoreSnapshot();
    }
}

// 3. Метод возврата
simpleRedo() {
    if (this.history.index < this.history.snapshots.length - 1) {
        this.history.index++;
        this.restoreSnapshot();
    }
}

// 4. Восстановление снимка
restoreSnapshot() {
    try {
        const snapshot = this.history.snapshots[this.history.index];
        if (!snapshot) return;
        
        this.svg.innerHTML = snapshot;
        
        this.worksheetLayer = document.getElementById('worksheet-layer');
        this.photoLayer = document.getElementById('photo-layer');
        this.vectorLayer = document.getElementById('vector-layer');
        this.helperLayer = document.getElementById('helper-layer');
        
        if (!this.vectorLayer) {
            this.vectorLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            this.vectorLayer.id = 'vector-layer';
            this.svg.appendChild(this.vectorLayer);
        }
        
        this.rebuildBezierReferences();
        this.updateUndoRedoButtons();
    } catch(e) {
        console.error('❌ Ошибка в restoreSnapshot:', e);
        console.error(e.stack);
        throw e;  // покажем браузеру
    }
}

rebuildBezierReferences() {
    // 1. Удаляем ВСЕ старые guide-элементы из DOM
    document.querySelectorAll('.bezier-guide-line, .bezier-control-point').forEach(el => {
        el.remove();
    });
    
    // 2. Собираем пути безье (в порядке следования)
    const vectorPathElements = Array.from(document.querySelectorAll('path.bezier-vector'));
    
    // 3. Обновляем ссылки в bezierVectors
    for (let i = 0; i < this.state.bezierVectors.length; i++) {
        const vector = this.state.bezierVectors[i];
        if (!vector) continue;
        
        vector.path = vectorPathElements[i] || null;
        vector.guideElements = {};
        
        // Перевешиваем обработчики на path
        if (vector.path) {
            
        }
    }
    
    // 4. Обновляем ссылки на точки безье
    const pointElements = new Map();
    document.querySelectorAll('circle.bezier-point').forEach(el => {
        const idx = parseInt(el.getAttribute('data-index'));
        if (!isNaN(idx)) pointElements.set(idx, el);
    });
    
    for (let i = 0; i < this.state.bezierPoints.length; i++) {
        const point = this.state.bezierPoints[i];
        if (!point) continue;
        
        const el = pointElements.get(i);
        point.element = el || null;
        point.index = i;
        
        if (el) {
            const newEl = el.cloneNode(true);
            el.parentNode.replaceChild(newEl, el);
            point.element = newEl;
            
            newEl.addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                const pointIndex = parseInt(newEl.getAttribute('data-index'));
                
                if (e.shiftKey && this.state.pendingConnectPoint !== null && 
                    this.state.pendingConnectPoint !== pointIndex) {
                    
                    this.connectTwoBezierPoints(this.state.pendingConnectPoint, pointIndex);
                    this.state.pendingConnectPoint = pointIndex;
                    this.selectBezierPoint(pointIndex);
                    return;
                }
                
                this.state.pendingConnectPoint = pointIndex;
                this.selectBezierPoint(pointIndex);
                const coords = this.getSVGCoordinates(e);
                this.startPointDrag(pointIndex, coords.x, coords.y);
            });
            
            newEl.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                e.preventDefault();
                this.toggleBezierPointType(pointIndex);
            });
        }
    }
    
	// 5. ПЕРЕСОЗДАЁМ guide-элементы для каждого вектора
	for (const vector of this.state.bezierVectors) {
		const fromPoint = this.state.bezierPoints[vector.from];
		const toPoint = this.state.bezierPoints[vector.to];
		if (!fromPoint || !toPoint) continue;
		if (!vector.path) continue; 
		
		this.createVectorGuides(vector, fromPoint, toPoint);
	}
    
    // 6. Синхронизируем пути (на случай рассинхрона координат)
    for (const vector of this.state.bezierVectors) {
        this.updateBezierVectorPath(vector);
    }
    
    // 7. Скрываем guide-элементы, если не в режиме B
    if (this.state.currentTool !== 'bezier-points') {
        document.querySelectorAll('.bezier-guide-line, .bezier-control-point').forEach(el => {
            el.style.display = 'none';
        });
    }
}

reattachPointHandlers(element, pointIndex) {

    const clone = element.cloneNode(true);
    element.parentNode.replaceChild(clone, element);
    
    // Возвращаем ссылку в state
    this.state.bezierPoints[pointIndex].element = clone;
    
    // Навешиваем обработчики заново
    const point = this.state.bezierPoints[pointIndex];
    
    clone.addEventListener('mousedown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        
        const pointIndex = parseInt(clone.getAttribute('data-index'));
        
        if (e.shiftKey && this.state.pendingConnectPoint !== null && 
            this.state.pendingConnectPoint !== pointIndex) {
            
            this.connectTwoBezierPoints(this.state.pendingConnectPoint, pointIndex);
            this.state.pendingConnectPoint = pointIndex;
            this.selectBezierPoint(pointIndex);
            return;
        }
        
        this.state.pendingConnectPoint = pointIndex;
        this.selectBezierPoint(pointIndex);
        const coords = this.getSVGCoordinates(e);
        this.startPointDrag(pointIndex, coords.x, coords.y);
    });
    
    clone.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        e.preventDefault();
        this.toggleBezierPointType(pointIndex);
    });
}

reattachControlHandler(element) {
    const clone = element.cloneNode(true);
    element.parentNode.replaceChild(clone, element);
    clone.addEventListener('mousedown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        this.startBezierControlDrag(e);
    });
    
    return clone;
}

// 5. Обновление кнопок
updateUndoRedoButtons() {

    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    
    const canUndo = this.history.index > 0;
    const canRedo = this.history.index < this.history.snapshots.length - 1;
    
    undoBtn.disabled = !canUndo;
    redoBtn.disabled = !canRedo;

    undoBtn.style.opacity = canUndo ? '1' : '0.3';

    redoBtn.title = canRedo ? 'Вернуть (Ctrl+Shift+Z)' : 'Нечего возвращать';
}

setupHotkeys() {
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        // Обработка Ctrl для ластика
        if (e.key === 'Control' || e.key === 'Meta') {
            if (this.state.currentTool === 'eraser') {
                this.hideEraserIndicator();
                this.svg.style.cursor = 'pointer';
            }
        }
		
        // Ctrl/Cmd + S - сохранить
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            this.saveSVG();
            return;
        }
        
        // Ctrl/Cmd + O - загрузить SVG
        if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
            e.preventDefault();
            document.getElementById('svgInput').click();
            return;
        }
        
        // Esc - сброс инструмента
		if (e.key === 'Escape') {
			// Если есть выделенная точка Безье — снимаем выделение
			if (this.state.bezierSelectedPoint !== null) {
				this.deselectAllPoints();
				return;
			}
			
			// Если есть выделенный элемент — снимаем выделение
			if (this.selectedElement) {
				this.removeSelectionHandles();
				this.selectedElement = null;
				return;
			}
			
			// Иначе переключаем на select
			this.setTool('select');
			return;
		}
        
        // Горячие клавиши для инструментов
        switch(e.key.toLowerCase()) {
            case 'v': // Выделение
                this.setTool('select');
                break;
            case 'b': // Кривые Безье
                this.setTool('bezier-points');
                break;
            case 'p': // Карандаш
                this.setTool('pen');
                break;
            case 'l': // Линия
                this.setTool('line');
                break;
            case 'r': // Прямоугольник
                this.setTool('rect');
                break;
            case 'c': // Круг
                this.setTool('circle');
                break;
            case 'e': // Ластик
                this.setTool('eraser');
                break;
            case 'u': // Push инструмент
                this.setTool('push');
                break;
            case 'z': // Zoom
                if (e.ctrlKey || e.metaKey) {
                    if (e.shiftKey) {
                        this.zoomIn();
                    } else {
                        this.zoomOut();
                    }
                }
                break;
            case '=': // Zoom in
            case '+':
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    this.zoomIn();
                }
                break;
            case '-': // Zoom out
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    this.zoomOut();
                }
                break;
            case '0': // Сброс zoom
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    this.setZoom(1);
                }
                break;
            case 'delete': // Удалить выделенное
            case 'backspace':
				if (this.state.currentTool === 'bezier-points' && 
					this.state.bezierSelectedPoint !== null) {
					this.deleteBezierPoint(this.state.bezierSelectedPoint);
				} else if (this.state.currentTool === 'select' && this.selectedBezierContour) {
					this.deleteSelectedBezierContour();
				} else if (this.state.currentTool === 'select' && this.selectedElement) {
					this.selectedElement.remove();
					this.clearSelection();
				}
				break;
        }
    });
    document.addEventListener('keyup', (e) => {
        if (e.key === 'Control' || e.key === 'Meta') {
            if (this.state.currentTool === 'eraser') {
                this.svg.style.cursor = 'none';
                const radius = (this.state.eraserSize / 2) / this.getScreenScale();
                this.showEraserIndicator(this.state.lastMouseX, this.state.lastMouseY, radius);
            }
        }
    });
}

updateAspectRatioDisplay(width, height) {
    const ratioDisplay = document.getElementById('aspectRatioDisplay');
    if (!ratioDisplay) return;
	
    this.state.originalImageRatio = width / height;
    const simplified = this.simplifyRatio(width, height);
    ratioDisplay.innerHTML = `${simplified.replace(':', '/<br>')}`;
    ratioDisplay.title = `Соотношение сторон: ${(width/height).toFixed(3)}`;
    
}

updateSizeWithAspectRatio(changedField, value) {
    if (!this.state.image || !this.state.originalImageRatio) {
        this.updatePixelDisplay();
        return;
    }
    
    const keepRatio = document.getElementById('keepAspectRatio').checked;
    const widthInput = document.getElementById('mmWidth');
    const heightInput = document.getElementById('mmHeight');
    
    if (!keepRatio) {
        this.updatePixelDisplay();
        return;
    }
    
    try {
        const newValue = parseFloat(value);
        if (isNaN(newValue) || newValue <= 0) return;
        
        if (changedField === 'width') {
            const newHeight = Math.round(newValue / this.state.originalImageRatio);
            heightInput.value = newHeight;
        } else {
            const newWidth = Math.round(newValue * this.state.originalImageRatio);
            widthInput.value = newWidth;
        }

        this.updatePixelDisplay();

    } catch (error) {
        console.error('Ошибка при обновлении размеров:', error);
    }
}

setupGlobalDragHandlers() {

	document.addEventListener('mousemove', (e) => {

		if (this.state.isDraggingPoint) {
			const coords = this.getSVGCoordinates(e);
			this.updatePointDrag(coords.x, coords.y);
		}

		if (this.state.isDraggingBezierControl) {
			const coords = this.getSVGCoordinates(e);
			this.updateBezierControlDrag(coords.x, coords.y);
		}
	});

	document.addEventListener('mouseup', (e) => {

		if (this.state.isDraggingPoint) {
			this.endPointDrag();
		}
		
		if (this.state.isDraggingBezierControl) {
			this.endBezierControlDrag();
		}
	});
}

scalePhoto(scale) {
    const photoElement = document.getElementById('photo-overlay');
    if (!photoElement || !this.state.image) return;
    this.state.photoScale = scale;

    const originalWidth = this.state.originalPhotoWidth || this.state.image.width;
    const originalHeight = this.state.originalPhotoHeight || this.state.image.height;
    const newWidth = originalWidth * scale;
    const newHeight = originalHeight * scale;
    const currentX = parseFloat(photoElement.getAttribute('x')) || 0;
    const currentY = parseFloat(photoElement.getAttribute('y')) || 0;
    const currentWidth = parseFloat(photoElement.getAttribute('width')) || newWidth;
    const currentHeight = parseFloat(photoElement.getAttribute('height')) || newHeight;
    const centerX = currentX + currentWidth / 2;
    const centerY = currentY + currentHeight / 2;
    const newX = centerX - newWidth / 2;
    const newY = centerY - newHeight / 2;
    photoElement.setAttribute('width', newWidth);
    photoElement.setAttribute('height', newHeight);
    photoElement.setAttribute('x', newX);
    photoElement.setAttribute('y', newY);
    
    this.updatePhotoScaleDisplay();
    
}

scalePhotoByWidthPercent(percent) {
    const photoElement = document.getElementById('photo-overlay');
    if (!photoElement || !this.state.image) return;

    const img = this.state.image;
    const currentDpi = parseInt(document.getElementById('dpiInput')?.value) || 96;
    const photoWidthInches = img.width / currentDpi;
    const photoHeightInches = img.height / currentDpi;
    
    const worksheetElement = document.getElementById('worksheet-background');
    const worksheetSvgWidth = worksheetElement ? 
        parseFloat(worksheetElement.getAttribute('width')) : 1000;
    const worksheetSvgHeight = worksheetElement ? 
        parseFloat(worksheetElement.getAttribute('height')) : 1000;
    
    const worksheetMmWidth = parseFloat(document.getElementById('mmWidth')?.value) || 210;
    const worksheetMmHeight = parseFloat(document.getElementById('mmHeight')?.value) || 297;
    
    const worksheetWidthInches = worksheetMmWidth / 25.4;
    const worksheetHeightInches = worksheetMmHeight / 25.4;
    
    const svgPixelsPerInchX = worksheetSvgWidth / worksheetWidthInches;
    const svgPixelsPerInchY = worksheetSvgHeight / worksheetHeightInches;
    
    const baseWidth = photoWidthInches * svgPixelsPerInchX;
    const baseHeight = photoHeightInches * svgPixelsPerInchY;
    
    const scaleFactor = percent / 100;
    const newWidth = baseWidth * scaleFactor;
    const newHeight = baseHeight * scaleFactor;
    
    this.state.photoScale = (baseWidth * scaleFactor) / img.width;
    
    const currentX = parseFloat(photoElement.getAttribute('x')) || 0;
    const currentY = parseFloat(photoElement.getAttribute('y')) || 0;
    const currentWidth = parseFloat(photoElement.getAttribute('width')) || newWidth;
    const currentHeight = parseFloat(photoElement.getAttribute('height')) || newHeight;
    
    const centerX = currentX + currentWidth / 2;
    const centerY = currentY + currentHeight / 2;
    
    const newX = centerX - newWidth / 2;
    const newY = centerY - newHeight / 2;
    
    photoElement.setAttribute('width', newWidth);
    photoElement.setAttribute('height', newHeight);
    photoElement.setAttribute('x', newX);
    photoElement.setAttribute('y', newY);
    
    this.updatePhotoSizeDisplay(percent);
}

fitPhotoToCanvas() {
    const photoElement = document.getElementById('photo-overlay');
    if (!photoElement || !this.state.image) return;
    
    const img = this.state.image;

    const currentDpi = parseInt(document.getElementById('dpiInput')?.value) || 96;
    const photoWidthInches = img.width / currentDpi;
    const photoHeightInches = img.height / currentDpi;
    
    const worksheetElement = document.getElementById('worksheet-background');
    const worksheetSvgWidth = worksheetElement ? 
        parseFloat(worksheetElement.getAttribute('width')) : 1000;
    const worksheetSvgHeight = worksheetElement ? 
        parseFloat(worksheetElement.getAttribute('height')) : 1000;
    
    const worksheetMmWidth = parseFloat(document.getElementById('mmWidth')?.value) || 210;
    const worksheetMmHeight = parseFloat(document.getElementById('mmHeight')?.value) || 297;
    
    const worksheetWidthInches = worksheetMmWidth / 25.4;
    const worksheetHeightInches = worksheetMmHeight / 25.4;
    
    const svgPixelsPerInchX = worksheetSvgWidth / worksheetWidthInches;
    const svgPixelsPerInchY = worksheetSvgHeight / worksheetHeightInches;

    const baseWidth = photoWidthInches * svgPixelsPerInchX;
    const baseHeight = photoHeightInches * svgPixelsPerInchY;
    
    const targetWidth = worksheetSvgWidth;

    const scale = targetWidth / baseWidth;
    const percent = Math.round(scale * 100);
    
    this.state.photoScale = (baseWidth * scale) / img.width;
    
    const newWidth = baseWidth * scale;
    const newHeight = baseHeight * scale;

    const viewBoxSize = 1000;
    const newX = (viewBoxSize - newWidth) / 2;
    const newY = (viewBoxSize - newHeight) / 2;
    
    photoElement.setAttribute('width', newWidth);
    photoElement.setAttribute('height', newHeight);
    photoElement.setAttribute('x', newX);
    photoElement.setAttribute('y', newY);
    
const percentOfOriginal = Math.round((newWidth / baseWidth) * 100);
this.updatePhotoSizeDisplay(percentOfOriginal);
    
}

            // ЗУМ
            zoomIn() {
                this.setZoom(this.state.zoom * 1.2);
            }
            
            zoomOut() {
                this.setZoom(this.state.zoom / 1.2);
            }
            
            setZoom(zoomLevel) {
                this.state.zoom = Math.max(0.1, Math.min(10, zoomLevel));
                
                const centerX = this.state.viewBox.x + this.state.viewBox.width / 2;
                const centerY = this.state.viewBox.y + this.state.viewBox.height / 2;
                
                const newWidth = 1000 / this.state.zoom;
                const newHeight = 1000 / this.state.zoom;
                
                this.state.viewBox = {
                    x: centerX - newWidth / 2,
                    y: centerY - newHeight / 2,
                    width: newWidth,
                    height: newHeight
                };
                
                this.svg.setAttribute('viewBox', 
                    `${this.state.viewBox.x} ${this.state.viewBox.y} ${this.state.viewBox.width} ${this.state.viewBox.height}`
                );
                
                this.updateZoomDisplay();
            }
            
            zoomToPoint(x, y, factor) {
                const newWidth = this.state.viewBox.width * factor;
                const newHeight = this.state.viewBox.height * factor;
                
                const mouseXPercent = (x - this.state.viewBox.x) / this.state.viewBox.width;
                const mouseYPercent = (y - this.state.viewBox.y) / this.state.viewBox.height;
                
                this.state.viewBox = {
                    x: x - (mouseXPercent * newWidth),
                    y: y - (mouseYPercent * newHeight),
                    width: newWidth,
                    height: newHeight
                };
                
                this.svg.setAttribute('viewBox', 
                    `${this.state.viewBox.x} ${this.state.viewBox.y} ${this.state.viewBox.width} ${this.state.viewBox.height}`
                );
                
                this.state.zoom = 1000 / newWidth;
                this.updateZoomDisplay();
            }
            
            updateZoomDisplay() {
                document.getElementById('zoomLevel').textContent = 
                    Math.round(this.state.zoom * 100) + '%';
            }

startPanning(e) {
    this.state.isMoving = true;
    this.state.moveStart = {
        x: e.clientX,
        y: e.clientY,
        viewBoxX: this.state.viewBox.x,
        viewBoxY: this.state.viewBox.y
    };
    this.svg.style.cursor = 'grabbing';
}
    
doPanning(e) {
    if (!this.state.isMoving) return;

    const dx = e.clientX - this.state.moveStart.x;
    const dy = e.clientY - this.state.moveStart.y;

    const scaleX = this.state.viewBox.width / this.svg.clientWidth;
    const scaleY = this.state.viewBox.height / this.svg.clientHeight;
    
    this.state.viewBox.x = this.state.moveStart.viewBoxX - dx * scaleX;
    this.state.viewBox.y = this.state.moveStart.viewBoxY - dy * scaleY;
    
    this.svg.setAttribute('viewBox', 
        `${this.state.viewBox.x} ${this.state.viewBox.y} ${this.state.viewBox.width} ${this.state.viewBox.height}`
    );
}


startBezierContourDrag(e, clickedElement) {
    const coords = this.getSVGCoordinates(e);
    
    // Находим вектор по кликнутому элементу
    const clickedVector = this.state.bezierVectors.find(v => v.path === clickedElement);
    if (!clickedVector) return;
    
    // Собираем все связанные векторы (весь контур)
    const contourVectors = this.findAllConnectedBezierVectors(clickedVector);
    
    // Собираем все уникальные точки контура
    const contourPoints = new Set();
    contourVectors.forEach(v => {
        contourPoints.add(v.from);
        contourPoints.add(v.to);
    });
    
    // Сохраняем начальные позиции всех точек
    const pointStartPositions = {};
    contourPoints.forEach(pointIndex => {
        const point = this.state.bezierPoints[pointIndex];
        if (point) {
            pointStartPositions[pointIndex] = {
                x: point.x,
                y: point.y
            };
        }
    });
    
    // Сохраняем начальные позиции всех контрольных точек
    const controlStartPositions = [];
    contourVectors.forEach(vector => {
        controlStartPositions.push({
            vector: vector,
            control1: { x: vector.control1.x, y: vector.control1.y },
            control2: { x: vector.control2.x, y: vector.control2.y }
        });
    });
    
    // Устанавливаем состояние перетаскивания
    this.state.isDraggingElement = true;
    this.state.draggingElement = clickedElement;
    this.state.draggingStartMouseX = coords.x;
    this.state.draggingStartMouseY = coords.y;
    
    // Сохраняем данные о контуре для перемещения
    this.state.bezierContourDragData = {
        contourVectors: contourVectors,
        contourPoints: Array.from(contourPoints),
        pointStartPositions: pointStartPositions,
        controlStartPositions: controlStartPositions
    };
    
    this.svg.style.cursor = 'grabbing';

}

findAllConnectedBezierVectors(startVector) {
    const visited = new Set();
    const connected = [];
    
    const traverse = (vector) => {
        if (visited.has(vector)) return;
        visited.add(vector);
        connected.push(vector);
        
        // Ищем векторы, связанные через точки
        this.state.bezierVectors.forEach(v => {
            if (!visited.has(v)) {
                if (v.from === vector.from || v.to === vector.from ||
                    v.from === vector.to || v.to === vector.to) {
                    traverse(v);
                }
            }
        });
    };
    
    traverse(startVector);
    return connected;
}

buildBezierContourFakePath(startVector) {
    const vectors = this.findAllConnectedBezierVectors(startVector);
    if (vectors.length === 0) return null;
    
    let d = '';
    for (const v of vectors) {
        const fromPoint = this.state.bezierPoints[v.from];
        const toPoint = this.state.bezierPoints[v.to];
        if (!fromPoint || !toPoint) continue;
        
        d += `M ${fromPoint.x} ${fromPoint.y} `;
        d += `C ${v.control1.x} ${v.control1.y} ${v.control2.x} ${v.control2.y} ${toPoint.x} ${toPoint.y} `;
    }
    
    if (!d) return null;
    
    // Стиль от первого вектора
    const first = vectors[0];
    const stroke = first.path.getAttribute('stroke') || this.state.strokeColor || '#4dabf7';
    const strokeWidth = first.path.getAttribute('stroke-width') || this.state.strokeWidth || 3;
    const linecap = first.path.getAttribute('stroke-linecap') || 'round';
    const linejoin = first.path.getAttribute('stroke-linejoin') || 'round';
    
    const fakePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    fakePath.setAttribute('d', d);
    fakePath.setAttribute('fill', 'none');
    fakePath.setAttribute('stroke', stroke);
    fakePath.setAttribute('stroke-width', strokeWidth);
    fakePath.setAttribute('stroke-linecap', linecap);
    fakePath.setAttribute('stroke-linejoin', linejoin);
    fakePath.dataset.isBezierContour = 'true';
    fakePath.style.cursor = 'move';
    fakePath.style.pointerEvents = 'all';
    
    // В vectorLayer — чтобы стандартные механизмы работали
    this.vectorLayer.appendChild(fakePath);
    
    return { fakePath, vectors };
}

doBezierContourDrag(x, y) {
    if (!this.state.bezierContourDragData) return;
    
    const data = this.state.bezierContourDragData;
    const dx = x - this.state.draggingStartMouseX;
    const dy = y - this.state.draggingStartMouseY;
    
    // Перемещаем все точки контура
    data.contourPoints.forEach(pointIndex => {
        const point = this.state.bezierPoints[pointIndex];
        const startPos = data.pointStartPositions[pointIndex];
        
        if (point && startPos) {
            point.x = startPos.x + dx;
            point.y = startPos.y + dy;
            
            // Обновляем визуальный элемент точки (если видим)
            if (point.element) {
                point.element.setAttribute('cx', point.x);
                point.element.setAttribute('cy', point.y);
            }
        }
    });
    
    // Перемещаем все контрольные точки
    data.controlStartPositions.forEach(item => {
        item.vector.control1.x = item.control1.x + dx;
        item.vector.control1.y = item.control1.y + dy;
        item.vector.control2.x = item.control2.x + dx;
        item.vector.control2.y = item.control2.y + dy;
    });
    
    // Обновляем визуализацию всех векторов контура
    data.contourVectors.forEach(vector => {
        // Обновляем путь
        this.updateBezierVectorPath(vector);
        
        // Обновляем направляющие
        if (vector.guideElements.control1) {
            vector.guideElements.control1.setAttribute('cx', vector.control1.x);
            vector.guideElements.control1.setAttribute('cy', vector.control1.y);
        }
        if (vector.guideElements.control2) {
            vector.guideElements.control2.setAttribute('cx', vector.control2.x);
            vector.guideElements.control2.setAttribute('cy', vector.control2.y);
        }
        if (vector.guideElements.line1) {
            const fromPoint = this.state.bezierPoints[vector.from];
            vector.guideElements.line1.setAttribute('x1', fromPoint.x);
            vector.guideElements.line1.setAttribute('y1', fromPoint.y);
            vector.guideElements.line1.setAttribute('x2', vector.control1.x);
            vector.guideElements.line1.setAttribute('y2', vector.control1.y);
        }
        if (vector.guideElements.line2) {
            const toPoint = this.state.bezierPoints[vector.to];
            vector.guideElements.line2.setAttribute('x1', toPoint.x);
            vector.guideElements.line2.setAttribute('y1', toPoint.y);
            vector.guideElements.line2.setAttribute('x2', vector.control2.x);
            vector.guideElements.line2.setAttribute('y2', vector.control2.y);
        }
    });
}

stopPhotoDrag() {
    if (!this.state.isDraggingPhoto) return;
    if (this.state.draggingPhotoElement) {
        this.state.draggingPhotoElement.style.outline = '';
        this.state.draggingPhotoElement.style.outlineOffset = '';
    }

    this.state.isDraggingPhoto = false;
    this.state.draggingPhotoElement = null;

    if (this.state.currentTool === 'select') {
        this.svg.style.cursor = 'move';
    } else {
        this.svg.style.cursor = 'crosshair';
    }
}

// Вспомогательный метод для сдвига пути
translatePath(d, dx, dy) {
    const commands = d.match(/[a-df-zA-DF-Z][^a-df-zA-DF-Z]*/g) || [];
    let newPath = '';
    
    commands.forEach(cmd => {
        const command = cmd[0];
        const numbers = cmd.substring(1).trim().split(/[\s,]+/).map(Number);
        let newCmd = command;
        
        if (command === 'Z' || command === 'z') {
            newPath += command + ' ';
            return;
        }
        
        for (let i = 0; i < numbers.length; i += 2) {
            if (i + 1 < numbers.length) {
                const x = numbers[i] + dx;
                const y = numbers[i + 1] + dy;
                newCmd += ` ${x} ${y}`;
            }
        }
        newPath += newCmd + ' ';
    });
    
    return newPath.trim();
}

stopPanning() {
    this.state.isMoving = false;
    if (this.state.currentTool === 'select') {
        this.svg.style.cursor = 'move';
    } else {
        this.svg.style.cursor = 'crosshair';
    }
}
// выделение

// Получение центра фигуры в глобальных координатах
getElementCenter(element) {
    const transform = element.getAttribute('transform') || '';
    const rotateMatch = transform.match(/rotate\([^,]+,([^,]+),([^)]+)\)/);
    if (rotateMatch) {
        return { x: parseFloat(rotateMatch[1]), y: parseFloat(rotateMatch[2]) };
    }
    // Иначе из bbox
    const bbox = this.getElementBBox(element);
    return { x: bbox.x + bbox.width/2, y: bbox.y + bbox.height/2 };
}

// Получение угла поворота фигуры (в радианах)
getElementRotation(element) {
    const transform = element.getAttribute('transform') || '';
    
    // Ищем rotate(угол, cx, cy)
    let match = transform.match(/rotate\(([^,]+),\s*([^,]+),\s*([^)]+)\)/);
    if (match) {
        return {
            angle: parseFloat(match[1]) * Math.PI / 180,
            cx: parseFloat(match[2]),
            cy: parseFloat(match[3])
        };
    }
    
    // Ищем просто rotate(угол)
    match = transform.match(/rotate\(([^)]+)\)/);
    if (match) {
        return {
            angle: parseFloat(match[1]) * Math.PI / 180,
            cx: null,
            cy: null
        };
    }
    
    return { angle: 0, cx: null, cy: null };
}

// Установка угла поворота фигуры
setElementRotation(element, angleDegrees, cx, cy) {
    let transform = element.getAttribute('transform') || '';
    
    // Удаляем старый rotate
    transform = transform.replace(/rotate\([^)]+\)/g, '').trim();
    
    // Добавляем новый rotate (всегда с центром)
    const newRotate = `rotate(${angleDegrees}, ${cx}, ${cy})`;
    
    element.setAttribute('transform', transform ? `${transform} ${newRotate}` : newRotate);
}

// Получение bounding box фигуры БЕЗ учёта поворота
getElementBBox(element) {
    const tag = element.tagName.toLowerCase();
    let bbox = { x: 0, y: 0, width: 0, height: 0 };
    
    if (tag === 'circle') {
        const cx = parseFloat(element.getAttribute('cx')) || 0;
        const cy = parseFloat(element.getAttribute('cy')) || 0;
        const r = parseFloat(element.getAttribute('r')) || 0;
        bbox = { x: cx - r, y: cy - r, width: r * 2, height: r * 2 };
    } else if (tag === 'ellipse') {
        const cx = parseFloat(element.getAttribute('cx')) || 0;
        const cy = parseFloat(element.getAttribute('cy')) || 0;
        const rx = parseFloat(element.getAttribute('rx')) || 0;
        const ry = parseFloat(element.getAttribute('ry')) || 0;
        bbox = { x: cx - rx, y: cy - ry, width: rx * 2, height: ry * 2 };
    } else if (tag === 'rect') {
        bbox.x = parseFloat(element.getAttribute('x')) || 0;
        bbox.y = parseFloat(element.getAttribute('y')) || 0;
        bbox.width = parseFloat(element.getAttribute('width')) || 0;
        bbox.height = parseFloat(element.getAttribute('height')) || 0;
    } else if (tag === 'line') {
        const x1 = parseFloat(element.getAttribute('x1')) || 0;
        const y1 = parseFloat(element.getAttribute('y1')) || 0;
        const x2 = parseFloat(element.getAttribute('x2')) || 0;
        const y2 = parseFloat(element.getAttribute('y2')) || 0;
        bbox.x = Math.min(x1, x2);
        bbox.y = Math.min(y1, y2);
        bbox.width = Math.abs(x2 - x1);
        bbox.height = Math.abs(y2 - y1);
    } else if (tag === 'image') {
        bbox.x = parseFloat(element.getAttribute('x')) || 0;
        bbox.y = parseFloat(element.getAttribute('y')) || 0;
        bbox.width = parseFloat(element.getAttribute('width')) || 0;
        bbox.height = parseFloat(element.getAttribute('height')) || 0;
    } else if (tag === 'path') {
        try {
            // getBBox() возвращает bbox БЕЗ учёта transform
            const rawBBox = element.getBBox();
            bbox = { x: rawBBox.x, y: rawBBox.y, width: rawBBox.width, height: rawBBox.height };
        } catch(e) {
            bbox = { x: 0, y: 0, width: 100, height: 100 };
        }
    }
    
    return bbox;
}

// Поворот точки вокруг центра
rotatePoint(px, py, cx, cy, angle) {
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    const dx = px - cx;
    const dy = py - cy;
    return {
        x: cx + dx * cos - dy * sin,
        y: cy + dx * sin + dy * cos
    };
}

// ВЫДЕЛЕНИЕ
selectElement(element) {
    // Снимаем выделение с предыдущего
    if (this.selectedElement && this.selectedElement !== element) {
        this.removeSelectionHandles();
    }
    
    this.selectedElement = element;
    
    if (element) {
        this.showSelectionHandles(element);
        this.updateToBezierButtonVisibility(element);
    }
}

// Показывает/прячет кнопку «В безье» в зависимости от выделенного элемента
updateToBezierButtonVisibility(element) {
    const block = document.getElementById('toBezierBlock');
    if (!block) return;
    
    if (element && this.canConvertToBezier(element)) {
        block.hidden = false;
    } else {
        block.hidden = true;
    }
}

// Удаляет выделенный безье-контур целиком
deleteSelectedBezierContour() {
    if (!this.selectedBezierContour) return;
    
    const contour = this.selectedBezierContour;
    const vectors = [...contour.vectors];
    
    // Сначала сбрасываем выделение (чтобы не мешало)
    const fakePath = contour.fakePath;
    this.removeSelectionHandles();
    this.selectedBezierContour = null;
    this.selectedElement = null;
    if (fakePath && fakePath.parentNode) fakePath.remove();
    
    // Собираем уникальные точки контура
    const pointIndices = new Set();
    for (const v of vectors) {
        pointIndices.add(v.from);
        pointIndices.add(v.to);
    }
    
    // Удаляем векторы
    for (const v of vectors) {
        // Убираем визуальные элементы
        if (v.path && v.path.parentNode) v.path.remove();
        const ge = v.guideElements || {};
        if (ge.line1) ge.line1.remove();
        if (ge.control1) ge.control1.remove();
        if (ge.line2) ge.line2.remove();
        if (ge.control2) ge.control2.remove();
        
        const idx = this.state.bezierVectors.indexOf(v);
        if (idx !== -1) this.state.bezierVectors.splice(idx, 1);
    }
    
    // Удаляем точки (только те, что больше не используются)
    const usedPointIndices = new Set();
    for (const v of this.state.bezierVectors) {
        usedPointIndices.add(v.from);
        usedPointIndices.add(v.to);
    }
    
    // Удаляем с конца, чтобы индексы не сбивались
    const toDelete = [...pointIndices].filter(i => !usedPointIndices.has(i));
    toDelete.sort((a, b) => b - a);
    
    for (const idx of toDelete) {
        const p = this.state.bezierPoints[idx];
        if (p && p.element && p.element.parentNode) p.element.remove();
        this.state.bezierPoints.splice(idx, 1);
    }
    
    // Обновляем индексы оставшихся точек и векторов
    this.state.bezierPoints.forEach((p, i) => {
        p.index = i;
        if (p.element) p.element.setAttribute('data-index', i);
    });
    
    for (const v of this.state.bezierVectors) {
        let fromShift = 0, toShift = 0;
        for (const deleted of toDelete) {
            if (v.from > deleted) fromShift++;
            if (v.to > deleted) toShift++;
        }
        v.from -= fromShift;
        v.to -= toShift;
    }
    
    this.saveSnapshot();
}

// Специальная версия для безье-контура: собирает все связанные векторы,
// строит фейковый path и вызывает стандартный механизм выделения.
selectBezierContour(clickedVectorPath) {
    const vector = this.state.bezierVectors.find(v => v.path === clickedVectorPath);
    if (!vector) {
        console.warn('Вектор не найден по path');
        return;
    }
    
    // Сбрасываем предыдущее выделение (с запеканием)
    this.clearSelection();
    
    const contour = this.buildBezierContourFakePath(vector);
    if (!contour) return;
    
    // Скрываем оригинальные визуальные элементы контура
    this.hideBezierContourVisuals(contour.vectors);
    
    // Сохраняем
    this.selectedBezierContour = {
        fakePath: contour.fakePath,
        vectors: contour.vectors,
        isBezierContour: true
    };
    this.selectedElement = contour.fakePath;
    
    // Рамка
    this.showSelectionHandles(contour.fakePath);
}

// Скрывает path безье, точки и направляющие
hideBezierContourVisuals(vectors) {
    for (const v of vectors) {
        if (v.path) v.path.style.display = 'none';
        
        const ge = v.guideElements || {};
        if (ge.line1) ge.line1.style.display = 'none';
        if (ge.control1) ge.control1.style.display = 'none';
        if (ge.line2) ge.line2.style.display = 'none';
        if (ge.control2) ge.control2.style.display = 'none';
        
        const fp = this.state.bezierPoints[v.from];
        const tp = this.state.bezierPoints[v.to];
        if (fp && fp.element) fp.element.style.display = 'none';
        if (tp && tp.element) tp.element.style.display = 'none';
    }
}

// Показывает обратно path безье, точки и направляющие
showBezierContourVisuals(vectors) {
    const showBezierEditing = (this.state.currentTool === 'bezier-points');
    
    for (const v of vectors) {
        if (v.path) v.path.style.display = '';
        
        const ge = v.guideElements || {};
        if (ge.line1) ge.line1.style.display = showBezierEditing ? '' : 'none';
        if (ge.control1) ge.control1.style.display = showBezierEditing ? '' : 'none';
        if (ge.line2) ge.line2.style.display = showBezierEditing ? '' : 'none';
        if (ge.control2) ge.control2.style.display = showBezierEditing ? '' : 'none';
        
        const fp = this.state.bezierPoints[v.from];
        const tp = this.state.bezierPoints[v.to];
        if (fp && fp.element) {
            fp.element.style.display = showBezierEditing ? '' : 'none';
        }
        if (tp && tp.element) {
            tp.element.style.display = showBezierEditing ? '' : 'none';
        }
    }
    
    // Финальная страховка: если не bezier-points, скрываем всё скопом
    if (!showBezierEditing) {
        this.toggleBezierPoints(false);
        this.hideBezierHelpers();
    }
}

removeSelectionHandles() {
    const handles = document.getElementById('selection-handles');
